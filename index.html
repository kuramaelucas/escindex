        </select></div>
    </div>
    <button class="btn btn-secondary" onclick="iniciarSessaoFlashcards(state.filtroRota.flashcards||{})">Começar com esse recorte</button>
  </div>

  ${meus.length ? `<div class="card mt-2">
    <div class="flex justify-between items-center gap-2" style="flex-wrap:wrap">
      <div style="min-width:220px;flex:1">
        <div class="card-title">Meus cartões (${meus.length})</div>
        <div class="text-sm muted">Os que você escreveu enquanto resolvia questões. São seus: ninguém mais vê, e entram no baralho junto com os da equipe.</div>
      </div>
    </div>
    <div class="table-wrap mt-2"><table><thead><tr><th>Frente</th><th>Assunto</th><th>Criado em</th><th></th></tr></thead><tbody>
      ${pagMeus.itens.map(c=>`<tr>
        <td class="text-sm"><span class="enunciado-clicavel" onclick="abrirFormularioFlashcard('${c.id}')">${escapeHtml(c.frente.slice(0,110))}${c.frente.length>110?"…":""}</span>${badgeSugestaoFlashcard(c)}</td>
        <td class="text-sm">${escapeHtml(nomeAssunto(c.assuntoId))}</td>
        <td class="text-xs muted">${c.criadoEm?formatDataBR(c.criadoEm):"—"}</td>
        <td class="flex gap-1">
          ${c.questaoOrigemId?`<button class="icon-btn" title="Ver a questão que originou o cartão" onclick="abrirQuestaoCompleta('${c.questaoOrigemId}')">${iconeSvg("search")}</button>`:""}
          <button class="icon-btn" title="Editar" onclick="abrirFormularioFlashcard('${c.id}')">${iconeSvg("edit")}</button>
          ${!c.sugeridoParaEquipe || c.decisaoEm ? `<button class="icon-btn" title="Sugerir para o baralho da equipe" onclick="sugerirFlashcardParaEquipe('${c.id}')">${iconeSvg("upload")}</button>` : ""}
          <button class="icon-btn" title="Arquivar" onclick="arquivarFlashcard('${c.id}')">${iconeSvg("trash")}</button>
        </td></tr>`).join("")}
    </tbody></table></div>
    ${controlesPaginacao(pagMeus, "cartão(ões) seu(s)")}
  </div>` : `<div class="card-flat mt-2 text-sm">
    <strong>Escreva seus próprios cartões.</strong> Ao responder uma questão, o botão “${"Virar flashcard"}” monta um cartão já no assunto daquela questão — é o melhor momento para isso, porque o conceito que faltou ainda está fresco. Esses cartões são só seus.
  </div>`}

  ${podeEditar ? `<div class="card mt-2">
    <div class="flex justify-between items-center gap-2" style="flex-wrap:wrap">
      <div style="min-width:220px;flex:1"><div class="card-title">Cartões da equipe (${daEquipe.length})</div>
      <div class="text-sm muted">Material oficial, visível para todos os alunos. Os cartões pessoais que cada aluno escreve não aparecem aqui.</div></div>
      <div class="flex gap-1" style="flex-wrap:wrap">
        <button class="btn btn-secondary btn-sm" onclick="navigate('material-pdf')">${iconeSvg("printer")} Imprimir baralho</button>

      </div>
    </div>
    <div class="table-wrap mt-2"><table><thead><tr><th>Frente</th><th>Assunto</th><th></th></tr></thead><tbody>

        <td class="text-sm"><span class="enunciado-clicavel" onclick="abrirFormularioFlashcard('${c.id}')">${escapeHtml(c.frente.slice(0,110))}${c.frente.length>110?"…":""}</span></td>

function atualizarFiltroFlash(){
  const f = state.filtroRota.flashcards = state.filtroRota.flashcards || {};
  const area = document.getElementById("flashArea").value;
  const esp = document.getElementById("flashEsp").value;
  const ass = document.getElementById("flashAssunto").value;
  // trocar de área/especialidade zera os níveis abaixo, pra não ficar filtro incoerente
  if(area !== (f.areaId||"")){ f.areaId = area||null; f.especialidadeId = null; f.assuntoId = null; }
  else if(esp !== (f.especialidadeId||"")){ f.especialidadeId = esp||null; f.assuntoId = null; }
  else f.assuntoId = ass||null;
  render();
}
function iniciarSessaoFlashcards(filtro){
  const u = usuarioAtual();
  const cartoes = montarBaralhoFlashcards(u.id, 20, filtro||{});
  if(!cartoes.length){ toast("Não há cartões para este recorte ainda. Tente um filtro mais amplo, ou peça à equipe para cadastrar cartões desse assunto.", "err"); return; }
  state.sessaoFlash = { cartoes, indice:0, virado:false, notas:[], finalizada:false };
  navigate("flashcards");
}
function virarFlashcard(){
  const s = state.sessaoFlash; if(!s) return;
  s.virado = !s.virado; render();
}
function responderFlashcard(nota){
  const s = state.sessaoFlash; if(!s) return;
  const cartao = s.cartoes[s.indice];
  registrarRevisaoFlashcard(usuarioAtual().id, cartao.id, nota);
  s.notas.push({cartaoId:cartao.id, nota});
  if(s.indice < s.cartoes.length-1){ s.indice++; s.virado = false; }
  else s.finalizada = true;
  render(); window.scrollTo(0,0);
}
function pularFlashcard(delta){
  const s = state.sessaoFlash; if(!s) return;
  s.indice = Math.max(0, Math.min(s.cartoes.length-1, s.indice+delta));
  s.virado = false; render();
}
function sairDaSessaoFlash(){ state.sessaoFlash = null; navigate("flashcards"); }
function renderFlashcardEmSessao(s){
  const cartao = s.cartoes[s.indice];
  const assunto = nomeAssunto(cartao.assuntoId);
  const rev = revisaoDoCartao(usuarioAtual().id, cartao.id);
  const favoritoAqui = isFavoritoCartao(usuarioAtual().id, cartao.id);
  return `
  <div class="flex justify-between items-center mb-2">
    <div class="text-sm muted">Cartão ${s.indice+1} de ${s.cartoes.length}</div>
    <button class="btn btn-ghost btn-sm" onclick="sairDaSessaoFlash()">Sair</button>
  </div>
  <div class="progress-track mb-3"><div class="progress-fill" style="width:${pct(s.notas.length, s.cartoes.length)}%"></div></div>
  <div class="why-tag">${iconeSvg("target")}<span>${escapeHtml(assunto)}${cartao.origem==="questao"?" · gerado de uma questão que você errou com certeza ou acertou no chute":""}${rev&&rev.vistas?" · visto "+rev.vistas+"x":""}</span></div>
  <div class="flash-palco">
    <div class="flashcard ${s.virado?"virado":""} area-gesto" id="areaGestoQuestao" onclick="virarFlashcard()">
      <button class="icon-btn flash-favorito" title="${favoritoAqui?"Tirar dos favoritos":"Salvar este cartão nos favoritos"}" aria-label="${favoritoAqui?"Tirar este cartão dos favoritos":"Salvar este cartão nos favoritos"}" onclick="event.stopPropagation();toggleFavoritoCartaoUI('${cartao.id}')" style="${favoritoAqui?"border-color:var(--amber);color:var(--amber)":""}">${iconeSvg("star")}</button>
      <div class="flash-etiqueta">${s.virado?"Resposta":"Pergunta"}</div>
      ${cartao.imagemUrl ? `<div class="qcard-img-wrap"><img class="qcard-img" src="${escapeHtml(cartao.imagemUrl)}" alt="${escapeHtml(cartao.imagemLegenda||"Imagem do cartão")}" loading="lazy">${cartao.imagemLegenda?`<div class="qcard-img-legenda">${escapeHtml(cartao.imagemLegenda)}</div>`:""}</div>` : ""}
      ${s.virado
        ? `<div class="flash-verso">${escapeHtml(cartao.verso)}</div>`
        : `<div class="flash-frente">${escapeHtml(cartao.frente)}</div>`}
      <div class="flash-toque">${iconeSvg("refresh")} ${s.virado?"Clique no cartão para ver a pergunta de novo":"Clique no cartão para ver a resposta"}</div>
    </div>
  </div>
  ${s.virado ? `<div class="flash-notas">
    <button class="flash-nota ruim" onclick="responderFlashcard('naolembrei')">Não lembrei<small>volta amanhã</small></button>
    <button class="flash-nota medio" onclick="responderFlashcard('quase')">Quase<small>volta em poucos dias</small></button>
    <button class="flash-nota bom" onclick="responderFlashcard('sabia')">Sabia<small>vai para longe</small></button>
  </div>
  <p class="text-xs muted mt-1" style="text-align:center;max-width:640px;margin-left:auto;margin-right:auto">Responda com honestidade: o intervalo do cartão depende disso, e enganar o algoritmo aqui só faz você revisar na véspera da prova o que devia ter fixado agora.</p>`
  : `<p class="text-xs muted mt-2" style="text-align:center">Tente lembrar antes de virar — é a tentativa, e não a leitura, que fixa.</p>`}
  ${cartao.origem==="questao" ? `<div class="flex justify-center mt-2"><button class="btn btn-ghost btn-sm" onclick="abrirQuestaoCompleta('${cartao.questaoId}')">${iconeSvg("search")} Ver a questão inteira</button></div>` : ""}
  <div class="dica-arrastar">${iconeSvg("swipe")}<span>arraste para o lado para passar de cartão</span></div>`;
}
function renderFlashcardsResumo(s){
  const cont = {naolembrei:0, quase:0, sabia:0};
  s.notas.forEach(n=>cont[n.nota]++);
  const total = s.notas.length;
  const aRever = s.notas.filter(n=>n.nota!=="sabia");
  return `
  <div class="page-header"><h2>Fim da revisão rápida</h2><p>${total} cartão(ões) revisado(s). Cada um já tem nova data de retorno.</p></div>
  <div class="grid grid-3">
    <div class="stat-tile"><div class="stat-value">${cont.sabia}</div><div class="stat-label">sabia</div></div>
    <div class="stat-tile"><div class="stat-value">${cont.quase}</div><div class="stat-label">quase — voltam em poucos dias</div></div>
    <div class="stat-tile"><div class="stat-value">${cont.naolembrei}</div><div class="stat-label">não lembrei — voltam amanhã</div></div>
  </div>
  ${aRever.length ? `<div class="card mt-2">
    <div class="card-title">O que ficou pendente</div>
    ${aRever.map(n=>{ const c = getFlashcard(n.cartaoId); if(!c) return ""; return `<div class="card-flat mb-1">
      <div class="text-sm" style="font-weight:600">${escapeHtml(c.frente.slice(0,160))}${c.frente.length>160?"…":""}</div>
      <div class="text-xs muted mt-1">${escapeHtml(nomeAssunto(c.assuntoId))} · ${n.nota==="quase"?"lembrou com esforço":"não lembrou"}</div>
    </div>`; }).join("")}
  </div>` : `<div class="card mt-2"><p class="text-sm">Você acertou todos de primeira. Se isso se repetir, vale aumentar o recorte do baralho ou voltar para as questões — cartão fácil demais deixa de ensinar.</p></div>`}
  <div class="flex gap-1 mt-2" style="flex-wrap:wrap">
    <button class="btn btn-primary" onclick="iniciarSessaoFlashcards({})">Mais uma rodada</button>
    ${aRever.length ? `<button class="btn btn-secondary" onclick="praticarQuestoesDoBaralho()">Praticar questões desses assuntos</button>` : ""}
    <button class="btn btn-ghost" onclick="sairDaSessaoFlash()">Encerrar</button>
  </div>`;
}
/* Ponte entre os dois formatos: depois do cartão, treinar a questão do mesmo
   assunto é o que transforma o conceito decorado em raciocínio. */
function praticarQuestoesDoBaralho(){
  const s = state.sessaoFlash; if(!s) return;
  const assuntos = [...new Set(s.notas.filter(n=>n.nota!=="sabia").map(n=>{ const c = getFlashcard(n.cartaoId); return c?c.assuntoId:null; }).filter(Boolean))];
  const pool = questoesAtivas().filter(q=>assuntos.includes(q.assuntoId));
  if(!pool.length){ toast("Ainda não há questões cadastradas nesses assuntos.", "err"); return; }
  const itens = embaralhar(pool).slice(0,15).map(q=>({questaoId:q.id, motivo:"Assunto que ficou pendente na revisão rápida"}));
  state.sessaoFlash = null;
  iniciarSessaoComLista(itens, "pratica");
}
/* Formulário de cartão, usado por três caminhos diferentes:
     - equipe criando material oficial (Revisão Rápida > Novo cartão)
     - aluno editando um cartão que ele mesmo escreveu
     - QUALQUER usuário transformando a questão que acabou de responder num
       cartão (opts.questaoId) — nesse caso o assunto já vem escolhido

   Quem não gere conteúdo só cria cartão PESSOAL: entra no baralho dele e não
   aparece para mais ninguém. É caderno de estudo, não material publicado. */
function abrirFormularioFlashcard(id, opts){
  opts = opts || {};
  const u = usuarioAtual();
  const c = id ? (db.flashcards||[]).find(x=>x.id===id) : null;
  if(c && c.usuarioId && c.usuarioId!==u.id){ toast("Este cartão é de outro usuário.", "err"); return; }
  if(c && !c.usuarioId && !podeGerirConteudo()){ toast("Cartões da equipe só podem ser editados por professores e administradores de conteúdo.", "err"); return; }

  const daEquipe = podeGerirConteudo() && !state.modoAluno && !(c && c.usuarioId);
  const questao = opts.questaoId ? getQuestao(opts.questaoId) : null;
  // assunto pré-selecionado: o do cartão em edição, ou o da questão de origem
  const assuntoEscolhido = c ? c.assuntoId : (questao ? questao.assuntoId : null);
  const titulo = c ? "Editar cartão" : (questao ? "Virar flashcard" : "Novo cartão");
  state.filtroRota.imagemFlashcard = c ? (c.imagemUrl || "") : "";

  abrirModal(`
    <div class="modal-header"><h3>${titulo}</h3><button class="icon-btn" onclick="fecharModal()">${iconeSvg("x")}</button></div>
    ${questao ? `<div class="card-flat mb-2">
      <div class="text-xs muted" style="font-weight:700;letter-spacing:.06em;text-transform:uppercase">Questão de origem</div>
      <div class="text-sm mt-1">${escapeHtml(questao.enunciado.slice(0,220))}${questao.enunciado.length>220?"…":""}</div>
      <div class="text-xs muted mt-1">${escapeHtml(questao.banca)} · ${questao.ano} · gabarito ${escapeHtml(questao.gabarito)}</div>
    </div>` : ""}
    <p class="text-sm muted">Cartão bom é curto e cobra UMA coisa. Se a frente precisa de dois parágrafos, provavelmente são dois cartões — ou é caso de questão, não de flashcard.</p>
    ${!daEquipe ? `<div class="card-flat mt-2 text-xs">${iconeSvg("user")} Este cartão fica <strong>só no seu baralho</strong>. Ninguém mais vê, e ele entra nas suas revisões junto com os cartões da equipe.</div>` : ""}
    <div class="field mt-2"><label class="label">Assunto</label>
      <select class="select" id="fcAssunto">
        ${db.taxonomia.areas.map(area=>`<optgroup label="${escapeHtml(area.nome)}">${
          db.taxonomia.especialidades.filter(e=>e.areaId===area.id).map(e=>
            db.taxonomia.assuntos.filter(a=>a.especialidadeId===e.id).map(a=>
              `<option value="${a.id}" ${assuntoEscolhido===a.id?"selected":""}>${escapeHtml(e.nome)} › ${escapeHtml(a.nome)}</option>`).join("")).join("")
        }</optgroup>`).join("")}
      </select>
      ${questao ? `<div class="hint mt-1">Já veio marcado com o assunto da questão (${escapeHtml(nomeAssunto(questao.assuntoId))}). Troque se o seu cartão for sobre outra coisa.</div>` : ""}
    </div>
    <div class="field"><label class="label">Frente (a pergunta)</label><textarea class="textarea" id="fcFrente" style="min-height:80px" placeholder="${questao?"Ex.: o conceito que faltou para você acertar esta questão, virado em pergunta curta.":"Ex.: Qual é o tempo-alvo para angioplastia primária no IAM com supra?"}">${escapeHtml(c?c.frente:"")}</textarea></div>
    <div class="field"><label class="label">Verso (a resposta)</label><textarea class="textarea" id="fcVerso" style="min-height:120px" placeholder="Resposta direta, em uma ou duas frases, com a justificativa essencial.">${escapeHtml(c?c.verso:"")}</textarea></div>
    ${questao && !c ? `<button class="link-btn mb-2" onclick="preencherCartaoComGabarito('${questao.id}')">Preencher o verso com o gabarito comentado</button>` : ""}
    <div class="field">
      <label class="label">Imagem (opcional — ECG, fundo de olho, lesão de pele...)</label>
      <div id="fcImagemPreview" class="mb-1">${state.filtroRota.imagemFlashcard ? `<img src="${escapeHtml(state.filtroRota.imagemFlashcard)}" style="max-height:180px;max-width:100%;border:1px solid var(--border);border-radius:var(--radius-sm)" alt="">` : '<span class="text-xs muted">Nenhuma imagem anexada.</span>'}</div>
      <div class="flex gap-1" style="flex-wrap:wrap">
        <label class="btn btn-secondary btn-sm" style="cursor:pointer">${iconeSvg("upload")} Enviar arquivo<input type="file" accept="image/*" style="display:none" onchange="carregarImagemFlashcard(this)"></label>
        <button class="btn btn-ghost btn-sm" onclick="definirImagemFlashcardPorUrl()">Usar link (URL)</button>
        ${state.filtroRota.imagemFlashcard ? `<button class="btn btn-ghost btn-sm" onclick="removerImagemFlashcard()">Remover imagem</button>` : ""}
      </div>
      <input class="input mt-1" id="fcImagemLegenda" placeholder="Legenda (ex.: ECG de 12 derivações, ritmo de base)" value="${escapeHtml(c?(c.imagemLegenda||""):"")}">
      <div class="hint mt-1">A imagem aparece na frente do cartão, antes de virar — ideal para cartões de reconhecimento (identifique o achado antes de ver a resposta).</div>

      ? "Mesma regra de conteúdo das questões: escrita autoral, baseada em diretrizes, consensos e protocolos oficiais. Nada copiado de cursinho, apostila ou banco comercial."
      : "Escreva com suas palavras. Cartão copiado do enunciado inteiro não ensina nada — o esforço de resumir é metade do aprendizado."}</p>

/* Atalho: joga o gabarito comentado no verso, para o aluno editar em cima
   em vez de começar da folha em branco. */
function preencherCartaoComGabarito(qid){
  const q = getQuestao(qid); if(!q) return;
  const alt = (q.alternativas||[]).find(a=>a.id===q.gabarito);
  const texto = (alt ? q.gabarito+") "+alt.texto : "Gabarito: "+q.gabarito) + (q.explicacaoGeral ? "\n\n"+q.explicacaoGeral : "");
  const campo = document.getElementById("fcVerso");
  if(campo){ campo.value = texto; campo.focus(); }
}
function salvarFlashcard(id, questaoOrigemId){
  const frente = (document.getElementById("fcFrente").value||"").trim();
  const verso = (document.getElementById("fcVerso").value||"").trim();
  const assuntoId = document.getElementById("fcAssunto").value;
  const imagemUrl = state.filtroRota.imagemFlashcard || "";
  const imagemLegenda = (document.getElementById("fcImagemLegenda").value||"").trim();
  if(!frente || !verso){ toast("Preencha frente e verso.", "err"); return; }
  const u = usuarioAtual();
  if(!db.flashcards) db.flashcards = [];
  if(id){
    const c = db.flashcards.find(x=>x.id===id);
    if(!c) { toast("Cartão não encontrado.", "err"); return; }
    if(c.usuarioId && c.usuarioId!==u.id){ toast("Este cartão é de outro usuário.", "err"); return; }
    if(!c.usuarioId && !podeGerirConteudo()){ toast("Cartões da equipe só podem ser editados por professores e administradores.", "err"); return; }
    Object.assign(c, {frente, verso, assuntoId, imagemUrl, imagemLegenda});
    if(c.usuarioId) nuvemRegistrar({cartaoPessoal:c});
  } else {
    // sem permissão de conteúdo (ou em modo aluno) o cartão nasce pessoal
    const pessoal = !(podeGerirConteudo() && !state.modoAluno);
    db.flashcards.push({
      id: uid("fc"), frente, verso, assuntoId, imagemUrl, imagemLegenda,
      origem: pessoal ? "aluno" : "autoral",
      usuarioId: pessoal ? u.id : null,
      questaoOrigemId: questaoOrigemId || null,
      status: "ativo", criadoPor: u.id, criadoEm: hojeISO(),
    });
    const novoCartao = db.flashcards[db.flashcards.length-1];
    if(novoCartao.usuarioId) nuvemRegistrar({cartaoPessoal:novoCartao});
  }
  state.filtroRota.imagemFlashcard = "";
  saveState(); fecharModal();
  toast(id ? "Cartão atualizado." : "Cartão criado. Ele entra na sua próxima revisão rápida.");
  render();
}
/* ---------- promoção de cartão pessoal para o baralho da equipe -----------
   Hoje os dois mundos (cartão pessoal do aluno e baralho oficial da equipe)
   não se comunicam. Isto abre uma ponte com aprovação no meio: o aluno
   sugere, mas o cartão só vira material da equipe (visível a todos) depois
   que um professor ou administrador de conteúdo aprova — mesma lógica já
   usada para questões sugeridas (ver aprovarQuestaoSugerida). Até lá, o
   cartão continua sendo só do aluno, então nada muda para ele enquanto
   espera. */
function badgeSugestaoFlashcard(c){
  if(!c.sugeridoParaEquipe) return "";
  if(c.decisaoEm) return c.aprovadoEm
    ? ` <span class="badge badge-accent">promovido</span>`
    : ` <span class="badge badge-danger" title="${escapeHtml(c.motivoRecusa||"")}">recusado</span>`;
  return ` <span class="badge badge-amber">aguardando aprovação</span>`;
}
function sugerirFlashcardParaEquipe(id){
  const u = usuarioAtual();
  const c = (db.flashcards||[]).find(x=>x.id===id);
  if(!c || c.usuarioId!==u.id){ toast("Cartão não encontrado.", "err"); return; }
  c.sugeridoParaEquipe = true;
  c.sugeridoEm = hojeISO();
  delete c.decisaoEm; delete c.aprovadoEm; delete c.aprovadoPor; delete c.motivoRecusa;
  saveState();
  toast("Cartão enviado para aprovação da coordenação/professor. Ele continua no seu baralho normalmente enquanto isso.");
  render();
}
function flashcardsSugeridos(){
  return (db.flashcards||[]).filter(c=>c.usuarioId && c.sugeridoParaEquipe && !c.decisaoEm).sort((a,b)=>(a.sugeridoEm||"").localeCompare(b.sugeridoEm||""));
}
function aprovarFlashcardSugerido(id){
  const c = (db.flashcards||[]).find(x=>x.id===id); if(!c) return;
  c.autorOriginalId = c.usuarioId;
  c.usuarioId = null;
  c.origem = "promovido";
  c.decisaoEm = hojeISO();
  c.aprovadoEm = hojeISO();
  c.aprovadoPor = usuarioAtual().id;
  saveState();
  toast("Cartão promovido: agora faz parte do baralho da equipe, visível para todos.");
  render();
}
function recusarFlashcardSugerido(id){
  const motivo = (window.prompt("Motivo da recusa (o aluno vai ver isto; pode deixar em branco):", "")||"").trim();
  const c = (db.flashcards||[]).find(x=>x.id===id); if(!c) return;
  c.decisaoEm = hojeISO();
  c.motivoRecusa = motivo;
  saveState();
  toast("Sugestão recusada. O cartão continua pessoal do aluno, que pode ajustar e enviar de novo.");
  render();
}
function podeMexerNoCartao(c){
  if(!c) return false;
  const u = usuarioAtual();
  if(c.usuarioId) return c.usuarioId === u.id;          // pessoal: só o dono
  return podeGerirConteudo();                            // da equipe: quem gere conteúdo
}
function arquivarFlashcard(id){
  const c = (db.flashcards||[]).find(x=>x.id===id); if(!c) return;
  if(!podeMexerNoCartao(c)){ toast("Você não pode arquivar este cartão.", "err"); return; }
  const pessoal = !!c.usuarioId;
  abrirModal(`<div class="modal-header"><h3>Arquivar cartão</h3><button class="icon-btn" onclick="fecharModal()">${iconeSvg("x")}</button></div>
    <p>${pessoal
      ? "O cartão sai do seu baralho. O histórico de revisão dele fica guardado, caso você queira retomá-lo depois."
      : "O cartão deixa de aparecer nos baralhos de todos os alunos, mas o histórico de quem já o revisou é preservado."}</p>
    <div class="flex gap-1 mt-2"><button class="btn btn-danger" onclick="arquivarFlashcardConfirmado('${id}')">Arquivar</button><button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button></div>`);
}
function arquivarFlashcardConfirmado(id){
  const c = (db.flashcards||[]).find(x=>x.id===id);
  if(!podeMexerNoCartao(c)){ toast("Você não pode arquivar este cartão.", "err"); return; }
  c.status = "arquivado";
  if(c.usuarioId) nuvemRegistrar({cartaoPessoal:c});
  saveState(); fecharModal(); toast("Cartão arquivado."); render();
}

/* ---------- uma tela só para prova cronometrada -----------------------------
   Simulados e Provas Antigas eram duas entradas de menu que levavam ao mesmo
   lugar mental — "fazer uma prova inteira, no relógio" — e a pessoa tinha de
   lembrar em qual delas estava o que queria. Agora são duas abas de uma tela
   só, e a diferença continua explícita, porque ela é real:

   - PROVA ANTIGA é a prova de verdade de uma instituição num ano, do jeito
     que caiu. Serve para medir onde você está contra a banca.
   - SIMULADO é um recorte montado pela equipe (ou por você), com tempo e
     tamanho escolhidos. Serve para treinar um bloco ou um assunto.

   O histórico de notas é o mesmo para os dois, então fica embaixo das duas
   abas em vez de duplicado. */
function abaProvas(){
  const f = state.filtroRota;
  if(f.abaProvas !== "simulados" && f.abaProvas !== "antigas") f.abaProvas = "antigas";
  return f.abaProvas;
}
function mudarAbaProvas(aba){ state.filtroRota.abaProvas = aba; render(); }
function renderProvasESimulados(){
  const u = usuarioAtual();

  const outros = db.simulados.filter(s=>!recomendados.includes(s));
  const meusResultados = db.resultadosSimulados.filter(r=>r.usuarioId===u.id).sort((a,b)=>b.data.localeCompare(a.data));
  const pagResultados = paginar(meusResultados, "provas-resultados", {porPagina:10});
  return `
  <div class="page-header"><h2>Provas e Simulados</h2><p>Prova inteira, no relógio. Na primeira aba, as provas antigas como caíram; na segunda, os simulados montados pela equipe para um bloco ou assunto.</p></div>
  <div class="flex gap-1 mb-2" style="flex-wrap:wrap">
    <button class="pill ${aba==="antigas"?"active":""}" onclick="mudarAbaProvas('antigas')">${iconeSvg("archive")} Provas antigas</button>
    <button class="pill ${aba==="simulados"?"active":""}" onclick="mudarAbaProvas('simulados')">${iconeSvg("clipboard")} Simulados da equipe (${db.simulados.length})</button>

    <p class="text-sm muted mb-2">Montados por professores, com tempo e tamanho definidos por eles. Os recomendados são os do seu bloco atual (${escapeHtml(bloco.nome)}).</p>
    ${recomendados.length ? `<div class="card-title mb-1">Recomendados para o seu bloco atual</div>${recomendados.map(renderSimuladoCard).join("")}` : ""}
    ${outros.length ? `<div class="card-title mt-3 mb-1">Outros simulados disponíveis</div>${outros.map(renderSimuladoCard).join("")}` : ""}
    ${!db.simulados.length ? '<div class="empty-state">Nenhum simulado disponível ainda. Peça a um professor para criar e recomendar um simulado para o seu bloco — ou faça uma prova antiga inteira, na aba ao lado.</div>' : ""}
  `}
  ${meusResultados.length ? `<div class="card mt-3">
    <div class="card-title mb-1">Suas notas (provas antigas e simulados)</div>
    <div class="table-wrap"><table><thead><tr><th>Prova</th><th>Nota</th><th>Data</th><th></th></tr></thead><tbody>
      ${pagResultados.itens.map(r=>`<tr><td class="text-sm">${escapeHtml(r.titulo||"—")}</td><td><span class="badge ${r.nota>=70?"badge-accent":r.nota>=50?"badge-amber":"badge-danger"}">${r.nota}%</span></td><td class="text-sm">${formatDataBR(r.data)}</td><td>${r.itens?`<button class="link-btn" onclick="verDetalheResultadoSimulado('${r.id}')">ver detalhes</button>`:""}</td></tr>`).join("")}

// as duas rotas antigas continuam respondendo e levam à mesma tela
function renderSimulados(){ return renderProvasESimulados(); }
/* histórico do próprio usuário naquele simulado, para ele saber, na hora de
   escolher, se já fez e como foi */
function desempenhoPrevioSimulado(simuladoId, titulo){
  const u = usuarioAtual();
  const tentativas = db.resultadosSimulados
    .filter(r=>r.usuarioId===u.id && (simuladoId ? r.simuladoId===simuladoId : r.titulo===titulo))
    .sort((a,b)=>a.data.localeCompare(b.data));
  if(!tentativas.length) return null;
  const notas = tentativas.map(t=>t.nota);
  const ultima = tentativas[tentativas.length-1];
  return {
    n: tentativas.length, ultima, melhor: Math.max(...notas),
    variacao: tentativas.length>1 ? ultima.nota - tentativas[tentativas.length-2].nota : null,
  };
}
function renderSimuladoCard(s){
  const previo = desempenhoPrevioSimulado(s.id, s.titulo);
  return `<div class="card mb-1">
    <div class="flex justify-between items-center gap-2" style="flex-wrap:wrap">
      <div>
        <div style="font-weight:700">${escapeHtml(s.titulo)}</div>
        <div class="text-sm muted">${s.questoes.length} questões · ${s.duracaoMin} min</div>
        ${previo ? `<div class="qcard-meta mt-1">
            <span class="badge ${previo.ultima.nota>=70?"badge-accent":previo.ultima.nota>=50?"badge-amber":"badge-danger"}">já feito · última nota ${previo.ultima.nota}%</span>
            <span class="badge badge-muted">melhor: ${previo.melhor}%</span>
            <span class="badge badge-muted">${previo.n} tentativa(s) · ${formatDataBR(previo.ultima.data)}</span>
            ${previo.variacao!==null ? `<span class="badge ${previo.variacao>=0?"badge-accent":"badge-danger"}">${previo.variacao>=0?"+":""}${previo.variacao} pts vs. anterior</span>` : ""}
          </div>` : '<div class="qcard-meta mt-1"><span class="badge badge-muted">ainda não realizado</span></div>'}
      </div>
      <div class="flex gap-1" style="flex-wrap:wrap">
        ${previo && previo.ultima.itens ? `<button class="btn btn-secondary btn-sm" onclick="verDetalheResultadoSimulado('${previo.ultima.id}')">Ver resultado anterior</button>` : ""}
        <button class="btn btn-primary btn-sm" onclick="iniciarSimulado('${s.id}')">${previo?"Refazer":"Começar"}</button>
      </div>

}
function iniciarSimulado(simuladoId){
  const s = db.simulados.find(x=>x.id===simuladoId); if(!s) return;
  state.sessaoAtual = { id:uid("simsessao"), tipo:"simulado", simuladoId, titulo:s.titulo, itens:s.questoes.map(qid=>({questaoId:qid, motivo:"Simulado: "+s.titulo})), indiceAtual:0, respostasSimulado:{}, duracaoMin:s.duracaoMin, finalizado:false, modoAprendizado:false, inicioMs:Date.now(), tsQuestao:Date.now(), tempos:{} };
  navigate("simulado-ativo");
}

/* ---------- cronômetro do simulado e tempo por questão ----------
   O relógio corre num intervalo próprio e só escreve no elemento da tela,
   sem redesenhar a página inteira a cada segundo. O tempo gasto em cada
   questão é acumulado toda vez que o aluno troca de questão ou finaliza —
   é esse número que depois mostra onde ele trava. */
let intervaloCronometro = null;
function acumularTempoQuestaoSimulado(){
  const s = state.sessaoAtual;
  if(!s || s.tipo!=="simulado" || !s.tsQuestao) return;
  const item = s.itens[s.indiceAtual]; if(!item) return;
  const delta = (Date.now() - s.tsQuestao)/1000;
  if(delta>0 && delta<7200) s.tempos[item.questaoId] = (s.tempos[item.questaoId]||0) + delta;
  s.tsQuestao = Date.now();
}
function tempoDecorridoSimulado(){
  const s = state.sessaoAtual;
  if(!s || !s.inicioMs) return 0;
  return Math.floor(((s.fimMs||Date.now()) - s.inicioMs)/1000);
}
function pararCronometro(){
  if(intervaloCronometro && typeof clearInterval==="function"){ clearInterval(intervaloCronometro); }
  intervaloCronometro = null;
}
function atualizarCronometro(){
  const s = state.sessaoAtual;
  // o relógio se desliga sozinho quando não há simulado em andamento
  if(!s || s.tipo!=="simulado" || s.finalizado || !s.inicioMs){ pararCronometro(); return; }
  const el = (typeof document!=="undefined") ? document.getElementById("cronometroSimulado") : null;
  if(!el) return;
  const decorrido = tempoDecorridoSimulado();
  const limite = (s.duracaoMin||0)*60;
  if(!limite){ el.textContent = formatarDuracao(decorrido)+" decorridos"; return; }
  const restante = limite - decorrido;
  if(restante<=0){
    el.textContent = "tempo esgotado";
    toast("Tempo esgotado. O simulado foi finalizado automaticamente — suas respostas estão salvas.", "err");
    finalizarSimulado();
    return;
  }
  el.textContent = formatarDuracao(restante)+" restantes";
  el.className = "badge " + (restante<300 ? "badge-danger" : restante<600 ? "badge-amber" : "badge-muted");
}
function garantirCronometro(){
  if(intervaloCronometro || typeof setInterval!=="function") return;
  intervaloCronometro = setInterval(atualizarCronometro, 1000);
}
function selecionarAlternativaSimulado(altId){
  const sessao = state.sessaoAtual; if(!sessao) return;
  desriscarSeNecessario(altId);
  sessao.respostasSimulado[sessao.itens[sessao.indiceAtual].questaoId] = altId;
  render();
}

/* Quanto tempo cada questão consumiu e onde o aluno travou. "Travar" aqui é
   passar de 1,6 vez o tempo mediano dele mesmo — comparação com o próprio
   ritmo, não com um padrão externo. */
function analiseTempoSimulado(sessao, linhas){
  const tempos = sessao.tempos || {};
  const comTempo = linhas.map(l=>({i:l.i, qid:l.q.id, correta:l.correta, seg: Math.round(tempos[l.q.id]||0)})).filter(x=>x.seg>0);
  if(comTempo.length < 2) return null;
  const ordenados = comTempo.map(x=>x.seg).sort((a,b)=>a-b);
  const meio = Math.floor(ordenados.length/2);
  const mediana = ordenados.length%2 ? ordenados[meio] : Math.round((ordenados[meio-1]+ordenados[meio])/2);
  const soma = ordenados.reduce((a,b)=>a+b,0);
  const total = sessao.tempoTotalSeg || soma;
  return {
    total, media: Math.round(soma/comTempo.length), mediana,
    lentas: comTempo.filter(x=>x.seg > mediana*1.6).sort((a,b)=>b.seg-a.seg).slice(0,5),
  };
}

function tiposLivroOuro(){
  return {
    doacao:      {nome:"Doação",       badge:"badge-amber",  icone:"star"},
    colaboracao: {nome:"Colaboração",  badge:"badge-accent", icone:"users"},

function contribuicoesAutomaticas(){
  const porUsuario = {};
  const garantir = (id)=>{ if(!id || id==="seed") return null; if(!porUsuario[id]) porUsuario[id] = {usuarioId:id, questoes:0, respostas:0, sinalizacoes:0}; return porUsuario[id]; };
  db.questoes.forEach(q=>{
    if(q.criadoPor==="seed") return;
    const reg = garantir(q.criadoPor); if(reg && q.status!=="pendente") reg.questoes++;
  });
  db.comentarios.filter(c=>c.respostaOficial).forEach(c=>{ const reg = garantir(c.usuarioId); if(reg) reg.respostas++; });
  db.questoes.forEach(q=>(q.sinalizacoes||[]).forEach(sig=>{ const reg = garantir(sig.usuarioId); if(reg) reg.sinalizacoes++; }));
  return Object.values(porUsuario)
    .map(r=>({...r, total: r.questoes + r.respostas + r.sinalizacoes, usuario: getUsuario(r.usuarioId)}))
    .filter(r=>r.usuario && r.total>0)
    .sort((a,b)=>b.total-a.total);
}

/* ==========================================================================
   16-B. HISTÓRICO DE ATIVIDADE — conjuntos de questões já feitos, com a
   taxa de acerto de cada um e atalho para reabrir a página de feedback
   (a mesma que aparece ao terminar um conjunto de questões).
   ========================================================================== */
function atividadePorDia(usuarioId, dias){
  const out = [];
  for(let i=dias-1;i>=0;i--){
    const iso = somarDias(hojeISO(), -i);
    const rs = db.respostas.filter(r=>r.usuarioId===usuarioId && r.data===iso);
    out.push({data:iso, total:rs.length, acertos:rs.filter(r=>r.correta).length});
  }
  return out;
}

/* ---------- o dia como unidade de histórico ------------------------------
   Um conjunto de questões é uma unidade útil, mas não é a única: boa parte
   do estudo acontece solta — cinco questões esperando o elevador, uma
   revisão rápida no intervalo, dez cartões antes de dormir. Nada disso
   aparecia aqui, porque só conjunto concluído virava linha.

   Então a unidade passa a ser o DIA: tudo o que foi respondido naquele dia
   (dentro ou fora de um conjunto), a taxa de acerto, os conjuntos que
   fecharam nele e quantos cartões foram revisados. O dia é clicável como um
   conjunto — reabre o mesmo feedback questão a questão —, e os conjuntos
   daquele dia continuam listados dentro dele, para quem quer o recorte. */
function diasDeAtividade(usuarioId){
  const porDia = new Map();
  const garantir = (dia) => {
    if(!porDia.has(dia)) porDia.set(dia, { data:dia, respostas:[], sessoes:[], simulados:[], cartoes:0, cartoesExatos:true });
    return porDia.get(dia);
  };
  db.respostas.filter(r=>r.usuarioId===usuarioId).forEach(r=>{ if(r.data) garantir(r.data).respostas.push(r); });
  (db.sessoes||[]).filter(x=>x.usuarioId===usuarioId).forEach(sess=>{ if(sess.data) garantir(sess.data).sessoes.push(sess); });
  (db.resultadosSimulados||[]).filter(x=>x.usuarioId===usuarioId).forEach(sim=>{ if(sim.data) garantir(sim.data).simulados.push(sim); });
  // dias em que só houve cartão também são dias de estudo e entram na lista
  ((db.diasCartoes && db.diasCartoes[usuarioId]) || []).forEach(dia => garantir(dia));
  Object.keys((db.cartoesPorDia && db.cartoesPorDia[usuarioId]) || {}).forEach(dia => garantir(dia));
  const dias = [...porDia.values()];
  dias.forEach(d=>{
    const c = cartoesFeitosNoDia(usuarioId, d.data);
    d.cartoes = c.n; d.cartoesExatos = c.exato;
    d.total = d.respostas.length;
    d.acertos = d.respostas.filter(r=>r.correta).length;
    d.chutes = d.respostas.filter(r=>r.confianca==="chute").length;
    d.duvidas = d.respostas.filter(r=>r.confianca==="duvida").length;
  });
  return dias.filter(d=>d.total || d.cartoes || d.sessoes.length || d.simulados.length)
             .sort((a,b)=>b.data.localeCompare(a.data));
}
/* Reabre um dia inteiro no mesmo feedback questão a questão dos conjuntos.
   É uma sessão de leitura montada na hora a partir das respostas do dia —
   não existe "conjunto do dia" guardado, e inventar um seria criar histórico
   que ninguém fez. */
function abrirDiaDoHistorico(dia){
  const u = usuarioAtual();
  const respostas = db.respostas.filter(r=>r.usuarioId===u.id && r.data===dia)
    .filter(r=>getQuestao(r.questaoId));
  if(!respostas.length){ toast("Neste dia você revisou cartões, mas não respondeu questões.", "err"); return; }
  state.sessaoAtual = {
    id: "dia-"+dia, tipo:"pratica", somenteLeitura:true, salvaNoHistorico:true, dataOriginal: dia,
    itens: respostas.map(r=>({questaoId:r.questaoId, motivo:"Respondida em "+formatDataBR(dia)})),
    respostasSessao: respostas.map(r=>({questaoId:r.questaoId, alternativaEscolhida:r.alternativaEscolhida, correta:r.correta, confianca:r.confianca, data:r.data})),
    indiceAtual:0, marcadas:{}, finalizada:true,
  };
  navigate("sessao");
}
function renderHistorico(){
  const u = usuarioAtual();
  const sessoes = (db.sessoes||[]).filter(x=>x.usuarioId===u.id).slice().reverse();

  const diasAtivos = diasDeAtividade(u.id);
  const pagDias = paginar(diasAtivos, "historico-dias", {porPagina:15});

              ${d.cartoes ? ` · ${d.cartoes} flashcard(s)${d.cartoesExatos?"":" (ao menos)"}` : ""}

/* ==========================================================================
   17. MEU DESEMPENHO
   ==========================================================================
   A página responde, nesta ordem, a três perguntas diferentes:
     1. "Quanto eu já sei?"      -> desempenho total, de tudo que já respondi
     2. "Como estou indo AGORA?" -> janela recente, escolhida pelo aluno
     3. "Onde eu preciso mexer?" -> as 5 grandes áreas e a calibração

   O recorte de tempo fica num seletor único (14 dias, 30 dias, 12 meses ou o
   ano corrente), porque a mesma pergunta muda de escala conforme o momento:
   perto da prova o que importa são os últimos dias; em março, olhar mês a mês
   é o que mostra se o ano está evoluindo de verdade.

   O detalhe assunto a assunto saiu daqui de propósito: virava uma lista de
   dezenas de linhas que ninguém lia até o fim. Aqui ficam as 5 grandes
   áreas, que é o nível em que se decide o que estudar na semana; o assunto
   aparece na tela de Revisão, ao lado da ação correspondente. */
function ctxDesempenho(){
  if(!state.filtroRota.desempenho) state.filtroRota.desempenho = {periodo:"14d"};
  return state.filtroRota.desempenho;
}
function mudarPeriodoDesempenho(p){ ctxDesempenho().periodo = p; render(); }
const PERIODOS_DESEMPENHO = [
  {id:"14d", label:"Últimos 14 dias"},
  {id:"30d", label:"Últimos 30 dias"},
  {id:"12m", label:"Últimos 12 meses"},
  {id:"ano", label:"Este ano, mês a mês"},
];
/* Devolve os dados já prontos para o gráfico, conforme o período escolhido. */
function dadosDoPeriodo(usuarioId, periodo){
  if(periodo==="30d") return {itens: desempenhoPorDia(usuarioId,30), granularidade:"dia", dias:30};
  if(periodo==="12m") return {itens: desempenhoPorMes(usuarioId,"12meses"), granularidade:"mes"};
  if(periodo==="ano") return {itens: desempenhoPorMes(usuarioId,"ano"), granularidade:"mes"};
  return {itens: desempenhoPorDia(usuarioId,14), granularidade:"dia", dias:14};
}
/* Rótulo curto das grandes áreas, para caber embaixo da barra. */
function abreviarArea(nome){
  const mapa = {
    "Clínica Médica":"Clínica",
    "Cirurgia Geral":"Cirurgia",
    "Pediatria":"Pediatria",
    "Ginecologia e Obstetrícia":"GO",
    "Medicina Preventiva e Social":"Preventiva",
  };
  return mapa[nome] || (nome.length>12 ? nome.slice(0,11)+"." : nome);
}
function renderDesempenho(){

  const dados = dadosDoPeriodo(u.id, ctx.periodo);

  const ehDiario = dados.granularidade==="dia";
  const resumo14 = resumoJanela(u.id, 14);
  const resumo30 = resumoJanela(u.id, 30);
  const resumoAtual = ehDiario ? resumoJanela(u.id, dados.dias) : null;
  const somaMeses = !ehDiario ? dados.itens.reduce((acc,m)=>({total:acc.total+m.total, acertos:acc.acertos+m.acertos}), {total:0,acertos:0}) : null;
  const mesesComEstudo = !ehDiario ? dados.itens.filter(m=>m.total>0) : [];
  const melhorMes = mesesComEstudo.length ? mesesComEstudo.slice().sort((a,b)=>b.taxa-a.taxa)[0] : null;

  const graficoAreas = graficoBarrasVerticaisSvg(porArea.map(a=>({

  return `

    <div class="grid grid-4 mt-2">

      <div class="stat-tile"><div class="stat-value">${cartoes.hoje}</div><div class="stat-label">revisados hoje (meta de ${metaCartoesDoUsuario(u)} por dia)</div></div>
      <div class="stat-tile"><div class="stat-value">${cartoes.dias}</div><div class="stat-label">dias com cartão revisado${cartoes.sequencia?` · ${cartoes.sequencia} seguido(s)`:""}</div></div>
    </div>

      ${cartoes.vencidos?`<span class="badge badge-amber" style="align-self:center">${cartoes.vencidos} cartão(ões) vencido(s) esperando</span>`:""}

      </div>

      </div>

    ${ehDiario ? `
    <div class="grid grid-4 mb-2">

    ${graficoBarrasVerticaisSvg(dados.itens, {altura:140, larguraMax: ehDiario?30:42, rotuloRotacionado: ehDiario && dados.dias>20})}

      <div class="stat-tile"><div class="stat-value">${formatarDuracao(ritmo.media)}</div><div class="stat-label">tempo médio</div></div>
      <div class="stat-tile"><div class="stat-value">${ritmo.mediaAcertos!==null?formatarDuracao(ritmo.mediaAcertos):"—"}</div><div class="stat-label">média quando acerta</div></div>
      <div class="stat-tile"><div class="stat-value">${ritmo.mediaErros!==null?formatarDuracao(ritmo.mediaErros):"—"}</div><div class="stat-label">média quando erra</div></div>
    </div>
    ${ritmo.assuntosLentos.length ? `<div class="mt-2">
      <div class="text-sm" style="font-weight:600">Assuntos em que você mais trava</div>
      ${ritmo.assuntosLentos.map(a=>`<div class="flex justify-between items-center card-flat mb-1">
        <span class="text-sm">${escapeHtml(nomeAssunto(a.assuntoId))} <span class="text-xs muted">(${a.n} questões)</span></span>
        <span class="badge ${a.media>ritmo.mediana*1.5?"badge-amber":"badge-muted"}">${formatarDuracao(a.media)} por questão</span>
      </div>`).join("")}
    </div>` : ""}
  </div>` : ""}
  `;
}

/* ==========================================================================
   18. META DE ESTUDO
   ==========================================================================
   A meta deixou de ser uma página no menu. Motivo: é um número que se define
   uma vez e se ajusta de vez em quando, mas que precisa ser VISTO todo dia —
   uma página própria invertia isso, escondendo o acompanhamento e dando
   destaque à configuração. Agora o progresso do dia abre a tela Estudar, e o
   ajuste do número fica a um clique, nesta janela.

   A rota "metas" continua existindo e leva para Estudar, para não quebrar
   link antigo, favorito do navegador ou hash salvo por alguém. */
function abrirModalMeta(){
  const u = usuarioAtual();
  const meta = metaDoUsuario(u);
  const feitasHoje = questoesRespondidasHoje(u.id);
  abrirModal(`
    <div class="modal-header"><h3>Meta diária de questões</h3><button class="icon-btn" onclick="fecharModal()">${iconeSvg("x")}</button></div>
    <p class="text-sm muted">Quantas questões você quer responder por dia. Vale mais uma meta modesta que você cumpre todo dia do que uma ambiciosa que você abandona na terceira semana.</p>
    <div class="field mt-2"><label class="label">Questões por dia</label><input class="input" type="number" id="metaInput" value="${meta}" min="1" max="500"></div>
    <div class="flex gap-1 mb-2" style="flex-wrap:wrap">
      <button class="pill" onclick="document.getElementById('metaInput').value=${db.configGeral.metaMinimaQuestoesDia}">mínimo (${db.configGeral.metaMinimaQuestoesDia})</button>
      <button class="pill" onclick="document.getElementById('metaInput').value=${db.configGeral.metaRecomendadaQuestoesDia}">ideal (${db.configGeral.metaRecomendadaQuestoesDia})</button>
    </div>
    <p class="text-xs muted">Recomendação da coordenação: mínimo de ${db.configGeral.metaMinimaQuestoesDia}/dia, ideal de ${db.configGeral.metaRecomendadaQuestoesDia}/dia. Hoje você já respondeu ${feitasHoje}.</p>
    <div class="flex gap-1 mt-3"><button class="btn btn-primary" onclick="salvarMeta()">Salvar meta</button><button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button></div>`);
}
function salvarMeta(){
  const valor = parseInt(document.getElementById("metaInput").value);
  if(!valor || valor<1){ toast("Informe um número válido.", "err"); return; }
  usuarioAtual().metaQuestoesDia = valor;
  saveState();
  fecharModal();
  toast(valor < db.configGeral.metaMinimaQuestoesDia ? "Meta salva. Está abaixo da recomendação mínima da coordenação." : "Meta salva.");
  render();
}
/* Meta diária de cartões: mesma janela, mesma lógica, outra unidade. */
function abrirModalMetaCartoes(){
  const u = usuarioAtual();
  const meta = metaCartoesDoUsuario(u);
  const feitosHoje = cartoesRevisadosHoje(u.id);
  const recomendada = (db.configGeral && db.configGeral.metaCartoesDia) || CONFIG.metaCartoesDia;
  abrirModal(`
    <div class="modal-header"><h3>Meta diária de cartões</h3><button class="icon-btn" onclick="fecharModal()">${iconeSvg("x")}</button></div>
    <p class="text-sm muted">Quantos flashcards você quer revisar por dia. Um cartão leva segundos, então a meta de cartões costuma ser bem maior que a de questões — e serve para segurar a rotina nos dias em que não dá para sentar e resolver prova.</p>
    <div class="field mt-2"><label class="label">Cartões por dia</label><input class="input" type="number" id="metaCartoesInput" value="${meta}" min="1" max="500"></div>
    <div class="flex gap-1 mb-2" style="flex-wrap:wrap">
      <button class="pill" onclick="document.getElementById('metaCartoesInput').value=10">dia corrido (10)</button>
      <button class="pill" onclick="document.getElementById('metaCartoesInput').value=${recomendada}">recomendada (${recomendada})</button>
    </div>
    <p class="text-xs muted">Hoje você já revisou ${feitosHoje} cartão(ões). A meta de cartões não substitui a de questões: elas convivem, e bater qualquer uma das duas já mantém sua sequência daquele tipo de estudo.</p>
    <div class="flex gap-1 mt-3"><button class="btn btn-primary" onclick="salvarMetaCartoes()">Salvar meta</button><button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button></div>`);
}
function salvarMetaCartoes(){
  const valor = parseInt(document.getElementById("metaCartoesInput").value);
  if(!valor || valor<1){ toast("Informe um número válido.", "err"); return; }
  usuarioAtual().metaCartoesDia = valor;
  saveState();
  fecharModal();
  toast("Meta de cartões salva.");
  render();
}

/* ==========================================================================
   18-B. MEU GRUPO — cada aluno usa, por padrão, o calendário oficial da
   coordenação, mas pode criar seu próprio grupo/turma com calendário
   customizado, ou adotar o calendário que outro aluno já montou.
   ========================================================================== */
function renderMeuGrupo(){
  const u = usuarioAtual();
  const meuGrupo = getGrupoDoUsuario(u);
  const souDono = meuGrupo.criadoPor === u.id && !meuGrupo.oficial;
  const semTurma = !!meuGrupo.oficial;
  const anoDaMinhaTurma = anoDoGrupo(meuGrupo, u);
  const anoParaCriar = temCalendarioProprio(u.anoFaculdade) ? u.anoFaculdade : CONFIG.anoFaculdadePadrao;
  const outrosGrupos = db.grupos.filter(g=>g.id!==meuGrupo.id && !g.oficial);
  const solicitacoesPendentes = souDono ? (meuGrupo.solicitacoesPendentes||[]) : [];
  const formado = !temCalendarioProprio(u.anoFaculdade);
  return `
  <div class="page-header"><h2>Meu Grupo</h2><p>Todas as turmas do seu ano passam pelos mesmos blocos, na mesma ordem. O que muda de uma para outra é por qual bloco ela começa — é o <strong>Grupo A, B, C ou D</strong> do calendário da faculdade.</p></div>

  ${semTurma ? `<div class="card mb-2" style="border-color:var(--accent)">
    <div class="card-title">${iconeSvg("users")} Escolha a sua turma</div>
    <p class="text-sm">Você ainda está no <strong>calendário oficial da coordenação</strong>. Ele funciona, mas segue o Grupo A: se a sua turma é outra, o bloco atual aparece trocado. Escolha abaixo a turma em que você está — ou crie a sua, se ela ainda não existir aqui.</p>
    <p class="text-xs muted mt-1">Dá para trocar depois quantas vezes precisar. Você fica em uma turma de cada vez.</p>
  </div>` : ""}

  <div class="card mb-2">
    <div class="qcard-meta mb-1">${meuGrupo.oficial ? '<span class="badge badge-muted">Calendário oficial — nenhuma turma escolhida</span>' : `<span class="badge badge-accent">${escapeHtml(nomeRodizio(anoDaMinhaTurma, meuGrupo.deslocamento))}</span>` + (souDono ? '<span class="badge badge-muted">Criado por você</span>' : '<span class="badge badge-muted">Criado por outro aluno</span>')}</div>
    <div style="font-weight:700;font-size:1.1rem">${escapeHtml(meuGrupo.nome)}</div>
    <div class="text-sm muted mt-1">${blocosDoGrupo(meuGrupo, u).length} bloco(s) na sequência de ${escapeHtml(anoDeReferencia(anoDaMinhaTurma))}${!meuGrupo.oficial?" · "+((meuGrupo.membrosAprovados||[]).length)+" membro(s)":""}.</div>
    ${formado ? `<div class="text-xs muted mt-1">Você está marcado como <strong>${escapeHtml(u.anoFaculdade||"Formado(a)")}</strong>, e quem já se formou não tem calendário de faculdade próprio. Participando de um grupo, você acompanha o calendário do ano daquela turma; fora dele, a plataforma usa a sequência de ${escapeHtml(CONFIG.anoFaculdadePadrao)} como referência.</div>` : ""}
    ${!semTurma ? `<button class="btn btn-ghost btn-sm mt-2" onclick="sairDoMeuGrupo()">Sair desta turma e voltar ao calendário oficial</button>` : ""}
  </div>

  ${solicitacoesPendentes.length ? `<div class="card mb-2" style="border-color:var(--amber)">
    <div class="card-title">Solicitações de acesso pendentes (${solicitacoesPendentes.length})</div>
    <p class="text-sm muted">Essas pessoas pediram para entrar na sua turma. Só entram depois que você aprovar.</p>
    ${solicitacoesPendentes.map(uidSolicitante=>{
      const solicitante = getUsuario(uidSolicitante);
      return `<div class="flex justify-between items-center card-flat mb-1">
        <span class="text-sm">${escapeHtml(solicitante?solicitante.nome:"—")}</span>
        <div class="flex gap-1"><button class="btn btn-primary btn-sm" onclick="aprovarAcessoGrupo('${meuGrupo.id}','${uidSolicitante}')">Aprovar</button><button class="btn btn-ghost btn-sm" onclick="rejeitarAcessoGrupo('${meuGrupo.id}','${uidSolicitante}')">Rejeitar</button></div>
      </div>`;
    }).join("")}
  </div>` : ""}

  <div class="card mb-2">
    <div class="card-title">Calendário desta turma</div>
    ${renderEditorCalendario(meuGrupo, {podeEditar: souDono, usuario: u, podeEditarSequencia: podeAdmin("blocos")})}
    ${!souDono && !semTurma ? '<p class="text-xs muted mt-1">Só quem criou a turma muda o grupo do rodízio. Se a letra estiver errada, avise o dono da turma ou a coordenação.</p>' : ""}
    <p class="text-xs muted mt-1">A ordem dos blocos é a do seu ano e é definida pela coordenação — o que a turma escolhe é por qual deles entra.</p>
  </div>

  ${!meuGrupo.oficial ? renderQuestoesDoGrupo(meuGrupo) : ""}

  <div class="card mb-2">
    <div class="card-title">${semTurma ? "Criar a minha turma" : "Criar outra turma"}</div>
    <p class="text-sm muted">A turma segue a sequência de blocos de ${escapeHtml(anoParaCriar)} (a mesma de todas as turmas do ano) e você escolhe em qual grupo do rodízio ela entra — é assim que duas turmas do mesmo ano estudam matérias diferentes na mesma semana. Quem pedir para entrar precisa da sua aprovação.</p>
    ${formado ? `<p class="text-xs muted">Como você está como ${escapeHtml(u.anoFaculdade||"Formado(a)")}, a turma nasce seguindo o calendário de ${escapeHtml(anoParaCriar)}.</p>` : ""}
    <p class="text-xs muted">Criar uma turma faz você sair da atual: cada pessoa fica em uma só.</p>
    <div class="flex gap-1 items-end mt-1" style="flex-wrap:wrap">
      <div class="field" style="margin-bottom:0;min-width:240px"><label class="label">Nome da turma</label><input class="input" id="novoGrupoNome" placeholder="Ex.: ${escapeHtml(anoParaCriar)} 2026 — Grupo B"></div>
      <div class="field" style="margin-bottom:0;min-width:200px"><label class="label">Grupo do rodízio</label>
        <select class="select" id="novoGrupoRodizio">
          ${opcoesRodizioPorLetra(anoParaCriar).map(o=>`<option value="${o.deslocamento}">Grupo ${escapeHtml(o.rotulo)} — começa em ${escapeHtml(o.bloco.nome)}</option>`).join("")}
        </select>
      </div>
      <button class="btn btn-primary" onclick="criarMeuGrupo()">Criar turma</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Entrar em uma turma já existente</div>
    ${outrosGrupos.length ? outrosGrupos.map(g=>{
      const souMembro = g.criadoPor===u.id || (g.membrosAprovados||[]).includes(u.id);
      const jaSolicitei = (g.solicitacoesPendentes||[]).includes(u.id);
      const anoG = anoDoGrupo(g, u);
      const atualG = blocoAtualDoGrupo(g, u);
      return `
      <div class="flex justify-between items-center mb-1 card-flat" style="gap:.5rem;flex-wrap:wrap">
        <div>
          <div style="font-weight:600">${escapeHtml(g.nome)} <span class="badge badge-accent">${escapeHtml(rotuloRodizio(anoG, g.deslocamento))}</span></div>
          <div class="text-xs muted">${escapeHtml(anoG)} · hoje em ${escapeHtml(atualG?atualG.nome:"—")} · criada por ${escapeHtml(getUsuario(g.criadoPor)?getUsuario(g.criadoPor).nome:"—")}</div>
        </div>
        ${souMembro ? `<button class="btn btn-secondary btn-sm" onclick="usarGrupo('${g.id}')">Entrar nesta turma</button>` :
          jaSolicitei ? `<button class="btn btn-secondary btn-sm" disabled>Solicitação enviada</button>` :
          `<button class="btn btn-secondary btn-sm" onclick="solicitarAcessoGrupo('${g.id}')">Pedir para entrar</button>`}
      </div>`;
    }).join("") : '<p class="text-sm muted">Nenhuma turma criada ainda. Crie a sua acima.</p>'}
  </div>
  <div class="card-flat mt-2 text-xs muted">Com a nuvem ligada, o estudo de cada pessoa viaja entre aparelhos, mas as turmas ainda são deste navegador: um grupo criado aqui só aparece para quem abrir a plataforma neste mesmo computador. Ver <code>nuvem/LEIA-ME.md</code>.</div>
  `;
}
function criarMeuGrupo(){
  const nome = document.getElementById("novoGrupoNome").value.trim();
  if(!nome){ toast("Dê um nome para a turma.", "err"); return; }
  const u = usuarioAtual();
  // a turma herda a sequência de um ano que tenha calendário (quem está como
  // "Formado(a)" não tem, e aí vale o ano padrão) e o que ela escolhe é o
  // grupo do rodízio — o bloco por onde entra na sequência
  const ano = temCalendarioProprio(u.anoFaculdade) ? u.anoFaculdade : CONFIG.anoFaculdadePadrao;
  const campoRodizio = document.getElementById("novoGrupoRodizio");
  const deslocamento = campoRodizio ? (parseInt(campoRodizio.value)||0) : 0;
  const novo = { id:uid("grupo"), nome, criadoPor:u.id, oficial:false, publico:true, criadoEm:hojeISO(),
                 anoFaculdade: ano, deslocamento,
                 blocoAtualIdManual:null, membrosAprovados:[], solicitacoesPendentes:[] };
  db.grupos.push(novo);
  entrarNoGrupo(u, novo.id);
  saveState();
  toast('Turma criada — você está no ' + nomeRodizio(ano, deslocamento) + '.');
  render();
}
function usarGrupo(grupoId){
  const g = getGrupo(grupoId); if(!g) return;
  const u = usuarioAtual();
  if(!g.oficial && g.criadoPor!==u.id && !(g.membrosAprovados||[]).includes(u.id)){
    toast("Você ainda não faz parte desta turma — peça para entrar.", "err"); return;
  }
  entrarNoGrupo(u, grupoId);
  saveState();
  toast('Agora você está em "'+g.nome+'" ('+nomeRodizio(anoDoGrupo(g,u), g.deslocamento)+').');
  render();
}
/* Sair da turma é voltar ao calendário oficial — nunca ficar sem calendário
   nenhum, o que deixaria a tela Estudar sem bloco atual. */
function sairDoMeuGrupo(){
  const u = usuarioAtual();
  entrarNoGrupo(u, db.grupoOficialId);
  saveState();
  toast("Você voltou ao calendário oficial da coordenação.");
  render();
}
function solicitarAcessoGrupo(grupoId){
  const g = getGrupo(grupoId); if(!g) return;
  const u = usuarioAtual();
  if(!g.solicitacoesPendentes) g.solicitacoesPendentes = [];
  if(!g.solicitacoesPendentes.includes(u.id)) g.solicitacoesPendentes.push(u.id);
  saveState();
  toast("Pedido enviado! Assim que "+(getUsuario(g.criadoPor)?getUsuario(g.criadoPor).nome:"o dono da turma")+" aprovar, você entra nela.");
  render();
}
function aprovarAcessoGrupo(grupoId, usuarioId){
  const g = getGrupo(grupoId); if(!g) return;
  const solicitante = getUsuario(usuarioId);
  if(solicitante) entrarNoGrupo(solicitante, grupoId);
  else g.solicitacoesPendentes = (g.solicitacoesPendentes||[]).filter(id=>id!==usuarioId);
  saveState();
  toast("Acesso aprovado.");
  render();
}
function rejeitarAcessoGrupo(grupoId, usuarioId){
  const g = getGrupo(grupoId); if(!g) return;
  g.solicitacoesPendentes = (g.solicitacoesPendentes||[]).filter(id=>id!==usuarioId);
  saveState();
  toast("Solicitação recusada.");
  render();
}
function renderQuestoesDoGrupo(grupo){
  const questoes = db.questoes.filter(q=>q.grupoId===grupo.id);
  const pagGrupo = paginar(questoes, "questoes-grupo", {porPagina:20});
  return `<div class="card mb-2">
    <div class="flex justify-between items-center mb-1" style="flex-wrap:wrap;gap:.5rem">
      <div class="card-title" style="margin-bottom:0">Questões deste grupo (${questoes.length})</div>
      <div class="flex gap-1" style="flex-wrap:wrap">
        <button class="btn btn-secondary btn-sm" onclick="navigate('importar-questoes')">${iconeSvg("upload")} Colar prova inteira / importar em lote</button>
        <button class="btn btn-primary btn-sm" onclick="abrirFormularioQuestao(null)">${iconeSvg("plus")} Adicionar questão</button>
      </div>
    </div>
    <p class="text-sm muted">Qualquer pessoa do grupo pode contribuir. Essas questões ficam disponíveis só pra quem está neste grupo — em "Estudar &gt; Monte sua lista", marque "incluir questões do meu grupo" pra praticá-las.</p>
    <div class="card-flat mt-2 text-sm">
      <strong>Prova inteira de uma vez:</strong> em "Enviar Questões" você informa a instituição e o ano uma única vez, copia o prompt pronto, cola numa IA junto com o PDF da prova e traz o resultado de volta. Escolha o destino <em>"Questões do meu grupo"</em> para elas caírem direto aqui.
      <div class="flex gap-1 mt-2" style="flex-wrap:wrap">
        <button class="btn btn-secondary btn-sm" onclick="navigate('importar-questoes')">${iconeSvg("search")} Abrir tela com o prompt pronto</button>
        <button class="btn btn-ghost btn-sm" onclick="copiarTexto(gerarPromptImportacao(),'Prompt copiado! Cole numa IA junto com a prova.')">Copiar prompt agora</button>
      </div>
    </div>
    ${questoes.length ? `<div class="table-wrap mt-2"><table><thead><tr><th>Questão</th><th>Assunto</th><th></th></tr></thead><tbody>
      ${pagGrupo.itens.map(q=>`<tr><td class="text-sm"><span class="enunciado-clicavel" onclick="abrirQuestaoCompleta('${q.id}')">${escapeHtml(q.enunciado.slice(0,90))}…</span></td><td class="text-sm">${escapeHtml(nomeAssunto(q.assuntoId))}</td><td class="flex gap-1"><button class="icon-btn" title="Ver na íntegra" onclick="abrirQuestaoCompleta('${q.id}')">${iconeSvg("search")}</button><button class="icon-btn" title="Editar" onclick="abrirFormularioQuestao('${q.id}')">${iconeSvg("edit")}</button></td></tr>`).join("")}
    </tbody></table></div>
    ${controlesPaginacao(pagGrupo, "questão(ões) do grupo")}` : '<p class="text-sm muted mt-1">Nenhuma questão adicionada ainda.</p>'}
  </div>`;
}

/* ==========================================================================

  </div>
  ${u.papel==="aluno" ? `<div class="card mt-2" style="max-width:460px">

// helpers de seleção rápida usados nos filtros com caixas de marcação
function marcarTodasCaixas(classe, marcar){ document.querySelectorAll("."+classe).forEach(el=>{ el.checked = !!marcar; }); }
function marcarUltimos5Caixas(classe){
  const caixas = [...document.querySelectorAll("."+classe)];
  const anos = caixas.map(el=>parseInt(el.value)).sort((a,b)=>b-a).slice(0,5);
  caixas.forEach(el=>{ el.checked = anos.includes(parseInt(el.value)); });
  toast(anos.length ? "Selecionados os últimos 5 anos: "+anos.join(", ") : "Nenhum ano disponível.");
}
function buscarCandidatasSimulado(){
  const areaIds = [...document.querySelectorAll(".csArea:checked")].map(el=>el.value);
  const anos = [...document.querySelectorAll(".csAno:checked")].map(el=>parseInt(el.value));
  const campoBanca = document.getElementById("csBanca");
  const banca = campoBanca ? campoBanca.value : "";
  const pool = buscarQuestoesPorFiltro(usuarioAtual().id, {areaIds, anos, bancas: banca?[banca]:[], incluirInativas:true}).map(q=>q.id);
  if(!state.filtroRota) state.filtroRota = {};
  state.filtroRota.criarSimulado = {pool, selecionadas:[]};
  render();
}
function toggleSelecaoSimulado(qid){
  const ctx = state.filtroRota.criarSimulado;
  const idx = ctx.selecionadas.indexOf(qid);
  if(idx>=0) ctx.selecionadas.splice(idx,1); else ctx.selecionadas.push(qid);
  render();
}
function salvarSimuladoCriado(){
  const ctx = state.filtroRota.criarSimulado;
  const titulo = document.getElementById("csTitulo").value.trim() || "Simulado sem título";
  const duracao = parseInt(document.getElementById("csDuracao").value) || Math.max(10,ctx.selecionadas.length*2);
  const blocos = [...document.querySelectorAll(".csBloco:checked")].map(el=>el.value);
  db.simulados.push({id:uid("sim"), titulo, questoes:ctx.selecionadas.slice(), duracaoMin:duracao, recomendadoParaBlocos:blocos, tipo:"simulado_professor", criadoPor:usuarioAtual().id, criadoEm:hojeISO()});
  saveState();
  state.filtroRota.criarSimulado = null;
  toast("Simulado criado.");
  navigate("simulados");
}

   de desempenho para levar à reunião de coordenação.

   Como a plataforma não pode depender de biblioteca externa, o PDF é gerado
   pelo próprio navegador: montamos o material dentro da div #areaImpressao
   (que fica invisível o tempo todo) e chamamos window.print(). Em todos os
   sistemas atuais existe a opção "Salvar como PDF" na janela de impressão —
   e o resultado é um PDF de texto real, pesquisável, não uma foto da tela.

   As regras de conteúdo valem aqui também: o material sai com a origem de
   cada questão e com as referências, e nada é copiado de terceiros. */
function ctxMaterialPDF(){
  if(!state.filtroRota.pdf) state.filtroRota.pdf = {
    tipo:"prova", fonte:"filtros", simuladoId:"", areaId:"", especialidadeId:"", banca:"", ano:"",
    quantidade:20, comGabarito:true, comExplicacao:true, comCartaoResposta:true, comReferencias:true,
    titulo:"", subtitulo:"",
  };
  return state.filtroRota.pdf;
}
function atualizarCampoPDF(campo, valor, ehCheck){
  const ctx = ctxMaterialPDF();
  ctx[campo] = ehCheck ? !!valor : valor;
  if(campo==="areaId") ctx.especialidadeId = "";
  render();
}
/* Conjunto de questões que vai para o papel, conforme a fonte escolhida. */
function questoesDoMaterialPDF(){
  const ctx = ctxMaterialPDF();
  if(ctx.fonte==="simulado"){
    const sim = db.simulados.find(s=>s.id===ctx.simuladoId);
    if(!sim) return [];
    return (sim.questaoIds||[]).map(getQuestao).filter(Boolean);
  }
  let pool = questoesAtivas();
  if(ctx.areaId) pool = pool.filter(q=>q.areaId===ctx.areaId);
  if(ctx.especialidadeId) pool = pool.filter(q=>q.especialidadeId===ctx.especialidadeId);
  if(ctx.banca) pool = pool.filter(q=>q.banca===ctx.banca);
  if(ctx.ano) pool = pool.filter(q=>String(q.ano)===String(ctx.ano));
  return embaralhar(pool).slice(0, Math.max(1, parseInt(ctx.quantidade)||20));
}
function flashcardsDoMaterialPDF(){
  const ctx = ctxMaterialPDF();
  // só material da equipe: o caderno pessoal de cada aluno não vira
  // impresso distribuído para a turma
  let pool = flashcardsDaEquipe();
  if(ctx.especialidadeId) pool = pool.filter(c=>{ const a = getAssunto(c.assuntoId); return a && a.especialidadeId===ctx.especialidadeId; });
  else if(ctx.areaId) pool = pool.filter(c=>{ const a = getAssunto(c.assuntoId); const e = a?getEspecialidade(a.especialidadeId):null; return e && e.areaId===ctx.areaId; });
  return pool.slice(0, Math.max(1, parseInt(ctx.quantidade)||20));
}

/* Monta o HTML de impressão e entrega para o navegador. */
function gerarMaterialPDF(){
  const ctx = ctxMaterialPDF();
  let corpo = "";
  if(ctx.tipo==="prova") corpo = htmlProvaPDF();
  else if(ctx.tipo==="lista") corpo = htmlListaComentadaPDF();
  else if(ctx.tipo==="flashcards") corpo = htmlFlashcardsPDF();
  else corpo = htmlDesempenhoPDF();
  if(!corpo){ toast("Não há conteúdo para imprimir com essas opções.", "err"); return; }
  imprimir(corpo);
}
function cabecalhoPDF(tituloPadrao){
  const ctx = ctxMaterialPDF();
  const titulo = ctx.titulo || tituloPadrao;
  const sub = ctx.subtitulo;
  return `<div class="pdf-cabecalho">
    <h1>${escapeHtml(titulo)}</h1>
    <div class="pdf-sub">${CONFIG.nomePlataforma}${sub?" · "+escapeHtml(sub):""} · gerado em ${formatDataBR(hojeISO())}</div>
  </div>`;
}
function htmlProvaPDF(){

    html += `<div class="pdf-questao">

      ${q.alternativas.map(a=>`<div class="pdf-alt">${escapeHtml(a.id)}) ${escapeHtml(a.texto)}</div>`).join("")}
      <div class="pdf-meta">${escapeHtml(q.banca)} · ${q.ano} · ${escapeHtml(nomeAssunto(q.assuntoId))}</div>

  return html;

function htmlFlashcardsPDF(){

function htmlDesempenhoPDF(){
  const alunos = db.usuarios.filter(x=>x.papel==="aluno" && x.status==="aprovado");
  if(!alunos.length) return "";
  let html = cabecalhoPDF("Relatório de desempenho da turma");
  const linhas = alunos.map(a=>{
    const respostas = db.respostas.filter(r=>r.usuarioId===a.id);
    const acertos = respostas.filter(r=>r.correta).length;
    const dias = new Set(respostas.map(r=>r.data)).size;
    const piores = sugestoesDeMelhoria(a.id, 1);
    return {
      nome: a.nome,
      grupo: getGrupoDoUsuario(a).nome,
      ano: a.anoFaculdade || "—",
      total: respostas.length,
      taxa: respostas.length ? pct(acertos, respostas.length)+"%" : "—",
      dias,
      pior: piores.length ? nomeAssunto(piores[0].assuntoId)+" ("+piores[0].taxa+"%)" : "—",
    };
  }).sort((a,b)=>b.total-a.total);
  html += `<table class="pdf-tabela"><thead><tr><th>Aluno</th><th>Turma</th><th>Ano</th><th>Questões</th><th>Acerto</th><th>Dias com estudo</th><th>Assunto mais fraco</th></tr></thead><tbody>
    ${linhas.map(l=>`<tr><td>${escapeHtml(l.nome)}</td><td>${escapeHtml(l.grupo)}</td><td>${escapeHtml(l.ano)}</td><td>${l.total}</td><td>${l.taxa}</td><td>${l.dias}</td><td>${escapeHtml(l.pior)}</td></tr>`).join("")}
  </tbody></table>`;
  html += `<p style="font-size:9pt;margin-top:.9rem;color:#333">Leitura sugerida: quem tem muitas questões e acerto baixo precisa de conteúdo; quem tem acerto alto e poucos dias com estudo precisa de constância; quem tem poucas questões e poucos dias parou — e é com esse que a conversa deve começar.</p>`;
  return html;
}
/* Preenche a área de impressão, chama o navegador e limpa depois. */
function imprimir(html){
  const area = document.getElementById("areaImpressao");
  area.innerHTML = html;
  const limpar = function(){ area.innerHTML = ""; window.removeEventListener("afterprint", limpar); };
  window.addEventListener("afterprint", limpar);
  setTimeout(function(){
    window.print();
    // alguns navegadores não disparam afterprint; limpamos por segurança
    setTimeout(limpar, 3000);
  }, 60);
}

function duvidasRespondidas(usuario){

function mudarPapelNaNuvem(id, papel){
  if(!podeAdmin("usuarios")){ toast("Só um administrador máster pode alterar papéis.", "err"); render(); return; }
  const linhaAtual = (nuvemUsuarios||[]).find(p=>p.id===id);
  // deixar de ser admin é deixar de ser máster: passa pela mesma trava
  if(papel !== "admin" && linhaAtual && linhaAtual.papel === "admin" && (linhaAtual.nivel_admin||"") === "master"
     && !podeDeixarDeSerMaster(id, "coordenacao", "nuvem")){ render(); return; }
  const campos = { papel };
  if(papel === "admin"){
    const linha = (nuvemUsuarios||[]).find(p=>p.id===id);
    if(linha && !linha.nivel_admin) campos.nivel_admin = "moderador";
  }
  nuvemAtualizarPerfil(id, campos, "Papel atualizado na nuvem.");
}
function mudarNivelNaNuvem(id, nivel){
  if(!podeAdmin("usuarios")){ toast("Só um administrador máster pode alterar níveis.", "err"); render(); return; }
  if(!podeDeixarDeSerMaster(id, nivel, "nuvem")) { render(); return; }
  nuvemAtualizarPerfil(id, { nivel_admin: nivel }, "Nível de acesso atualizado para " + rotuloNivelAdmin(nivel) + ".");
}
function mudarStatusNaNuvem(id, status){
  if(!podeAdmin("usuarios")){ toast("Só um administrador máster pode alterar o acesso.", "err"); return; }
  const rotulos = {aprovado:"Cadastro aprovado — a pessoa já pode entrar.", inativo:"Conta inativada: a pessoa deixa de conseguir entrar, mas o estudo dela fica guardado.", rejeitado:"Cadastro recusado."};
  nuvemAtualizarPerfil(id, { status }, rotulos[status] || "Status atualizado.");
}
/* Não dá para ficar sem administrador máster — e as duas listas NÃO se
   somam. Uma conta local de demonstração é máster só deste navegador: ela
   não passa no e_equipe() do banco, então não administra a turma da nuvem.
   Contá-la deixaria a coordenação se rebaixar achando que havia um suplente,
   e a partir daí ninguém mais poderia aprovar, promover ou excluir ninguém
   na nuvem — sem conserto pelo site, só pelo painel do Supabase.
   Por isso cada lado só conta com os seus. */
function podeDeixarDeSerMaster(id, novoNivel, ondeMora){
  if(novoNivel === "master") return true;
  const suplentes = ondeMora === "nuvem"
    ? (nuvemUsuarios||[]).filter(p => p.papel==="admin" && (p.nivel_admin||"coordenacao")==="master" && p.id!==id && p.status==="aprovado").length
    : db.usuarios.filter(u => u.papel==="admin" && nivelAdminDe(u)==="master" && u.id!==id).length;
  if(suplentes === 0){
    toast(ondeMora === "nuvem"
      ? "É preciso manter pelo menos um administrador máster NA NUVEM — é ele que aprova e administra a turma. Promova outra pessoa antes."
      : "É preciso manter pelo menos um administrador máster neste navegador.", "err");
    return false;
  }
  return true;
}

/* ---------------------------- excluir um cadastro -------------------------
   Inativar e excluir respondem a coisas diferentes: inativar é "esta pessoa
   não entra mais", guardando o estudo dela; excluir é "esta pessoa nunca
   deveria ter entrado" — um cadastro duplicado, um e-mail errado, alguém de
   fora da turma. Como excluir não tem volta, a janela diz, antes de
   confirmar, exatamente o que vai junto e o que fica. */
function dadosDoUsuario(id){
  return {
    respostas: db.respostas.filter(r=>r.usuarioId===id).length,
    favoritos: db.favoritos.filter(f=>f.usuarioId===id).length + (db.favoritosCartoes||[]).filter(f=>f.usuarioId===id).length,
    cartoes: db.flashcards.filter(c=>c.usuarioId===id).length,
    sessoes: db.sessoes.filter(x=>x.usuarioId===id).length,
    simulados: db.resultadosSimulados.filter(x=>x.usuarioId===id).length,
    questoes: db.questoes.filter(q=>q.criadoPor===id).length,
    comentarios: db.comentarios.filter(c=>c.usuarioId===id).length,
    turmas: db.grupos.filter(g=>!g.oficial && g.criadoPor===id).length,
  };
}
function confirmarExcluirUsuario(id, onde){
  if(!podeAdmin("usuarios")){ toast("Só um administrador máster pode excluir cadastros.", "err"); return; }
  const local = getUsuario(id);
  const naNuvem = (nuvemUsuarios||[]).find(p=>p.id===id);
  const nome = (naNuvem && naNuvem.nome) || (local && local.nome) || "este cadastro";
  const email = (naNuvem && naNuvem.email) || (local && local.email) || "";
  if(usuarioAtual() && usuarioAtual().id === id){ toast("Você não pode excluir a própria conta.", "err"); return; }
  const ehMasterNaNuvem = !!(naNuvem && naNuvem.papel==="admin" && (naNuvem.nivel_admin||"")==="master");
  const ehMasterLocal = !!(local && local.papel==="admin" && nivelAdminDe(local)==="master");
  if(onde==="nuvem" && ehMasterNaNuvem && !podeDeixarDeSerMaster(id, "coordenacao", "nuvem")) return;
  if(onde==="local" && ehMasterLocal && !podeDeixarDeSerMaster(id, "coordenacao", "local")) return;
  const d = dadosDoUsuario(id);
  const vaiJunto = [
    d.respostas ? d.respostas + " resposta(s)" : "",
    d.favoritos ? d.favoritos + " favorito(s)" : "",
    d.cartoes ? d.cartoes + " cartão(ões) pessoal(is)" : "",
    d.sessoes ? d.sessoes + " sessão(ões)" : "",
    d.simulados ? d.simulados + " nota(s) de simulado" : "",
  ].filter(Boolean);
  const fica = [
    d.questoes ? d.questoes + " questão(ões) que enviou ao banco" : "",
    d.comentarios ? d.comentarios + " comentário(s) em questões" : "",
    d.turmas ? d.turmas + " turma(s) que criou" : "",
  ].filter(Boolean);
  abrirModal(`
    <div class="modal-header"><h3>Excluir o cadastro de ${escapeHtml(nome)}?</h3><button class="icon-btn" onclick="fecharModal()">${iconeSvg("x")}</button></div>
    <p class="text-sm">${escapeHtml(email)}</p>
    <p class="text-sm mt-2"><strong>Isto não pode ser desfeito.</strong> Se a intenção é só tirar o acesso, use <em>Inativar</em>: a pessoa deixa de entrar e o estudo dela continua guardado.</p>
    ${vaiJunto.length ? `<div class="card-flat mt-2"><div class="text-sm" style="font-weight:600">Vai junto, deste navegador:</div><div class="text-sm muted mt-1">${vaiJunto.join(" · ")}</div></div>` : '<div class="card-flat mt-2 text-sm muted">Não há estudo desta pessoa guardado neste navegador.</div>'}
    ${fica.length ? `<div class="card-flat mt-1"><div class="text-sm" style="font-weight:600">Fica na plataforma (é conteúdo da turma, não dado pessoal):</div><div class="text-sm muted mt-1">${fica.join(" · ")}</div></div>` : ""}
    ${onde==="nuvem" ? `<p class="text-xs muted mt-2">Na nuvem, o que se apaga é o <strong>cadastro</strong> (a linha de <code>perfis</code>) — e é isso que corta a entrada, mesmo com e-mail e senha certos. Duas coisas continuam lá até alguém removê-las pelo painel do Supabase, porque este site não tem a chave que faz isso: a conta de autenticação e as respostas que a pessoa já tinha sincronizado (elas ficam ligadas à conta, não ao cadastro). Removendo a conta pelo painel, o estudo dela sai junto, em cascata.</p>` : ""}
    <div class="flex gap-1 mt-3">
      <button class="btn btn-danger" onclick="excluirUsuarioConfirmado('${id}','${onde}')">${iconeSvg("trash")} Excluir mesmo assim</button>
      <button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
    </div>`);
}
async function excluirUsuarioConfirmado(id, onde){
  if(!podeAdmin("usuarios")){ toast("Só um administrador máster pode excluir cadastros.", "err"); return; }
  if(onde === "nuvem"){
    const ok = await nuvemExcluirPerfil(id);
    if(!ok){ fecharModal(); render(); return; }
  }
  apagarDadosLocaisDoUsuario(id);
  saveState();
  fecharModal();
  toast("Cadastro excluído.");
  render();
}
/* Apaga do banco deste navegador tudo o que é PESSOAL daquele id. Questões,
   comentários e turmas que a pessoa criou não entram: são conteúdo que a
   turma usa, e apagá-los tiraria material de quem ficou. */
function apagarDadosLocaisDoUsuario(id){
  db.usuarios = db.usuarios.filter(u => u.id !== id);
  db.respostas = db.respostas.filter(r => r.usuarioId !== id);
  db.favoritos = db.favoritos.filter(f => f.usuarioId !== id);
  db.favoritosCartoes = (db.favoritosCartoes||[]).filter(f => f.usuarioId !== id);
  db.flashcards = db.flashcards.filter(c => c.usuarioId !== id);
  db.sessoes = db.sessoes.filter(x => x.usuarioId !== id);
  db.resultadosSimulados = db.resultadosSimulados.filter(x => x.usuarioId !== id);
  if(db.revisoes) delete db.revisoes[id];
  if(db.revisoesFlashcards) delete db.revisoesFlashcards[id];
  if(db.diasCartoes) delete db.diasCartoes[id];
  if(db.cartoesPorDia) delete db.cartoesPorDia[id];
  if(db.sessoesEmAndamento) delete db.sessoesEmAndamento[id];
  (db.grupos||[]).forEach(g => {
    g.membrosAprovados = (g.membrosAprovados||[]).filter(x => x !== id);
    g.solicitacoesPendentes = (g.solicitacoesPendentes||[]).filter(x => x !== id);
  });
}

  alvo.nivelAdmin = nivel;
  saveState();
  toast("Nível de acesso atualizado para "+rotuloNivelAdmin(nivel)+".");

}

function badgeStatusQuestao(status){
  const map = {ativa:["badge-accent","Ativa"], pendente:["badge-amber","Pendente"], anulada:["badge-muted","Anulada"], desatualizada:["badge-amber","Desatualizada"]};
  const [cls,label] = map[status] || ["badge-muted", status];
  return `<span class="badge ${cls}">${label}</span>`;
}
function filtrosBanco(){
  if(!state.filtroRota.banco) state.filtroRota.banco = {busca:"", banca:"", ano:"", areaId:"", status:"", ultimos5:false};
  return state.filtroRota.banco;
}
function mudarFiltroBanco(campo, valor){
  const f = filtrosBanco();
  if(campo==="ultimos5"){ f.ultimos5 = !!valor; if(f.ultimos5) f.ano = ""; }
  else f[campo] = valor;
  render();
}
function limparFiltrosBanco(){ state.filtroRota.banco = {busca:"", banca:"", ano:"", areaId:"", status:"", ultimos5:false}; render(); }
function buscarNoBanco(){ filtrosBanco().busca = document.getElementById("buscaBancoInput").value; render(); }
function renderBancoQuestoes(){
  const f = filtrosBanco();
  const bancas = [...new Set(db.questoes.map(q=>q.banca))].sort();
  const anosDisponiveis = [...new Set(db.questoes.map(q=>q.ano))].sort((a,b)=>b-a);
  const anoMaisRecente = anosDisponiveis.length ? anosDisponiveis[0] : new Date().getFullYear();
  const termo = (f.busca||"").toLowerCase();
  let lista = db.questoes.slice();
  if(termo) lista = lista.filter(q=>q.enunciado.toLowerCase().includes(termo) || (q.alternativas||[]).some(a=>a.texto.toLowerCase().includes(termo)));
  if(f.banca) lista = lista.filter(q=>q.banca===f.banca);
  if(f.ano) lista = lista.filter(q=>q.ano===parseInt(f.ano));
  if(f.ultimos5) lista = lista.filter(q=>q.ano > anoMaisRecente-5);
  if(f.areaId) lista = lista.filter(q=>q.areaId===f.areaId);
  if(f.status) lista = lista.filter(q=>q.status===f.status);
  lista.sort((a,b)=> b.ano-a.ano || (a.banca||"").localeCompare(b.banca||""));
  return `
  <div class="page-header"><h2>Banco de Questões</h2><p>${db.questoes.length} questão(ões) no total (${questoesAtivas(true).length} ativas, excluindo anuladas/desatualizadas das sessões e estatísticas; inclui questões restritas a grupos de alunos).</p></div>
  <div class="card mb-2">
    <div class="grid grid-4">
      <div class="field" style="margin-bottom:0"><label class="label">Instituição</label>
