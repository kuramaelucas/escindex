<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Esc — Preparação para Residência Médica</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B6E5C'/%3E%3Ctext x='50' y='69' font-size='56' font-family='Georgia,serif' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   ESC — SISTEMA DE DESIGN
   Cores, tipografia e componentes usados em toda a plataforma.
   Se sua equipe quiser trocar as cores da marca, mexa só no bloco :root abaixo.
   ========================================================================== */
:root{
  --bg:#F5F6F3; --surface:#FFFFFF; --surface-2:#EBEFEC;
  --ink:#11201C; --ink-2:#44534D;
  /* --muted e --amber foram escurecidos um pouco (mesmo tom, menor luminosidade)
     para passar de ~3.3:1 para acima de 4.5:1 de contraste sobre fundo claro —
     o mínimo da WCAG AA para texto pequeno. Antes, texto em cinza-esverdeado
     claro (rótulos, dicas) e em dourado (avisos, badges) ficava difícil de
     ler para quem tem baixa visão. */
  --muted:#64726E; --amber:#885F25;
  --border:#DEE4E0; --border-strong:#C4CDC7;
  --accent:#0B6E5C; --accent-dark:#084F42; --accent-soft:#E1EFEB;
  --amber-soft:#F3E8D6;
  --danger:#B23A2E; --danger-soft:#F6E5E2;
  --toast-bg:#1D2A26;
  --shadow-xs:0 1px 2px rgba(17,32,28,.06);
  --shadow-sm:0 3px 10px rgba(17,32,28,.08);
  --shadow-md:0 8px 22px rgba(17,32,28,.12);
  /* Barras de acerto x erro: o verde claro é a fatia acertada e o cinza
     claro é o que sobra (erros). Cinza em vez de vermelho de propósito —
     a barra é um retrato do quanto já foi dominado, não uma punição. */
  --barra-acerto:#5CB894; --barra-erro:#DCE2DE;
  --font-display:'Source Serif 4',Georgia,'Times New Roman',serif;
  --font-body:'IBM Plex Sans','Segoe UI',Roboto,Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius-sm:7px; --radius:12px; --radius-lg:18px;
  --shadow-pop:0 12px 32px rgba(17,32,28,.16);
  --maxw:1180px;
}
/* Modo escuro — mesma paleta de papéis (fundo/superfície/texto/tinta de
   marca), só com os valores invertidos para reduzir claridade à noite.
   Ativado trocando o atributo data-theme do <html> (ver alternarTema()). */
html[data-theme="dark"]{
  --bg:#121917; --surface:#1A2320; --surface-2:#212C28;
  --ink:#E8EDE9; --ink-2:#B7C4BE; --muted:#84948D;
  --border:#2C3733; --border-strong:#3D4A44;
  --accent:#33B092; --accent-dark:#5FCBB0; --accent-soft:#173029;
  --amber:#E0AC5E; --amber-soft:#3A2E1B;
  --danger:#E3776B; --danger-soft:#3A2320;
  --barra-acerto:#3FA888; --barra-erro:#2F3B36;
  --shadow-xs:0 1px 2px rgba(0,0,0,.28);
  --shadow-sm:0 3px 10px rgba(0,0,0,.32);
  --shadow-md:0 8px 22px rgba(0,0,0,.4);
  --shadow-pop:0 12px 32px rgba(0,0,0,.45);
}
/* Reduz/desliga animações e transições para quem pediu isso ao sistema —
   inclusive a troca de tema, que passa a ser instantânea como antes. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}
/* nos botões/badges cheios de cor, o texto continua branco nos dois temas;
   ajustamos só o hover do botão primário pra clarear em vez de escurecer,
   já que "mais escuro" já é o padrão no modo noturno */
html[data-theme="dark"] .btn-primary:hover{background:#2A9A80}
html[data-theme="dark"] .qcard-alt.selected,html[data-theme="dark"] .qcard-alt.correct{color:var(--ink)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
/* Troca de tema clara/escura deixa de ser um corte seco: fundo, texto e
   bordas fazem uma transição curta em vez de piscar. */
body,.sidebar,.topbar,.card,.card-flat,.qcard,.modal,.input,.select,.textarea,.stat-tile,.flashcard,.qcard-alt{transition:background-color .18s ease,border-color .18s ease,color .18s ease}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.22;margin:0;color:var(--ink)}
p{margin:0}
a{color:var(--accent-dark)}
button{font-family:inherit;color:inherit}
img{max-width:100%;display:block}
::selection{background:var(--accent-soft)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- ícones (ver sprite SVG no body) ---------- */
svg.icon,svg.nav-icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.icon-lg{width:26px;height:26px}

/* ---------- layout base ---------- */
.container{max-width:var(--maxw);margin:0 auto;padding:0 1.5rem}
.hidden{display:none !important}
.muted{color:var(--muted)}
.mt-1{margin-top:.5rem}.mt-2{margin-top:1rem}.mt-3{margin-top:1.5rem}.mt-4{margin-top:2rem}
.mb-1{margin-bottom:.5rem}.mb-2{margin-bottom:1rem}.mb-3{margin-bottom:1.5rem}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-1{gap:.5rem}.gap-2{gap:1rem}.gap-3{gap:1.5rem}
.grid{display:grid;gap:1rem}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.text-sm{font-size:.82rem}
.text-xs{font-size:.72rem}
.nowrap{white-space:nowrap}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.65rem 1.15rem;border-radius:var(--radius-sm);border:1px solid transparent;font-size:.88rem;font-weight:600;cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .05s ease;white-space:nowrap;background:none}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark)}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--ink)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent-dark)}
.btn-ghost{background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#8f2e24}
.btn-sm{padding:.4rem .7rem;font-size:.78rem}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;transition:border-color .12s ease,transform .08s ease,box-shadow .12s ease}
.icon-btn:hover{border-color:var(--accent);box-shadow:var(--shadow-xs)}
.icon-btn:active{transform:scale(.94)}
.link-btn{background:none;border:none;padding:0;color:var(--accent-dark);font-weight:600;font-size:.85rem;cursor:pointer;text-decoration:underline}

/* ---------- formulários ---------- */
.field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem}
.label{font-size:.8rem;font-weight:600;color:var(--ink-2)}
.hint{font-size:.75rem;color:var(--muted)}
.input,.select,.textarea{border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:.62rem .75rem;font-size:.9rem;font-family:inherit;background:var(--surface);color:var(--ink);width:100%}
.input:focus,.select:focus,.textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.textarea{min-height:120px;resize:vertical}
.textarea-mono{font-family:var(--font-mono);font-size:.82rem;line-height:1.6}
.checkbox-row{display:flex;align-items:center;gap:.5rem;font-size:.85rem}

/* ---------- cartões / superfícies ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.35rem}
.card + .card{margin-top:1rem}
/* Dentro de uma grade, o espaço entre os cartões já é o `gap` — a margem de
   cima aqui sobrava, e pior: ela só não caía no PRIMEIRO cartão (que não tem
   um .card antes dele). O resultado era o primeiro quadradinho da grade
   ficando mais alto que os outros, como se destacasse a prova mais recente
   de propósito. É o caso de Provas Antigas, onde o primeiro cartão é o do
   banco didático do ano corrente. */
.grid > .card + .card{margin-top:0}
/* Cartão de prova antiga: o nome da instituição ocupa uma ou duas linhas
   conforme o tamanho ("Esc — Banco Didático" quebra, "IAMSPE" não), então os
   botões são empurrados para a base para todos ficarem na mesma altura. */
.prova-card{display:flex;flex-direction:column}
.prova-card .prova-acoes{margin-top:auto;padding-top:.7rem}
.prova-card .prova-ano{font-family:var(--font-display);font-size:1.6rem;line-height:1.1}
.prova-card .prova-banca{font-weight:600;min-height:2.4em;display:flex;align-items:flex-start}
.card-title{font-size:1.02rem;margin-bottom:.2rem}
.card-flat{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.2rem}

/* ---------- badges / pills ---------- */
.badge{display:inline-flex;align-items:center;gap:.3rem;padding:.22rem .6rem;border-radius:100px;font-size:.7rem;font-weight:600;white-space:nowrap}
.badge-accent{background:var(--accent-soft);color:var(--accent-dark)}
.badge-amber{background:var(--amber-soft);color:var(--amber)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-muted{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .8rem;border-radius:100px;border:1px solid var(--border-strong);background:var(--surface);font-size:.8rem;font-weight:600;cursor:pointer;transition:border-color .12s ease,background .12s ease,transform .08s ease}
.pill:hover{border-color:var(--accent)}
.pill:active{transform:scale(.96)}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------- mapa de questões do simulado (durante a prova) ----------
   Durante o simulado o mapa responde a UMA pergunta: já respondi esta
   questão ou não. Ele nunca diz se a resposta está certa ou errada — numa
   prova cronometrada, saber o resultado no meio muda o comportamento (a
   pessoa volta para "consertar" o que já passou, ou desanima e apressa o
   resto) e a nota deixa de medir o que a prova de verdade mediria. Por isso
   as cores aqui são neutras: cheio = respondida, tracejado = em branco.
   O verde e o vermelho só existem no mapa do RESULTADO, depois de acabar. */
.mapa-questoes{display:flex;flex-wrap:wrap;gap:.35rem}
.pill-mapa{min-width:42px;justify-content:center;padding:.4rem .5rem;font-variant-numeric:tabular-nums}
.pill-mapa.em-branco{background:transparent;border-style:dashed;color:var(--muted)}
.pill-mapa.respondida{background:var(--surface-2);border-color:var(--border-strong);color:var(--ink)}
.pill-mapa.atual{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pill-mapa .ponto-resp{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
.mapa-legenda{display:flex;flex-wrap:wrap;gap:.9rem;align-items:center}
.mapa-legenda .amostra{display:inline-flex;align-items:center;gap:.35rem}
.mapa-legenda .quadro{width:15px;height:15px;border-radius:5px;border:1px solid var(--border-strong);background:var(--surface-2);display:inline-block}
.mapa-legenda .quadro.vazio{background:transparent;border-style:dashed}

/* ---------- tabelas ---------- */
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{text-align:left;color:var(--muted);font-weight:600;font-size:.72rem;padding:.5rem .7rem;border-bottom:1px solid var(--border-strong)}
td{padding:.65rem .7rem;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
.table-wrap table{border:none}

/* ---------- estrutura autenticada (shell) ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{width:252px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:1.3rem 1rem;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:40;transition:transform .2s ease}
.sidebar-brand{font-family:var(--font-display);font-weight:700;font-size:1.2rem;color:var(--ink);display:flex;align-items:center;gap:.55rem;margin-bottom:1.4rem;padding:0 .3rem}
.sidebar-brand .mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:1rem}
.bloco-chip{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius-sm);padding:.6rem .75rem;margin-bottom:1.1rem}
.bloco-chip-label{font-size:.66rem;color:var(--accent-dark);font-weight:700}
.bloco-chip-name{font-size:.83rem;font-weight:600;color:var(--ink);margin-top:.15rem;line-height:1.3}
.nav-section-label{font-size:.68rem;color:var(--muted);font-weight:700;margin:1rem .5rem .4rem;letter-spacing:.07em;text-transform:uppercase}
.nav-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.1rem}
.nav-item{display:flex;align-items:center;gap:.65rem;padding:.55rem .65rem;border-radius:var(--radius-sm);color:var(--ink-2);font-size:.87rem;font-weight:500;cursor:pointer;border:1px solid transparent}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--accent-soft);color:var(--accent-dark);font-weight:700}
.sidebar-footer{margin-top:auto;padding-top:1rem;border-top:1px solid var(--border)}
.main{margin-left:252px;flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:.9rem 2rem;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:20}
.topbar-title{font-size:1.05rem}
.page{padding:2rem;max-width:var(--maxw);width:100%}
.page.entrando{animation:page-in .22s ease}
/* A animação de entrada é um sinal sutil de que a TELA mudou, sem esperar o
   usuário reparar via scroll ou título. Por isso ela vive numa classe à
   parte, posta só na troca de tela (ver desenharTela): quando o que muda é
   o conteúdo da mesma tela — marcar uma alternativa, responder uma questão —
   ela não toca, senão a tela pareceria piscar a cada clique. */
@keyframes page-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.page-header{margin-bottom:1.6rem}
.page-header p{color:var(--muted);margin-top:.3rem}
.hamburger{display:none}
.backdrop{display:none;position:fixed;inset:0;background:rgba(17,32,28,.35);z-index:35}
@media (max-width:960px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .page{padding:1.25rem}
  .topbar{padding:.8rem 1.1rem}
  .hamburger{display:inline-flex}
  .backdrop.open{display:block}
}

/* ---------- estatísticas / progresso ---------- */
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.2rem}
.stat-value{font-family:var(--font-display);font-size:1.7rem;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat-label{font-size:.78rem;color:var(--muted);margin-top:.15rem}
.progress-track{height:8px;background:var(--surface-2);border-radius:100px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:100px}
.progress-fill.danger{background:var(--danger)}
.progress-fill.amber{background:var(--amber)}

/* ---------- mapa de progresso da sessão de questões ----------
   Um quadradinho por questão da fila: o número, e a cor dizendo o que
   aconteceu. Serve para navegar (clicar volta à questão) e para enxergar o
   conjunto inteiro sem sair da questão atual. */
.mapa-sessao{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.55rem}
.mapa-pill{min-width:32px;height:32px;padding:0 .35rem;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--muted);font-family:inherit;font-size:.78rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.15rem;cursor:pointer;transition:transform .08s ease,border-color .12s ease}
.mapa-pill:hover:not(:disabled){border-color:var(--accent)}
.mapa-pill:active:not(:disabled){transform:scale(.94)}
.mapa-pill:disabled{cursor:default;opacity:.85}
.mapa-pill.acertou{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dark)}
.mapa-pill.errou{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.mapa-pill.agora{border-color:var(--ink-2);color:var(--ink)}
/* marcada mas ainda sem confiança declarada: a questão tem um rascunho
   esperando, e o âmbar é o mesmo aviso usado no resto da plataforma */
.mapa-pill.marcada{border-color:var(--amber);color:var(--ink)}
.mapa-pill.atual{outline:2px solid var(--accent);outline-offset:1px}
/* o pontinho âmbar marca os dois casos que a plataforma trata como "não
   sabida": acerto no chute e erro com certeza */
.mapa-pill .marca{width:5px;height:5px;border-radius:50%;background:var(--amber);flex:none}
/* legenda do mapa da SESSÃO (prática), com nome próprio para não colidir
   com a .mapa-legenda do simulado, que é outra coisa: lá a legenda diz
   respondida/em branco, aqui diz acertou/errou. */
.mapa-sessao-legenda{display:flex;gap:.9rem;flex-wrap:wrap;margin-top:.55rem;align-items:center}
.mapa-sessao-legenda .amostra{width:11px;height:11px;border-radius:3px;border:1px solid var(--border-strong);display:inline-block;margin-right:.3rem;vertical-align:-1px}
.mapa-sessao-legenda .amostra.acertou{background:var(--accent-soft);border-color:var(--accent)}
.mapa-sessao-legenda .amostra.errou{background:var(--danger-soft);border-color:var(--danger)}
.mapa-sessao-legenda .amostra.marcada{width:7px;height:7px;border-radius:50%;background:var(--amber);border-color:var(--amber)}
@media (max-width:640px){
  .mapa-pill{min-width:29px;height:29px;font-size:.73rem}
  .mapa-sessao-legenda{gap:.65rem}
  .mapa-sessao-legenda .so-largo{display:none}
}
@media (min-width:641px){
  .mapa-sessao-legenda .so-estreito{display:none}
}

/* ---------- questão ---------- */
.qcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.75rem;max-width:740px}
.qcard-meta{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.1rem}
.qcard-img-wrap{margin:0 0 1.1rem}
.qcard-img{max-width:100%;max-height:420px;object-fit:contain;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:zoom-in;background:var(--surface-2)}
.qcard-img-legenda{font-size:.75rem;color:var(--muted);margin-top:.35rem}
.qcard-enunciado{font-family:var(--font-display);font-size:1.14rem;line-height:1.6;color:var(--ink);margin-bottom:1.5rem;white-space:pre-line}
.qcard-alts{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1.1rem}
.qcard-alt{display:flex;align-items:flex-start;gap:.75rem;padding:.8rem 1rem;border:1px solid var(--border-strong);border-radius:var(--radius-sm);cursor:pointer;transition:border-color .12s ease,background .12s ease,transform .12s ease,box-shadow .12s ease;background:var(--surface)}
.qcard-alt:hover{border-color:var(--accent);transform:translateX(2px);box-shadow:var(--shadow-xs)}
.qcard-alt.selected{border-color:var(--accent);background:var(--accent-soft)}
.qcard-alt.correct{border-color:var(--accent);background:var(--accent-soft)}
.qcard-alt.incorrect{border-color:var(--danger);background:var(--danger-soft)}
.qcard-alt.disabled{cursor:default}
/* depois de responder, as alternativas não respondem mais a clique — o hover
   não pode continuar sugerindo que dá pra clicar nelas */
.qcard-alt.disabled:hover{transform:none;box-shadow:none;border-color:var(--border-strong)}
.qcard-alt.disabled.selected:hover,.qcard-alt.disabled.correct:hover{border-color:var(--accent)}
.qcard-alt.disabled.incorrect:hover{border-color:var(--danger)}
.alt-letter{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:.76rem;font-weight:700;flex-shrink:0;color:var(--ink-2);background:var(--surface)}
.qcard-alt.selected .alt-letter,.qcard-alt.correct .alt-letter{border-color:var(--accent);color:var(--accent-dark)}
.qcard-alt.incorrect .alt-letter{border-color:var(--danger);color:var(--danger)}
.alt-text{font-size:.92rem;line-height:1.5;padding-top:.15rem;flex:1}
/* ---------- alternativas eliminadas ("riscar" como se faz na prova) ----------
   Quem risca uma alternativa está dizendo "esta eu já descartei". Ela fica
   apagada e com o texto cortado, mas continua no lugar: o objetivo é reduzir o
   campo de escolha sem esconder informação, igual ao rascunho no papel. */
.alt-cortar{opacity:0;width:26px;height:26px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:opacity .12s ease,border-color .12s ease,color .12s ease}
.alt-cortar svg{width:13px;height:13px}
.qcard-alt:hover .alt-cortar,.qcard-alt.eliminada .alt-cortar{opacity:1}
.alt-cortar:focus-visible{opacity:1}
/* em tela de toque não existe "passar o mouse": o × fica sempre visível,
   só que discreto, senão no celular ninguém descobre que dá para riscar */
@media (hover:none){.alt-cortar{opacity:.55}}
.alt-cortar:hover{border-color:var(--danger);color:var(--danger)}
.qcard-alt.eliminada{opacity:.5;background:var(--surface-2);border-style:dashed}
.qcard-alt.eliminada:hover{transform:none;box-shadow:none}
.qcard-alt.eliminada .alt-text{text-decoration:line-through;text-decoration-color:var(--muted)}
.qcard-alt.eliminada .alt-letter{border-style:dashed}
.confidence-row{display:flex;gap:.6rem;margin-top:1.1rem}
.confidence-btn{flex:1;padding:.7rem .5rem;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface);font-weight:600;font-size:.83rem;cursor:pointer}
.confidence-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.feedback-box{border-radius:var(--radius-sm);padding:1rem 1.1rem;margin-top:1.1rem;font-size:.88rem;line-height:1.55}
.feedback-box.ok{background:var(--accent-soft);border:1px solid var(--accent)}
.feedback-box.no{background:var(--danger-soft);border:1px solid var(--danger)}
.qcard-actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.2rem;padding-top:1.1rem;border-top:1px solid var(--border)}
.why-tag{display:flex;align-items:center;gap:.4rem;font-size:.76rem;color:var(--accent-dark);background:var(--accent-soft);padding:.35rem .65rem;border-radius:var(--radius-sm);margin-bottom:1rem}
/* A anotação que o aluno escreveu para si mesmo numa questão salva. Fica com
   a cara de papel de rascunho (a faixa âmbar na lateral) para não se
   confundir com a explicação da questão, que é material da plataforma. */
.nota-pessoal{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:var(--radius-sm);padding:.7rem .9rem}
.nota-pessoal-titulo{display:flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem}
.nota-pessoal .text-sm{white-space:pre-wrap}

/* ---------- legenda e seletor de período dos gráficos de desempenho ---------- */
.legenda-barras{display:flex;flex-wrap:wrap;gap:1rem;font-size:.75rem;color:var(--muted);margin-top:.5rem;align-items:center}
.legenda-barras span{display:flex;align-items:center;gap:.35rem}
.legenda-barras i{width:11px;height:11px;border-radius:3px;display:inline-block}
.seletor-periodo{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.2rem}
.seletor-periodo .pill{cursor:pointer}

/* ---------- árvore de taxonomia ---------- */
.tree-area{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:.7rem;overflow:hidden;background:var(--surface)}
.tree-area-head{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.1rem;cursor:pointer;font-weight:600}
.tree-area-head:hover{background:var(--surface-2)}
.tree-body{padding:0 1.1rem 1rem;display:none}
.tree-body.open{display:block}
.tree-esp{margin-top:.6rem}
.tree-esp-name{font-size:.82rem;font-weight:700;color:var(--ink-2);margin-bottom:.35rem}
.tree-assunto-row{display:flex;align-items:center;justify-content:space-between;padding:.45rem .6rem;border-radius:var(--radius-sm);font-size:.85rem}
.tree-assunto-row:hover{background:var(--surface-2);cursor:pointer}

/* ---------- modal / toast ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(17,32,28,.45);display:flex;align-items:center;justify-content:center;z-index:80;padding:1.5rem}
.modal{background:var(--surface);border-radius:var(--radius);max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:1.6rem;box-shadow:var(--shadow-pop)}
.modal-lg{max-width:820px}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem}
.toast-container{position:fixed;bottom:1.5rem;right:1.5rem;z-index:100;display:flex;flex-direction:column;gap:.6rem}
.toast{background:var(--toast-bg);color:#fff;padding:.8rem 1.1rem;border-radius:var(--radius-sm);font-size:.85rem;box-shadow:var(--shadow-pop);max-width:320px;animation:toast-in .18s ease}
.toast.err{background:var(--danger)}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Nome de arquivo ou de pasta escrito no meio de um texto. */
code{font-family:var(--font-mono);font-size:.86em;background:var(--surface-2);padding:.1rem .35rem;border-radius:4px}

/* Tarja de "faltou a pasta dados/" — aparece só quando nenhum arquivo de
   conteúdo foi carregado (ver avisarSeFaltarConteudo, no código). */
.aviso-dados{background:var(--amber-soft);color:var(--amber);border-bottom:1px solid var(--amber);padding:.85rem 1.2rem;font-size:.85rem;line-height:1.55}
.aviso-dados code{background:var(--surface);padding:.1rem .35rem;border-radius:4px;font-family:var(--font-mono);font-size:.8rem}

/* ---------- paginação de listas ---------- */
.paginacao{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-top:.9rem;padding-top:.8rem;border-top:1px solid var(--border)}
.paginacao-resumo{font-size:.78rem;color:var(--muted)}

/* ---------- abas ---------- */
.tabs{display:flex;gap:.3rem;border-bottom:1px solid var(--border);margin-bottom:1.4rem;overflow-x:auto}
.tab{padding:.7rem 1rem;font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent-dark);border-color:var(--accent)}

/* ---------- vazio / empty state ---------- */
.empty-state{text-align:center;padding:3rem 1.5rem;color:var(--muted)}
.empty-state svg{margin:0 auto 1rem}

/* ---------- páginas públicas (landing / login) ---------- */
.public-nav{display:flex;align-items:center;justify-content:space-between;padding:1.3rem 0}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.3rem;display:flex;align-items:center;gap:.55rem}
.brand .mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:3rem;align-items:center;padding:3.5rem 0 4.5rem}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding:2rem 0}}
.hero h1{font-size:clamp(2rem,1.55rem + 2vw,2.75rem);letter-spacing:-.01em}
.hero-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.6rem;box-shadow:var(--shadow-pop);animation:hero-in .5s ease}
@keyframes hero-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.auth-wrap{max-width:420px;margin:3rem auto;padding:0 1.5rem}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem}
.feature-row{display:flex;gap:1rem;padding:1.1rem 0;border-bottom:1px solid var(--border)}
.feature-row:last-child{border-bottom:none}
.feature-icon{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0}
footer.site-footer{padding:2.5rem 0;color:var(--muted);font-size:.82rem;border-top:1px solid var(--border);margin-top:2rem}

/* ---------- enunciado clicável ----------
   Qualquer trecho de questão mostrado numa lista abre a questão inteira ao
   ser tocado. O tracejado embaixo é a dica visual de que dá pra clicar. */
.enunciado-clicavel{cursor:pointer;border-bottom:1px dashed var(--border-strong);display:inline-block;transition:color .12s ease,border-color .12s ease}
.enunciado-clicavel:hover{color:var(--accent-dark);border-color:var(--accent)}
.qcard-enunciado.enunciado-clicavel{display:block;border-bottom:none}
.qcard-enunciado.enunciado-clicavel:hover{color:var(--accent-dark)}

/* ---------- gesto de arrastar para o lado (celular) ----------
   O cartão da questão acompanha o dedo enquanto o usuário arrasta e volta
   sozinho ao lugar se o movimento não for suficiente para trocar de questão. */
.area-gesto{touch-action:pan-y}
.area-gesto.arrastando{transition:none}
.area-gesto.soltando{transition:transform .18s ease}
.dica-arrastar{display:none;align-items:center;justify-content:center;gap:.45rem;font-size:.74rem;color:var(--muted);margin-top:.6rem}
@media (max-width:960px){.dica-arrastar{display:flex}}

/* ---------- flashcards ---------- */
.flash-palco{max-width:640px;margin:0 auto;perspective:1400px}
.flashcard{position:relative;min-height:290px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-lg);padding:2rem 1.8rem;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow-md);cursor:pointer;transition:box-shadow .15s ease,transform .1s ease}
.flashcard:hover{box-shadow:var(--shadow-pop)}
.flashcard:active{transform:scale(.985)}
.flashcard.virado{border-color:var(--accent);animation:flash-flip .3s ease}
/* Truque leve de "virar": espreme o cartão na horizontal e solta — como o
   conteúdo (verso) já vem pronto no HTML, o efeito visual de flip acontece
   sem precisar manter o nó do DOM entre um render e outro. */
@keyframes flash-flip{0%{transform:scaleX(1)}50%{transform:scaleX(.08)}100%{transform:scaleX(1)}}
.flash-etiqueta{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:.9rem}
.flash-frente{font-family:var(--font-display);font-size:1.22rem;line-height:1.55;color:var(--ink);white-space:pre-line}
.flash-verso{font-size:.95rem;line-height:1.6;color:var(--ink);white-space:pre-line}
.flash-verso strong{color:var(--accent-dark)}
/* O convite para virar: como não há mais botão de "mostrar resposta", é este
   texto, dentro do próprio cartão, que diz o que fazer. */
.flash-toque{display:flex;align-items:center;justify-content:center;gap:.35rem;text-align:center;font-size:.76rem;color:var(--muted);margin-top:1.4rem}
.flash-toque svg{width:14px;height:14px;opacity:.7}
/* A estrela de favoritar fica no alto do cartão, fora do caminho do texto,
   e não vira o cartão junto (o clique dela para em si mesmo). */
.flash-favorito{position:absolute;top:.8rem;right:.9rem}
.flash-notas{display:flex;gap:.55rem;margin-top:1.1rem;max-width:640px;margin-left:auto;margin-right:auto}
.flash-nota{flex:1;padding:.85rem .4rem;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:var(--surface);font-weight:700;font-size:.82rem;cursor:pointer;line-height:1.3;transition:border-color .12s ease,background .12s ease,transform .08s ease}
.flash-nota:active{transform:scale(.96)}
.flash-nota small{display:block;font-weight:500;font-size:.68rem;color:var(--muted);margin-top:.2rem}
.flash-nota.ruim:hover{border-color:var(--danger);background:var(--danger-soft)}
.flash-nota.medio:hover{border-color:var(--amber);background:var(--amber-soft)}
.flash-nota.bom:hover{border-color:var(--accent);background:var(--accent-soft)}

/* ---------- impressão / PDF ----------
   Para gerar PDF sem depender de nenhuma biblioteca externa, a plataforma
   monta o material dentro de #areaImpressao e chama a impressão do próprio
   navegador — onde "Salvar como PDF" já existe em todos os sistemas. */
#areaImpressao{display:none}
@media print{
  body>#app,body>#toastContainer,.modal-overlay{display:none !important}
  #areaImpressao{display:block !important;padding:0;color:#000;background:#fff;font-family:Georgia,'Times New Roman',serif}
  @page{margin:18mm 16mm}
  .pdf-cabecalho{border-bottom:2px solid #000;padding-bottom:.5rem;margin-bottom:1.2rem}
  .pdf-cabecalho h1{font-size:17pt;margin:0}
  .pdf-cabecalho .pdf-sub{font-size:9.5pt;color:#333;margin-top:.2rem}
  .pdf-questao{margin-bottom:1.1rem;page-break-inside:avoid;font-size:10.5pt;line-height:1.45}
  .pdf-questao .pdf-num{font-weight:700}
  .pdf-questao .pdf-alt{margin-left:1.1rem}
  .pdf-questao .pdf-meta{font-size:8.5pt;color:#444;margin-top:.15rem}
  .pdf-gabarito{page-break-before:always}
  .pdf-tabela{width:100%;border-collapse:collapse;font-size:9.5pt}
  .pdf-tabela th,.pdf-tabela td{border:1px solid #999;padding:.28rem .4rem;text-align:left}
  .pdf-flash{border:1px solid #666;padding:.55rem .7rem;margin-bottom:.5rem;page-break-inside:avoid;font-size:10pt}
  .pdf-corte{border-top:1px dashed #999;margin:.8rem 0}
}
</style>
</head>

<script>
/* A ponte entre os arquivos de conteúdo e o código: cada arquivo da pasta
   "dados/" chama uma destas duas funções e entrega a sua lista. Guardamos
   também o nome de quem respondeu, para a plataforma conseguir dizer o que
   carregou (Configurações > Arquivos de conteúdo) e avisar quando algo
   ficou pelo caminho. */
window.EscDados = {
  taxonomia: null,      // vira SEED_TAXONOMIA   (área > especialidade > assunto)
  blocos: [],           // vira SEED_BLOCOS      (calendário de referência)
  sequenciasAno: null,  // vira SEED_SEQUENCIAS_ANO
  questoes: [],         // vira SEED_QUESTOES
  flashcards: [],       // vira SEED_FLASHCARDS
  simulados: [],        // vira SEED_SIMULADOS
  usuarios: [],         // vira SEED_USUARIOS    (contas de demonstração)
  livroOuro: [],        // vira SEED_LIVRO_OURO
  comentarios: [],      // vira SEED_COMENTARIOS
  arquivos: [],         // um registro por arquivo que entregou conteúdo

  _anotar: function(nomeArquivo, tipo, itens){
    this.arquivos.push({ nome: nomeArquivo, tipo: tipo, itens: itens });
  },
  /* As listas se SOMAM em vez de substituir: é o que permite acrescentar uma
     prova (ou um segundo baralho, ou mais assuntos) criando um arquivo novo,
     sem tocar no que já existe. */
  _juntar: function(destino, lista){
    if(!Array.isArray(lista)) return 0;
    lista.forEach(x => destino.push(x));
    return lista.length;
  },

  registrarQuestoes: function(nomeArquivo, lista){
    if(!Array.isArray(lista)) return;
    this._anotar(nomeArquivo, "questões", this._juntar(this.questoes, lista));
  },
  registrarFlashcards: function(nomeArquivo, lista){
    if(!Array.isArray(lista)) return;
    this._anotar(nomeArquivo, "flashcards", this._juntar(this.flashcards, lista));
  },
  registrarSimulados: function(nomeArquivo, lista){
    if(!Array.isArray(lista)) return;
    this._anotar(nomeArquivo, "simulados", this._juntar(this.simulados, lista));
  },
  registrarTaxonomia: function(nomeArquivo, arvore){
    if(!arvore) return;
    if(!this.taxonomia) this.taxonomia = { areas:[], especialidades:[], assuntos:[] };
    const n = this._juntar(this.taxonomia.areas, arvore.areas)
            + this._juntar(this.taxonomia.especialidades, arvore.especialidades)
            + this._juntar(this.taxonomia.assuntos, arvore.assuntos);
    this._anotar(nomeArquivo, "taxonomia", n);
  },
  registrarCalendario: function(nomeArquivo, c){
    if(!c) return;
    let n = this._juntar(this.blocos, c.blocos);
    if(c.sequenciasAno){
      if(!this.sequenciasAno) this.sequenciasAno = {};
      Object.keys(c.sequenciasAno).forEach(ano => { this.sequenciasAno[ano] = c.sequenciasAno[ano]; n++; });
    }
    this._anotar(nomeArquivo, "calendário", n);
  },
  registrarDemonstracao: function(nomeArquivo, d){
    if(!d) return;
    const n = this._juntar(this.usuarios, d.usuarios)
            + this._juntar(this.livroOuro, d.livroOuro)
            + this._juntar(this.comentarios, d.comentarios);
    this._anotar(nomeArquivo, "demonstração", n);
  },
};
</script>

/* A tarja diz QUAL arquivo faltou, não só que algo faltou: com sete arquivos
   na pasta, "não carregou" sozinho não diz onde procurar. A taxonomia vem
   primeiro na lista de propósito — sem ela nada se classifica, e é a falta
   que mais estraga a tela. */
function avisarSeFaltarConteudo(){
  const r = resumoArquivosDeConteudo();
  const faltando = [];
  if(!r.taxonomia)  faltando.push("a taxonomia (<code>dados/taxonomia.js</code>)");
  if(!r.blocos)     faltando.push("o calendário de blocos (<code>dados/calendario.js</code>)");
  if(!r.questoes)   faltando.push("as questões (<code>dados/banco-didatico.js</code> e as provas)");
  if(!r.flashcards) faltando.push("os flashcards (<code>dados/flashcards-equipe.js</code>)");
  if(!r.usuarios)   faltando.push("as contas de demonstração (<code>dados/demonstracao.js</code>)");
  if(!faltando.length) return;                      // veio tudo: nada a avisar
  const tudo = r.arquivos.length === 0;
  const tarja = document.createElement("div");
  tarja.className = "aviso-dados";
  tarja.innerHTML = tudo
    ? `<strong>A pasta <code>dados/</code> não foi carregada.</strong>
       Todo o conteúdo da plataforma — taxonomia, calendário, questões, flashcards e
       simulados — mora nela, que precisa estar ao lado do arquivo index.html e ser
       publicada junto com ele, quando o site está no ar. A plataforma continua
       funcionando com o que já estiver salvo neste navegador, mas nada de novo entra
       enquanto a pasta não voltar.`
    : `<strong>Falta parte do conteúdo:</strong> não ${faltando.length===1?"carregou":"carregaram"}
       ${faltando.join(", ")}. Confira se ${faltando.length===1?"o arquivo está":"os arquivos estão"}
       na pasta <code>dados/</code> e se não há erro de digitação dentro ${faltando.length===1?"dele":"deles"}
       — um arquivo com erro de JavaScript deixa de carregar inteiro.
       Configurações &gt; Arquivos de conteúdo mostra o que entrou.`;
  document.body.insertBefore(tarja, document.body.firstChild);
}

    favoritosCartoes: [], // {usuarioId, cartaoId, data} — os flashcards salvos, do mesmo jeito
    revisoes: {},          // revisoes[usuarioId][questaoId] = {repeticoes,fator,intervalo,proximaRevisao,ultimaConfianca}
    simulados: copiaProfunda(SEED_SIMULADOS), // provas antigas / simulados criados por professores
    resultadosSimulados: [],
    sessoes: [],            // histórico de conjuntos de questões concluídos (feedback questão a questão)
    sessoesEmAndamento: {}, // sessoesEmAndamento[usuarioId] = fila de questões não terminada, para retomar depois
    feedbacks: [],          // comentários, sugestões e reclamações gerais sobre a plataforma
    cargasProvas: [],       // provas sendo transcritas em lotes (ver Central de Provas)
    configGeral: {
      metaMinimaQuestoesDia: CONFIG.metaMinimaQuestoesDia,
      metaRecomendadaQuestoesDia: CONFIG.metaRecomendadaQuestoesDia,
      metaCartoesDia: CONFIG.metaCartoesDia,
      misturaBlocos: {...CONFIG.misturaBlocos},
      rampaRevisaoInicio: [...CONFIG.rampaRevisaoInicio],
    },
    // nuvem (seção 2-C): a fila do que ainda não subiu e até onde já baixamos
    filaNuvem: [],
    nuvem: { contaId:null, ultimaSyncEm:null, marcas:{}, recusados:[], calendarioPendente:[] },
    versao: 2,
  };
}

/* ---------------------------- rede de segurança do banco -----------------
   CADASTRO NÃO SE PERDE. Tudo o que a turma faz — cadastros, respostas,
   favoritos, questões enviadas — vive neste banco, e o resto (questões,
   cartões, calendário) o código sabe recriar sozinho a partir da pasta
   "dados/". Essas duas coisas têm valor MUITO diferente: recriar o conteúdo
   custa um F5, recriar os cadastros da turma é impossível.

   Por isso nada aqui volta ao "ponto de partida" por causa de um defeito.
   Diante de um banco salvo estranho, a regra é sempre consertar o que está
   quebrado e ficar com o resto — nunca trocar o banco inteiro por um novo.

   `garantirEstruturaDb()` é esse conserto: percorre as coleções que o código
   espera e devolve ao tipo certo (lista, objeto, texto) só as que estiverem
   erradas. Uma coleção de conteúdo estragada volta vazia e é repovoada por
   sincronizarConteudoNovo(); uma de gente é preservada item a item, jogando
   fora só o que não é um registro com id. */
function garantirEstruturaDb(alvo){
  const reparos = [];
  const lista = (chave, padrao) => {
    if(Array.isArray(alvo[chave])) return;
    reparos.push(chave);
    alvo[chave] = padrao === undefined ? [] : copiaProfunda(padrao);
  };
  const objeto = (chave) => {
    if(alvo[chave] && typeof alvo[chave] === "object" && !Array.isArray(alvo[chave])) return;
    reparos.push(chave);
    alvo[chave] = {};
  };
  // o que a turma produziu: preservado sempre que for uma lista
  lista("usuarios"); lista("respostas"); lista("favoritos"); lista("favoritosCartoes"); lista("sessoes");
  lista("resultadosSimulados"); lista("feedbacks"); lista("comentarios");
  lista("cargasProvas"); lista("filaNuvem"); lista("grupos");
  // conteúdo: se vier estragado, volta vazio e é repovoado pela pasta "dados/"
  lista("questoes"); lista("flashcards"); lista("simulados"); lista("livroOuro");
  objeto("revisoes"); objeto("revisoesFlashcards"); objeto("diasCartoes"); objeto("cartoesPorDia");
  objeto("sessoesEmAndamento"); objeto("sequenciasAno"); objeto("configGeral");
  if(!alvo.taxonomia || typeof alvo.taxonomia !== "object"){ reparos.push("taxonomia"); alvo.taxonomia = {areas:[],especialidades:[],assuntos:[]}; }
  ["areas","especialidades","assuntos"].forEach(k=>{
    if(!Array.isArray(alvo.taxonomia[k])){ reparos.push("taxonomia."+k); alvo.taxonomia[k] = []; }
  });
  // um "usuário" sem id não é cadastro de ninguém e quebraria todas as telas
  const antes = alvo.usuarios.length;
  alvo.usuarios = alvo.usuarios.filter(u => u && typeof u === "object" && u.id);
  if(alvo.usuarios.length !== antes) reparos.push("usuarios (" + (antes - alvo.usuarios.length) + " sem id)");
  // uma entrada nula no meio das turmas derrubava as migrações, que
  // desreferenciam cada grupo
  const gruposAntes = alvo.grupos.length;
  alvo.grupos = alvo.grupos.filter(g => g && typeof g === "object" && g.id);
  if(alvo.grupos.length !== gruposAntes) reparos.push("grupos (" + (gruposAntes - alvo.grupos.length) + " inválido(s))");
  // o grupo oficial é o calendário de quem não escolheu turma: sem ele, toda
  // tela de aluno fica sem bloco atual
  if(!alvo.grupoOficialId) alvo.grupoOficialId = "grupo-oficial";
  if(!alvo.grupos.some(g => g && g.id === alvo.grupoOficialId)){
    reparos.push("grupo oficial");
    alvo.grupos.push({ id: alvo.grupoOficialId, nome:"Calendário Oficial da Coordenação", criadoPor:"u-admin", oficial:true, publico:true, criadoEm: hojeISO(), anoFaculdade:null, deslocamento:0, blocoAtualIdManual:null });
  }
  if(!alvo.nuvem || typeof alvo.nuvem !== "object") alvo.nuvem = { contaId:null, ultimaSyncEm:null, marcas:{}, recusados:[], calendarioPendente:[] };
  if(!alvo.nuvem.marcas || typeof alvo.nuvem.marcas !== "object") alvo.nuvem.marcas = {};
  if(!Array.isArray(alvo.nuvem.recusados)) alvo.nuvem.recusados = [];
  if(!Array.isArray(alvo.nuvem.calendarioPendente)) alvo.nuvem.calendarioPendente = [];
  /* Os parâmetros do algoritmo têm valor padrão no CONFIG, então um campo
     torto aqui não precisa quebrar tela nenhuma — e quebrava: um
     `misturaBlocos` nulo derrubava Configurações Gerais inteira, e daí a
     coordenação não conseguia nem chegar ao botão de backup. */
  const cg = alvo.configGeral;
  const numero = (chave, padrao) => { if(typeof cg[chave] !== "number" || !isFinite(cg[chave])){ reparos.push("configGeral."+chave); cg[chave] = padrao; } };
  numero("metaMinimaQuestoesDia", CONFIG.metaMinimaQuestoesDia);
  numero("metaRecomendadaQuestoesDia", CONFIG.metaRecomendadaQuestoesDia);
  numero("metaCartoesDia", CONFIG.metaCartoesDia);
  if(!cg.misturaBlocos || typeof cg.misturaBlocos !== "object"){ reparos.push("configGeral.misturaBlocos"); cg.misturaBlocos = {...CONFIG.misturaBlocos}; }
  ["atual","revisaoPassados","previaFuturos"].forEach(k=>{
    if(typeof cg.misturaBlocos[k] !== "number") cg.misturaBlocos[k] = CONFIG.misturaBlocos[k];
  });
  if(!cg.pesosDificuldade || typeof cg.pesosDificuldade !== "object"){ reparos.push("configGeral.pesosDificuldade"); cg.pesosDificuldade = {...CONFIG.pesosDificuldade}; }
  ["taxaAcerto","especificidade","prevalencia"].forEach(k=>{
    if(typeof cg.pesosDificuldade[k] !== "number") cg.pesosDificuldade[k] = CONFIG.pesosDificuldade[k];
  });
  if(!Array.isArray(cg.rampaRevisaoInicio) || cg.rampaRevisaoInicio.length < 3){ reparos.push("configGeral.rampaRevisaoInicio"); cg.rampaRevisaoInicio = [...CONFIG.rampaRevisaoInicio]; }
  return reparos;
}

/* Guarda o banco salvo como estava, sob outra chave, antes de qualquer
   caminho que possa substituí-lo. É a última rede: mesmo que tudo o mais
   falhe, o texto original continua no navegador e dá para recuperar. */
function guardarCopiaDeResgate(bruto){
  if(!bruto) return;
  try{ localStorage.setItem(CHAVE_RESGATE, bruto); }
  catch(e){ /* sem espaço para a cópia: o banco em si continua intacto */ }
}

function loadState(){
  let bruto = null;
  try{
    bruto = localStorage.getItem(CHAVE_STORAGE);
    if(!bruto){ db = dbPadrao(); saveState(); return; }
    const parsed = JSON.parse(bruto);
    /* Antes, um banco sem `usuarios` ou sem `questoes` era trocado pelo banco
       de demonstração. Mas "sem questões" é um banco que perdeu CONTEÚDO — o
       código repõe isso da pasta "dados/" — e trocá-lo levava junto os
       cadastros, que ninguém repõe. Agora só o que não dá para ler como
       objeto recomeça do zero, e mesmo assim com cópia de resgate. */
    if(!parsed || typeof parsed !== "object" || Array.isArray(parsed)){
      guardarCopiaDeResgate(bruto);
      db = dbPadrao(); saveState(); return;
    }
    db = parsed;
    garantirEstruturaDb(db);
    // migração leve: versões antigas (v1) tinham um único calendário global em
    // db.blocos. Se encontrarmos isso sem a coleção de grupos, embrulhamos
    // automaticamente num "grupo oficial" pra não perder o que já existia.
    if(!db.grupos && db.blocos){
      const grupoOficialId = "grupo-oficial";
      db.grupos = [{ id:grupoOficialId, nome:"Calendário Oficial da Coordenação", criadoPor:"u-admin", oficial:true, publico:true, criadoEm:hojeISO(), blocos: db.blocos, blocoAtualIdManual: db.blocoAtualIdManual||null }];
      db.grupoOficialId = grupoOficialId;
      delete db.blocos; delete db.blocoAtualIdManual;
      db.versao = 2;
      saveState();
    }
    // preenche campos novos que dados salvos mais antigos podem não ter,
    // sem precisar reiniciar tudo
    if(!db.feedbacks) db.feedbacks = [];
    if(!db.sessoes) db.sessoes = [];
    // Central de Provas entrou depois: quem já usava começa sem prova nenhuma
    // em andamento (as questões que já importou continuam no banco, intactas)
    if(!db.cargasProvas) db.cargasProvas = [];
    // sessão retomável entrou depois: quem já usava começa sem nenhuma guardada
    if(!db.sessoesEmAndamento) db.sessoesEmAndamento = {};
    /* Blocos deixaram de pertencer ao grupo e passaram a pertencer ao ANO da
       faculdade, com cada turma entrando na sequência por um bloco diferente.
       A migração não joga calendário nenhum fora: o calendário que cada grupo
       tinha vira a sequência do ano dele, se aquele ano ainda não tiver uma.
       Grupos que só copiavam o oficial (o caso normal) simplesmente passam a
       apontar para a sequência do ano, com deslocamento zero. */
    if(!db.sequenciasAno){
      db.sequenciasAno = copiaProfunda(SEED_SEQUENCIAS_ANO);
      const oficial = (db.grupos||[]).find(g=>g.oficial);
      // o calendário oficial salvo (se estiver customizado) continua valendo
      // como a sequência do ano padrão, para ninguém perder o que montou
      if(oficial && oficial.blocos && oficial.blocos.length){
        db.sequenciasAno[CONFIG.anoFaculdadePadrao] = copiaProfunda(oficial.blocos);
      }
      (db.grupos||[]).forEach(g=>{
        if(g.oficial){ g.anoFaculdade = g.anoFaculdade || null; }
        else if(!g.anoFaculdade){
          // a turma passa a ser do ano de quem a criou (ou do padrão)
          const dono = (db.usuarios||[]).find(u=>u.id===g.criadoPor);
          g.anoFaculdade = (dono && dono.anoFaculdade) || CONFIG.anoFaculdadePadrao;
          // calendário próprio e diferente do oficial vira a sequência daquele
          // ano, se ninguém ocupou o lugar ainda
          if(g.blocos && g.blocos.length && !SEED_SEQUENCIAS_ANO[g.anoFaculdade]){
            db.sequenciasAno[g.anoFaculdade] = copiaProfunda(g.blocos);
          }
        }
        if(g.deslocamento===undefined) g.deslocamento = 0;
        // a lista de blocos agora é derivada do ano, não guardada no grupo.
        // O calendário que o grupo tinha fica arquivado em vez de ser apagado:
        // se alguém tiver montado um calendário próprio, ele continua no banco
        // (e no backup) para a coordenação consultar antes de descartar.
        if(g.blocos && g.blocos.length) g.blocosArquivados = g.blocos;
        delete g.blocos;
      });
      saveState();
    }
    (db.grupos||[]).forEach(g=>{ if(g.deslocamento===undefined) g.deslocamento = 0; });
    /* Anos sem calendário próprio (hoje "Formado(a)"): a sequência que
       existia para eles sai de circulação, mas não é jogada fora — fica em
       db.sequenciasArquivadas, onde continua no banco e no backup, caso a
       coordenação queira consultar antes de descartar. Quem estava marcado
       como formado não perde nada: passa a acompanhar o calendário do ano da
       turma em que estiver (ver anoDeReferencia). */
    (CONFIG.anosSemCalendario||[]).forEach(ano=>{
      if(db.sequenciasAno && db.sequenciasAno[ano]){
        if(!db.sequenciasArquivadas) db.sequenciasArquivadas = {};
        db.sequenciasArquivadas[ano] = db.sequenciasAno[ano];
        delete db.sequenciasAno[ano];
      }
    });
    /* O 3º ano nasceu com uma sequência de exemplo (ids b3-1 … b3-4), antes
       de o calendário real da faculdade existir. Quem já tinha essa sequência
       de exemplo salva no navegador recebe a de verdade no lugar; quem já
       tinha editado o 3º ano (qualquer id diferente) fica com o que montou —
       sobrescrever o trabalho da coordenação seria pior do que uma sequência
       desatualizada, que ela conserta na própria tela. */
    if(db.sequenciasAno && Array.isArray(db.sequenciasAno["3º ano"]) && SEED_SEQUENCIAS_ANO["3º ano"]){
      const atual3 = db.sequenciasAno["3º ano"];
      const ehExemplo = atual3.length === 4 && atual3.every(b => /^b3-[1-4]$/.test(b.id||""));
      if(ehExemplo) db.sequenciasAno["3º ano"] = copiaProfunda(SEED_SEQUENCIAS_ANO["3º ano"]);
    }
    /* Mesma história no 5º ano: ele nasceu com quatro blocos de exemplo
       (b5-1 … b5-4), e agora existe o quadro real da faculdade — doze
       estágios, doze turmas e um rodízio que não é um ciclo. Quem tinha o
       exemplo recebe o de verdade; quem editou o 5º ano fica com o que
       montou. */
    if(db.sequenciasAno && Array.isArray(db.sequenciasAno["5º ano"]) && SEED_SEQUENCIAS_ANO["5º ano"]){
      const atual5 = db.sequenciasAno["5º ano"];
      const ehExemplo5 = atual5.length === 4 && atual5.every(b => /^b5-[1-4]$/.test(b.id||""));
      if(ehExemplo5) db.sequenciasAno["5º ano"] = copiaProfunda(SEED_SEQUENCIAS_ANO["5º ano"]);
    }
    // meta diária de flashcards: quem já usava recebe a recomendação padrão, e
    // o diário de dias com cartão é semeado com o que dá para saber do que já
    // existe (a última data de cada cartão) — a sequência começa a valer daí
    if(db.configGeral && !db.configGeral.metaCartoesDia) db.configGeral.metaCartoesDia = CONFIG.metaCartoesDia;
    if(!db.diasCartoes){
      db.diasCartoes = {};
      Object.keys(db.revisoesFlashcards || {}).forEach(uid=>{
        const dias = new Set(Object.values(db.revisoesFlashcards[uid]).map(r=>r.ultimaData).filter(Boolean));
        if(dias.size) db.diasCartoes[uid] = [...dias].sort();
      });
    }
    // flashcards entraram depois: quem já usava a plataforma recebe as
    // coleções vazias aqui e os cartões de semente logo abaixo, em
    // sincronizarConteudoNovo(), sem perder nada do que já tinha
    if(!db.flashcards) db.flashcards = [];
    if(!db.revisoesFlashcards) db.revisoesFlashcards = {};
    // favoritar cartão veio depois de favoritar questão: a coleção nasce vazia
    if(!Array.isArray(db.favoritosCartoes)) db.favoritosCartoes = [];
    if(!db.cartoesPorDia) db.cartoesPorDia = {};
    // Cartão agora tem dono: os que têm usuarioId são pessoais (caderno do
    // aluno) e os sem dono são material da equipe. Todo cartão salvo antes
    // desta versão foi escrito por professor ou admin, então continua sem
    // dono — que é exatamente o comportamento certo. A linha abaixo só
    // normaliza o campo, para não haver "undefined" espalhado no banco.
    db.flashcards.forEach(c=>{ if(c.usuarioId===undefined) c.usuarioId = null; });
    // "Internato" deixou de ser uma opção de ano da faculdade (virou 5º/6º
    // ano). Quem já estava cadastrado assim é movido para 6º ano, que é onde
    // está a maior parte de quem se declarava "internato" perto da prova.
    db.usuarios.forEach(x=>{ if(x.anoFaculdade==="Internato") x.anoFaculdade = "6º ano"; });
    if(db.aulas) delete db.aulas; // a área de aulas foi removida da plataforma
    if(db.configGeral && !db.configGeral.rampaRevisaoInicio) db.configGeral.rampaRevisaoInicio = [...CONFIG.rampaRevisaoInicio];
    // realinha área/especialidade das questões ao assunto de cada uma (o
    // desalinhamento surgia quando um assunto era criado ou movido depois)
    corrigirTaxonomiaAutomaticamente();
    sincronizarConteudoNovo();
    // níveis de administrador: bancos antigos não tinham esse campo
    db.usuarios.forEach(x=>{ if(x.papel==="admin" && !x.nivelAdmin) x.nivelAdmin = (x.id==="u-admin" ? "master" : "coordenacao"); });
    // a plataforma passou a se chamar "Esc": atualiza os e-mails das contas
    // de demonstração já salvas, pra continuarem batendo com a tela de entrada
    db.usuarios.forEach(x=>{ if(x.email && x.email.indexOf("@medbloco.demo")>=0) x.email = x.email.replace("@medbloco.demo","@esc.demo"); });
    // nuvem: a fila de envio e as marcas de "até onde já baixei" nascem
    // vazias em quem ainda não tinha conta (ver seção 2-C)
    if(!Array.isArray(db.filaNuvem)) db.filaNuvem = [];
    if(!db.nuvem) db.nuvem = { contaId:null, ultimaSyncEm:null, marcas:{}, recusados:[], calendarioPendente:[] };
    if(!db.nuvem.marcas) db.nuvem.marcas = {};
    if(!Array.isArray(db.nuvem.recusados)) db.nuvem.recusados = [];
    if(!Array.isArray(db.nuvem.calendarioPendente)) db.nuvem.calendarioPendente = [];
  }catch(e){
    /* Uma migração que tropeça NÃO é motivo para apagar a turma. Antes, um
       único campo inesperado no banco salvo trocava tudo pelo banco de
       demonstração, em silêncio — e cadastros, respostas e questões enviadas
       iam junto, sem volta. Agora o banco lido é mantido, consertado no que
       dá e usado assim mesmo; o conteúdo que faltar volta pela pasta
       "dados/", em sincronizarConteudoNovo(). Só se nem isso for possível é
       que se recomeça, e sempre com cópia de resgate. */
    console.error("Falha no meio da leitura dos dados salvos — o que já foi lido está sendo preservado.", e);
    guardarCopiaDeResgate(bruto);
    recuperarBanco(bruto, e);
  }
}

/* A recuperação depois de um tropeço. A regra que organiza tudo aqui é uma
   só: CADA PASSO PODE FALHAR SOZINHO, e falhar não pode custar as pessoas.
   Por isso os passos que mexem em conteúdo (taxonomia, reposição a partir da
   pasta "dados/") rodam cada um no seu próprio try — se um deles estourar, o
   que se perde é conteúdo, que a pasta repõe na próxima abertura, e não o
   cadastro de ninguém.

   Recomeçar do zero ficou reservado ao único caso em que não há nada a
   salvar: nenhum usuário legível no banco. */
function recuperarBanco(bruto, erroOriginal){
  if(!db || typeof db !== "object" || Array.isArray(db)){
    try{ db = JSON.parse(bruto); }catch(e){ db = null; }
  }
  if(!db || typeof db !== "object" || Array.isArray(db)){
    db = dbPadrao();
    tentar(saveState);
    avisarSobreBancoIlegivel();
    return;
  }
  const reparos = tentar(()=>garantirEstruturaDb(db)) || [];
  const pessoas = Array.isArray(db.usuarios) ? db.usuarios.length : 0;
  if(!pessoas){
    // nem um cadastro legível: aí sim não há o que preservar
    db = dbPadrao();
    tentar(saveState);
    avisarSobreBancoIlegivel();
    return;
  }
  tentar(corrigirTaxonomiaAutomaticamente);
  tentar(sincronizarConteudoNovo);
  tentar(saveState);
  avisarSobreReparoDoBanco(reparos, erroOriginal);
}
/* Roda uma etapa da recuperação sem deixar que ela derrube as outras. */
function tentar(fn){
  try{ return fn(); }
  catch(e){ console.error("Etapa da recuperação falhou (seguindo adiante):", e); return null; }
}

/* O conserto não pode ser silencioso: quem cuida da plataforma precisa saber
   que algo veio torto, para conferir e tirar um backup antes de continuar. */
function avisarSobreReparoDoBanco(reparos, erro){
  if(typeof window === "undefined") return;
  setTimeout(()=>{
    const quantos = (db.usuarios||[]).length;
    toast("Os dados salvos vieram com um defeito e foram consertados — nenhum cadastro foi apagado ("
      + quantos + " no banco). Vale exportar um backup. Detalhe técnico no console: " + (erro && erro.message ? erro.message : ""), "err");
    if(reparos && reparos.length) console.warn("Coleções reparadas:", reparos.join(", "));
  }, 1200);
}
function avisarSobreBancoIlegivel(){
  if(typeof window === "undefined") return;
  setTimeout(()=>{
    toast("Não foi possível ler os dados salvos neste navegador. Uma cópia do arquivo original ficou guardada — chame quem cuida da plataforma antes de cadastrar de novo.", "err");
  }, 1200);
}

/* Recuperação manual da cópia de resgate, para quem cuida da plataforma
   chamar pelo console (ou pelo botão em Configurações). Não roda sozinho:
   restaurar por conta própria um banco que acabou de dar problema pode
   sobrescrever algo que ainda estava bom. */
function bancoDeResgateDisponivel(){
  try{ return !!localStorage.getItem(CHAVE_RESGATE); }catch(e){ return false; }
}
function resumoDoResgate(){
  try{
    const d = JSON.parse(localStorage.getItem(CHAVE_RESGATE) || "null");
    if(!d) return null;
    return {
      usuarios: (d.usuarios||[]).length,
      respostas: (d.respostas||[]).length,
      questoes: (d.questoes||[]).length,
    };
  }catch(e){ return null; }
}
function restaurarBancoDeResgate(){
  if(!podeMexerEmBackup()) return;
  const bruto = localStorage.getItem(CHAVE_RESGATE);
  if(!bruto){ toast("Não há cópia de resgate neste navegador.", "err"); return; }
  const r = resumoDoResgate();
  abrirModal(`<div class="modal-header"><h3>Restaurar a cópia de resgate</h3><button class="icon-btn" onclick="fecharModal()">${iconeSvg("x")}</button></div>

    <div class="flex gap-1 mt-2"><button class="btn btn-danger" onclick="restaurarResgateConfirmado()">Restaurar a cópia</button><button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button></div>`);
}

/* Quando novas áreas, especialidades, assuntos ou questões são acrescentadas
   ao código (como o pacote de Técnica Operatória, Cardiologia, Infectologia e
   Oftalmologia), quem já usava a plataforma tem um banco salvo no navegador
   que não conhece esse conteúdo. Esta função acrescenta ao banco salvo apenas
   o que falta, comparando pelo id — sem apagar nem sobrescrever nada do que o
   usuário já produziu (respostas, favoritos, questões próprias, edições). */
function sincronizarConteudoNovo(){
  let novos = 0;
  if(!db.taxonomia) return;
  (SEED_TAXONOMIA.areas||[]).forEach(a=>{ if(!db.taxonomia.areas.some(x=>x.id===a.id)){ db.taxonomia.areas.push(copiaProfunda(a)); novos++; } });
  (SEED_TAXONOMIA.especialidades||[]).forEach(e=>{ if(!db.taxonomia.especialidades.some(x=>x.id===e.id)){ db.taxonomia.especialidades.push(copiaProfunda(e)); novos++; } });
  (SEED_TAXONOMIA.assuntos||[]).forEach(a=>{ if(!db.taxonomia.assuntos.some(x=>x.id===a.id)){ db.taxonomia.assuntos.push(copiaProfunda(a)); novos++; } });
  SEED_QUESTOES.forEach(q=>{ if(!db.questoes.some(x=>x.id===q.id)){ db.questoes.push(copiaProfunda(q)); novos++; } });
  SEED_USUARIOS.forEach(u=>{ if(!db.usuarios.some(x=>x.id===u.id)){ db.usuarios.push(copiaProfunda(u)); novos++; } });
  if(!db.flashcards) db.flashcards = [];
  SEED_FLASHCARDS.forEach(c=>{ if(!db.flashcards.some(x=>x.id===c.id)){ db.flashcards.push(copiaProfunda(c)); novos++; } });
  if(!db.livroOuro) { db.livroOuro = copiaProfunda(SEED_LIVRO_OURO); novos++; }
  // um ano da faculdade que ganhou calendário no código e ainda não existe no
  // banco salvo entra aqui — sem tocar nos anos que a coordenação já editou
  if(db.sequenciasAno){
    Object.keys(SEED_SEQUENCIAS_ANO||{}).forEach(ano=>{
      if(!temCalendarioProprio(ano)) return;
      if(!db.sequenciasAno[ano] || !db.sequenciasAno[ano].length){
        db.sequenciasAno[ano] = copiaProfunda(SEED_SEQUENCIAS_ANO[ano]); novos++;
      }
    });
  }
  if(novos) saveState();
}

/* Tamanho aproximado do banco no navegador. Passou a importar de verdade
   quando as questões ganharam imagens embutidas: o limite do localStorage
   costuma ficar entre 5 e 10 MB. */
function tamanhoBancoKb(){
  try{ return Math.round(JSON.stringify(db).length/1024); }catch(e){ return 0; }
}
let _geracaoDb = 0; // incrementado a cada saveState(); invalida caches derivados de db (ver mapaPrevalenciasAssuntos)
/* Devolve `true` se gravou mesmo. Quem cria um cadastro PRECISA olhar esse
   retorno: antes, o armazenamento cheio fazia a tela dizer "cadastro
   enviado", a pessoa ir embora e o cadastro não existir no recarregamento —
   um dado perdido que ninguém sabia que tinha perdido. */
function saveState(){
  _geracaoDb++;
  let gravou = true;
  try{
    localStorage.setItem(CHAVE_STORAGE, JSON.stringify(db));
  }catch(e){
    gravou = false;
    console.error("Falha ao salvar dados", e);
    // um toast some sozinho e some junto com o aviso; isto aqui é perda de
    // dado, e precisa parar a pessoa
    if(typeof abrirModal === "function"){
      abrirModal(`<div class="modal-header"><h3>${iconeSvg("alert")} Não foi possível salvar</h3></div>
        <p class="text-sm">O armazenamento deste navegador está cheio ou bloqueado, e <strong>o que você acabou de fazer não foi gravado</strong>. Ao recarregar a página, isso se perde.</p>
        <p class="text-sm muted mt-1">O banco ocupa ${tamanhoBancoKb()} KB. O que mais pesa são imagens embutidas em questões. Caminhos: exportar um backup agora (se você for administrador máster), liberar espaço do navegador, ou abrir a plataforma numa janela normal — janelas anônimas costumam bloquear o armazenamento.</p>
        <div class="flex gap-1 mt-2">${podeAdmin("backup") ? '<button class="btn btn-primary" onclick="exportarBackup()">Exportar backup agora</button>' : ""}<button class="btn btn-secondary" onclick="fecharModal()">Entendi</button></div>`);
    }else{
      toast("Não foi possível salvar os dados neste navegador (armazenamento cheio ou bloqueado).", "err");
    }
  }
  // com a nuvem ligada, o que acabou de ser salvo aqui sobe alguns segundos
  // depois, em bloco (ver nuvemAgendarSync, na seção 2-C). Sem nuvem, esta
  // linha não faz nada.
  if(typeof nuvemAgendarSync === "function") nuvemAgendarSync();
  return gravou;
}
