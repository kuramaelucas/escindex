<script>
/* VERSÃO DA PLATAFORMA — mude a cada publicação, e SÓ AQUI.
   É o remédio para "a página abriu a versão velha". O navegador (e o
   servidor do site) guardam cópia do index.html e dos arquivos das pastas
   codigo/ e dados/ e, depois de uma atualização, podem continuar
   entregando a cópia antiga — ou, pior, o index.html novo com um
   calendario.js velho. Três defesas:
     1. todo arquivo de codigo/ e de dados/ é pedido com ?v=VERSÃO no
        endereço (ver o carregador no fim desta página): versão nova é
        endereço novo, e cópia guardada não serve;
     2. ao abrir, a plataforma baixa o index.html do servidor sem cache e
        compara a versão dele com esta; se o servidor tem uma mais nova, a
        página se recarrega sozinha (ou avisa, se a pessoa estiver no meio
        de uma questão) — ver verificarVersaoNova(), na seção 27-B;
     3. o service worker (sw.js) busca tudo na rede primeiro e só usa a
        cópia guardada quando não há internet.
   AO PUBLICAR: troque a data abaixo. Como os ?v= são montados a partir
   dela, não há mais doze lugares para lembrar — é um só. */
window.ESC_VERSAO = "2026-09-26-usp";
/* O visual vem de codigo/estilo.css, pedido com a versão no endereço pelo
   mesmo motivo. */
document.write('<link rel="stylesheet" href="codigo/estilo.css?v=' + encodeURIComponent(window.ESC_VERSAO) + '">');
</script>

<!-- ==========================================================================
     ONDE MORA CADA COISA
     ==========================================================================
     Este index.html é só a MOLDURA: o cabeçalho, os ícones e a lista de
     arquivos a carregar. Todo o resto é arquivo próprio, em duas pastas que
     precisam estar ao lado dele (e ser publicadas junto):

       codigo/  o CÓDIGO — telas, regras, algoritmos, CONFIG e o visual
                (estilo.css). Treze arquivos numerados na ordem em que
                carregam; cada um começa dizendo o que tem dentro.
       dados/   o CONTEÚDO — taxonomia, calendário, questões (uma prova por
                arquivo), flashcards, simulados e os dados de demonstração.
                Ver dados/LEIA-ME.md.

     POR QUÊ. Com tudo num arquivo só eram mais de 12.000 linhas, e qualquer
     leitura (de uma pessoa ou de uma IA) gastava o fôlego atravessando o que
     não interessava. Agora cada pedaço se abre e se confere sozinho — pedir
     "mude a tela de Meu Desempenho" é abrir codigo/10-telas-do-aluno.js.

     O SITE NÃO MUDA. Abrir o index.html com dois cliques continua bastando.
     Se a pasta dados/ faltar, a plataforma avisa numa tarja; se a pasta
     codigo/ faltar, a página diz isso em vez de abrir em branco.

     PARA ACRESCENTAR UM ARQUIVO (uma prova nova, por exemplo): crie o
     arquivo na pasta e escreva o nome dele, sem ".js", na lista
     ESC_ARQUIVOS logo abaixo. A ordem da lista é a ordem de carga — a
     taxonomia vem primeiro porque todo o resto aponta para ela, e a
     inicialização (13-admin-e-inicializacao) vem por último.
     ========================================================================== -->
<script>
/* A ponte entre os arquivos de conteúdo e o código: cada arquivo da pasta
   "dados/" chama uma destas duas funções e entrega a sua lista. Guardamos
   também o nome de quem respondeu, para a plataforma conseguir dizer o que
   carregou (Configurações > Arquivos de conteúdo) e avisar quando algo
   ficou pelo caminho. */
window.EscDados = {
  taxonomia: null,      // vira SEED_TAXONOMIA   (área > especialidade > assunto)
  blocos: [],           // vira SEED_BLOCOS      (calendário de referência)
  sequenciasAno: null,  // vira SEED_SEQUENCIAS_ANO
  questoes: [],         // vira SEED_QUESTOES
  flashcards: [],       // vira SEED_FLASHCARDS
  simulados: [],        // vira SEED_SIMULADOS
  usuarios: [],         // vira SEED_USUARIOS    (contas de demonstração)
  livroOuro: [],        // vira SEED_LIVRO_OURO
  comentarios: [],      // vira SEED_COMENTARIOS
  arquivos: [],         // um registro por arquivo que entregou conteúdo

  _anotar: function(nomeArquivo, tipo, itens){
    this.arquivos.push({ nome: nomeArquivo, tipo: tipo, itens: itens });
  },
  /* As listas se SOMAM em vez de substituir: é o que permite acrescentar uma
     prova (ou um segundo baralho, ou mais assuntos) criando um arquivo novo,
     sem tocar no que já existe. */
  _juntar: function(destino, lista){
    if(!Array.isArray(lista)) return 0;
    lista.forEach(x => destino.push(x));
    return lista.length;
  },

  registrarQuestoes: function(nomeArquivo, lista){
    if(!Array.isArray(lista)) return;
    this._anotar(nomeArquivo, "questões", this._juntar(this.questoes, lista));
  },
  registrarFlashcards: function(nomeArquivo, lista){
    if(!Array.isArray(lista)) return;
    this._anotar(nomeArquivo, "flashcards", this._juntar(this.flashcards, lista));
  },
  registrarSimulados: function(nomeArquivo, lista){
    if(!Array.isArray(lista)) return;
    this._anotar(nomeArquivo, "simulados", this._juntar(this.simulados, lista));
  },
  registrarTaxonomia: function(nomeArquivo, arvore){
    if(!arvore) return;
    if(!this.taxonomia) this.taxonomia = { areas:[], especialidades:[], assuntos:[] };
    const n = this._juntar(this.taxonomia.areas, arvore.areas)
            + this._juntar(this.taxonomia.especialidades, arvore.especialidades)
            + this._juntar(this.taxonomia.assuntos, arvore.assuntos);
    this._anotar(nomeArquivo, "taxonomia", n);
  },
  registrarCalendario: function(nomeArquivo, c){
    if(!c) return;
    let n = this._juntar(this.blocos, c.blocos);
    if(c.sequenciasAno){
      if(!this.sequenciasAno) this.sequenciasAno = {};
      Object.keys(c.sequenciasAno).forEach(ano => { this.sequenciasAno[ano] = c.sequenciasAno[ano]; n++; });
    }
    this._anotar(nomeArquivo, "calendário", n);
  },
  registrarDemonstracao: function(nomeArquivo, d){
    if(!d) return;
    const n = this._juntar(this.usuarios, d.usuarios)
            + this._juntar(this.livroOuro, d.livroOuro)
            + this._juntar(this.comentarios, d.comentarios);
    this._anotar(nomeArquivo, "demonstração", n);
  },
};

/* A LISTA DE ARQUIVOS, na ordem em que carregam. Conteúdo primeiro (o código
   usa o que os arquivos de dados/ entregaram ao EscDados), código depois. */
window.ESC_ARQUIVOS = {
  dados: [
    "taxonomia", "calendario", "banco-didatico",
    "prova-unifesp-2022", "prova-unifesp-2023", "prova-unifesp-2024",
    "prova-unifesp-2025", "prova-unifesp-2026",
    "prova-santacasa-2021", "prova-santacasa-2022", "prova-santacasa-2023",
    "prova-santacasa-2025", "prova-santacasa-2026",
    "prova-usp-2022", "prova-usp-2023", "prova-usp-2024", "prova-usp-2025",
    "prova-usp-2026", "flashcards-equipe", "flashcards-assuntos-novos",
    "flashcards-assuntos-usp", "simulados-equipe", "demonstracao",
  ],
  codigo: [
    "01-config", "02-persistencia",
    "03-nuvem", "04-utilitarios",
    "05-motor-de-estudos", "06-entrada-e-estrutura",
    "07-telas-iniciais", "08-sessao-e-revisao",
    "09-flashcards-e-provas", "10-telas-do-aluno",
    "11-telas-da-equipe", "12-importacao-e-central",
    "13-admin-e-inicializacao",
  ],
};
/* O carregador: escreve uma linha <script src="pasta/nome.js?v=VERSÃO"> por
   arquivo, na ordem da lista. Escritas assim, durante a leitura da página,
   elas rodam uma depois da outra exatamente como linhas escritas à mão — e
   funcionam também com o arquivo aberto com dois cliques. Um arquivo que
   não carrega fica anotado em ESC_FALTOU. */
(function carregarArquivos(){
  var v = encodeURIComponent(window.ESC_VERSAO);
  window.ESC_FALTOU = [];
  ["dados", "codigo"].forEach(function(pasta){
    window.ESC_ARQUIVOS[pasta].forEach(function(nome){
      var src = pasta + "/" + nome + ".js?v=" + v;
      document.write('<script src="' + src + '" onerror="window.ESC_FALTOU.push(\'' + pasta + '/' + nome + '.js\')"><\/script>');
    });
  });
})();
</script>
<script>
/* Se o código não chegou (a pasta codigo/ ficou para trás, ou um arquivo dela
   tem erro), a página diz isso em vez de ficar em branco. */
if(typeof render !== "function"){
  var faltou = (window.ESC_FALTOU || []).filter(function(f){ return f.indexOf("codigo/") === 0; });
  document.getElementById("app").innerHTML =
    '<div style="max-width:560px;margin:4rem auto;padding:1.5rem;font-family:sans-serif;line-height:1.5">' +
    '<h2>A plataforma não carregou por completo</h2>' +
    '<p>Falta a pasta <code>codigo/</code> ao lado do <code>index.html</code>' +
    (faltou.length ? ' (não chegou: <code>' + faltou.join('</code>, <code>') + '</code>)' : ', ou um dos arquivos dela tem um erro') +
    '. Ela precisa ser publicada junto com o site. O seu estudo salvo neste navegador não se perdeu.</p></div>';
}
</script>
