<!-- Política de segurança de conteúdo, só o que não quebra a plataforma: o site
     usa handlers inline (onclick) e document.write, então scripts e estilos
     não podem ser restringidos; mas dá para fechar o que nunca é preciso —
     plugins (object-src), <base> trocado (base-uri), formulário enviado para
     fora (form-action) — e limitar para onde um script injetado consegue
     mandar dado (connect-src: o próprio site e a nuvem Supabase). Se a
     plataforma passar a falar com outro endereço, ele entra aqui. -->
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; connect-src 'self' https://*.supabase.co">
<meta name="description" content="Plataforma de estudos para a prova de residência médica: questões comentadas, revisão espaçada, flashcards e simulados.">

   servidor do site) guardam cópia do index.html e dos arquivos das pastas
   codigo/ e dados/ e, depois de uma atualização, podem continuar
   entregando a cópia antiga — ou, pior, o index.html novo com um
   calendario.js velho. Três defesas:
     1. todo arquivo de codigo/ é pedido com ?v=cHASH e todo arquivo de dados/
        com ?v= do hash dele (ESC_HASH_DADOS; ver o carregador no fim desta página): versão nova é

     2. ao abrir, a plataforma baixa o index.html do servidor sem cache e
        compara a versão dele com esta; se o servidor tem uma mais nova, a
        página se recarrega sozinha (ou avisa, se a pessoa estiver no meio
        de uma questão) — ver verificarVersaoNova(), na seção 27-B;
     3. o service worker (sw.js) busca tudo na rede primeiro e só usa a
        cópia guardada quando não há internet.
   O FORMATO é AAAA-MM-DD.cHASH.dHASH. Os dois hashes são calculados pelo
   `npm run publicar` a partir do conteúdo: cHASH muda quando muda o código
   (codigo/, sw.js, esta página); dHASH, quando muda o conteúdo (dados/*.js).

     Este index.html é só a MOLDURA: o cabeçalho, os ícones e a lista de
     arquivos a carregar. Todo o resto é arquivo próprio, em duas pastas que
     precisam estar ao lado dele (e ser publicadas junto):

       codigo/  o CÓDIGO — telas, regras, algoritmos, CONFIG e o visual
                (estilo.css). Arquivos numerados na ordem em que carregam
                (03a, 03b… são partes de um mesmo assunto); cada um começa
                dizendo o que tem dentro. Mapa completo: CLAUDE.md.
       dados/   o CONTEÚDO — taxonomia, calendário, questões (uma prova por
                arquivo), flashcards, simulados e os dados de demonstração.
                Ver dados/LEIA-ME.md.

     POR QUÊ. Com tudo num arquivo só eram mais de 12.000 linhas, e qualquer
     leitura (de uma pessoa ou de uma IA) gastava o fôlego atravessando o que
     não interessava. Agora cada pedaço se abre e se confere sozinho — pedir
     "mude a tela de Meu Desempenho" é abrir
     codigo/10a-favoritos-historico-desempenho.js.

     O SITE NÃO MUDA. Abrir o index.html com dois cliques continua bastando.
     Se a pasta dados/ faltar, a plataforma avisa numa tarja; se a pasta
     codigo/ faltar, a página diz isso em vez de abrir em branco.

     PARA ACRESCENTAR UM ARQUIVO (uma prova nova, por exemplo): crie o
     arquivo na pasta e escreva o nome dele, sem ".js", na lista
     ESC_ARQUIVOS logo abaixo. A ordem da lista é a ordem de carga — a
     taxonomia vem primeiro porque todo o resto aponta para ela, e a
     inicialização (14-admin-e-inicializacao) vem por último.
     ========================================================================== -->
<script>
/* A ponte entre os arquivos de conteúdo e o código: cada arquivo da pasta
   "dados/" chama uma destas duas funções e entrega a sua lista. Guardamos
   também o nome de quem respondeu, para a plataforma conseguir dizer o que
   carregou (Configurações > Arquivos de conteúdo) e avisar quando algo
   ficou pelo caminho. */
window.EscDados = {
  taxonomia: null,      // vira SEED_TAXONOMIA   (área > especialidade > assunto)
  blocos: [],           // vira SEED_BLOCOS      (calendário de referência)
  sequenciasAno: null,  // vira SEED_SEQUENCIAS_ANO
  questoes: [],         // vira SEED_QUESTOES
  flashcards: [],       // vira SEED_FLASHCARDS
  simulados: [],        // vira SEED_SIMULADOS
  usuarios: [],         // vira SEED_USUARIOS    (contas de demonstração)
  livroOuro: [],        // vira SEED_LIVRO_OURO
  comentarios: [],      // vira SEED_COMENTARIOS
  trilhaFormados: null, // vira SEED_TRILHA_FORMADOS ({ordem, exige}: cronograma de Formado(a))
  provasInativas: [],   // vira SEED_PROVAS_INATIVAS (provas que já chegam inativas: {chave, rotulo})
  indice: null,         // índice leve das questões (dados/indice-questoes.js): vira as fichas de SEED_QUESTOES (02b)
  indiceBusca: null,    // primeiros caracteres de cada enunciado (dados/indice-busca.js), só quando a busca abre
  corpos: {},           // id da questão -> a questão inteira de um arquivo de prova já carregado (o texto: 02b)
  arquivosComCorpo: {}, // nome do arquivo de prova -> true, quando o corpo das questões dele chegou
  arquivos: [],         // um registro por arquivo que entregou conteúdo

  _anotar: function(nomeArquivo, tipo, itens){
    this.arquivos.push({ nome: nomeArquivo, tipo: tipo, itens: itens });
  },
  /* As listas se SOMAM em vez de substituir: é o que permite acrescentar uma
     prova (ou um segundo baralho, ou mais assuntos) criando um arquivo novo,
     sem tocar no que já existe. */
  _juntar: function(destino, lista){
    if(!Array.isArray(lista)) return 0;
    lista.forEach(x => destino.push(x));
    return lista.length;
  },

  registrarQuestoes: function(nomeArquivo, lista){
    if(!Array.isArray(lista)) return;
    // com o índice leve carregado, as questões já existem como fichas: o arquivo de prova só traz o CORPO
    if(this.indice){
      lista.forEach(q => { this.corpos[q.id] = q; });
      this.arquivosComCorpo[nomeArquivo] = true;
      this._anotar(nomeArquivo, "questões", lista.length);
      return;
    }
    this._anotar(nomeArquivo, "questões", this._juntar(this.questoes, lista));
  },
  registrarIndice: function(d){
    if(!d || !Array.isArray(d.linhas)) return;
    this.indice = d;
    this._anotar("indice-questoes", "índice", d.linhas.length);
  },
  registrarIndiceBusca: function(lista){ if(Array.isArray(lista)) this.indiceBusca = lista; },
  registrarFlashcards: function(nomeArquivo, lista){
    if(!Array.isArray(lista)) return;
    this._anotar(nomeArquivo, "flashcards", this._juntar(this.flashcards, lista));
  },
  registrarSimulados: function(nomeArquivo, lista){
    if(!Array.isArray(lista)) return;
    this._anotar(nomeArquivo, "simulados", this._juntar(this.simulados, lista));
  },
  registrarTaxonomia: function(nomeArquivo, arvore){
    if(!arvore) return;
    if(!this.taxonomia) this.taxonomia = { areas:[], especialidades:[], assuntos:[] };
    const n = this._juntar(this.taxonomia.areas, arvore.areas)
            + this._juntar(this.taxonomia.especialidades, arvore.especialidades)
            + this._juntar(this.taxonomia.assuntos, arvore.assuntos);
    // assuntos fundidos: { "id-que-sumiu": "id-que-ficou" } (ver aplicarFusoesDeAssuntos)
    if(arvore.fusoes) this.taxonomia.fusoes = Object.assign(this.taxonomia.fusoes || {}, arvore.fusoes);
    this._anotar(nomeArquivo, "taxonomia", n);
  },
  registrarCalendario: function(nomeArquivo, c){
    if(!c) return;
    let n = this._juntar(this.blocos, c.blocos);
    if(c.sequenciasAno){
      if(!this.sequenciasAno) this.sequenciasAno = {};
      Object.keys(c.sequenciasAno).forEach(ano => { this.sequenciasAno[ano] = c.sequenciasAno[ano]; n++; });
    }
    this._anotar(nomeArquivo, "calendário", n);
  },
  registrarTrilhaFormados: function(nomeArquivo, t){
    if(!t || !Array.isArray(t.ordem)) return;
    this.trilhaFormados = { ordem: t.ordem, exige: t.exige || {} };
    this._anotar(nomeArquivo, "trilha", t.ordem.length);
  },
  registrarProvasInativas: function(nomeArquivo, lista){
    if(!Array.isArray(lista)) return;
    this._anotar(nomeArquivo, "provas inativas", this._juntar(this.provasInativas, lista));
  },
  registrarDemonstracao: function(nomeArquivo, d){
    if(!d) return;
    const n = this._juntar(this.usuarios, d.usuarios)
            + this._juntar(this.livroOuro, d.livroOuro)
            + this._juntar(this.comentarios, d.comentarios);
    this._anotar(nomeArquivo, "demonstração", n);
  },
};

/* A LISTA DE ARQUIVOS, na ordem em que carregam. Conteúdo primeiro (o código
   usa o que os arquivos de dados/ entregaram ao EscDados), código depois.
   A lista do conteúdo NÃO mora aqui: ela está em dados/manifesto.js (que
   preenche ESC_ARQUIVOS.dados), para acrescentar uma prova mexer só na
   pasta dados/. A do código fica aqui, porque é código. */
window.ESC_ARQUIVOS = {
  dados: [],
  codigo: [
    "01-config", "02-persistencia", "02b-corpos-das-questoes",
    "03a-nuvem-conexao", "03b-nuvem-sincronizacao", "03c-nuvem-compartilhadas", "03d-nuvem-telas", "03e-nuvem-grupos",
    "04-utilitarios", "05a-motor-de-estudos", "05b-desempenho-e-metas", "05c-cronogramas-de-sessao", "05d-trilha-de-estudos", "05e-trilha-de-formados", "05f-revisao-sugerida",
    "06-entrada-e-estrutura", "06b-busca-global", "06c-modo-plataforma", "06d-controle-de-videogame", "07-telas-iniciais", "08-sessao-e-revisao", "08b-destaques-de-texto", "08c-questoes-dissertativas", "08d-revisao", "08e-comentarios-e-duvidas",
    "09a-revisao-rapida", "09b-simulados-e-provas", "09c-cartoes-em-lote", "09d-provas-antigas",
    "10a-favoritos-historico-desempenho", "10b-meta-grupo-perfil", "10c-perfil",
    "11a-simulado-e-pdf", "11b-qualidade-e-cadastros", "11c-banco-e-taxonomia", "11d-painel-da-turma", "11e-avisos",
    "12a-importacao", "12b-central-de-provas", "12c-questoes-para-atualizar", "12d-pendencias-de-conteudo",
    "13-tutorial", "14-admin-e-inicializacao",
  ],
};
/* O carregador: escreve uma linha <script src="pasta/nome.js?v=VERSÃO"> por
   arquivo, na ordem da lista. Escritas assim, durante a leitura da página,
   elas rodam uma depois da outra exatamente como linhas escritas à mão — e
   funcionam também com o arquivo aberto com dois cliques. Um arquivo que
   não carrega fica anotado em ESC_FALTOU. Dois passos: este escreve o
   manifesto de dados/ (que diz quais arquivos de conteúdo existem) e o
   próximo <script> escreve o resto, já com a lista na mão. */
window.ESC_FALTOU = [];
window.escEndereco = function(pasta, nome){
  var v = encodeURIComponent(pasta === "dados" ? (window.ESC_HASH_DADOS[nome] || window.ESC_VERSAO_PARTES.dados) : window.ESC_VERSAO_PARTES.codigo);
  return pasta + '/' + nome + '.js?v=' + v;
};
window.escCarregar = function(pasta, nome){
  document.write('<script src="' + window.escEndereco(pasta, nome) + '" onerror="window.ESC_FALTOU.push(\'' + pasta + '/' + nome + '.js\')"><\/script>');
};
/* Escrito antes dos <script>: um <script> escrito com document.write só é pedido
   quando o anterior termina, então os ~150 arquivos formavam uma fila de idas e
   voltas à rede (22 s no celular com 100 ms de latência). Anunciar todos de uma
   vez com preload baixa em paralelo; a execução segue na mesma ordem. */
window.escPreCarregar = function(pasta, nome){
  document.write('<link rel="preload" as="script" href="' + window.escEndereco(pasta, nome) + '">');
};
/* Marcas de tempo entre os blocos (lidas por `npm run medir-carga`; não mudam nada). */
window.escMarcar = function(nome){ document.write('<script>try{performance.mark("' + nome + '")}catch(e){}<\/script>'); };
window.escCarregar("dados", "manifesto");
</script>
<script>
/* MOLDURA PRIMEIRO. Só o que o código lê ao carregar vai antes dele: taxonomia,
   calendário e trilha (pequenos; 02-persistencia.js guarda referência a eles).
   O resto do conteúdo (30 MB de questões) é pedido DEPOIS da primeira pintura,
   por escCarregarResto, e só então o banco é montado (iniciarBanco, em
   14-admin-e-inicializacao.js). Até lá render() desenha a moldura. */
window.ESC_DADOS_DA_FRENTE = ["taxonomia", "calendario", "trilha-formados"];
(function(){
  var frente = window.ESC_ARQUIVOS.dados.filter(function(n){ return window.ESC_DADOS_DA_FRENTE.indexOf(n) >= 0; });
  window.ESC_DADOS_DEPOIS = window.ESC_ARQUIVOS.dados.filter(function(n){ return window.ESC_DADOS_DA_FRENTE.indexOf(n) < 0; });
  frente.forEach(function(nome){ window.escPreCarregar("dados", nome); });
  window.ESC_ARQUIVOS.codigo.forEach(function(nome){ window.escPreCarregar("codigo", nome); });
  frente.forEach(function(nome){ window.escCarregar("dados", nome); });
  window.escMarcar("esc:dados-frente");
  window.ESC_ARQUIVOS.codigo.forEach(function(nome){ window.escCarregar("codigo", nome); });
  window.escMarcar("esc:codigo-prontos");
  /* Só agenda o conteúdo depois que TODO o código executou (é este <script>, escrito
     depois dos de codigo/, que chama): com a rede lenta o analisador pode ceder
     a vez antes disso, e os dados chegariam sem iniciarBanco para recebê-los. */
  document.write('<script>window.escAgendarResto()<\/script>');
})();
/* Os arquivos inseridos assim baixam em paralelo e executam na ordem da lista
   (async = false), cada um numa tarefa própria: a moldura continua respondendo
   enquanto o conteúdo entra. Arquivo que falha fica em ESC_FALTOU e não trava os outros. */
window.ESC_DADOS_SOB_DEMANDA = ["indice-busca"];   // só quando a busca global abre (06b)
window.escCarregarLista = function(lista, aoFim){
  var faltam = lista.length;
  if(!faltam){ aoFim(); return; }
  var terminou = function(){ if(--faltam === 0) aoFim(); };
  lista.forEach(function(nome){
    var s = document.createElement("script");
    s.async = false; s.src = window.escEndereco("dados", nome);
    s.onload = terminou;
    s.onerror = function(){ window.ESC_FALTOU.push("dados/" + nome + ".js"); terminou(); };
    document.head.appendChild(s);
  });
};
/* Duas levas: primeiro o índice leve das questões; só então se sabe quais arquivos são de prova
   (guardam só o texto das questões e ficam para quando forem precisos: garantirCorpos, 02b) e
   quais são conteúdo que a plataforma lê inteiro (cartões, simulados, demonstração…).
   ESC_CORPOS_COMPLETOS (a URL com ?completo=1, ou o servidor dos testes) baixa os textos todos
   já na carga, como a plataforma fazia antes. */
window.escCarregarResto = function(){
  if(window.ESC_RESTO_INICIADO) return;
  window.ESC_RESTO_INICIADO = true;
  var depois = window.ESC_DADOS_DEPOIS;
  var outros = depois.filter(function(n){ return n !== "indice-questoes" && window.ESC_DADOS_SOB_DEMANDA.indexOf(n) < 0; });
  window.escCarregarLista(depois.filter(function(n){ return n === "indice-questoes"; }), function(){
    var ind = window.EscDados.indice, deProva = ind ? ind.arquivos : [];
    var completos = window.ESC_CORPOS_COMPLETOS || /[?&]completo=1/.test(location.search);
    window.escCarregarLista(outros.filter(function(n){ return completos || deProva.indexOf(n) < 0; }), function(){
      try{ performance.mark("esc:dados-prontos"); }catch(e){}
      window.ESC_DADOS_PRONTOS = true;
      if(typeof iniciarBanco === "function") iniciarBanco();
    });
  });
};
/* Depois da primeira pintura; o temporizador cobre aba em segundo plano (sem rAF). */
window.escAgendarResto = function(){
  requestAnimationFrame(function(){ setTimeout(window.escCarregarResto, 0); });
  setTimeout(window.escCarregarResto, 1500);
};
</script>
<script>
/* Se o código não chegou (a pasta codigo/ ficou para trás, ou um arquivo dela
   tem erro), a página diz isso em vez de ficar em branco. */
if(typeof render !== "function"){
  var faltou = (window.ESC_FALTOU || []).filter(function(f){ return f.indexOf("codigo/") === 0; });
  document.getElementById("app").innerHTML =
    '<div style="max-width:560px;margin:4rem auto;padding:1.5rem;font-family:sans-serif;line-height:1.5">' +
    '<h2>A plataforma não carregou por completo</h2>' +
    '<p>Falta a pasta <code>codigo/</code> ao lado do <code>index.html</code>' +
    (faltou.length ? ' (não chegou: <code>' + faltou.join('</code>, <code>') + '</code>)' : ', ou um dos arquivos dela tem um erro') +
    '. Ela precisa ser publicada junto com o site. O seu estudo salvo neste navegador não se perdeu.</p></div>';
}
</script>
</body>
</html>
