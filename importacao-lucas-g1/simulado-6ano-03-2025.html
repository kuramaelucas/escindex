<script>
const DADOS=[{"n": 1, "e": "Um estudo avaliou os fatores associados ao risco de anemia infantil em crianças do estado do Amazonas. Os resultados do estudo são apresentados na tabela a seguir (RR: risco relativo; IC 95%: intervalo de confiança de 95%): Renda familiar: RR 0,61 (IC 95% 0,39 – 0,95); Idade da criança (meses): RR 1,18 (0,96 – 1,32); Anemia materna no parto: RR 1,67 (1,17 – 2,39); Malária nos dois primeiros anos de vida: RR 2,25 (1,30 – 3,87); Deficiência de ferro: RR 2,15 (1,47 – 3,15). Considerando os dados da tabela, indique a alternativa cujos componentes são fatores associados ao aumento no risco de anemia infantil.", "a": ["Idade da criança, anemia materna no parto, malária nos dois primeiros anos de vida", "Renda familiar, anemia materna no parto, malária nos dois primeiros anos de vida", "Anemia materna no parto, malária nos dois primeiros anos de vida, deficiência de ferro", "Alto índice de riqueza, malária nos dois primeiros anos de vida, deficiência de ferro"], "g": "C", "ar": "Medicina Preventiva e Social", "es": "Epidemiologia", "as_": "Medidas de Frequência e Associação", "d": "fundamental", "i": "Tabela com RR e IC 95% dos fatores associados à anemia infantil", "x": "A alternativa C está correta. Dicas do enunciado: um fator **associado ao aumento do risco** tem **RR maior que 1 com todo o IC 95% acima de 1**. Pela tabela: anemia materna no parto (1,17-2,39), malária (1,30-3,87) e deficiência de ferro (1,47-3,15) cumprem o critério. A: a idade da criança tem IC de 0,96 a 1,32, que inclui o 1 (associação não significativa). B: a renda familiar tem RR de 0,61, ou seja, é fator de **proteção**, não de aumento do risco. D: a renda alta também é protetora, e a alternativa ainda se apoia nessa interpretação invertida.", "r": "Medronho, Epidemiologia; Gordis, Epidemiology."}, {"n": 2, "e": "Um estudo avaliou a associação entre consumo de bebidas alcoólicas e acidente vascular cerebral durante 6 anos de acompanhamento. Os resultados do estudo se encontram na tabela: Consumo de bebida alcoólica 0 vezes por semana: AVC sim 20, não 800, total 1.000; 1 ou mais vezes por semana: AVC sim 80, não 1.920, total 2.000; Total: sim 100, não 2.720, total 3.000. Considerando os dados da tabela, calcule o risco relativo de acidente vascular cerebral associado ao consumo de bebidas alcoólicas uma ou mais vezes por semana.", "a": ["2,0", "4,0", "0,2", "0,4"], "g": "A", "ar": "Medicina Preventiva e Social", "es": "Epidemiologia", "as_": "Medidas de Frequência e Associação", "d": "fundamental", "i": "Tabela 2x2 de consumo de álcool e AVC", "x": "A alternativa A está correta. Dicas do enunciado: estudo com **acompanhamento de 6 anos**, de coorte, cuja medida é o **risco relativo = risco nos expostos / risco nos não expostos**. Expostos: 80/2.000 = **0,04**; não expostos: 20/1.000 = **0,02**; RR = 0,04/0,02 = **2,0**. B: 4,0 seria obtido ao inverter ou ao dobrar o resultado. C: 0,2 e D: 0,4 não correspondem à razão entre os riscos, e sim a valores que misturam número de casos e totais, sem a divisão correta.", "r": "Medronho, Epidemiologia."}, {"n": 3, "e": "Um estudo foi realizado no Brasil com o objetivo de analisar a associação entre a estrutura das unidades básicas de saúde (UBS) e mortalidade infantil em 2018. Dados sobre disponibilidade de equipamentos médicos, disponibilidade de testes diagnósticos e oferecimento de vacinas de UBS de 5.570 municípios brasileiros foram obtidos das Secretarias Municipais de Saúde. Dados de mortalidade infantil foram obtidos do Sistema de Informação de Mortalidade do DATASUS. Os resultados do estudo podem ser observados na figura abaixo (mapa do Brasil com a taxa de mortalidade infantil suavizada por município). Qual foi o tipo de estudo epidemiológico realizado?", "a": ["Estudo transversal", "Estudo ecológico", "Ensaio clínico comunitário", "Estudo de coorte"], "g": "B", "ar": "Medicina Preventiva e Social", "es": "Epidemiologia", "as_": "Desenhos de Estudo Epidemiológico", "d": "fundamental", "i": "Mapa do Brasil com mortalidade infantil por município (Dilélio et al., Rev Saúde Pública 2024)", "x": "A alternativa B está correta. Dicas do enunciado: a unidade de análise são os **municípios** (5.570), com **dados agregados** de estrutura das UBS e de mortalidade infantil, e a figura é um **mapa**: **estudo ecológico**. A: o estudo transversal mede exposição e desfecho em indivíduos em um mesmo momento, o que não ocorre. C: o ensaio comunitário envolve intervenção do pesquisador, ausente aqui. D: a coorte acompanha indivíduos ao longo do tempo.", "r": "Medronho, Epidemiologia; Dilélio et al., Rev Saúde Pública 2024."}, {"n": 4, "e": "Um estudo investigou a associação entre dor de cabeça e insônia em adolescentes de 15 anos de idade da coorte de nascimento de Pelotas. Os adolescentes responderam a um questionário sobre ocorrência e tipo de dor de cabeça e um questionário sobre qualidade do sono. Um total de 1.916 adolescentes foram incluídos no estudo. A tabela a seguir mostra os resultados do estudo (prevalência de dor de cabeça, % e IC 95%): Insônia durante o último mês: Nenhuma, N 162, 34,0 (27,1; 41,6); < 1 vez por semana, N 443, 40,4 (35,9; 45,0); 1 – 2 vezes por semana, N 664, 49,6 (45,8; 53,3); ≥ 3 vezes por semana, N 647, 65,8 (62,1; 69,4). Qual é a medida de associação adequada para descrever a associação entre prevalência de dor de cabeça e insônia nesse estudo?", "a": ["Incidência absoluta", "Razão de incidência", "Risco atribuível", "Razão de prevalência"], "g": "D", "ar": "Medicina Preventiva e Social", "es": "Epidemiologia", "as_": "Medidas de Frequência e Associação", "d": "intermediario", "i": "Tabela de prevalência de dor de cabeça segundo frequência de insônia", "x": "A alternativa D está correta. Dicas do enunciado: **questionários respondidos em um único momento**, e a tabela mostra a **prevalência** da dor de cabeça em cada nível de insônia: **estudo transversal**. A medida de associação adequada é a **razão de prevalência**, que compara a prevalência do desfecho entre expostos e não expostos. A, B e C: incidência absoluta, razão de incidência e risco atribuível são medidas de estudos **longitudinais** (coorte), em que se acompanha o surgimento de casos novos ao longo do tempo, o que este estudo não fez.", "r": "Medronho, Epidemiologia."}, {"n": 5, "e": "Mulher com diabetes tipo 1, frequenta e é atendida, há 12 anos, pela mesma Unidade Básica de Saúde localizada no bairro onde mora. O princípio da Atenção Primária à Saúde (APS) evidenciado nesta relação paciente com o serviço de saúde é:", "a": ["Resolutividade.", "Hierarquização.", "Territorialização.", "Longitudinalidade."], "g": "D", "ar": "Medicina Preventiva e Social", "es": "Saúde da Família", "as_": "Estratégia Saúde da Família", "d": "fundamental", "i": null, "x": "A alternativa D está correta. Dicas do enunciado: acompanhamento na **mesma UBS por 12 anos**: a **longitudinalidade** é a existência de uma **fonte contínua de atenção e sua utilização ao longo do tempo**. A: a resolutividade é a capacidade de resolver a maior parte dos problemas de saúde, não só vínculo duradouro. B: a hierarquização organiza os níveis de atenção. C: a territorialização relaciona-se à área de abrangência da UBS, e o texto não destaca isso.", "r": "Starfield, Atenção Primária; Política Nacional de Atenção Básica (Portaria 2.436/2017)."}, {"n": 6, "e": "Um estudo avaliou a associação entre dificuldade de realizar atividades de vida diária e quedas em idosos. Um total de 420 idosos foram acompanhados por cinco anos no estudo. Os resultados do estudo se encontram na tabela abaixo: Dificuldade de realizar atividades da vida diária — Sim: quedas sim 14, não 56, total 70; Não: quedas sim 35, não 315, total 350; Total: sim 49, não 371, total 420. Considerando os dados da tabela acima, calcule o risco relativo e o risco atribuível de quedas em idosos com dependência em atividades da vida diária em relação a idosos sem dependência em atividades da vida diária.", "a": ["Risco relativo: 2,0; risco atribuível: 0,1", "Risco relativo: 2,0; risco atribuível: 0,2", "Risco relativo: 1,0; risco atribuível: 0,3", "Risco relativo: 1,0; risco atribuível: 0,4"], "g": "A", "ar": "Medicina Preventiva e Social", "es": "Epidemiologia", "as_": "Medidas de Frequência e Associação", "d": "fundamental", "i": "Tabela 2x2 de dificuldade em atividades de vida diária e quedas", "x": "A alternativa A está correta. Dicas do enunciado: estudo de **coorte de 5 anos**. Risco nos expostos = 14/70 = **0,20**; risco nos não expostos = 35/350 = **0,10**. **RR = 0,20/0,10 = 2,0** e **risco atribuível = 0,20 − 0,10 = 0,1** (diferença de risco). B: o risco atribuível não é 0,2, que é o risco nos expostos. C e D: RR igual a 1,0 significaria ausência de associação, o que não corresponde aos dados, e os riscos atribuíveis de 0,3 e 0,4 também não resultam da subtração correta.", "r": "Medronho, Epidemiologia."}, {"n": 7, "e": "Em vários municípios, a exemplo de São Paulo, há muito tempo a média complexidade ou a atenção ambulatorial especializada vem sendo avaliada como “gargalo” ou “obstáculo” do Sistema Único de Saúde (SUS). Qual princípio do SUS não está sendo contemplado?", "a": ["Equidade", "Regionalização.", "Integralidade.", "Universalidade."], "g": "C", "ar": "Medicina Preventiva e Social", "es": "SUS e Políticas de Saúde", "as_": "Níveis de Atenção à Saúde", "d": "fundamental", "i": null, "x": "A alternativa C está correta. Dicas do enunciado: o \"gargalo\" na **média complexidade** impede o usuário que entra pela atenção primária de acessar o **cuidado especializado** quando precisa, **quebrando a linha de cuidado**. Isso fere a **integralidade**: cuidado completo e contínuo, em todos os níveis do sistema. A: a equidade trata de dar mais a quem mais precisa e não é o ponto. B: a regionalização é a organização dos serviços por territórios e redes. D: a universalidade é o acesso de todos, que não é o princípio descrito pela dificuldade de acessar a média complexidade.", "r": "Lei 8.080/1990; Política Nacional de Atenção Básica."}, {"n": 8, "e": "As conferências municipais de saúde são espaços de debates e deliberações coletivas para formulação de políticas de saúde voltadas ao município. Durante as conferências de saúde, quais segmentos devem ter participação com direito ‘voz e voto’ nos procedimentos de votação?", "a": ["Usuários, gestores e técnicos de manutenção de equipamentos.", "Programadores do orçamento, trabalhadores e gestores.", "Gestores, usuários e programadores de orçamento.", "Trabalhadores da saúde, gestores e usuários dos serviços de saúde."], "g": "D", "ar": "Medicina Preventiva e Social", "es": "SUS e Políticas de Saúde", "as_": "Princípios e Diretrizes do SUS", "d": "fundamental", "i": null, "x": "A alternativa D está correta. Dicas do enunciado: pela **Lei 8.142/1990** e pelas resoluções do Conselho Nacional de Saúde, as conferências e conselhos têm composição **paritária**: **50% usuários, 25% trabalhadores da saúde e 25% gestores e prestadores**. Todos têm voz e voto. A, B e C: incluem técnicos de manutenção de equipamentos ou programadores de orçamento, que não são segmentos previstos na representação do controle social.", "r": "Lei 8.142/1990; Resolução CNS nº 453/2012."}, {"n": 9, "e": "A Lei Federal nº 13.097, de 19 de janeiro de 2015, ampliou a entrada de capital estrangeiro na saúde no Brasil. Assinale a alternativa correta, correspondente a caso ou tipo de estabelecimentos, nos quais não era permitido antes de 2015, mas passou a poder contar com participação do capital estrangeiro:", "a": ["Hospitais e clínicas privados", "Hemocentros e bancos de sangue", "Escolas médicas", "Planos e seguros de saúde"], "g": "A", "ar": "Medicina Preventiva e Social", "es": "SUS e Políticas de Saúde", "as_": "Financiamento do SUS e Saúde Suplementar", "d": "intermediario", "i": null, "x": "A alternativa A está correta. Dicas do enunciado: a **Lei 13.097/2015** alterou a Lei 8.080 (art. 23) e passou a permitir a participação direta ou indireta, inclusive controle, de empresas ou **capital estrangeiro** em **hospital geral, filantrópico e especializado, policlínica, clínica geral e especializada**, entre outros casos. B: a coleta, o processamento e a distribuição de sangue continuam sob regras específicas, com vedação à comercialização. C: escolas médicas não fazem parte do rol do art. 23. D: os planos e seguros de saúde já tinham participação de capital estrangeiro desde a Lei 9.656 e a Emenda 40.", "r": "Lei 13.097/2015; Lei 8.080/1990, art. 23."}, {"n": 10, "e": "O Ministério da Saúde, em 2023, instituiu incentivo financeiro federal de implantação e custeio para as equipes multiprofissionais (eMulti) na atenção primária à saúde (APS). A nova proposta constitui um arranjo substitutivo aos Núcleos Ampliados de Saúde da Família (NASF). Assinale a alternativa que corresponde à definição de equipes multiprofissionais (eMulti)", "a": ["equipes compostas por profissionais de saúde de diferentes áreas de conhecimento que atuam de maneira complementar e integrada às demais equipes da Atenção Primária à Saúde - APS, com atuação corresponsável pela população e pelo território, em articulação intersetorial e com a Rede de Atenção à Saúde – RAS.", "equipes compostas por profissionais de saúde de diferentes áreas de conhecimento que atuam de maneira obrigatória e integrada às demais equipes de Média Complexidade - MC, com atuação corresponsável pela população e pelo território, em articulação intersetorial e com a Rede de Atenção à Saúde – RAS.", "equipes compostas por profissionais de saúde de diferentes áreas de conhecimento médico que atuam de maneira exclusiva e integrada às demais equipes da Atenção Terciária à Saúde - ATS, com atuação corresponsável pela população e pelo território, em articulação intersetorial e com a Rede de Atenção à Saúde – RAS.", "equipes compostas por profissionais de saúde de diferentes áreas de conhecimento médico que atuam de maneira complementar e exclusiva às demais equipes de Média Complexidade - MC, com atuação corresponsável pela população e pelo território, em articulação intersetorial e com a Rede de Atenção à Saúde – RAS."], "g": "A", "ar": "Medicina Preventiva e Social", "es": "SUS e Políticas de Saúde", "as_": "Políticas Nacionais de Saúde (Mulher, Idoso, Pessoa com Deficiência, Alimentação, Educação Permanente)", "d": "intermediario", "i": null, "x": "A alternativa A está correta. Dicas do enunciado: a **Portaria GM/MS nº 635/2023** instituiu as **eMulti**, que substituem o NASF, definidas como equipes de profissionais de diferentes áreas que atuam de forma **complementar e integrada às demais equipes da Atenção Primária**, com **corresponsabilidade pela população e pelo território** e articulação com a RAS. B: coloca as eMulti na média complexidade, quando elas foram criadas para a APS. C: coloca na atenção terciária e fala em atuação exclusiva. D: restringe às áreas do conhecimento médico e à média complexidade, o que contraria a definição.", "r": "Portaria GM/MS nº 635/2023."}, {"n": 11, "e": "Uma jovem de 20 anos de idade, comparece à consulta com ginecologista para uma avaliação de rotina. Ela iniciou sua vida sexual recentemente e deseja “fazer todos os exames necessários” para garantir que está saudável. O médico solicita sorologias, colpocitologia e uma ultrassonografia transvaginal (USTV). Tendo em vista as diretrizes do Ministério da Saúde e a prevenção de doenças, como seria avaliada a conduta do médico?", "a": ["O médico agiu corretamente ao solicitar colpocitologia e USTV, já que esses exames são essenciais para a detecção precoce de patologias uterinas e outros agravos em mulheres jovens.", "A solicitação de colpocitologia e USTV para uma paciente de 20 anos sem sintomas não está indicada, mas a realização desses exames não traria grandes prejuízos à paciente.", "A conduta foi adequada, pois a realização de exames como o colpocitológico e a USTV ajudam a garantir a prevenção de problemas ginecológicos graves em pacientes sexualmente ativas.", "Apenas as sorologias são indicadas para a paciente. A solicitação de colpocitologia e USTV em uma mulher de 20 anos assintomática pode levar a sobrediagnósticos e gerar preocupações desnecessárias."], "g": "D", "ar": "Medicina Preventiva e Social", "es": "Bioética", "as_": "Comunicação e Relação Médico-Paciente", "d": "intermediario", "i": null, "x": "A alternativa D está correta. Dicas do enunciado: jovem de **20 anos, assintomática**, que quer \"todos os exames\". O rastreamento do câncer de colo do útero começa **aos 25 anos**, e a **USTV não é método de rastreio**, apenas de diagnóstico. A conduta se orienta pela **prevenção quaternária**: evitar sobrediagnóstico, cascata de intervenções e ansiedade; indicam-se apenas as **sorologias** (rastreio de IST). A e C: afirmam que colpocitologia e USTV são essenciais e preventivos, o que contraria as diretrizes. B: reconhece que não há indicação, mas minimiza o dano, quando exames desnecessários podem gerar achados incidentais e intervenções.", "r": "Diretrizes Brasileiras para o Rastreamento do Câncer do Colo do Útero (INCA); Prevenção quaternária, Rev Bras Med Fam Comunidade."}, {"n": 12, "e": "Mulher de 35 anos de idade mudou-se para o bairro Jardim Ângela há três meses. Ela foi à Unidade Básica de Saúde (UBS) de referência para expressar sua insatisfação. Em conversa com a gerente da unidade, relatou que nunca foi visitada pelo agente comunitário de saúde (ACS). No entanto, sua sogra, que mora em uma rua paralela, recebe visitas mensais. Qual das respostas abaixo seria uma explicação razoável a ser oferecida pela gerente?", "a": ["A sua residência pertence ao território da equipe vermelha da Estratégia de Saúde da Família (ESF). No entanto, como a classificação de risco da sua família é baixa, o agente comunitário está priorizando famílias mais vulneráveis para acompanhamento mensal.", "Como o Ministério da Saúde recomenda o cadastramento de até 3.000 pessoas por equipe e este número já foi atingido, será necessário contratar novos agentes comunitários de saúde para cadastrar sua família.", "A sua residência fica fora da área de cobertura da ESF, mas dentro da área de abrangência da UBS. Sendo assim, podemos solicitar que os agentes comunitários da equipe amarela - que têm menos famílias cadastradas - realizem visitas à sua família.", "A sua residência fica fora da área de cobertura da ESF. Portanto, você e sua família podem utilizar a UBS para consultas ambulatoriais, mas não terão um agente comunitário de saúde de referência."], "g": "D", "ar": "Medicina Preventiva e Social", "es": "Saúde da Família", "as_": "Estratégia Saúde da Família", "d": "intermediario", "i": null, "x": "A alternativa D está correta. Dicas do enunciado: a ESF organiza a APS em **territórios adstritos**, com equipes e ACS responsáveis por famílias cadastradas; a sogra, que mora em outra rua, é visitada porque está na **área coberta**. Quem mora na área de abrangência da UBS mas **fora da cobertura da ESF** é atendido em **modelo ambulatorial**, sem ACS de referência. A: o território não é da equipe vermelha, e a classificação de risco não explica a ausência de qualquer visita. B: a recomendação é de **no máximo 4.000 pessoas por equipe** (média de 3.000), e o problema aqui é de cobertura, e não de falta de ACS. C: o ACS de outra equipe não faz visita fora do território, e a lógica da ESF não permite redirecionar famílias entre equipes dessa forma.", "r": "Política Nacional de Atenção Básica (Portaria 2.436/2017)."}, {"n": 13, "e": "Homem de 62 anos de idade é tabagista, sedentário, obeso, hipertenso e diabético. Ele marcou uma consulta com o seu médico de família porque sente-se indisposto para a realização das suas atividades diárias. Qual orientação do plano de cuidados segue os princípios da entrevista motivacional?", "a": ["Paulo, que tal escolher uma pequena mudança que você ache que pode começar a fazer agora?", "Paulo, como o seu risco cardiovascular é alto, se você quiser precaver-se de desfechos clínicos desfavoráveis como o infarto agudo do miocárdio ou acidente vascular cerebral, é fundamental que você melhore seus hábitos de vida.", "Paulo, sugiro que você tente realizar 150 minutos de atividades físicas por semana. Se você alcançar esta meta, é possível que se sinta mais disposto para as suas atividades diárias.", "Paulo, você precisa abandonar o cigarro, fazer atividades físicas e alimentar-se adequadamente o quanto antes for possível. Como o seu risco cardiovascular é alto, quanto mais compromissos você puder assumir com relação a mudanças de hábitos, maior será o impacto na prevenção dos riscos."], "g": "A", "ar": "Medicina Preventiva e Social", "es": "Bioética", "as_": "Comunicação e Relação Médico-Paciente", "d": "intermediario", "i": null, "x": "A alternativa A está correta. Dicas do enunciado: a **entrevista motivacional** é um estilo de conversa **colaborativo e não confrontativo**, que fortalece a motivação do próprio indivíduo e coloca nele a **escolha e a responsabilidade** pela mudança. Perguntar \"que tal escolher uma pequena mudança que você acha que pode começar agora?\" respeita a autonomia e estimula metas realistas. B: usa o risco e a ameaça de infarto ou AVC para pressionar, estilo diretivo e ameaçador. C: o profissional impõe a meta (150 minutos) sem ouvir a pessoa. D: lista exigências e urgência, o que gera resistência.", "r": "Dias RB, Diretrizes de intervenção quanto a mudanças de comportamento: a Entrevista Motivacional (Nescon/UFMG, 2009)."}, {"n": 14, "e": "Menina de 9 anos de idade vem à consulta com a mãe devido à disúria e dor ao evacuar há 15 dias. Foi atendida no Pronto Atendimento há 10 dias, onde foi prescrito amoxicilina 500mg de 8/8h por 5 dias. No entanto, após 5 dias de tratamento, os sintomas persistem. A criança está faltando à escola devido ao desconforto. Não apresentou febre ou reduziu a ingestão alimentar, porém, a mãe relata que a menina tem estado mais retraída e evitado certas atividades que antes gostava de fazer. Qual aspecto deve ser avaliado de modo mais importante?", "a": ["Candidíase vaginal.", "Pielonefrite.", "Oxiurose.", "Violência sexual."], "g": "D", "ar": "Medicina Preventiva e Social", "es": "Saúde da Família", "as_": "Estratégia Saúde da Família", "d": "intermediario", "i": null, "x": "A alternativa D está correta pelo gabarito oficial. Dicas do enunciado: menina de 9 anos com **disúria e dor ao evacuar há 15 dias, sem resposta ao antibiótico**, **faltando à escola, mais retraída e evitando atividades** que gostava: **mudança de comportamento** associada a sintomas genitais e anorretais persistentes. Esses sinais exigem **investigar violência sexual**, abordando fatores psicossociais e físicos. A: a candidíase vaginal em criança dessa idade é incomum e não explica o retraimento. B: sem febre e com bom estado geral, a pielonefrite é improvável. C: a oxiurose causa prurido anal noturno, sem esse impacto comportamental. Observação: a questão é indireta, e as outras hipóteses também são plausíveis, mas a mudança de comportamento é o sinal que aponta para a violência.", "r": "Ministério da Saúde, Atenção humanizada às pessoas em situação de violência sexual; ECA."}, {"n": 15, "e": "Médico: Olá, Carla, como posso te ajudar hoje? Carla: Então, doutor, estou sentindo muita dor no ombro direito já faz algumas semanas. Médico: Você já machucou o ombro antes? De zero a 10, qual seria a intensidade dessa dor? Carla: Nunca machuquei, mas a dor seria 7. Médico: Pode ser uma tendinite. Vou te passar um anti-inflamatório e recomendo descanso. Se não melhorar, volte para reavaliação. Carla: Obrigada, doutor, vou seguir suas orientações. Ao abrir a porta para sair: Ah, doutor, você pode me dar uma receita para um calmante? Estou com muita dificuldade de dormir por causa de problemas no trabalho. Tendo em vista que Carla apresentou uma demanda aditiva no fim da consulta, qual seria a melhor maneira de manejar essa demanda?", "a": ["Para prevenir demandas aditivas, é importante abordar todas as preocupações do paciente na mesma consulta. Essa abordagem esgota as demandas e aumenta a satisfação com o atendimento.", "As demandas aditivas são aquelas que o paciente traz no fim da consulta porque não acredita que o médico possa ajudá-lo. Por isso, é fundamental demonstrar interesse e acolher a nova demanda.", "A prevenção de demandas aditivas pode ser feita logo no início da consulta com perguntas como: “Há algo mais que você gostaria de discutir hoje?”. Isso permite antecipar e pactuar o que será abordado.", "Como o tempo da consulta é limitado, o médico deve estabelecer um número de queixas a serem abordadas por vez. Caso o paciente traga algo ao sair, é importante não incentivar essa prática para não comprometer o fluxo de atendimentos."], "g": "C", "ar": "Medicina Preventiva e Social", "es": "Bioética", "as_": "Comunicação e Relação Médico-Paciente", "d": "intermediario", "i": null, "x": "A alternativa C está correta. Dicas do enunciado: a queixa de insônia surge **ao final da consulta, após a fase de exploração** (demanda aditiva, \"queixa da porta\"). Como o tempo é limitado, recomenda-se **preveni-las no início**, perguntando \"há algo mais que você gostaria de discutir hoje?\", para **antecipar e pactuar** o que será abordado; se surgirem no fim, avalia-se a gravidade e se aborda ou se agenda. A: tentar abordar tudo na mesma consulta é inviável e prejudica a qualidade. B: nem sempre o motivo é descrença na ajuda, e a conduta correta não é só acolher no final. D: estabelecer limite rígido e desencorajar o paciente prejudica o vínculo e pode ignorar queixa grave.", "r": "Dohms e Gusso (orgs.), Comunicação clínica: aperfeiçoando os encontros em saúde, Artmed, 2021; Gusso e Lopes, Tratado de MFC, 2019."}, {"n": 16, "e": "Homem de 19 anos de idade, heterossexual, comparece à consulta médica solicitando um check-up geral. Ele está assintomático, mas demonstra grande preocupação com sua saúde após descobrir que um colega de trabalho mais jovem está em tratamento para colesterol alto. O paciente nega histórico familiar de doenças e afirma que realizou exames no ano passado, todos com resultados normais. Ao ser questionado sobre a possibilidade de realizar testes para infecções sexualmente transmissíveis, ele revela medo, já que frequentemente não usa preservativo, mas concorda em realizar os exames. O profissional de saúde solicita: hemograma completo, glicemia de jejum, perfil lipídico, e sorologias para HIV, sífilis, hepatite B e hepatite C. Dentre os exames solicitados, qual é o mais indicado para rastreamento no contexto apresentado?", "a": ["Hemograma completo.", "Sorologias para infecções sexualmente transmissíveis (ISTs).", "Glicemia de jejum.", "Perfil lipídico."], "g": "B", "ar": "Medicina Preventiva e Social", "es": "Epidemiologia", "as_": "Níveis e Estratégias de Prevenção", "d": "fundamental", "i": null, "x": "A alternativa B está correta. Dicas do enunciado: homem de **19 anos, assintomático, com comportamento sexual de risco (não usa preservativo)**. O rastreamento indicado é o de **IST: HIV, sífilis, hepatites B e C**, recomendado pelo PCDT para quem tem exposição sexual de risco. A: o hemograma de rotina não é rastreio em assintomático jovem. C: a glicemia de jejum entra no rastreio a partir dos 35 anos ou com fatores de risco para diabetes. D: o perfil lipídico em homem de 19 anos sem fatores de risco ou história familiar não tem indicação de rastreio, e o fato de um colega ter colesterol alto não o justifica.", "r": "PCDT para IST (Ministério da Saúde); Prevenção quaternária."}, {"n": 17, "e": "Homem de 45 anos de idade, heterossexual, negro, bancário, casado e pai de 4 filhos, procura sua equipe de Saúde da Família para uma consulta de rotina. Após uma discussão intensa com a esposa, que resultou na sua saída de casa há 5 dias, começou a apresentar palpitações intermitentes e dor de cabeça persistente. Relata dificuldades para dormir e se alimentar, mas, no momento da consulta, nega os sintomas. Não tem vícios nem histórico de doenças prévias. No exame clínico, sua Pressão Arterial (PA) foi de 150 x 89 mmHg, aferida três vezes com técnica adequada. Seu índice de massa corporal (IMC) é 24,8 kg/m². Semiologia cardíaca normal. Qual deve ser o plano de cuidados para este paciente?", "a": ["Fazer o diagnóstico de Hipertensão Arterial Sistêmica (HAS) estágio I, prescrever hidroclorotiazida 25 mg/dia e solicitar exames laboratoriais (colesterol total e frações, triglicerídeos, glicemia, exame qualitativo de urina, creatinina, eletrocardiograma e microalbuminúria).", "Fazer o diagnóstico de Hipertensão Arterial Sistêmica (HAS) estágio I, prescrever hidroclorotiazida 25 mg/dia mg/dia e marcar consulta com enfermagem para abordagem de Mudanças no Estilo de Vida (MEV).", "Reavaliar a pressão arterial em consultas subsequentes e acompanhar os sintomas relatados.", "Solicitar exames laboratoriais (colesterol total e frações, glicemia), recomendar técnicas de relaxamento e manejo do estresse, além de reavaliar a pressão arterial em consultas subsequentes."], "g": "C", "ar": "Clínica Médica", "es": "Cardiologia", "as_": "Hipertensão Arterial Sistêmica", "d": "intermediario", "i": null, "x": "A alternativa C está correta. Dicas do enunciado: **PA de 150x89 mmHg aferida na mesma consulta**, em contexto de **estresse emocional agudo** (briga, saída de casa, insônia), sem diagnóstico prévio. O **diagnóstico de HAS não se faz em uma só consulta**: é preciso **confirmar** com valores ≥ 140/90 em mais de uma ocasião, ou por MAPA/MRPA. A conduta é **reavaliar a PA em consultas subsequentes e acompanhar os sintomas**. A e B: fecham o diagnóstico e iniciam hidroclorotiazida com base em uma única consulta e em contexto de estresse. D: solicitar exames laboratoriais antes de confirmar a hipertensão é precipitado.", "r": "Diretrizes Brasileiras de Hipertensão Arterial 2020 (SBC)."}, {"n": 18, "e": "Médica de família e comunidade está acompanhando uma paciente de 35 anos de idade que mora com o marido e dois filhos. Ana foi recentemente diagnosticada com depressão moderada e iniciou tratamento com antidepressivos prescritos. Porém, após alguns meses, a paciente não demonstrou melhora significativa dos sintomas, relatando episódios contínuos de tristeza intensa e falta de energia, além de isolamento social. A médica está preocupada e sente que precisa de suporte adicional para conduzir o tratamento de forma mais eficaz. Qual deve ser a abordagem nesse momento?", "a": ["Aumentar a dose do antidepressivo e encaminhar a paciente para acompanhamento no Centro de Atenção Psicossocial (CAPS).", "Solicitar à paciente que marque uma consulta com o psiquiatra da UBS.", "Realizar uma interconsulta com um psiquiatra do CAPS para discutir o manejo do caso e possíveis ajustes no tratamento.", "Solicitar apoio matricial à equipe multiprofissional da UBS, envolvendo psiquiatra e psicólogo."], "g": "D", "ar": "Medicina Preventiva e Social", "es": "Saúde da Família", "as_": "Estratégia Saúde da Família", "d": "intermediario", "i": null, "x": "A alternativa D está correta. Dicas do enunciado: depressão moderada sem melhora com antidepressivo, e a médica de família **precisa de suporte para conduzir o caso na própria APS**. O **matriciamento (apoio matricial)** constrói o cuidado de forma **compartilhada**, com **horizontalização** entre equipe de referência e equipe de apoio (psiquiatra e psicólogo), por interconsultas, discussão de caso e projetos terapêuticos, mantendo o paciente no território. A: aumentar a dose e encaminhar ao CAPS é encaminhamento vertical, sem necessidade, pois a depressão moderada é manejada na APS. B: marcar com o psiquiatra transfere o cuidado em vez de compartilhá-lo. C: a interconsulta com o CAPS é uma ferramenta do matriciamento, mas o apoio matricial à equipe é a abordagem mais completa.", "r": "Guia prático de matriciamento em saúde mental (Ministério da Saúde, 2011); Gusso e Lopes, Tratado de MFC, 2019."}, {"n": 19, "e": "Durante uma reunião de equipe da Estratégia de Saúde da Família, a equipe médica relata que muitos pacientes têm dificuldade em acessar consultas médicas e de enfermagem, especialmente em horários mais convenientes. A equipe também observa que a maior parte das consultas é preenchida logo no início do mês, o que limita a capacidade de atender demandas espontâneas. Como resultado, muitos pacientes acabam recorrendo ao pronto-socorro local para cuidados que poderiam ser resolvidos na Atenção Primária. Qual atributo da Atenção Primária à Saúde está sendo discutido, e qual seria uma estratégia eficaz para otimizar essa situação?", "a": ["Coordenação: investir em maior articulação com os serviços de urgência para garantir o seguimento dos pacientes na UBS.", "Integralidade: ampliar os serviços disponíveis na UBS, como grupos de educação em saúde e atendimento psicológico, para oferecer mais opções de cuidado.", "Acesso: reorganizar a agenda da equipe para reservar um percentual de consultas de demanda espontânea no mesmo dia.", "Longitudinalidade: incentivar consultas programadas e acompanhamento sistemático para evitar idas desnecessárias ao pronto-socorro."], "g": "C", "ar": "Medicina Preventiva e Social", "es": "Saúde da Família", "as_": "Estratégia Saúde da Família", "d": "fundamental", "i": null, "x": "A alternativa C está correta. Dicas do enunciado: **dificuldade de acessar consultas**, agenda lotada no início do mês e pacientes recorrendo ao pronto-socorro: problema de **acesso (primeiro contato)**, com componentes geográfico e **sócio-organizacional** (agenda, horários). A estratégia é **reorganizar a agenda, reservando um percentual de consultas para demanda espontânea no mesmo dia**. A: a coordenação trata da integração entre pontos da rede. B: a integralidade amplia a oferta de ações, e o problema descrito é de agenda. D: a longitudinalidade é a continuidade do vínculo, e mais consultas programadas lotariam ainda mais a agenda.", "r": "Gusso e Lopes, Tratado de MFC, 2019; Starfield, Atenção Primária."}, {"n": 20, "e": "Mulher de 65 anos de idade comparece à consulta de rotina na UBS após assistir a uma reportagem na TV sobre a importância do rastreamento de câncer de mama. A reportagem enfatizou que mulheres que realizam mamografias anuais vivem muito mais tempo após o diagnóstico do câncer do que aquelas que descobrem a doença apenas quando apresentam sintomas. Preocupada, quer saber se deveria realizar mamografias com mais frequência do que o recomendado. Qual viés pode estar presente na interpretação apresentada pela reportagem?", "a": ["Viés de prevalência, em que os casos mais comuns são mais detectados, mas isso não implica maior incidência de novos casos na população.", "Viés de tempo de antecipação, em que o rastreamento precoce aumenta o tempo que a pessoa vive com o diagnóstico, mas não necessariamente aumenta a expectativa de vida.", "Viés de seleção, em que as pessoas que escolhem fazer exames regularmente são mais saudáveis do que aquelas que não o fazem, distorcendo os resultados.", "Viés de memória, em que os pacientes com diagnóstico de câncer lembram-se mais claramente de seus sintomas prévios do que os que não foram diagnosticados."], "g": "B", "ar": "Medicina Preventiva e Social", "es": "Epidemiologia", "as_": "Níveis e Estratégias de Prevenção", "d": "intermediario", "i": null, "x": "A alternativa B está correta. Dicas do enunciado: a reportagem afirma que mulheres que fazem mamografia anual **vivem mais tempo após o diagnóstico**. Se a sobrevida é contada **a partir do diagnóstico**, a doença descoberta mais cedo parece durar mais, mesmo sem prolongar a vida: é o **viés de tempo de antecipação (lead-time bias)**. A: o viés de prevalência (de prevalência-incidência) não é o que explica a diferença de sobrevida. C: o viés de seleção (efeito do voluntário saudável) também pode existir, e o gabarito considera o lead-time o mais evidente no trecho. D: o viés de memória ocorre em estudos de caso-controle, quando os doentes lembram melhor de exposições.", "r": "Gusso e Lopes, Tratado de MFC, 2019; Ministério da Saúde, Caderno de Atenção Primária nº 29, Rastreamento."}, {"n": 21, "e": "A médica de família e comunidade (MFC) em uma UBS na periferia de São Paulo e a enfermeira notaram que os pacientes com diabetes na área estavam enfrentando dificuldades para manter um bom controle glicêmico. Após investigar, descobriram que muitos desses pacientes viviam em uma região com poucas praças e parques. Conversando com os Agentes Comunitários de Saúde (ACSs), identificaram uma demanda local por mais áreas verdes. Em resposta, decidiram que o educador físico da unidade começaria a oferecer grupos de atividade física na UBS semanalmente. Qual atributo da Atenção Primária à Saúde (APS) está mais evidente no trabalho de gestão descrito?", "a": ["Entendendo a pessoa como um todo", "Orientação para a comunidade", "Integralidade", "Competência cultural"], "g": "B", "ar": "Medicina Preventiva e Social", "es": "Saúde da Família", "as_": "Estratégia Saúde da Família", "d": "intermediario", "i": null, "x": "A alternativa B está correta. Dicas do enunciado: a equipe **identificou uma necessidade da comunidade** (falta de áreas verdes e de atividade física) e **tomou medidas para atendê-la** (grupos de atividade física na UBS): **orientação para a comunidade**, atributo derivativo de Starfield, que reconhece as necessidades e o contexto social da população atendida. A: entender a pessoa como um todo é foco no indivíduo, e aqui o foco é coletivo. C: a integralidade é a oferta de ações abrangentes, não a resposta a uma necessidade comunitária. D: a competência cultural é a adaptação a subpopulações com culturas distintas, que não é o foco do caso.", "r": "Starfield B, Atenção Primária: equilíbrio entre necessidades de saúde, serviços e tecnologia (UNESCO/MS, 2002)."}, {"n": 22, "e": "Mulher de 23 anos de idade é mãe de um recém-nascido (RN) que nasceu a termo com 39 semanas, pesando 3045g, e teve alta com 3 dias de vida. O bebê apresentou perda de peso inicial (2800g na alta) e, aos 7 dias de vida, a mãe relatou dificuldade na amamentação, com dor nas mamas. O bebê estava fazendo 3 trocas diárias de fralda e pesava 2680g. A enfermeira orientou sobre a técnica de pega e recomendou ordenha e oferta de leite materno após cada mamada, com reavaliação pelo médico em 3 dias. Na consulta médica, a mãe relatou melhora na técnica de pega e manutenção das evacuações. O peso do bebê aumentou para 2700g e ele estava mamando bem. Qual deve ser a conduta?", "a": ["Encaminhar ao pronto-socorro", "Prescrever soro de reidratação oral", "Suplementar com fórmula láctea", "Reforçar orientação de pega e ordenha"], "g": "C", "ar": "Pediatria", "es": "Crescimento e Desenvolvimento", "as_": "Puericultura", "d": "intermediario", "i": null, "x": "A alternativa C está correta. Dicas do enunciado: RN de 3.045 g que **aos 7 dias pesa 2.680 g (perda de cerca de 12%)** e, **após a correção da técnica de pega e a ordenha, ganhou apenas 20 g em 3 dias (2.700 g)**: perda superior a 10% do peso de nascimento e **recuperação insuficiente**, apesar das medidas iniciais. A indicação é a **suplementação com fórmula láctea** (ou leite ordenhado), mantendo o estímulo à amamentação. A: não há sinais clínicos graves (desidratação, letargia) que justifiquem o pronto-socorro. B: o problema é nutricional, e não de desidratação isolada. D: as orientações já foram feitas e foram insuficientes para o ganho de peso.", "r": "Ministério da Saúde, Saúde da criança: crescimento e desenvolvimento (2012); ABM Clinical Protocol #3 (2017)."}, {"n": 23, "e": "Um estudo avaliou incidência de hipertensão em servidores públicos de 35 a 78 anos na Inglaterra. Os participantes foram acompanhados por um total de 12 meses. A tabela abaixo mostra os resultados do estudo para três cidades inglesas. Cidade, N, Pessoas-ano em risco, Novos casos de hipertensão, Prevalência de hipertensão: Bath, 1.016, 470, 47, 220; Bradford, 944, 450, 18, 165; Bristol, 895, 374, 6, 96. Considerando os dados da tabela acima, qual é a taxa de incidência de hipertensão durante o período do estudo para a cidade de Bradford?", "a": ["10 casos por 1.000 pessoas-ano", "366,6 casos por 1.000 pessoas-ano", "40 casos por 1.000 pessoas-ano", "468 casos por 1.000 pessoas-ano"], "g": "C", "ar": "Medicina Preventiva e Social", "es": "Epidemiologia", "as_": "Medidas de Frequência e Associação", "d": "fundamental", "i": "Tabela com N, pessoas-ano em risco, novos casos e prevalência de hipertensão em três cidades", "x": "A alternativa C está correta. Dicas do enunciado: a **taxa de incidência = novos casos / pessoas-ano em risco**. Para Bradford: **18 / 450 = 0,04**, ou **40 casos por 1.000 pessoas-ano**. A: 10 por 1.000 não corresponde a nenhuma razão da tabela de Bradford. B: 366,6 não resulta do cálculo. D: 468 por 1.000 não tem relação com 18 casos em 450 pessoas-ano; os valores de prevalência (165) e o N (944) não entram na taxa de incidência.", "r": "Medronho, Epidemiologia."}, {"n": 24, "e": "Um estudo avaliou 70 pacientes diagnosticados com enxaqueca em uma unidade de saúde e 70 pacientes livres de enxaqueca que frequentaram a mesma unidade de saúde. Os pacientes foram entrevistados e foram obtidas informações sobre características sociodemográficas, estilo de vida e fatores de risco para doença cardiovascular. Os pacientes também forneceram amostras de sangue para dosagem de vitamina D. Pacientes diagnosticados com enxaqueca possuíam concentração de vitamina D sérica mais baixa do que pacientes livres de enxaqueca e foi encontrada uma associação entre baixos níveis séricos de vitamina D e chance de enxaqueca. Identifique o tipo de estudo epidemiológico e a medida de associação utilizada para descrever a relação entre vitamina D sérica e enxaqueca.", "a": ["Estudo de caso-controle e razão de chances", "Ensaio clínico e razão de chances", "Estudo de caso-controle e razão de prevalência", "Ensaio clínico e razão de prevalência"], "g": "A", "ar": "Medicina Preventiva e Social", "es": "Epidemiologia", "as_": "Desenhos de Estudo Epidemiológico", "d": "fundamental", "i": null, "x": "A alternativa A está correta. Dicas do enunciado: o estudo **seleciona 70 pacientes com enxaqueca (casos) e 70 sem (controles)** e compara a exposição (vitamina D baixa), com resultado em termos de **\"chance\" de enxaqueca**: **caso-controle**, cuja medida de associação é a **razão de chances (odds ratio)**. B e D: o ensaio clínico exige intervenção randomizada do pesquisador, que não houve. C: a razão de prevalência é medida de estudos transversais, e o caso-controle não estima prevalência.", "r": "Medronho, Epidemiologia; Togha et al., Headache 2018."}, {"n": 25, "e": "JCD, 10 anos portador de diabetes tipo 1 desde 6 anos, deu entrada às 7:30 com queixa respiratória e dor de garganta importante, porém sem febre. Foi iniciado tratamento para CAD após preencher critérios diagnósticos e na 5ª hora foi instalado SM 100/30/20 (SG5/NaCl20%/KCl19,1%) por aceitação ruim da dieta até a 12ª hora, quando aceitou melhor a dieta. Você evoluiu o paciente que encontra-se em BEG, eupneico, acianótico e anictérico. Boa perfusão periférica. Ausculta pulmonar e cardíaca normais. FC 120 bpm; FR 26 ipm; PA 100X65; TEC 2seg. Aceitando dieta bem. Tabela de evolução: na entrada glicemia 358, pH 7,12, bicarbonato 5,0; na 13ª hora glicemia 255, Na 134, K 3,9 mEq/L, pH 7,31 e bicarbonato 18,1, pCO2 36, com cetonemia ausente; uso de insulina lispro (0,1 U/kg) a cada 2 horas. Qual deve ser a sua conduta após avaliar os exames da 13ª hora do início do tratamento?", "a": ["Paciente ainda não saiu da CAD. Manter insulina SC a cada 2 horas + iniciar reposição de potássio até preencher critérios de saída da CAD.", "Paciente saiu da CAD. Iniciar NPH+ liberar dieta rica em potássio e não prescrever insulina SC ultrarrápida.", "Paciente saiu da CAD. Iniciar NPH + reposição de potássio via oral+ dieta + insulina ultrarrápida se necessário.", "Paciente não saiu da CAD. Manter esquema de insulina ultrarrápida usado e liberar dieta rica em potássio até a introdução da NPH."], "g": "C", "ar": "Clínica Médica", "es": "Endocrinologia", "as_": "Diabetes Mellitus", "d": "avancado", "i": "Tabela de exames seriados da evolução da cetoacidose (da entrada à 13ª hora)", "x": "A alternativa C está correta. Dicas do enunciado: nos critérios de resolução de CAD **pediátrica**, a glicemia não faz parte. Os critérios são **pH > 7,30, bicarbonato > 15 mEq/L, cetonemia < 1 mmol/L ou ânion gap < 18**. Na 13ª hora, **pH 7,31 e bicarbonato 18,1**: a CAD está resolvida. A conduta é **iniciar a insulina NPH** (característica neutra) quando o pH está neutro (> 7,30), com **reposição de potássio por via oral** (K⁺ 3,9 é baixo para o total corporal depletado) e dieta, mantendo **insulina ultrarrápida se necessário**, pois ainda há hormônios contrarreguladores elevados nas primeiras 24 horas. A e D: o paciente já saiu da CAD. B: não prescrever ultrarrápida pode deixar a glicemia sem controle nas primeiras 24 horas, e dieta rica em potássio não basta para repor a depleção.", "r": "ISPAD Guidelines 2022 (Diabetic Ketoacidosis); Diretriz da SBD e da SBP."}, {"n": 26, "e": "Criança de 12 anos de idade tem colapso súbito enquanto praticava esportes. Ela não responde, não respira e não tem pulso (palpado por 5 segundos). O SAMU é chamado e RCP é iniciada. Chega um desfibrilador externo automático. Qual deve ser a conduta?", "a": ["Checar o pulso rapidamente e aplicar o desfibrilador.", "Terminar o ciclo de RCP completando 2 minutos.", "Terminar o ciclo de RCP e checar o pulso em até 10 segundos.", "Aplicar o desfibrilador."], "g": "D", "ar": "Pediatria", "es": "Emergências Pediátricas", "as_": "Insuficiência Respiratória e PCR em Pediatria", "d": "fundamental", "i": null, "x": "A alternativa D está correta. Dicas do enunciado: **colapso súbito em atleta de 12 anos, sem pulso, em RCP**, com **DEA disponível**. Pelas diretrizes da AHA 2020, quando o desfibrilador chega a **prioridade é parar o que se faz e conectá-lo** (**aplicar o desfibrilador**) o mais rápido possível, sem terminar o ciclo e sem nova checagem de pulso, pois a causa provável é arritmia chocável. A: checar pulso novamente atrasa o choque. B e C: terminar o ciclo de 2 minutos, ou checar pulso, atrasa a desfibrilação sem benefício.", "r": "PALS, American Heart Association 2020."}, {"n": 27, "e": "Criança de 9 meses de idade não responde, não respira e pulso axilar fraco. Está sendo realizada RCP de alta qualidade e o monitor cardíaco mostra o ritmo abaixo (ritmo organizado em bradicardia).", "a": ["Administração de 0,02 mg/kg de atropina intra-óssea ou intravenosa", "Administração de 0,01 mg/kg de epinefrina intra-óssea ou intravenosa", "Colocação de marcapasso transtorácico", "Intubação orotraqueal"], "g": "B", "ar": "Pediatria", "es": "Emergências Pediátricas", "as_": "Insuficiência Respiratória e PCR em Pediatria", "d": "intermediario", "i": "Traçado de ECG com bradicardia e complexos QRS organizados", "x": "A alternativa B está correta. Dicas do enunciado: lactente de 9 meses **sem resposta, sem respiração e pulso fraco** com **bradicardia sintomática (FC < 60 com baixa perfusão)**, já em **RCP de alta qualidade**. Dicas da imagem: ritmo organizado e lento. Pelo PALS, garante-se ventilação com bolsa-válvula-máscara e, se a FC não melhora, inicia-se RCP e segue-se o fluxograma da **parada em ritmo não chocável, com epinefrina 0,01 mg/kg IV/IO**. A: a atropina é considerada em bradicardia por tônus vagal, e não é o próximo passo em RCP. C: o marcapasso transtorácico é raramente usado e não tem papel nesse momento. D: a via aérea avançada é feita sem interromper a RCP, mas a epinefrina é a prioridade.", "r": "PALS, American Heart Association 2020."}, {"n": 28, "e": "Um pré-escolar de 3 anos de idade é levado ao pronto-socorro após um episódio de convulsão focal que evoluiu para uma convulsão tônico-clônica generalizada. A mãe relata que a criança teve uma infecção respiratória recente. No exame clínico, a criança está sonolenta, responde a estímulos dolorosos e apresenta sinal de Brudzinsky positivo. A tomografia computadorizada de crânio é normal. Qual deve ser a conduta?", "a": ["Iniciar antibióticos intravenosos", "Realizar uma punção lombar", "Administrar uma dose de midazolam", "Observar e reavaliar em 24 horas"], "g": "B", "ar": "Clínica Médica", "es": "Infectologia", "as_": "Meningites", "d": "intermediario", "i": null, "x": "A alternativa B está correta. Dicas do enunciado: **convulsão focal que se generaliza, sonolência e sinal de Brudzinski positivo** (irritação meníngea) após infecção respiratória: **meningite ou encefalite** até prova em contrário. A **TC de crânio normal** exclui efeito de massa, e a conduta é a **punção lombar** para analisar o líquor e definir a infecção do SNC. A: iniciar antibiótico antes do líquor perde o diagnóstico, e na prática se coletam culturas e inicia-se o tratamento sem atrasar; entre as alternativas, a investigação é o ponto. C: o midazolam trata a crise ativa, que já cessou. D: observar por 24 horas, com sinais meníngeos, é inseguro.", "r": "Diretrizes de Meningites (Ministério da Saúde); IDSA Bacterial Meningitis Guidelines."}, {"n": 29, "e": "Criança de 7 anos de idade, com história de tratamento por infecção de pele com administração de antibiótico há 1 mês. Mãe leva a criança para atendimento médico por quadro de edema palpebral e de membros inferiores há 3 dias. Apresenta diurese escurecida há 2 dias. Exame clínico: bom estado geral, corado e acianótico. CV: BRNM em 2T, sem sopros audíveis, TEC 2 segundos, FC: 120 bpm, PA acima do percentil 95 para idade e estatura. AP: MV presente, sem ruídos adventícios, FR: 20 irpm, sem sinais de desconforto respiratório e SatO2 95% em ar ambiente. Abdome: flácido, sem visceromegalias, indolor à palpação e RH presente. Edema palpebral e de membros inferiores 2+/4+. Exames laboratoriais: Urina tipo 1: proteína +/4+, leucócitos 50 por campo e hemácias incontáveis. Qual deve ser a conduta?", "a": ["Prednisolona", "Cefalexina", "Furosemida", "Nitroprussiato de sódio"], "g": "C", "ar": "Clínica Médica", "es": "Nefrologia", "as_": "Síndromes Glomerulares", "d": "fundamental", "i": null, "x": "A alternativa C está correta. Dicas do enunciado: **infecção de pele há 1 mês**, seguida de **edema palpebral e de membros, urina escura (hematúria), hipertensão e proteinúria leve**: **síndrome nefrítica (glomerulonefrite pós-estreptocócica)**. Hipertensão e edema decorrem da **reabsorção hidrossalina**, e o tratamento é de **suporte, com diurético de alça (furosemida)** e restrição de sal. A: o corticoide é da síndrome nefrótica, não da nefrítica pós-infecciosa. B: o antibiótico não tem efeito, pois a infecção já foi tratada e a lesão é imunomediada. D: o nitroprussiato é para emergência hipertensiva com lesão de órgão-alvo, que não há.", "r": "KDIGO 2021 Glomerular Diseases; Tratado de Pediatria SBP."}, {"n": 30, "e": "Menina de 3 anos de idade, previamente hígida, dá entrada no Pronto Socorro trazida pela mãe que informa que a filha passa os finais de semana com o pai e que tem retornado muito tímida, além de chorar antes de ir para a casa do pai. Mãe refere que, ao dar banho na filha, notou lesão lacerada em vulva. Em relação ao caso, é correto afirmar que:", "a": ["Está indicado o uso de ceftriaxona para profilaxia de gonococo e azitromicina para profilaxia de clamídia.", "É recomendada a introdução de PEP (profilaxia pós exposição ao HIV) em todos os casos de suspeita de violência sexual com penetração.", "Deve-se recomendar que a mãe abra boletim de ocorrência, sem o qual não é possível dar continuidade nas profilaxias pós exposição.", "Caso com suspeita de violência sexual, para evitar maiores traumas, deve ser feito exame físico resumido e encaminhar para serviço de atendimento especializado para realizar o exame físico completo."], "g": "A", "ar": "Pediatria", "es": "Emergências Pediátricas", "as_": "Suspeita de Maus-tratos Infantis", "d": "intermediario", "i": null, "x": "A alternativa A está correta pelo gabarito oficial. Dicas do enunciado: criança de 3 anos com **retraimento, choro antes de ir para a casa do pai e lesão lacerada em vulva**: **suspeita de violência sexual**. Pelo gabarito, a **profilaxia para IST** inclui **ceftriaxona (gonococo) e azitromicina (clamídia)**, junto de outras medidas. B: a PEP para HIV **não se indica em todos os casos**: avalia-se risco (exposição, tempo e agressor). C: o **boletim de ocorrência não é exigido** para a profilaxia e o atendimento. D: o exame físico deve ser **completo no próprio serviço**, para procurar outras lesões e cuidados urgentes, e não resumido. Observação: o protocolo atual do Ministério da Saúde é mais detalhado quanto às profilaxias.", "r": "Ministério da Saúde, Atenção humanizada às pessoas em situação de violência sexual; PCDT para IST (2022)."}, {"n": 31, "e": "Lactente de 1 ano e 6 meses dá entrada no pronto socorro sonolento. Levado à sala de emergência, com SatO2 85%, FR 12 ipm, respiração superficial. Qual dispositivo é mais adequado para ofertar O2 a esse paciente?", "a": ["Máscara não reinalante", "Cateter nasal de alto fluxo", "Ventilação não invasiva", "Ventilação com bolsa-válvula-máscara"], "g": "D", "ar": "Pediatria", "es": "Emergências Pediátricas", "as_": "Insuficiência Respiratória e PCR em Pediatria", "d": "fundamental", "i": null, "x": "A alternativa D está correta. Dicas do enunciado: lactente **sonolento, com SatO2 85%, FR 12 (bradipneia) e respiração superficial**: **insuficiência respiratória com falência ventilatória**. É preciso **ventilar com pressão positiva**, ou seja, **bolsa-válvula-máscara**, enquanto se prepara a via aérea avançada. A: a máscara não reinalante oferece oxigênio, mas não ventila quem respira mal. B: o cateter de alto fluxo ajuda quem tem esforço respiratório, não em respiração superficial e rebaixamento. C: a ventilação não invasiva é contraindicada com rebaixamento do nível de consciência.", "r": "PALS, American Heart Association 2020; Tratado de Pediatria SBP."}, {"n": 32, "e": "Menino, 14 anos de idade, proveniente de São Paulo. Diabético em uso de NPH (20U-8U-5U). Refere febre não aferida ontem associada a vômitos (hoje 10X) e dor abdominal. Desde às cinco horas da manhã começou a ficar com a respiração rápida, hálito lembrando fruta apodrecida e grande mal-estar. EF: Regular estado geral, sonolento, afebril, anictérico, desidratado +++. Extremidades frias, taquipneico+++; TEC de 5 segs, pulso fino. FC 140 bpm; FR 40 ipm; PA 100 X 60 mmHg. Na avaliação inicial, podemos afirmar que:", "a": ["Paciente encontra-se em choque compensado, pois apresenta envolvimento de órgão alvo (sonolência, TEC e FC aumentados e PA sistólica maior do que Pe 5%).", "Paciente encontra-se em choque descompensado, pois apresenta envolvimento de órgão alvo (sonolência, TEC e FC aumentados, pulso fino e PA sistólica menor do que Pe 5%).", "Paciente apresenta quadro provável de CAD e o tratamento deve ser focado na utilização de insulinoterapia antes da hidratação e a hidratação deve ser lenta para evitar edema cerebral.", "Paciente encontra-se em CAD com choque compensado e o devido a isso a prioridade é o tratamento com insulina endovenosa contínua desde a primeira hora e deixar com soro de manutenção nas próximas 48 horas estimando o volume perdas."], "g": "A", "ar": "Clínica Médica", "es": "Endocrinologia", "as_": "Diabetes Mellitus", "d": "intermediario", "i": null, "x": "A alternativa A está correta. Dicas do enunciado: diabético com **vômitos, respiração rápida e profunda (Kussmaul), hálito cetônico**: **cetoacidose diabética**. Há **sonolência, TEC de 5 s, FC de 140, pulso fino e extremidades frias**, mas **PA de 100x60**, acima do p5 para a idade (> 90 mmHg): **choque compensado**, com envolvimento de órgão-alvo. B: a PA sistólica está acima do percentil 5, o que afasta o choque descompensado (hipotensivo). C: a insulina **não deve ser iniciada antes da primeira hora de expansão volêmica**. D: o erro está em usar insulina na primeira hora, o que aumenta o risco de mortalidade e de edema cerebral, e em estimar a reposição em 48 horas sem tratar a perfusão.", "r": "ISPAD Guidelines 2022 (Diabetic Ketoacidosis); PALS."}, {"n": 33, "e": "Criança de 8 anos de idade, é trazido pelo pai ao Pronto Socorro em um plantão noturno de sábado. Refere vômitos há 5 dias, associado a dor abdominal. Não sabe referir febre, nem diarreia. Não mora com a criança. Hoje acordou devido a vômitos e urinou na roupa durante a noite. Ao exame físico encontra-se desidratado. PA: 90/70 mmHg. FC: 135. Temperatura: 37,2 C. Perfusão periférica boa. Qual deve ser a conduta?", "a": ["Medicar para vômitos, esperar e oferecer líquidos por via oral", "Medicar para vômitos, fazer uma expansão endovenosa, liberar e orientar medidas para diarreia", "Fazer uma expansão endovenosa, fazer glicemia de ponta de dedo", "Chamar especialista da gastropediatria."], "g": "C", "ar": "Pediatria", "es": "Emergências Pediátricas", "as_": "Desidratação na Infância", "d": "intermediario", "i": null, "x": "A alternativa C está correta. Dicas do enunciado: **vômitos por 5 dias, dor abdominal, sem febre nem diarreia, urina na roupa à noite (enurese nova/poliúria)** e desidratação: o quadro não sugere gastroenterite, e deve-se pensar em **cetoacidose diabética** como primeira manifestação. A conduta é **realizar a expansão endovenosa e medir a glicemia capilar**. A: medicar e oferecer líquido oral deixa de investigar uma causa grave. B: liberar com orientação para diarreia, sem avaliação, é inseguro. D: chamar a gastropediatria atrasa uma conduta que é imediata.", "r": "ISPAD Guidelines 2022; Tratado de Pediatria SBP."}, {"n": 34, "e": "Criança de 4 semanas de vida sem antecedentes relevantes apresenta icterícia, acolia fecal e colúria. O exame físico apresenta abdome globoso, com fígado palpável de bordas rombas. Um ultrassom solicitado demonstra triângulo fibroso próximo à ramificação portal. Após a confirmação diagnóstica, qual deve ser a conduta?", "a": ["Drenagem transparieto-hepática.", "Transplante hepático.", "Hepatectomia não regrada.", "Portoenteroanastomose."], "g": "D", "ar": "Pediatria", "es": "Neonatologia", "as_": "Icterícia Neonatal", "d": "fundamental", "i": null, "x": "A alternativa D está correta. Dicas do enunciado: lactente de 4 semanas com **icterícia tardia, acolia fecal, colúria**, fígado de bordas rombas e **sinal do cordão ou triângulo fibroso à USG**: **atresia de vias biliares**. O tratamento inicial é a **portoenteroanastomose (cirurgia de Kasai)**, de preferência antes dos 60 dias de vida. A: a drenagem transparieto-hepática não trata a atresia. B: o transplante hepático é reservado a falha do Kasai ou cirrose avançada. C: a hepatectomia não regrada não tem indicação nessa doença.", "r": "Tratado de Pediatria SBP; Diretrizes de colestase neonatal (SBP/SBH)."}, {"n": 35, "e": "Neonato com antecedente de polidrâmnio submetido à RX de tórax (abaixo) por tosse desde o nascimento. Qual é o diagnóstico?", "a": ["Síndrome da Aspiração Meconial", "Atresia de Esôfago", "Pneumonia Neonatal", "Pneumotórax"], "g": "B", "ar": "Pediatria", "es": "Neonatologia", "as_": "Malformações Digestivas Congênitas (Atresias, Má-rotação, VACTERL)", "d": "intermediario", "i": "Radiografia de tórax de RN com sonda enrolada no esôfago proximal e ausência de bolha gástrica", "x": "A alternativa B está correta. Dicas do enunciado: **polidrâmnio** (o feto não deglute o líquido) e **tosse desde o nascimento** (aspiração de saliva). Dicas da imagem: **sonda de aspiração enrolada no esôfago proximal** e **estômago sem bolha de ar**, o que sugere **atresia de esôfago sem fístula**. A: a síndrome de aspiração meconial ocorre em RN com líquido meconial e cursa com desconforto, sem sonda enrolada. C: a pneumonia neonatal não explica o polidrâmnio nem a sonda. D: o pneumotórax mostra hipertransparência com colapso pulmonar, não esse achado.", "r": "Tratado de Pediatria SBP; Nelson, Textbook of Pediatrics."}, {"n": 36, "e": "Menino de 5 anos é levado ao pronto socorro devido a “manchas na pele”, conforme a imagem abaixo e gengivorragia de pequena monta hoje. A mãe refere que está em bom estado geral, ativo, com boa aceitação de dieta e diurese preservada. Nega febre, adinamia, histórico de discrasia sanguínea. Refere ter recebido a vacina da gripe há 3 semanas. Considerando a principal hipótese diagnóstica, qual exame complementar é necessário para o diagnóstico e seu respectivo tratamento?", "a": ["Hemograma completo. Observação para casos leves e corticosteróide/imunoglobulina para casos mais graves", "Coagulograma (TTPA). Reposição de fator VIII", "Hemograma completo. Transfusão de plaquetas", "Teste de agregação plaquetária com ristocetina. Reposição do fator de von Willebrand"], "g": "A", "ar": "Clínica Médica", "es": "Hematologia", "as_": "Distúrbios da Hemostasia", "d": "fundamental", "i": "Fotografia de petéquias e equimoses nas pernas", "x": "A alternativa A está correta. Dicas do enunciado: criança em **bom estado geral, ativa, sem febre**, com **petéquias, equimoses e gengivorragia leve** cerca de **3 semanas após um gatilho (vacina)**, sem história prévia de sangramento: **púrpura trombocitopênica imune (PTI)**. O diagnóstico é feito pelo **hemograma, com plaquetopenia isolada**, e o tratamento é **observação nos casos leves** e **corticoide ou imunoglobulina** nos mais graves. B: o TTPA e o fator VIII são da hemofilia A, que cursa com hematomas e hemartroses. C: a transfusão de plaquetas é reservada a ameaça à vida (choque, sangramento do SNC). D: o teste com ristocetina e o fator de von Willebrand são da doença de von Willebrand.", "r": "ASH 2019 Guidelines for ITP; Tratado de Pediatria SBP."}, {"n": 37, "e": "Em um paciente submetido à quimioterapia há 2 dias, e que procura um serviço médico com queixa de tosse e febre (38,1C 2 picos), que informa sintomas gripais em outros membros da família, e cujo hemograma mostra 2500 leucócitos sem contagem diferencial é correto afirmar:", "a": ["A coleta do painel viral (RT-PCR) está indicada, visando reduzir o uso desnecessário de antimicrobiano", "Um Rx de tórax deve ser realizado, apesar da falta de achados clínicos pulmonares no exame e saturação em ar ambiente normal", "Como nao existe neutropenia grave (HMG = 2500 leucocitos), exames complementares são desnecessários", "A PCR deve ser colhida precocemente, a fim de dirigir o esquema terapêutico proposto"], "g": "B", "ar": "Clínica Médica", "es": "Hematologia", "as_": "Neoplasias Hematológicas", "d": "intermediario", "i": null, "x": "A alternativa B está correta. Dicas do enunciado: paciente em **quimioterapia há 2 dias, com febre e tosse** e leucócitos de 2.500 sem diferencial: **neutropenia febril** até prova em contrário. A avaliação inicial inclui **hemograma, PCR, hemocultura (periférica e de acessos), urina e urocultura e radiografia de tórax** se houver sintomas respiratórios; no neutropênico os sinais pulmonares são pobres, e a radiografia deve ser feita mesmo com exame normal. A: o painel viral é útil, mas não substitui a investigação nem a cobertura antimicrobiana. C: 2.500 leucócitos sem diferencial não excluem neutropenia grave, e exames complementares são necessários. D: a PCR faz parte da investigação, mas não dirige o esquema terapêutico.", "r": "IDSA 2010, Febrile Neutropenia; Diretrizes SOBOPE."}, {"n": 38, "e": "Lactente de 12 meses é trazido pelo SAMU com história de crise convulsiva tônica clônica após queda da própria altura. Mãe informa que paciente estava tentando andar. Mãe também informa que está investigando doença que causa hemorragia (não lembra o nome). Ao exame clínico: Glasgow 12, pupilas isocóricas, PA: 90/60 mmHg. FC 114 b.p.m. Sem rigidez de nuca. Encaminhado ao setor de tomografia, após acesso endovenoso e garantia de via aérea pérvia, para realização de tomografia de crânio. Paciente apresenta nova crise tônico clônica generalizada. Neurocirurgia é chamado e quer realizar a drenagem. Qual é o diagnóstico tomográfico e a conduta adequada?", "a": ["Hematoma extradural. Manter via aérea e aguardar neurologista pediátrico e hematologista", "Hematoma extradural. Prescrever fenitoína para evitar nova crise", "Hematoma subdural. Prescrever 10 ml/kg de plasma fresco e fenitoína", "Hematoma subdural. Prescrever complexo protrombínico (fatores II,V, VII, IX, X), e fenitoína, liberar para cirurgia"], "g": "D", "ar": "Clínica Médica", "es": "Hematologia", "as_": "Distúrbios da Hemostasia", "d": "avancado", "i": "TC de crânio com coleção hiperdensa em meia-lua na convexidade (hematoma subdural)", "x": "A alternativa D está correta. Dicas do enunciado: lactente com **crises convulsivas após trauma de baixo impacto** (queda da própria altura) e **mãe investigando doença que causa hemorragia**: sugere **hemofilia**. Dicas da imagem: coleção em meia-lua: **hematoma subdural**. Na hemofilia com TCE, **repõe-se o fator antes mesmo da tomografia**; na falta do fator, usa-se **complexo protrombínico**. Com crises sucessivas sem recuperação da consciência, indica-se **fenitoína** e **drenagem cirúrgica** por neurocirurgia. A e B: é hematoma subdural, e esperar ou só usar fenitoína não trata a hemorragia. C: o plasma fresco é opção só se faltarem fator e complexo protrombínico, com efeito bem menor.", "r": "Diretrizes de hemofilia (WFH 2020; Ministério da Saúde); ATLS Pediátrico."}, {"n": 39, "e": "Lactente de 5 meses trazido ao pronto socorro por hipoatividade e febre não aferida há 1 dia. Na admissão, apresenta-se em REG, descorado ++/4, taquidispneico com tiragem intercostal, FR 54 ipm, saturação em ar ambiente 91%, MV presentes sem ruídos adventícios, FC 170 bpm, tempo de enchimento capilar 6 segundos, pulso periférico fino, pulso central cheio, pressão arterial 50 x 20 mm Hg, fígado no rebordo costal, temperatura 39°C. Qual deve ser conduta?", "a": ["Iniciar com soro fisiológico 20 ml/ kg.", "Iniciar norepinefrina EV contínua pelo choque séptico hipotensivo.", "Iniciar corticoide pelo risco de insuficiência adrenal.", "Prescrever droga vasoativa, epinefrina devido a gravidade do quadro."], "g": "A", "ar": "Clínica Médica", "es": "Medicina de Emergência", "as_": "Choque e Ultrassom à Beira do Leito", "d": "intermediario", "i": null, "x": "A alternativa A está correta. Dicas do enunciado: lactente com **febre, TEC de 6 s, pulso fino, hipotensão (50x20) e taquicardia**, **fígado no rebordo costal** (sem hepatomegalia) e **sem ruídos pulmonares**: **choque séptico sem sinais de hipervolemia**. A reposição volêmica deve vir **antes da droga vasoativa**, em alíquotas de **10 a 20 mL/kg**, com reavaliação de tolerância e resposta a cada expansão. B e D: a droga vasoativa é iniciada se o choque persistir após a reposição volêmica, e não antes de tentar expandir. C: o corticoide é indicado no choque refratário, com suspeita de insuficiência adrenal, depois da ressuscitação inicial.", "r": "Surviving Sepsis Campaign Pediatric Guidelines 2020; PALS."}, {"n": 40, "e": "Lactente de 5 meses trazido ao pronto socorro por hipoatividade e febre não aferida há 1 dia. Na admissão, apresenta-se em REG, descorado ++/4, taquidispneico com tiragem intercostal, FR 54 ipm, saturação em ar ambiente 91%, MV presentes sem ruídos adventícios, FC 170 bpm, tempo de enchimento capilar 6 segundos, pulso periférico fino, pulso central cheio, pressão arterial 50 x 20 mm Hg, fígado no rebordo costal, temperatura 39°C. É correto afirmar que:", "a": ["A intubação orotraqueal precoce está indicada devido à instabilidade hemodinâmica.", "A inserção imediata de máscara laríngea pode ser considerada em função do choque.", "A obtenção da via aérea avançada pode ser indicada após a estabilização cardiovascular.", "Não há necessidade de antecipar o preparo para a obtenção de via aérea avançada pelo choque hipotensivo."], "g": "C", "ar": "Clínica Médica", "es": "Medicina de Emergência", "as_": "Choque e Ultrassom à Beira do Leito", "d": "avancado", "i": null, "x": "A alternativa C está correta. Dicas do enunciado: lactente em **choque séptico hipotensivo com SatO₂ de 91% e esforço respiratório**, mas **respirando, com drive**. O ideal é **estabilizar hemodinamicamente antes da via aérea avançada**, pois os fármacos da sequência rápida podem causar parada em quem está instável; a intubação é feita **após a estabilização cardiovascular**. A: intubar precocemente com instabilidade aumenta o risco de PCR, e a via aérea avançada não é prioridade absoluta enquanto há drive. B: a máscara laríngea não é a solução do choque. D: é preciso antecipar o preparo (material, drogas, equipe), pois a intubação provavelmente será necessária.", "r": "Surviving Sepsis Campaign Pediatric Guidelines 2020; PALS."}, {"n": 41, "e": "Menino de 8 meses, previamente hígido, apresenta febre de 39,5°C há 24 horas. No momento, exame clínico sem alterações e sem outras queixas. Realizou todas as vacinas indicadas pelo Ministério da Saúde à faixa etária. Qual deve ser a conduta?", "a": ["Solicitar Urina 1 por sonda vesical de alívio, uma vez que a criança não consegue fazer por jato médio", "Observar o quadro e orientar retorno se aparecerem novos sintomas, pois a criança não tem sinais de alarme", "Iniciar tratamento empírico com antibióticos de amplo espectro pelo risco de infecção bacteriana invasiva", "Realizar radiografia de tórax para pesquisa de pneumonia oculta."], "g": "A", "ar": "Pediatria", "es": "Emergências Pediátricas", "as_": "Febre sem Foco no Lactente", "d": "fundamental", "i": null, "x": "A alternativa A está correta. Dicas do enunciado: lactente de 8 meses, **vacinado, febre alta de 24 horas sem foco** e exame normal. Na **febre sem sinais localizatórios**, o principal diagnóstico a investigar é a **infecção urinária**, e a faixa etária (< 12 meses, sobretudo meninas e não circuncidados) é fator de risco. Colhe-se **urina tipo 1 e urocultura por sonda vesical de alívio** em criança que não faz coleta por jato médio. B: apenas observar deixa uma ITU sem diagnóstico. C: o antibiótico empírico amplo não é indicado em lactente bem, vacinado, sem sinais de toxemia. D: a radiografia de tórax só se faz com sintomas respiratórios ou leucocitose acentuada, e não é o primeiro passo.", "r": "Sociedade Brasileira de Pediatria, Febre sem sinais localizatórios; AAP 2011 UTI Guideline."}, {"n": 42, "e": "Adolescente, 13 anos de idade, fibrocística pancreato-insuficiente, está internada em enfermaria com quadro de exacerbação da doença de base, no quinto dia de internação. Não apresenta comorbidades associadas. Está em uso de medicações de uso contínuo, salbutamol 600mcg 3/3h, metilprednisolona na dose de 2mg/Kg, ceftazidima, oxacilina e amicacina. No histórico, a paciente é colonizada de forma crônica por Pseudomonas aeruginosa multissensível e intermitente Staphylococcus aureus meticilinossensível. A cultura de escarro de entrada revela apenas Pseudomonas aeruginosa multissensível. A paciente encontra-se afebril há 3 dias, em bom estado geral, com melhora importante do desconforto respiratório - já de volta ao seu basal -, e à ausculta pulmonar apresenta estertores subcrepitantes difusos, sibilos esparsos, além de redução do murmúrio vesicular em base esquerda. Qual deve ser a conduta?", "a": ["Manter a ceftazidima e suspender a amicacina e oxacilina.", "Manter a ceftazidima e amicacina e suspender a oxacilina.", "Manter todos os antibióticos.", "Manter amicacina e oxacilina e suspender a ceftazidima."], "g": "C", "ar": "Clínica Médica", "es": "Pneumologia", "as_": "Bronquiectasias", "d": "avancado", "i": null, "x": "A alternativa C está correta pelo gabarito oficial. Dicas do enunciado: **fibrose cística em exacerbação**, colonizada de forma crônica por *Pseudomonas aeruginosa* e, de forma intermitente, por *S. aureus* sensível. As exacerbações devem ser tratadas com **cobertura para todos os organismos** com os quais a paciente tem colonização, crônica ou intermitente; portanto **mantêm-se todos os antibióticos** (ceftazidima + amicacina para pseudomonas, oxacilina para estafilococo). A, B e D: suspender qualquer um deixaria um agente colonizador sem cobertura durante a exacerbação. Observação: a melhora clínica não é motivo para reduzir o esquema antes de completar o tempo (em geral 14 dias).", "r": "Cystic Fibrosis Foundation Pulmonary Guidelines; Diretrizes brasileiras de fibrose cística."}, {"n": 43, "e": "Você encontra uma criança inconsciente desacompanhada. Ao checar a responsividade, a criança não responde. Você checa pulso e respiração por 5 segundos, confirmando que a criança está em parada cardiorrespiratória. Qual deve ser a conduta?", "a": ["Buscar o DEA.", "Iniciar ressuscitação cardiopulmonar por 2 minutos e, após, pedir ajuda.", "Pedir ajuda e, após, iniciar ressuscitação cardiopulmonar.", "Iniciar ressuscitação cardiopulmonar até a ajuda chegar."], "g": "B", "ar": "Pediatria", "es": "Emergências Pediátricas", "as_": "Insuficiência Respiratória e PCR em Pediatria", "d": "fundamental", "i": null, "x": "A alternativa B está correta. Dicas do enunciado: **criança encontrada colapsada por um único socorrista, sem ninguém por perto**, e sem saber há quanto tempo está parada. Pelo PALS, o socorrista **sozinho** realiza **um ciclo de RCP (2 minutos)** e **depois pede ajuda** (e busca o DEA), porque a parada pediátrica costuma ser de origem respiratória e a ventilação e as compressões são prioritárias; se o colapso fosse presenciado, pediria ajuda primeiro. A: buscar o DEA antes de iniciar a RCP atrasa as compressões. C: pedir ajuda antes de iniciar só se aplica ao colapso presenciado. D: iniciar a RCP e esperar a ajuda chegar, sem acionar o serviço de emergência, não é recomendado.", "r": "PALS, American Heart Association 2020."}, {"n": 44, "e": "Menino de 2 anos é trazido ao pronto-socorro após ingerir acidentalmente uma quantidade desconhecida de água sanitária há cerca de 30 minutos. A mãe encontrou a criança com o frasco vazio e espuma ao redor da boca. No exame clínico, a criança está chorosa, com sinais de irritação oral e vômitos frequentes. Os sinais vitais estão normais. Qual deve ser a conduta?", "a": ["Induzir vômito para eliminar o produto ingerido.", "Administrar carvão ativado.", "Realizar lavagem gástrica.", "Manter a criança em observação e administrar suporte sintomático."], "g": "D", "ar": "Clínica Médica", "es": "Medicina de Emergência", "as_": "Intoxicações Exógenas e Síndromes Toxicológicas", "d": "fundamental", "i": null, "x": "A alternativa D está correta. Dicas do enunciado: ingestão de **água sanitária (cáustico)**, com irritação oral e vômitos, sinais vitais normais. Na ingestão de **produtos cáusticos** são **contraindicados a indução do vômito e a lavagem gástrica** (risco de nova lesão esofágica e aspiração) e o carvão ativado não adsorve bem cáusticos. A conduta é **observação cuidadosa, suporte sintomático e, se necessário, endoscopia nas primeiras 24 horas** para avaliar a extensão da lesão. A: induzir o vômito expõe novamente o esôfago ao cáustico. B: o carvão ativado é ineficaz e atrapalha a endoscopia. C: a lavagem gástrica é contraindicada.", "r": "Centro de Controle de Intoxicações (SP); Tratado de Pediatria SBP."}, {"n": 45, "e": "Menina de 7 anos dá entrada no pronto socorro com quadro de urticária aguda associado a sinais de broncoespasmo cerca de 1 hora após dose de dipirona. Realizada adrenalina via intramuscular, com resolução completa do quadro após 1ª dose. Qual deve ser a conduta?", "a": ["Alta imediata; Encaminhar ao imunologista.", "Observação por pelo menos 6h; prescrição de corticosteróides.", "Observação por pelo menos 6h; encaminhamento ao imunologista.", "Alta imediata; orientação sobre apresentação bifásica."], "g": "C", "ar": "Clínica Médica", "es": "Alergia e Imunologia", "as_": "Anafilaxia e Reações Alérgicas Graves", "d": "fundamental", "i": null, "x": "A alternativa C está correta. Dicas do enunciado: **urticária aguda com broncoespasmo 1 hora após dipirona**: **anafilaxia**, resolvida com **uma dose de adrenalina IM**. Mantém-se **observação por pelo menos 6 a 8 horas** pelo risco de **reação bifásica** (que pode ocorrer até 48-72 horas), e na alta orienta-se identificar o desencadeante, reconhecer os sintomas, ter um plano de ação e **encaminhar ao imunologista**. A e D: a alta imediata, sem observação, é insegura. B: os corticoides não previnem a reação bifásica e não são a conduta principal.", "r": "World Allergy Organization Anaphylaxis Guidance 2020; ASBAI, Diretriz de anafilaxia."}, {"n": 46, "e": "Criança de 8 meses dá entrada na emergência com quadro de vômitos e diarreia. Na avaliação inicial a criança está desidratada grave. Realizada coleta de exames laboratoriais e glicemia capilar (78mg/dL) sendo prescrito expansão com soro fisiológico. Após a fase de expansão, a criança parece hidratada e apresenta os seguintes exames: pH 7,22; Bic = 9; Na = 133 mEq/L; K = 3,0 mEq/L, glicemia capilar = 68 mg/dL. Qual deve ser a conduta?", "a": ["Infusão de bicarbonato de sódio a 3%, KCl na diluição de 40 mEq/litro durante 1 hora, glicose a 25% 2 ml/ Kg.", "Soro de manutenção basal com reposição de potássio, liberar a dieta e ondansetrona se necessário.", "Soro de manutenção basal, manter jejum devido a acidose e solicitar novos exames após 2 horas.", "Infusão de bicarbonato a 3%, soro de manutenção com reposição de potássio e liberar a dieta após ondansetrona."], "g": "B", "ar": "Pediatria", "es": "Emergências Pediátricas", "as_": "Desidratação na Infância", "d": "intermediario", "i": null, "x": "A alternativa B está correta. Dicas do enunciado: desidratação grave por gastroenterite, agora **hidratada após a expansão**, com **acidose metabólica leve (pH 7,22, bicarbonato 9)** e **hipocalemia (K⁺ 3,0)**. A conduta é **soro de manutenção basal com repo
