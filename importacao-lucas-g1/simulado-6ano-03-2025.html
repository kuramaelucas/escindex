erose múltipla**. O tratamento do surto é **pulsoterapia com metilprednisolona 1 g/dia por 3-5 dias**. B: a plasmaférese é de segunda linha, para surto grave sem resposta ao corticoide. C e D: na neuromielite óptica espera-se perda visual grave, às vezes bilateral, com anticorpo anti-aquaporina-4 e quase sempre sem bandas oligoclonais; e mesmo nela o tratamento inicial é a pulsoterapia, com plasmaférese em casos graves.", "r": "McDonald Criteria 2017; Toledano et al., Curr Neurol Neurosci Rep 2015."}, {"n": 91, "e": "Mulher de 63 anos de idade, com diagnóstico prévio de insuficiência cardíaca com fração de ejeção reduzida de etiologia chagásica, é trazida ao DE por familiares em decorrência de adinamia, dispneia e rebaixamento do nível de consciência há 24 horas. Na avaliação inicial, apresenta PA 85x54 mmHg, SpO2 92%, murmúrio vesicular presente bilateralmente sem ruídos adventícios e um tempo de enchimento capilar de 4 segundos e membros inferiores sem edemas, turgência jugular negativa e ausência de refluxo hepatojugular. Qual é a opção que melhor representa os possíveis achados no POCUS do paciente?", "a": ["Imagem (A) — POCUS pulmonar com camada anecoica compatível com derrame pleural.", "Imagem (B) — POCUS da veia cava inferior com diâmetro de 2 cm na expiração e 0,8 cm na inspiração (colapsável).", "Imagem (C) — modo M com sinal do código de barras (ausência de deslizamento pleural, compatível com pneumotórax).", "Imagem (D) — POCUS pulmonar com linhas B (compatível com doença intersticial, como pneumonia)."], "g": "B", "ar": "Clínica Médica", "es": "Medicina de Emergência", "as_": "Choque e Ultrassom à Beira do Leito", "d": "avancado", "i": "quatro imagens de POCUS (derrame pleural, veia cava inferior, modo M pulmonar e linhas B)", "x": "A alternativa B está correta. Dicas do enunciado: paciente com ICFEr, **hipotensa (85x54), TEC de 4 s, sem congestão** (sem edema, sem estase jugular, sem refluxo hepatojugular) e **pulmão sem ruídos adventícios**: **choque com perfil de baixa pré-carga/hipovolemia**. Dicas da imagem: a veia cava inferior é pequena e **colapsável** (2 cm na expiração e 0,8 cm na inspiração, ou seja, colapso importante), o que traduz **baixo volume intravascular**. A: derrame pleural não é sustentado pelo exame pulmonar normal. C: o código de barras do modo M indica pneumotórax, sem base clínica. D: as linhas B indicam edema ou pneumonia, e a ausculta e os sinais de congestão estão ausentes.", "r": "BLUE Protocol; RUSH Protocol (Perera et al.)."}, {"n": 92, "e": "Homem, 50 anos de idade, com diagnóstico prévio de doença pulmonar obstrutiva crônica em uso de oxigenoterapia domiciliar, iniciou quadro agudo de tosse produtiva e febre. Na admissão do pronto-socorro, foi colocado na máscara com reservatório 15 L/min e apresentava SpO2 de 60%. A gasometria da admissão mostrou pH 7,1; PCO2 90 mmHg; PO2 120 mmHg, HCO3 36 mEq/L. Em seguida, foi iniciado antibioticoterapia e corticoterapia endovenosa. Dado a evolução para insuficiência respiratória hipercápnica (tipo II), o paciente foi submetido a intubação orotraqueal e iniciado a ventilação mecânica invasiva. As curvas do ventilador mecânico são mostradas abaixo (fase expiratória prolongada, com fluxo expiratório que não retorna a zero antes do novo ciclo). Qual das condições o paciente apresenta maior risco de desenvolver?", "a": ["Edema pulmonar não cardiogênico", "Barotrauma", "Lesão por colapso e expansão alveolar repetitivo", "Hiperinsuflação dinâmica"], "g": "D", "ar": "Clínica Médica", "es": "Pneumologia", "as_": "Ventilação Mecânica Invasiva", "d": "avancado", "i": "Tela do ventilador com curvas de pressão, fluxo e volume com expiração prolongada", "x": "A alternativa D está correta. Dicas do enunciado: **DPOC exacerbado, intubado** e submetido a ventilação mecânica. Dicas da imagem: a **fase expiratória é prolongada e achatada**, o fluxo expiratório não volta a zero antes do próximo ciclo e há **disparos ineficazes**: **aprisionamento aéreo (auto-PEEP)**, ou seja, **hiperinsuflação dinâmica**, comum em obstrutivos graves. A: o edema pulmonar não cardiogênico é da SDRA. B: o barotrauma é complicação possível, mas é consequência da hiperinsuflação, e a questão pergunta a condição que o paciente apresenta maior risco. C: a lesão por colapso e expansão repetitivos (atelectrauma) ocorre em pulmões com tendência ao colapso, o que não é o caso aqui.", "r": "Diretrizes Brasileiras de Ventilação Mecânica (AMIB/SBPT); GOLD 2024."}, {"n": 93, "e": "Homem de 20 anos de idade buscou o pronto-socorro devido a cefaleia intensa que teve início há 2 dias. Paciente refere cefaleia grau 10/10, em facada, atingindo pico máximo em mais de 1 minuto, em região temporal esquerda, com duração de cerca de 45 minutos, associado a lacrimação, hiperemia conjuntival e congestão nasal do mesmo lado, além de uma agitação durante a dor. Refere cerca de 4 episódios por dia. Nega episódios prévios semelhantes. Ao exame neurológico: prejudicado devido a cefaleia associado a lacrimação, hiperemia conjuntival e congestão nasal ipsilateral, no entanto, exame somático sem alterações. Qual deve ser a conduta?", "a": ["Prescrever oxigênio 100%", "Prescrever Sumatriptano", "Solicitar TC crânio e Angio-tomografia intracraniana e prescrever corticoide", "Solicitar TC crânio e Angio-tomografia intracraniana e prescrever oxigênio 100%"], "g": "D", "ar": "Clínica Médica", "es": "Neurologia", "as_": "Cefaleias", "d": "intermediario", "i": null, "x": "A alternativa D está correta. Dicas do enunciado: **cefaleia unilateral em facada, 45 minutos, com lacrimação, hiperemia conjuntival, congestão nasal e agitação**, em **homem jovem**, com vários episódios por dia: **cefaleia em salvas** (cefaleia trigêmino-autonômica). Como é o **primeiro episódio**, antes de fechar o diagnóstico é preciso **excluir causa secundária por imagem** (de preferência RM e angiorressonância; na indisponibilidade, TC e angio-TC). O tratamento da fase aguda é **oxigênio 100% em máscara não reinalante a 12-15 L/min por 15 minutos**, com triptanos como segunda linha. A: tratar sem imagem em primeiro episódio deixa de excluir causas secundárias. B: o sumatriptano é a segunda linha. C: o corticoide não é tratamento da fase aguda, e é usado como ponte na profilaxia.", "r": "Continuum 2024;30(2):391-410; ICHD-3."}, {"n": 94, "e": "Mulher, 25 anos de idade, com histórico de asma, deu entrada no pronto- socorro com quadro de dispneia e rebaixamento do nível de consciência. Na admissão, apresentava SpO2 60% em ar ambiente, FR 25 irpm, ausculta do tórax silente, além de rebaixamento do nível de consciência. Apresentou refratariedade às medidas broncodilatadoras e ao sulfato de magnésio intravenoso, sendo submetida à intubação orotraqueal e transferida à UTI. Evoluiu com melhora ao longo da primeira semana de UTI. Durante o round de discussão, você discute com assistente o motivo do ventilador estar mostrando um volume inspirado (VTi) muito diferente do volume expirado (VTe). Para prosseguir com a investigação, realizam a manobra demonstrada na imagem abaixo (pausa expiratória, com elevação da curva de pressão). Qual é o diagnóstico?", "a": ["Atelectrauma", "Vazamento no circuito", "Pneumotórax", "PEEP intrínseca"], "g": "D", "ar": "Clínica Médica", "es": "Pneumologia", "as_": "Ventilação Mecânica Invasiva", "d": "avancado", "i": "Tela do ventilador durante manobra de pausa expiratória com aumento da curva de pressão", "x": "A alternativa D está correta. Dicas do enunciado: paciente asmática intubada por crise grave, com **volume inspirado diferente do expirado**, e a manobra de **pausa expiratória** mostra **aumento da curva de pressão**, o que indica **aprisionamento aéreo (auto-PEEP, PEEP intrínseca)**. Se houvesse vazamento, a curva de pressão permaneceria reta, indicando apenas a PEEP programada. A: o atelectrauma é dano por colapso e reabertura de alvéolos, sem relação com diferença de volumes. B: o vazamento no circuito não eleva a pressão na pausa expiratória. C: o pneumotórax se manifesta com queda de saturação e instabilidade, e não explica a elevação da pressão na pausa.", "r": "Diretrizes Brasileiras de Ventilação Mecânica (AMIB/SBPT); GINA 2024 (asma grave)."}, {"n": 95, "e": "Homem, 57 anos de idade, com histórico de etilismo importante, diabetes mellitus do tipo 2 e hipertensão arterial sistêmica sem seguimento adequado, busca Pronto - Socorro com quadro de aumento de volume abdominal, dispneia aos esforços, sonolência diurna e insônia, além de ortopneia e espumúria nas últimas semanas. Ao exame clínico, apresenta PA 90x70 mmHg, FC 74 bpm, SatO2 96%, telangiectasias em tórax, eritema palmar bilateral. AP: estertores crepitantes até terço médio bilateral. AC: bulhas rítmicas normofônéticas com presença de B3, edema de MMII e turgência jugular patológica a 45 graus. Foi realizado um USG de abdome com presença de ascite, com sinais incipientes de cirrose hepática e sem sinais de trombose de veia porta ou causas obstrutivas. Foi então optado por solicitação de exames laboratoriais séricos e realização de paracentese com saída de 4,2L de líquido ascítico, com os seguintes resultados: - Sérico: Hb 12,3g/dL; Leuco 5042 céls/mm³ (linf 20% / seg 70%); Plaq 90 000/ mm³; ureia 44 mg/dL; Cr 2,1mg/dL; Na 140 mEq/ L; K 4.2mEq/ L; albumina 2,7 g/dL. - Líquido ascítico: leucócitos 130 céls/mm³ (100 neutrófilos / 20 linfócitos) / albumina1,5 g/dL / proteína total 3,4 g/dL. - Urina I: sem leucocitúria, proteinúria 3+/4+, sem hemácias. Qual exame deve ser solicitado para definir a conduta de tratamento e diagnóstico da causa etiológica mais provável?", "a": ["Cultura de micobactéria no líquido ascítico", "Elastografia hepática", "Ecocardiograma transtorácico", "Proteinúria 24h"], "g": "C", "ar": "Clínica Médica", "es": "Gastroenterologia", "as_": "Cirrose e Complicações", "d": "avancado", "i": null, "x": "A alternativa C está correta. Dicas do enunciado: ascite com sinais de **insuficiência cardíaca** (ortopneia, B3, edema, turgência jugular, estertores) e estigmas hepáticos. O **GASA = 2,7 − 1,5 = 1,2 g/dL (≥ 1,1)** indica **hipertensão portal**, afastando causas inflamatórias ou síndrome nefrótica (GASA < 1,1). A **proteína total do líquido de 3,4 g/dL (> 2,5)**, sem causa obstrutiva hepática, sugere **etiologia cardíaca**, e o **ecocardiograma transtorácico** define a fração de ejeção e a conduta. A: a cultura para micobactérias é para ascite tuberculosa, com GASA < 1,1 e linfócitos predominantes. B: a elastografia avalia fibrose, e a proteína alta no líquido aponta para causa cardíaca. D: a proteinúria de 24 h investiga síndrome nefrótica, que teria GASA baixo.", "r": "AASLD Practice Guidance on Ascites; Diretriz Brasileira de Insuficiência Cardíaca."}, {"n": 96, "e": "Mulher de 72 anos de idade, em acompanhamento ambulatorial por hipertensão arterial sistêmica, doença renal crônica estadio III (RFG CKD-EPI 45 ml/min/1,73m² há 1 ano) e insuficiência cardíaca de fração de ejeção de 38% no ecocardiograma transtorácico realizado há 6 meses. Em uso de carvedilol 25 mg 12/12h, enalapril 25 mg 12/12h, espironolactona 25 mg/dia e furosemida 40 mg/dia. Retorna em consulta ambulatorial após 6 meses do último ajuste medicamentoso com queixa de manter dispneia aos moderados esforços, além de ortopneia e edema periférico. Ao exame clínico: MV+ bilateralmente, estertores bibasais, FR 18 ipm. Bulhas arrítmicas normofônéticas em 2T sem sopros, turgência jugular presente, PA 110x70 mmHg, FC 72 bpm. Edema de membros inferiores 2+/4+. Exames: sódio 143 mEq/L; potássio 3,9 mEq/L; ureia 40 mg/dL; creatinina 1,2 mg/dL (RFG CKD-EPI 48 ml/min/1,73m²); ECG com hipertrofia de câmaras esquerdas e fibrilação atrial. Qual deve ser a conduta?", "a": ["Aumentar furosemida e suspender enalapril e espironolactona devido risco de hipercalemia e piora de creatinina.", "Introduzir ivabradina devido FC > 70 bpm em uso de beta-bloqueador em dose otimizada e introduzir varfarina para profilaxia de AVC cardioembólico.", "Trocar enalapril por sacubitril-valsartana devido insuficiência cardíaca sintomática com medicações de primeira linha otimizadas e contraindicar anticoagulação plena para o paciente devido idade > 70 anos e HAS-BLED 3 pontos.", "Introduzir rivaroxabana para profilaxia de AVC cardioembólico e introduzir iSGLT2 devido insuficiência cardíaca sintomática com medicações de primeira linha otimizadas."], "g": "D", "ar": "Clínica Médica", "es": "Cardiologia", "as_": "Insuficiência Cardíaca", "d": "avancado", "i": "ECG com fibrilação atrial e sinais de sobrecarga de câmaras esquerdas", "x": "A alternativa D está correta. Dicas do enunciado: idosa com **ICFEr (FE 38%) sintomática (NYHA II) a despeito de IECA, betabloqueador e espironolactona** otimizados e **sinais de congestão**. Dicas da imagem: ECG com **fibrilação atrial**. Com **CHA₂DS₂-VASc de 5**, há indicação de **anticoagulação plena** (varfarina ou DOAC; a rivaroxabana serve até ClCr 15), e o **iSGLT2** é o pilar a acrescentar, pelo benefício na IC independentemente do diabetes e na DRC. A: o risco de hipercalemia e piora da creatinina não justifica suspender enalapril e espironolactona (K⁺ 3,9, creatinina 1,2). B: a ivabradina só se indica com ritmo sinusal e FC > 70, e aqui há FA. C: o HAS-BLED de 3 não contraindica a anticoagulação, apenas pede vigilância; e trocar por ARNI seria possível, mas a alternativa contraindica a anticoagulação.", "r": "Diretriz Brasileira de Insuficiência Cardíaca Crônica (SBC); ESC 2021 Heart Failure."}, {"n": 97, "e": "Homem, 30 anos de idade, vítima de colisão moto x anteparo, é trazido ao Pronto-Socorro. Apresenta via aérea pérvia, colar cervical, murmúrios vesiculares presentes e simétricos, saturação de 97%, pressão arterial de 80 x 40 mmHg, frequência cardíaca 145 bpm, tempo de enchimento capilar 4 segundos, pupilas isocóricas e fotorreagentes e Glasgow 13. O exame perineal é apresentado, com saída de grande quantidade de sangue pela lesão. Qual deve ser a conduta?", "a": ["Tamponamento da lesão com compressas estéreis", "Desbridamento da lesão, hemostasia e realização de retalho miocutâneo", "Sutura primária da lesão e antibiótico de amplo espectro", "Dreno com colostomia em alça por videolaparoscópica."], "g": "A", "ar": "Cirurgia Geral", "es": "Trauma", "as_": "Atendimento Inicial ao Trauma (ATLS)", "d": "avancado", "i": "Fotografia de lesão perineal extensa com sangramento", "x": "A alternativa A está correta. Dicas do enunciado: **trauma pélvico-perineal complexo em choque hemorrágico (PA 80x40, FC 145, TEC 4 s)**, com **sangramento ativo pelo períneo**. Dicas da imagem: lesão perineal extensa. Nesse tipo de lesão, \"menos é mais\": primeiro **controlar o sangramento com tamponamento da lesão com compressas** e estabilizar. A derivação do trânsito intestinal (colostomia em alça) é feita **se o paciente está estável**, e as reconstruções ficam para depois. B: o desbridamento amplo e o retalho miocutâneo são reconstruções que não cabem na sala de trauma. C: a sutura primária de lesão perineal contaminada e extensa não é recomendada. D: a derivação por videolaparoscopia não é adequada em paciente instável.", "r": "ATLS 10ª edição; WSES Guidelines on Pelvic Ring Injuries."}, {"n": 98, "e": "Mulher, 64 anos de idade, se queixa de dor abdominal difusa de forte intensidade há 24 horas, acompanhada de febre e diarreia sem sangue. Nega sintomas urinários. Antecedente de internação prévia há 1 mês devido a pneumonia. Refere tabagismo. Tem hipertensão arterial sistêmica e diabete melito, controlados com medicamentos. Ao exame clínico: Regular estado geral, FC: 110 bpm, FR: 16 irpm, PA: 100x70 mmHg. Ausculta torácica sem alterações. Abdome distendido, doloroso com sinais de irritação peritoneal difusamente. Exames bioquímicos: Hb: 11,3 g/dL; Leuco: 19,57 mil/mm3; PCR: 60mg/dL; Creat: 2,19 mg/dL; Ureia:141 mg/dl; Lactato: 28 mg/dL; Gasometria sem outras alterações. Tomografia de abdome: espessamento difuso do cólon com distensão. Qual é a principal hipótese diagnóstica e tratamento?", "a": ["Colite pseudomembranosa e antibioticoterapia", "Trombose venosa mesentérica e anticoagulação plena", "Úlcera péptica perfurada e ulcerorrafia laparoscópica", "Diverticulite complicada e colectomia direita com ileotransverso anastomose"], "g": "A", "ar": "Clínica Médica", "es": "Infectologia", "as_": "Infecções Relacionadas à Assistência (IRAS)", "d": "avancado", "i": "TC de abdome com espessamento difuso do cólon e distensão", "x": "A alternativa A está correta pelo gabarito oficial. Dicas do enunciado: **internação por pneumonia há 1 mês (provável uso de antibiótico)**, seguida de **diarreia sem sangue, febre, dor abdominal difusa e leucocitose de 19.570**. Dicas da imagem: **espessamento difuso do cólon**. Todo quadro diarreico em ambiente hospitalar ou após antibiótico deve levantar a hipótese de **colite pseudomembranosa (*Clostridioides difficile*)**; o diagnóstico é feito com as toxinas A e B nas fezes, e o tratamento é com **metronidazol oral** e, nos resistentes, **vancomicina oral**. B: a trombose mesentérica é de dor desproporcional ao exame e sem diarreia. C: a úlcera perfurada tem pneumoperitônio, sem espessamento colônico difuso. D: a diverticulite complicada não explica o acometimento difuso. Observação: o quadro tem irritação peritoneal e instabilidade, podendo ser colite fulminante, que pode exigir cirurgia, e o tratamento atual de primeira linha é vancomicina ou fidaxomicina.", "r": "IDSA/SHEA 2021 Update on C. difficile; Diretrizes brasileiras de IRAS."}, {"n": 99, "e": "Homem de 45 anos de idade é vítima de queda de 8 metros de altura. Apresenta trauma torácico com múltiplas fraturas de costelas. Identificado pneumotórax à direita, com realização de drenagem de tórax ainda durante o primeiro atendimento. Paciente se manteve estável após a drenagem de tórax, realizando tomografia de tórax representada abaixo (pneumotórax volumoso à direita persistente com dreno visível):", "a": ["Introduzir um segundo dreno de tórax.", "Puncionar no segundo espaço intercostal.", "Reavaliar o dreno de tórax.", "Realizar toracotomia de urgência."], "g": "C", "ar": "Cirurgia Geral", "es": "Trauma", "as_": "Trauma Torácico (Lesões de Aorta, Hilo Pulmonar)", "d": "intermediario", "i": "TC de tórax com pneumotórax volumoso à direita persistente e dreno torácico", "x": "A alternativa C está correta. Dicas do enunciado: **trauma torácico com drenagem inicial**, paciente estável, mas a **tomografia mostra manutenção do pneumotórax volumoso** à direita. A primeira conduta é **reavaliar o dreno**: ele pode ter sido deslocado durante o transporte, **clampeado**, mal posicionado ou obstruído; antes de qualquer procedimento maior, **passar um novo dreno, colocar em aspiração e checar o funcionamento**. A: introduzir um segundo dreno só vem se o primeiro estiver funcionando e o pneumotórax persistir. B: a punção no segundo espaço é para pneumotórax hipertensivo na sala de trauma. D: a toracotomia de urgência é para instabilidade ou grande vazamento aéreo persistente, após o dreno revisado.", "r": "ATLS 10ª edição; Colégio Brasileiro de Cirurgiões, Trauma Torácico."}, {"n": 100, "e": "Homem de 65 anos de idade, dá entrada no pronto socorro com distensão abdominal e dor em hérnia inguinal à direita. Refere que sempre teve medo da cirurgia e por isso não realizou reparo cirúrgico indicado há 10 anos. Refere ainda que a hérnia vem aumentando progressivamente de volume. Indicado tratamento operatório através de inguinotomia à direita. No intraoperatório foi observado sofrimento de 15 cm de alças de intestino delgado. Durante a manipulação ocorreu ruptura da área de sofrimento com contaminação controlada do campo operatório. Qual deve ser a conduta?", "a": ["Realizar laparotomia exploradora para adequada inspeção da cavidade abdominal.", "Realizar enterectomia segmentar, mas não utilizar tela no reparo da hérnia devido contaminação.", "Realizar enterectomia segmentar com anastomose primária e realizar o reparo da hérnia conforme técnica de Lichtenstein.", "Interromper tratamento operatório por inguinotomia e realizar laparoscopia diagnóstica com lavagem da cavidade abdominal."], "g": "C", "ar": "Cirurgia Geral", "es": "Abdome Agudo", "as_": "Hérnias da Parede Abdominal", "d": "avancado", "i": null, "x": "A alternativa C está correta pelo gabarito oficial. Dicas do enunciado: **hérnia inguinal encarcerada com sofrimento de 15 cm de delgado**, que se rompeu durante a manipulação com **contaminação local controlada**. A hérnia se resolve por **inguinotomia**, mesmo com complicação local: faz-se **enterectomia segmentar com anastomose primária** e **reparo pela técnica de Lichtenstein**; segundo os protocolos do serviço e a literatura, é possível utilizar tela mesmo com contaminação controlada. A: a laparotomia só é necessária se houver dúvida de perfuração das alças que estavam dentro da cavidade, o que não é o caso. B: evitar a tela por contaminação é conduta controversa e não segue o protocolo da casa. D: interromper e fazer laparoscopia não se justifica, pois tudo se resolve pela inguinotomia. Observação: a questão é controversa na literatura quanto ao uso de tela em campo contaminado.", "r": "HerniaSurge Guidelines 2018; Colégio Brasileiro de Cirurgiões."}, {"n": 101, "e": "Adolescente, 15 anos de idade, estudante, procura atendimento médico por queixas de dor na coluna vertebral, especialmente à noite, que melhora com o uso de anti-inflamatórios não esteroides (AINEs) e sem relação com atividade física. Relata que a dor começou há cerca de seis meses, de forma insidiosa, e tem se intensificado gradualmente. Também menciona que, nos últimos meses, observou uma assimetria na postura. Já foi atendido em outros serviços e realizada radiografia panorâmica da coluna total, diagnosticado com escoliose idiopática do adolescente (radiografia com curva escoliótica). Paciente vem ao serviço devido manutenção do quadro álgico e progressão da curva. Paciente nega antecedentes pessoais e familiares. Qual deve ser a conduta?", "a": ["Manter o seguimento como escoliose idiopática juvenil, encaminhar paciente para a fisioterapia e RPG. Retorno em 6 meses com nova radiografia panorâmica.", "Ampliar a investigação com Tomografia computadorizada da coluna total para melhor investigação do quadro.", "Repetir a radiografia panorâmica com as inclinações laterais, além de introduzir colete para o paciente devido a progressão da curva.", "Otimizar a analgesia com opioide, solicitar Ressonância Nuclear magnética ambulatorialmente, retorno precoce após exames."], "g": "B", "ar": "Cirurgia Geral", "es": "Ortopedia e Traumatologia", "as_": "Ortopedia Pediátrica", "d": "avancado", "i": "Radiografia panorâmica da coluna com escoliose", "x": "A alternativa B está correta. Dicas do enunciado: adolescente com **dor lombar insidiosa de 6 meses, noturna, que melhora com AINE e não se relaciona com atividade**, e **escoliose dolorosa**, com progressão da curva. Escoliose **dolorosa** não é idiopática até prova em contrário: suspeita-se de **osteoma osteoide** (tumor ósseo benigno, mais comum em meninos de 5 a 24 anos), cuja dor é aliviada por AINE. Na coluna, as radiografias podem parecer normais, e o **exame padrão-ouro é a tomografia**. A: manter o seguimento como idiopática ignora a dor noturna e a resposta ao AINE. C: o colete trata a escoliose idiopática, e não resolve a causa. D: o opioide não é indicado, e a RM é menos sensível que a TC para o nidus.", "r": "Tratado de Ortopedia Pediátrica; Campbell's Operative Orthopaedics."}, {"n": 102, "e": "Mulher de 46 anos de idade dá entrada no pronto socorro com quadro de dor abdominal difusa. Após a realização da tomografia de abdome, foi feito o diagnóstico de diverticulite aguda em cólon sigmóide. Indicada laparotomia. De achados no intraoperatório, espessamento de cólon sigmóide e peritonite purulenta difusa. Qual deve ser a conduta?", "a": ["Drenagem cirúrgica da cavidade abdominal", "Retossigmoidectomia a Hartmann", "Retossigmoidectomia com anastomose primária", "Lavagem da cavidade abdominal e antibiótico de amplo espectro"], "g": "B", "ar": "Cirurgia Geral", "es": "Abdome Agudo", "as_": "Doença Diverticular", "d": "fundamental", "i": null, "x": "A alternativa B está correta. Dicas do enunciado: **diverticulite aguda do sigmoide com peritonite purulenta difusa (Hinchey III)**, em cirurgia de emergência. Em **contaminação da cavidade, cirurgia de emergência e/ou instabilidade**, pensa-se em **ostomia**: faz-se a **retossigmoidectomia à Hartmann** (colostomia terminal e fechamento do coto retal). A anastomose é reservada a paciente estável, sem contaminação, em cirurgia eletiva e com poucos hemocomponentes. A: a drenagem isolada não trata a fonte. C: a anastomose primária em peritonite purulenta difusa e cólon (órgão sensível) tem alto risco de deiscência. D: a lavagem e antibiótico sem ressecar o segmento doente é opção apenas em casos selecionados e não é o padrão aqui.", "r": "ASCRS Guidelines for Left-Sided Colonic Diverticulitis 2020; WSES 2020."}, {"n": 103, "e": "Mulher, 54 anos de idade, refere quadro de dor e abaulamento na região inguinocrural à direita há 2 meses, desencadeados aos esforços. Ao exame físico, observa-se abaulamento na região inguinocrural à direita (figura a seguir, com linha marcando o ligamento inguinal e abaulamento abaixo dessa linha), à manobra de Valsalva, com redução ao repouso. Com relação a este tipo de hérnia, qual é a alternativa correta?", "a": ["Trata-se de hérnia inguinal. A técnica de Lichtenstein é a melhor conduta.", "Quando encarcerada, o acesso deve ser por via inguinal e abdominal.", "Trata-se de hérnia femoral e quando operada de urgência tem elevada mortalidade.", "Trata-se do defeito mais comum da parede abdominal."], "g": "C", "ar": "Cirurgia Geral", "es": "Abdome Agudo", "as_": "Hérnias da Parede Abdominal", "d": "intermediario", "i": "Fotografia de abaulamento na região inguinocrural direita abaixo da linha do ligamento inguinal", "x": "A alternativa C está correta. Dicas do enunciado: **mulher de 54 anos com abaulamento inguinocrural**. Dicas da imagem: a linha sobre o ligamento inguinal mostra que o abaulamento está **abaixo dele**, ou seja, **hérnia femoral** (as inguinais surgem acima do ligamento). As femorais ocorrem mais em **mulheres**, complicam com **estrangulamento** e, quando operadas de urgência, têm **mortalidade elevada**. A: não é inguinal, e a técnica de Lichtenstein não cobre o defeito femoral; usam-se tela em plug (via aberta) ou laparoscopia. B: o acesso depende da técnica e do quadro, e a afirmação não é o ponto. D: o defeito mais comum da parede abdominal é a hérnia inguinal indireta, e não a femoral.", "r": "HerniaSurge Guidelines 2018; Colégio Brasileiro de Cirurgiões."}, {"n": 104, "e": "Mulher, 33 anos de idade, apresenta dor abdominal de forte intensidade há 36 horas. Refere início da dor na região superior do abdome, que depois tornou-se difusa. Apresentou vômitos e náuseas. Realizados os seguintes exames laboratoriais: Hb: 11,3 g/dL; Ht:31%; Leucócitos: 16.320/mm³; PCR: 170 mg/dL; Creatinina:1,18 mg/dL; Ureia: 55 mg/dL; TGO: 290 U/L: TGP: 313U/L; BD: 1,9 mg/dL; FA: 145 U/L; GGT: 123 U/L; Amilase: 1280 U/L; Lipase: 2500 U/L. Está indicada a realização de exame de imagem adicional neste momento?", "a": ["Não está indicada a realização de exame.", "Sim, está indicada tomografia de abdome.", "Sim, está indicada colangiorressonância.", "Sim, está indicado ultrassom de abdome superior."], "g": "D", "ar": "Cirurgia Geral", "es": "Abdome Agudo", "as_": "Pancreatite Aguda", "d": "fundamental", "i": null, "x": "A alternativa D está correta. Dicas do enunciado: **dor epigástrica que se difunde, vômitos, lipase de 2.500 U/L (> 3 vezes o limite) e amilase de 1.280**, com **TGP de 313 e TGO de 290** (acima de 150, sugestivo de etiologia biliar): **pancreatite aguda provavelmente biliar**. O exame de imagem na admissão procura a **etiologia**, ou seja, **cálculos na vesícula e dilatação de vias biliares**, por **ultrassom de abdome superior**. A: o diagnóstico já está fechado, mas a imagem da vesícula orienta a conduta e a alta. B: a tomografia na fase aguda é reservada a quem não evolui nas primeiras 48 horas ou a dúvida diagnóstica, para procurar complicações. C: a colangiorressonância se faz quando há necessidade de estudar a via biliar (suspeita de coledocolitíase), e não faz parte da investigação de rotina.", "r": "ACG 2024 Guideline: Management of Acute Pancreatitis; Sabiston, 20ª ed."}, {"n": 105, "e": "Homem de 39 anos de idade foi transferido para um hospital terciário por apendicite aguda complicada, seguida de múltiplas laparotomias exploradoras que evoluíram com fístulas intestinais de alto débito. Na admissão encontra-se em regular estado geral, com índice de massa corporal de 11,8 kg/m2. Calculado o gasto basal de energia: 1500 kcal. Foi proposto iniciar dieta parenteral. Qual é o aporte calórico que deve ser prescrito neste momento e quais são os distúrbios eletrolíticos mais prováveis após o início do tratamento?", "a": ["450 kcal; hipofosfatemia e hipopotassemia.", "450 kcal; hipocalcemia e hiponatremia.", "1500 kcal; hipofosfatemia e hipopotassemia.", "1500 kcal; hipocalcemia e hiponatremia"], "g": "A", "ar": "Cirurgia Geral", "es": "Pré e Pós-operatório", "as_": "Complicações Cirúrgicas", "d": "avancado", "i": null, "x": "A alternativa A está correta. Dicas do enunciado: **desnutrição grave (IMC 11,8)** e longo tempo sem alimentação adequada, com fístulas de alto débito: **risco de síndrome de realimentação**. Inicia-se com **carga calórica muito abaixo da meta** (cerca de 30% de 1.500 kcal, ou seja, **~450 kcal**), aumentando de forma progressiva. Com a chegada da glicose e da insulina, **potássio e fósforo entram nas células**, e os distúrbios esperados são **hipofosfatemia e hipopotassemia** (também hipomagnesemia). B: o aporte está correto, mas os distúrbios citados (cálcio e sódio) não são os da realimentação. C e D: iniciar com 1.500 kcal (a meta total) é erro grave que precipita a síndrome. Se ela ocorrer, interrompe-se a dieta, repõem-se os eletrólitos e reinicia-se após normalização.", "r": "ASPEN Consensus Recommendations for Refeeding Syndrome; NICE CG32."}, {"n": 106, "e": "Homem de 32 anos de idade, vítima de acidente em via pública, trauma de motocicleta vs caminhão em alta velocidade. O paciente foi resgatado na cena do acidente pela equipe médica pré-hospitalar, consciente e com queixa de muita dor na bacia e nos membros inferiores. Na sala de urgência, paciente orientado e normotenso (PA 130 x 80 mmHg). Mantinha-se com frequência cardíaca de 100 bpm e eupnéico. Apresentava múltiplas escoriações nos membros e tronco, sem feridas cortantes. Membros com boa perfusão distal e sem deformidades. Dor e mobilidade anormal à compressão lateral da bacia. Apresenta laceração perineal extensa. Qual deve ser a conduta?", "a": ["Fixação externa e curativos repetidos do períneo", "Fixação externa e curativo a vácuo do períneo", "Fixação externa e colostomia", "Fixação externa e aproximação precoce da ferida"], "g": "C", "ar": "Cirurgia Geral", "es": "Trauma", "as_": "Atendimento Inicial ao Trauma (ATLS)", "d": "avancado", "i": null, "x": "A alternativa C está correta. Dicas do enunciado: **trauma pélvico de alta energia, bacia instável** (mobilidade anormal à compressão lateral) com **laceração perineal extensa**: **fratura exposta da pelve**. Na fratura exposta, a laceração perineal torna o **risco de contaminação por fezes** alto e o controle da ferida difícil, por isso, além da **fixação externa**, faz-se a **colostomia (derivação do trânsito) nas primeiras 48 horas**, que é a medida mais importante. A e B: só curativos (repetidos ou a vácuo) mantêm a ferida exposta à contaminação fecal. D: a aproximação precoce da ferida contaminada leva a infecção grave.", "r": "ATLS 10ª edição; WSES Guidelines on Pelvic Ring Injuries."}, {"n": 107, "e": "Homem de 73 anos de idade dá entrada em pronto atendimento devido a massa em epigastro há 1 mês. Relata ter percebido massa no último mês, porém, como estava assintomático, não procurou serviço de saúde. Refere há 3 anos diminuição de jato urinário, aumento de frequência urinária e noctúria. Nega febre, alterações de hábito intestinal. Ao exame clínico, apresenta massa em hipogastro, indolor à palpação, maciça, de contornos bem definidos. Toque retal com presença de próstata aumentada, homogênea. USG de rins e vias urinárias evidenciou bexigoma de moderada proporção associada a discreta dilatação pielocalicinal bilateral. Próstata de dimensões aumentadas, de difícil mensuração. Qual deve ser a conduta?", "a": ["Iniciar tansulosina e seguimento ambulatorial com urologia", "Sondagem vesical de demora e seguimento ambulatorial com urologia", "Cistostomia por punção e avaliação de urgência pela urologia", "Sondagem de alívio e avaliação de urgência pela urologia"], "g": "B", "ar": "Cirurgia Geral", "es": "Urologia", "as_": "Próstata (HPB e Câncer)", "d": "intermediario", "i": null, "x": "A alternativa B está correta. Dicas do enunciado: idoso com **sintomas urinários obstrutivos há 3 anos**, **massa em hipogástrio maciça (bexigoma)**, próstata aumentada e homogênea, com **dilatação pielocalicinal bilateral**: **retenção urinária crônica por HPB, com hidronefrose** e risco de insuficiência renal pós-renal. É preciso **descomprimir a bexiga com sonda vesical de demora** e depois encaminhar à urologia para o tratamento definitivo. A: a tansulosina demora para agir e não resolve uma retenção instalada com repercussão renal. C: a cistostomia é mais invasiva, reservada a quando a sondagem uretral não é possível. D: a sonda de alívio (retirada após esvaziar) é insuficiente, pois a bexiga volta a encher rapidamente por obstrução persistente.", "r": "Diretrizes de HPB (AUA 2021; SBU); Sabiston, 20ª ed."}, {"n": 108, "e": "Homem de 73 anos de idade dá entrada no pronto atendimento devido a dor abdominal há 3 horas, abrupta, associada a pré-síncope. Nega sintomas gastrointestinais ou urinários. Nega febre. Refere fibrilação atrial, hipertensão arterial, diabete melito tipo 2 e tabagismo prévios. Durante avaliação inicial apresenta-se inquieto, FC: 110 bpm, PA: 145x78 mmHg, TEC: 4s. O abdome é plano, flácido, doloroso à palpação difusa com achado de massa mesogástrica hiperpulsátil. Pulsos periféricos presentes e simétricos. Qual é a conduta?", "a": ["Coleta de d dímero para avaliação de dissecção de aorta", "Coleta de exames laboratoriais, incluindo amilase e gasometria arterial", "Angiotomografia de aorta de urgência para avaliação de rotura de aneurisma de aorta", "Controle de frequência cardíaca e pressão arterial em sala de emergência"], "g": "C", "ar": "Cirurgia Geral", "es": "Cirurgia Vascular", "as_": "Aneurisma de Aorta", "d": "intermediario", "i": null, "x": "A alternativa C está correta. Dicas do enunciado: idoso com **dor abdominal abrupta, massa abdominal pulsátil, pré-síncope, taquicardia e TEC de 4 s** (instabilidade), com fatores de risco cardiovasculares (hipertensão, diabetes, tabagismo): a tríade clássica de **rotura de aneurisma da aorta abdominal**. Por ser emergência cirúrgica de altíssima mortalidade, a prioridade é **confirmar o diagnóstico com angiotomografia de aorta** (exame padrão-ouro) e encaminhar ao tratamento definitivo. A: o D-dímero não tem papel na confirmação. B: exames laboratoriais, amilase e gasometria não são prioridade perante o diagnóstico da rotura. D: controlar a frequência e a pressão não substitui a confirmação diagnóstica. Observação: em instabilidade extrema, o paciente vai direto à sala cirúrgica, sem imagem.", "r": "Diretrizes SVS 2018 para aneurisma de aorta abdominal; Colégio Brasileiro de Cirurgiões."}, {"n": 109, "e": "Homem de 72 anos de idade dá entrada no pronto socorro com icterícia progressiva há 2 meses, associada a dor em hipocôndrio direito e calafrios há 3 dias. Refere também colúria e acolia fecal. Nega diagnóstico prévio de patologia hepatobiliar. Refere hipertensão arterial e diabete melito, controladas com uso de medicação por via oral. Nega cirurgias prévias. Paciente apresenta FC: 110 bpm, PA: 100x60mmHg, TEC: 3 segundos. Ictérico 2+/4+. Abdome plano, flácido, levemente doloroso à palpação de hipocôndrio direito. Restante do exame sem alterações. Exames laboratoriais: Hemograma: Hb: 12g/dL, Ht: 38%, leucócitos: 16350 mm³ (bastões 2% neutrófilos 67% leucócitos 22%), plaquetas: 234 K/µL, PCR: 260 mg/dL, ureia: 67 mg/dL, creatinina: 1,6mg/dL, Na: 134 mEq/L, K: 4,7 mEq/L, bilirrubinas totais: 13,8 mg/dL, bilirrubina direta: 10,4 mg/dL, TGO: 82 U/L, TGP: 49 U/L, gama GT: 845 U/L, fosfatase alcalina: 1147U/L. Realizado ultrassom de abdome superior que evidenciou dilatação de vias biliares intra-hepáticas com presença de massa em topografia de hilo hepático medindo 5x3x4,5 cm. Vesícula biliar normodistendida, com presença de cálculos em seu interior. Qual deve ser a conduta?", "a": ["Derivação biliodigestiva e colecistectomia", "CPRE", "Drenagem transparietohepática", "Colangioressonância"], "g": "C", "ar": "Cirurgia Geral", "es": "Abdome Agudo", "as_": "Colangite Aguda e Vias Biliares", "d": "avancado", "i": null, "x": "A alternativa C está correta pelo gabarito oficial (que não traz comentário). Dicas do enunciado: **icterícia obstrutiva progressiva com colúria e acolia, febre/calafrios, taquicardia, hipotensão relativa, leucocitose e PCR elevada**: **colangite aguda grave** causada por **massa no hilo hepático (tumor de Klatskin)**, com dilatação das vias intra-hepáticas. A prioridade é a **descompressão biliar urgente**, e na obstrução hilar a via transparieto-hepática é a que drena as vias intra-hepáticas acima do bloqueio. A: a derivação cirúrgica em paciente séptico e ictérico tem risco proibitivo. B: a CPRE tem baixa chance de drenar adequadamente no tumor hilar e, quando não, deixa vias contaminadas sem drenagem. D: a colangiorressonância define a anatomia, mas atrasa a drenagem em quadro séptico. Observação: algumas diretrizes aceitam CPRE com drenagem endoscópica; o gabarito escolheu a via percutânea.", "r": "Diretrizes de Tokyo 2018 (colangite aguda); Colégio Brasileiro de Cirurgiões."}, {"n": 110, "e": "Homem de 24 anos de idade foi vítima de ferimento por faca em 7o espaço intercostal, linha axilar média esquerda. Está hemodinamicamente estável e sua radiografia de tórax é normal. Qual deve ser a conduta?", "a": ["Ultrassom de abdome (FAST).", "Tomografia de tórax e abdome.", "Laparoscopia", "Drenagem de tórax"], "g": "C", "ar": "Cirurgia Geral", "es": "Trauma", "as_": "Trauma Abdominal", "d": "intermediario", "i": null, "x": "A alternativa C está correta. Dicas do enunciado: **ferida por arma branca no 7º espaço intercostal, linha axilar média esquerda** (região de **transição toracoabdominal**), com paciente **estável e radiografia normal**. Nessa região a lesão do **diafragma** é frequente e silenciosa, e os métodos preferenciais de investigação são a **laparoscopia** (estáveis) e a laparotomia (instáveis), pela baixa sensibilidade da TC. A: o FAST é pouco sensível para lesão diafragmática. B: a tomografia tem baixa sensibilidade para lesão do diafragma, mesmo em assintomáticos. D: a drenagem de tórax é para hemotórax ou pneumotórax, que a radiografia normal não mostra.", "r": "ATLS 10ª edição; EAST Guideline para lesões diafragmáticas."}, {"n": 111, "e": "Mulher de 62 anos de idade teve diverticulite aguda há 4 meses com resolução após antibioticoterapia por via oral. Refere desde então episódios de cistite associada à pneumatúria. Não apresentou novos episódios de diverticulite. Realizou colonoscopia que evidenciou múltiplos divertículos em cólon sigmoide, com área de fibrose, sendo sugerida associação ao processo inflamatório prévio. Foram realizadas biópsias, ainda sem resultado. Traz o exame de uretrocistografia retrógrada abaixo (contraste na bexiga com extravasamento para o cólon). Qual é o diagnóstico provável e o tratamento para o caso?", "a": ["Câncer colorretal invasivo; estadiamento com TC de tórax e abdome e coleta de marcadores tumorais", "Fístula colovesical; iniciar antibioticoterapia profilática", "Fístula colovesical; realizar colectomia e cistectomia segmentares", "Câncer colorretal invasivo; realizar colectomia e cistectomia segmentares"], "g": "C", "ar": "Cirurgia Geral", "es": "Abdome Agudo", "as_": "Doença Diverticular", "d": "intermediario", "i": "Cistografia com extravasamento de contraste da bexiga para o cólon sigmoide", "x": "A alternativa C está correta. Dicas do enunciado: **diverticulite prévia, cistite de repetição e pneumatúria**, com divertículos e fibrose no sigmoide na colonoscopia (biópsias ainda sem resultado). Dicas da imagem: **contraste da bexiga extravasando para o cólon**, uma comunicação entre os dois: **fístula colovesical**, complicação comum da doença diverticular. A correção é **operatória, com ressecção dos segmentos comprometidos (colectomia e cistectomia segmentares)**. A: não há dado que sustente câncer invasivo, e as biópsias ainda estão pendentes. B: o antibiótico profilático não resolve a fístula, que exige cirurgia. D: o câncer colorretal é diagnóstico de exclusão aqui, e a cirurgia da fístula tem como alvo o processo diverticular, ainda que com ressecção que permita análise histológica.", "r": "ASCRS Guidelines for Left-Sided Colonic Diverticulitis 2020; Sabiston, 20ª ed."}, {"n": 112, "e": "Homem de 73 anos de idade está internado por pancreatite aguda grave há 23 dias. Há 4 dias, apresentou piora do estado geral e aumento da leucocitose, sem melhora com o uso de imipenem. Hoje foi realizada nova tomografia de abdome (grande coleção peripancreática com gás e debris, compatível com necrose infectada). Qual deve ser a conduta?", "a": ["Drenagem transgástrica por endoscopia.", "Necrosectomia por laparotomia.", "Necrosectomia vídeo-laparoscópica.", "Drenagem percutânea guiada por tomografia."], "g": "D", "ar": "Cirurgia Geral", "es": "Abdome Agudo", "as_": "Pancreatite Aguda", "d": "avancado", "i": "TC de abdome com extensa necrose pancreática e coleção peripancreática infectada", "x": "A alternativa D está correta pelo gabarito oficial. Dicas do enunciado: **pancreatite grave há 23 dias, piora clínica e leucocitose crescente apesar do imipenem**. Dicas da imagem: grande coleção peripancreática com gás e debris: **necrose infectada**. A conduta inicial na **abordagem escalonada (step-up approach)** é a **drenagem percutânea guiada por tomografia**, que pode resolver o quadro e evitar a necrosectomia. A: a drenagem transgástrica endoscópica é uma alternativa de step-up em coleções encapsuladas e próximas ao estômago, e o gabarito privilegia o acesso percutâneo. B e C: a necrosectomia por laparotomia ou por vídeo, pela alta mortalidade, fica reservada a casos refratários à drenagem. Observação: as diretrizes atuais consideram a drenagem endoscópica e a percutânea como opções iniciais.", "r": "van Santvoort et al., NEJM 2010 (PANTER); ACG 2024 Guideline."}, {"n": 113, "e": "Mulher, 84 anos de idade dá entrada no PS às 03:00 de um domingo, acompanhada de um dos seus filhos, após queda da própria altura durante ida ao banheiro na madrugada. Paciente deambula no domicílio sem auxílio. Queixa-se de dor no quadril direito e incapacidade de deambulação. Paciente apresenta-se na sala de emergência, deitado na maca, estável hemodinamicamente, queixando-se de dor à mobilização do quadril direito e o membro inferior direito se apresenta segundo a imagem a seguir (encurtado e em rotação externa). É avaliado como apto na avaliação de risco pré-operatório. Qual deve ser a conduta?", "a": ["Considerando-se a idade avançada do paciente, é mais indicado tratamento conservador com repouso absoluto.", "É indicada cirurgia de urgência para fixação externa e melhora do quadro álgico do paciente.", "O tratamento cirúrgico deve ser realizado preferencialmente nas primeiras 48h e a fixação interna é bem indicada.", "O tratamento de imediato é não cirúrgico com realização de fisioterapia para fortalecimento muscular e estímulo à consolidação óssea."], "g": "C", "ar": "Cirurgia Geral", "es": "Ortopedia e Traumatologia", "as_": "Fraturas e Luxações", "d": "intermediario", "i": "Fotografia do membro inferior direito encurtado e em rotação externa (fratura do fêmur proximal)", "x": "A alternativa C está correta. Dicas do enunciado: idosa de 84 anos, **queda da própria altura, dor no quadril e incapacidade de deambular**, que antes caminhava sem auxílio. Dicas da imagem: membro **encurtado e em rotação externa**, típico de **fratura do fêmur proximal**. A maioria dessas fraturas exige **tratamento cirúrgico**, e o atraso sem razão clínica aumenta as complicações (úlceras de pressão, pneumonia, trombose, infecção urinária) e a mortalidade; o ideal é **operar nas primeiras 24-48 horas** (fixação interna ou artroplastia, conforme o tipo). A: o tratamento conservador, com repouso absoluto, fica reservado a pacientes que não deambulam e são muito frágeis. B: a fixação externa não é o método habitual na fratura do quadril. D: o tratamento não cirúrgico com fisioterapia não consolida essa fratura em paciente ativo.", "r": "AAOS Clinical Practice Guideline: Management of Hip Fractures in Older Adults (2021); Campbell's Operative Orthopaedics."}, {"n": 114, "e": "Homem de 46 anos de idade é vítima de atropelamento por carro. A: Via aérea pérvia, saturação de 97% ar ambiente. B: Ausculta e expansibilidade pulmonar simétricas. C: FC: 80bpm, PA: 110 x 70mmHg. D: Glasgow de 15. Sem alterações de pupilas. E: Dor abdominal na fossa ilíaca direita e supra-púbica. As imagens tomográficas estão expostas abaixo (líquido livre na pelve, sem lesão aparente de fígado, baço ou rins). Qual deve ser a conduta?", "a": ["Cistoscopia.", "Laparoscopia.", "Embolização.", "Sondagem vesical"], "g": "B", "ar": "Cirurgia Geral", "es": "Trauma", "as_": "Trauma Abdominal", "d": "avancado", "i": "TC de abdome e pelve com líquido livre na pelve sem lesão de órgão parenquimatoso", "x": "A alternativa B está correta. Dicas do enunciado: paciente **estável hemodinamicamente** após atropelamento, com dor em fossa ilíaca direita e suprapúbica. Dicas da imagem: **líquido livre na pelve sem lesão hepática, esplênica ou renal**. Líquido livre sem lesão de víscera parenquimatosa sugere **lesão de mesentério, de víscera oca ou de bexiga intraperitoneal**, todas de **tratamento cirúrgico**; como o paciente é estável, pode-se usar a **laparoscopia**. A: a cistoscopia não avalia as demais causas. C: a embolização trata sangramento arterial ativo (blush) de víscera parenquimatosa, ausente aqui. D: a sondagem vesical pode mostrar hematúria, mas a ausência de hematúria não afasta lesão e a sonda não investigaria as outras causas.", "r": "ATLS 10ª edição; EAST Guidelines on Blunt Abdominal Trauma."}, {"n": 115, "e": "Homem, 37 anos de idade, foi vítima de ferimento por arma branca (faca de cozinha) na região periumbilical há 1 hora. Admitido no serviço: A: Falando (hálito etílico), saturação de 96% em ar ambiente B: Sem alterações C: FC: 76 bpm, PA: 140x70 mmHg. D: Glasgow 15 E: Obeso (IMC 41kg/m2), com ferimento na parede anterior do abdome, de 2 cm, próximo à cicatriz umbilical, sem sangramento ativo, com dor apenas no local. Dorso sem alterações. Realizado FAST: negativo. Qual deve ser a conduta?", "a": ["Tomografia de abdome.", "Laparoscopia diagnóstica.", "Repetir FAST em 6 horas.", "Radiografia de abdome em 3 posições."], "g": "B", "ar": "Cirurgia Geral", "es": "Trauma", "as_": "Trauma Abdominal", "d": "intermediario", "i": null, "x": "A alternativa B está correta. Dicas do enunciado: **ferimento penetrante na parede anterior do abdome**, estável, com FAST negativo e **obesidade (IMC 41)**. Para confirmar a violação da cavidade peritoneal, a conduta atual é a **laparoscopia diagnóstica**: a exploração digital da ferida deixou de ser usada pelo número de falsos resultados, e a **TC tem sensibilidade questionável**, principalmente em obesos. A: a TC de abdome é pouco sensível para confirmar a violação peritoneal. C: repetir o FAST em 6 horas não confirma violação e atrasa o diagnóstico de lesão de víscera oca. D: a radiografia de abdome em três posições é para pneumoperitônio, com baixo rendimento aqui. Em pacientes instáveis, a laparotomia exploradora é indicada.", "r": "ATLS 10ª edição; WSES Guidelines on Penetrating Abdominal Trauma."}, {"n": 116, "e": "Homem de 54 anos de idade refere abaulamento em região inguinal direita há dois anos, tornando-se irredutível há um mês. Há um dia apresenta dor intensa e hiperemia no local do abaulamento. Refere ainda ter sido submetido a cirurgia para correção de hérnia inguinal bilateral aos 15 anos de idade. Qual deve ser a conduta cirúrgica?", "a": ["Acesso obrigatório por laparotomia devido correção cirúrgica na adolescência.", "Acesso por inguinotomia, apesar da possibilidade de isquemia da alça intestinal herniada.", "Acesso por laparotomia, já que se trata de hérnia inguinal recidivada e encarcerada.", "Há possibilidade de conversão para laparotomia se enterectomia necessária."], "g": "B", "ar": "Cirurgia Geral", "es": "Abdome Agudo", "as_": "Hérnias da Parede Abdominal", "d": "intermediario", "i": null, "x": "A alternativa B está correta pelo gabarito oficial. Dicas do enunciado: **hérnia inguinal recidivada, encarcerada e com sinais inflamatórios** (dor e hiperemia), com suspeita de sofrimento da alça. A correção segue pela **inguinotomia**, com a técnica de Lichtenstein, abrindo o saco herniário e avaliando o conteúdo; na hérnia estrangulada, é possível fazer **enterectomia e anastomose pela própria inguinotomia**. A: não há acesso obrigatório por laparotomia só pela cirurgia na adolescência. C: a recidiva e o encarceramento não impõem a laparotomia. D: a conversão para laparotomia é uma possibilidade, mas o primeiro acesso é a inguinotomia, e tudo costuma se resolver por ela. Observação: a alternativa D, tecnicamente, também descreve uma possibilidade correta; o gabarito indica B.", "r": "HerniaSurge Guidelines 2018; Colégio Brasileiro de Cirurgiões."}, {"n": 117, "e": "Mulher de 81 anos de idade foi encontrada por familiares caída no chão do banheiro de sua residência onde vive sozinha. Foi encontrada desacordada, com ferimento extenso em região de couro cabeludo e face sangrando intensamente. Levada imediatamente ao Pronto Socorro do HC FMUSP, onde foi estabilizada, realizou TC de crânio e foi levada imediatamente ao centro cirúrgico para realizar hemostasia e sutura do ferimento apresentado abaixo (extenso ferimento do couro cabeludo; TC com extenso AVC isquêmico em território de artéria cerebral média à esquerda). É correto afirmar que:", "a": ["O hematoma subdural flagrado na TC de crânio apresenta características de crônico, não sendo relacionado ao trauma atual.", "O hematoma subdural à esquerda, não apresenta desvio de linha média. Há indicação de intubação orotraqueal e realização de TC de controle em 6h.", "Em caso de óbito, há indicação formal de encaminhar paciente ao Instituto Médico Legal.", "Apesar do sangramento intenso em couro cabeludo, normalmente essas lesões não sangram a ponto de chocar o paciente."], "g": "C", "ar": "Cirurgia Geral", "es": "Neurocirurgia", "as_": "Traumatismo Cranioencefálico", "d": "intermediario", "i": "Fotografia de ferimento extenso do couro cabeludo e TC de crânio com extenso AVC isquêmico à esquerda", "x": "A alternativa C está correta. Dicas do enunciado: **idosa encontrada caída**, com **ferimento extenso do couro cabeludo e face** e TC de crânio. Dicas da imagem: a TC mostra **extenso AVC isquêmico em território da artéria cerebral média esquerda**, e não hematoma subdural. Lesões traumáticas (causa externa) e **óbitos suspeitos devem ser encaminhados ao Instituto Médico Legal (IML)**. A e B: as alternativas assumem hematoma subdural, o que a TC não mostra (trata-se de um AVC isquêmico). D: as lesões extensas do couro cabeludo **sangram muito**, podendo causar choque, e se tratam com hemostasia por pontos em X ou chuleio ancorado.", "r": "Colégio Brasileiro de Cirurgiões, Trauma; Resoluções do CFM sobre atestado de óbito e IML."}, {"n": 118, "e": "Mulher de 35 anos de idade é vítima de trauma. Apresenta agitação psicomotora e alteração do nível de consciência. É indicada intubação orotraqueal, entretanto, paciente não permite que a pré-oxigenação seja feita de maneira adequada. Qual deve ser a estratégia para intubá-la?", "a": ["Sequência rápida de intubação", "Sequência atrasada de intubação", "KOBE – ketamine only breathing intubation", "IOT acordado"], "g": "B", "ar": "Cirurgia Geral", "es": "Anestesiologia", "as_": "Via Aérea e Indução Anestésica", "d": "intermediario", "i": null, "x": "A alternativa B está correta. Dicas do enunciado: vítima de trauma **agitada, que não permite a pré-oxigenação**. Na **sequência atrasada de intubação**, dá-se **cetamina 1 mg/kg**, que **dissocia o paciente e permite a pré-oxigenação adequada**; depois complementa-se com mais 1 mg/kg de cetamina e, só então, realiza-se o **bloqueio neuromuscular**. A estratégia evita intubar com hipóxia ou hipotensão, que pioram a mortalidade. A: a sequência rápida exige pré-oxigenação, que a paciente não tolera. C: o KOBE (cetamina sem bloqueador) não é a estratégia padrão e expõe a risco. D: a intubação acordada exige colaboração, que a paciente não oferece.", "r": "Walls Manual of Emergency Airway Management; Weingart, Delayed Sequence Intubation (Ann Emerg Med 2011)."}, {"n": 119, "e": "Homem de 16 anos de idade, é trazido ao pronto-socorro de hospital terciário pelo Serviço de Resgate, devido a queda da bicicleta após colisão em alta velocidade contra anteparo fixo. Paciente relata ter traumatizado a região superior do abdome contra o guidão da bicicleta e refere intensa dor no local. Apresenta ainda trauma craniano, sem perda de consciência, porém refere cefaleia intensa. Nega vômitos. Dados coletados pela equipe do resgate no local do acidente: Pulso=128 bpm, Pressão arterial=130x90mmHg, Frequência respiratória=16 ipm, Saturação de oxigênio= 97% em ar ambiente. Tempo entre acidente e admissão hospitalar: 30 minutos. Na avaliação no pronto-socorro: A: Vias aéreas pérvias, com colar cervical; B: Murmúrios vesiculares presentes bilateralmente, expansibilidade simétrica, tórax indolor à palpação, sem crepitações. FR=16 ipm, saturação de O2 =98% em ar ambiente; C: Pulso = 142 bpm, Pressão arterial =110X70mmHg, sem sangramento visível. Abdome doloroso à palpação em epigástrio e mesogástrio, onde se evidenciam equimose e escoriação. Toque retal sem alterações, diurese clara; D: Escala de Coma de Glasgow = 15, pupilas isocóricas e fotorreagentes; E: Sem outras alterações. Quanto ao caso, assinale a imagem tomográfica que melhor representa o mecanismo de trauma:", "a": ["Imagem (A) — TC de abdome com aneurisma de aorta, sem outros achados.", "Imagem (B) — TC de abdome com contraste oral e alças de delgado com nível líquido e uma alça edemaciada.", "Imagem (C) — TC de abdome com pâncreas repleto de calcificações (pancreatite crônica).", "Imagem (D) — TC de abdome com lesão esplênica, provavelmente traumática."], "g": "D", "ar": "Cirurgia Geral", "es": "Trauma", "as_": "Trauma Abdominal", "d": "intermediario", "i": "quatro tomografias de abdome (A a D) para escolher a lesão compatível com o trauma", "x": "A alternativa D está correta pelo gabarito oficial. Dicas do enunciado: adolescente com **trauma de alta energia em abdome superior (guidão), dor em epigástrio e mesogástrio, equimose e escoriação, taquicardia crescente (128 para 142) e PA em queda**: sinais de **hemorragia intra-abdominal**. A imagem que representa o mecanismo é a **lesão esplênica**, a víscera maciça mais frequentemente lesada no trauma abdominal fechado. A: o aneurisma de aorta não é compatível com a idade e o mecanismo. B: a imagem com alças de delgado com nível líquido e uma alça edemaciada corresponde a outro quadro (obstrução ou lesão de alça). C: a pancreatite crônica com calcificações é doença crônica e não explica o trauma agudo. Observação: o enunciado menciona dor em epigástrio e mesogástrio, o que também poderia sugerir lesão pancreática ou duodenal; o gabarito indica D.", "r": "ATLS 10ª edição; EAST Guidelines for Blunt Splenic Injury."}, {"n": 120, "e": "Homem de 40 anos de idade, policial, é vítima de lesão por arma de fogo em transição toracoabdominal. Devido a instabilidade hemodinâmica persistente, foi indicada laparotomia exploradora com achado de lesão hepática transfixante, mantendo sangramento ativo. Das condutas intraoperatórias abaixo listadas, qual a que representa a técnica adequada para o controle de sangramentos nesse tipo de lesão?", "a": ["Imagem (A) — tamponamento do trajeto da lesão com balão (sonda de Sengstaken-Blakemore ou balão confeccionado) no trajeto do ferimento.", "Imagem (B) — sutura simples do parênquima com fio e agulha.", "Imagem (C) — hemostasia direta de vasos com clipes e fios.", "Imagem (D) — tamponamento hepático com compressas (packing)."], "g": "A", "ar": "Cirurgia Geral", "es": "Trauma", "as_": "Trauma Abdominal", "d": "avancado", "i": "quatro desenhos de técnicas de controle de lesão hepática (balão, sutura, ligadura direta e packing)", "x": "A alternativa A está correta pelo gabarito oficial. Dicas do enunciado: **ferimento por arma de fogo**, paciente **instável**, laparotomia com **lesão hepática transfixante e sangramento ativo**. A técnica descrita para lesões transfixantes é o **tamponamento com balão**: usar um balão (como o de **Sengstaken-Blakemore**, criado para hemorragia varicosa) e **projetá-lo no trajeto do ferimento** para controle do sangramento. B: a sutura simples do parênquima não controla a hemorragia de trajeto profundo. C: a ligadura direta de vasos serve para sangramentos localizados, não para o trajeto transfixante. D: o **packing hepático** é uma boa opção em traumas hepáticos contusos ou complexos, mas o gabarito indica o balão para a lesão transfixante. Lembre: o divisor das condutas no trauma abdominal é a hemodinâmica: instáveis operam; estáveis podem ser conservadores ou embolizados se houver blush.", "r": "ATLS 10ª edição; Mattox, Trauma, 8ª ed."}];
const CHAVE="esc-simulado-"+document.title;
let resp={};try{resp=JSON.parse(localStorage.getItem(CHAVE)||"{}")}catch(e){}
function salvar(){try{localStorage.setItem(CHAVE,JSON.stringify(resp))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const negrito=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
const $=id=>document.getElementById(id);
let atual=0;
const areas=[...new Set(DADOS.map(d=>d.ar))];
$("fArea").innerHTML='<option value="">todas</option>'+areas.map(a=>`<option>${esc(a)}</option>`).join("");
function lista(){return DADOS.filter(d=>(!$("fArea").value||d.ar===$("fArea").value)&&(!$("fSit").value||($("fSit").value==="nao"?!resp[d.n]:resp[d.n]&&resp[d.n]!==d.g)))}
function grade(){
  const l=lista();
  $("grade").innerHTML=l.map(d=>`<button data-n="${d.n}" class="${resp[d.n]?(resp[d.n]===d.g?"ok":"err"):""} ${DADOS[atual]&&DADOS[atual].n===d.n?"cur":""}">${d.n}</button>`).join("");
  $("grade").querySelectorAll("button").forEach(b=>b.onclick=()=>{atual=DADOS.findIndex(d=>d.n==b.dataset.n);tudo()});
  const feitas=DADOS.filter(d=>resp[d.n]),certas=feitas.filter(d=>resp[d.n]===d.g);
  $("placar").textContent=`${feitas.length}/${DADOS.length} respondidas — ${certas.length} certas`+(feitas.length?` (${Math.round(100*certas.length/feitas.length)}%)`:"");
}
function questao(){
  const d=DADOS[atual],r=resp[d.n];
  $("q").innerHTML=`<div class="meta">Questão ${d.n} · ${esc(d.ar)} › ${esc(d.es)} › ${esc(d.as_)}</div>`+
  (d.i?`<div class="img">Esta questão tem figura no caderno original: ${esc(d.i)}.</div>`:"")+
  `<div class="enun">${esc(d.e)}</div>`+
  d.a.map((t,i)=>{const L="ABCD"[i];let c="alt";if(r){if(L===d.g)c+=" ok";else if(L===r)c+=" err"}return `<button class="${c}" data-l="${L}"${r?" disabled":""}><b>${L}</b><span>${esc(t)}</span></button>`}).join("")+
  (r?`<div class="expl"><span class="res">${r===d.g?"Acertou.":"Errou."} Gabarito: ${d.g}.</span>\n${negrito(d.x)}<div class="ref">Referências: ${esc(d.r)}</div></div>`:"");
  $("q").querySelectorAll(".alt").forEach(b=>b.onclick=()=>{resp[d.n]=b.dataset.l;salvar();tudo()});
  $("ant").disabled=atual===0;$("prox").disabled=atual===DADOS.length-1;
}
function tudo(){grade();questao();window.scrollTo(0,0)}
$("ant").onclick=()=>{atual--;tudo()};$("prox").onclick=()=>{atual++;tudo()};
$("fArea").onchange=$("fSit").onchange=()=>{const l=lista();if(l.length)atual=DADOS.findIndex(d=>d.n===l[0].n);tudo()};
$("zerar").onclick=()=>{if(confirm("Apagar suas respostas deste simulado?")){resp={};salvar();tudo()}};
tudo();
</script></body></html>
