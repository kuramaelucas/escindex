sição de potássio**, **liberar a dieta** e usar **ondansetrona** se houver vômitos; a acidose geralmente se corrige com a reidratação. A: o bicarbonato só se indica com acidose grave e persistente, e a infusão de KCl rápida a 40 mEq/L por 1 hora é perigosa. C: manter jejum por acidose não é necessário e atrasa a recuperação. D: o bicarbonato não é indicado neste cenário.", "r": "Manejo do Paciente com Diarreia (Ministério da Saúde, 2024); Tratado de Pediatria SBP."}, {"n": 47, "e": "Criança de 2 anos portadora de malformação do trato urinário (duplicidade pielocalicial) com história de infecções urinárias de repetição, sendo a última infecção por pseudomonas há 1 mês com tratamento por 3 dias, é levada ao hospital com febre e dor abdominal. Coletado exames que mostraram: Hemograma com leucocitose de 21.000/mm3 com predomínio de neutrófilos e urina tipo 1 coletada por sonda vesical com 68.000 leucócitos/ campo e nitrito negativo. Qual deve ser a conduta?", "a": ["Hospitalização com início imediato de antibiótico com cobertura para pseudomonas até resultado de urocultura e após a alta realização de cintilografia com DTPA e urografia excretora.", "Hospitalização e inicio de antibiótico somente após resultado de urocultura, visto que com nitrito negativo o agente deve ser atípico. Após a alta completar a investigação com uretrocistomicccional (UCM).", "Hospitalização com início imediato de antibiótico com cobertura para bactéria gram positiva, pois a pesquisa de nitrito veio negativa e investigação após a alta com uretrocistomiccional (UCM).", "Hospitalização com início imediato de antibiótico com cobertura para pseudomonas, até resultado de cultura e após a alta realização de cintilografia com DMSA e Uretrocistomiccional (UCM)."], "g": "D", "ar": "Clínica Médica", "es": "Infectologia", "as_": "Infecção do Trato Urinário", "d": "intermediario", "i": null, "x": "A alternativa D está correta. Dicas do enunciado: criança de 2 anos com **malformação (duplicidade pielocalicial), ITUs de repetição** (a última por *Pseudomonas*) e agora **febre, dor abdominal, leucocitose com neutrofilia e piúria (68.000 leucócitos)**: **pielonefrite**, em paciente de risco. Indica-se **internação e antibiótico imediato com cobertura para pseudomonas**, até a cultura. Após a alta, investiga-se com **cintilografia com DMSA** (cicatrizes) e **uretrocistografia miccional (UCM)** (refluxo e anomalias). A: DTPA e urografia excretora não são os exames de escolha para essa investigação. B: não se espera a cultura para tratar uma criança febril com piúria; nitrito negativo não afasta ITU, pois nem todos os germes (como *Pseudomonas* e gram-positivos) o produzem. C: a cobertura de gram-positivos não é a indicada com antecedente de pseudomonas.", "r": "Diretriz de ITU em Pediatria (SBP, 2016); AAP 2011 UTI Guideline."}, {"n": 48, "e": "Menino de 8 anos, foi levado à unidade básica de saúde com queixa de astenia (não quer mais jogar bola, subir escada ou caminhar), mudança de comportamento (irritabilidade acentuada), náuseas e vômitos pela manhã e diplopia, sem história de doença crônica ou febre. Ao exame físico você observa paciente descorado +/4+, PA 120x80mmHg, FC = 105 bpm, FR = 24 ipm, t° = 36,9°C; sem dor, saturação de 97% em ar ambiente. Qual é a principal hipótese diagnóstica e qual deve ser a conduta?", "a": ["Processo expansivo de SNC e ressonância magnética de crânio, após cuidados terapêuticos iniciais.", "Miocardite viral e ecocardiograma de urgência, após cuidados terapêuticos iniciais.", "Processo expansivo de SNC e encaminhamento para serviço terciário de saúde, após cuidados terapêuticos iniciais.", "Miocardite viral e encaminhamento para serviço terciário de saúde, após cuidados terapêuticos iniciais."], "g": "C", "ar": "Cirurgia Geral", "es": "Neurocirurgia", "as_": "Tumores do Sistema Nervoso Central", "d": "intermediario", "i": null, "x": "A alternativa C está correta. Dicas do enunciado: escolar com **astenia progressiva, mudança de comportamento, vômitos matinais e diplopia**, sem febre: sinais de **hipertensão intracraniana por processo expansivo do SNC** (tumor, frequentemente de fossa posterior). As suspeitas de tumor de SNC devem ser **encaminhadas prontamente ao serviço terciário**, onde há exames e tratamento disponíveis, após os cuidados iniciais. A: a ressonância é o exame de eleição, mas sua execução pela rede básica é demorada e atrasa o diagnóstico. B e D: a miocardite viral não explicaria, por si, a mudança comportamental aguda, os vômitos matinais e a diplopia, e o paciente não tem sinais de insuficiência cardíaca.", "r": "Tratado de Pediatria SBP; Sinais de alerta para tumores do SNC na infância (INCA)."}, {"n": 49, "e": "Cardiotocografia durante o trabalho de parto está indicada nas gestações de alto risco e no parto medicado no baixo risco, sendo as desacelerações ou DIPs os parâmetros mais importantes a serem observados. É CORRETO afirmar que:", "a": ["O DIP I ou cefálico é indicativo de hipoxemia fetal.", "O DIP III ou umbilical, quando presente no parto, é indicativo de sofrimento fetal agudo.", "No parto, as acelerações transitórias são o marcador mais importante de bem estar fetal.", "O DIP II, quando frequente e associado às alterações da frequência cardíaca fetal, é indicativo de sofrimento fetal agudo."], "g": "D", "ar": "Ginecologia e Obstetrícia", "es": "Obstetrícia", "as_": "Vitalidade Fetal, Líquido Amniótico e Indução do Parto", "d": "intermediario", "i": null, "x": "A alternativa D está correta. Dicas do enunciado: o **DIP II (tardio)** começa cerca de 30 segundos após a contração e reflete a **resposta do coração fetal à hipóxia (insuficiência uteroplacentária)**; quando é frequente (mais de 50% das contrações), não volta à linha de base e se associa a **taquicardia ou perda da variabilidade**, indica **sofrimento fetal**. A: o DIP I (precoce, cefálico) ocorre junto com a contração e decorre da compressão do polo cefálico, mediada pelo reflexo vagal, e não indica hipoxemia. B: o DIP III (variável, umbilical) não é sinal obrigatório de sofrimento; é desfavorável se durar mais de 30 segundos e ficar abaixo de 60 bpm, com recuperação lenta. C: as acelerações são sinal de bem-estar, mas **sua ausência no trabalho de parto não é sinal de sofrimento**, e não são o marcador mais importante.", "r": "Febrasgo, Avaliação da vitalidade fetal; ACOG Practice Bulletin 106."}, {"n": 50, "e": "Texto para as questões 50 e 51: Mulher, 37 anos de idade, 3G2Pc, está gestante de 32+3 semanas e procura o pronto socorro com queixa de sangramento vaginal há 30 minutos. Nega cefaleia, escotomas, epigastralgia e refere boa movimentação fetal. Paciente não traz caderneta de pré-natal e refere que já realizou 3 consultas na UBS. Ao exame: bom estado geral, descorada 1+, hidratada, anictérica, afebril; PA: 120x80 mmHg, FC: 95 bpm, T: 36,5°C BCF: 145 bpm rítmico; AU: 32 cm; Tônus uterino fisiológico; Dinâmica uterina ausente. Exame especular: sangramento coletado em fundo de saco em moderada quantidade. Cardiotocografia: (traçado com linha de base e variabilidade preservadas, acelerações presentes e sem desacelerações). Qual(is) exame(s) devem ser solicitados?", "a": ["Ressonância Magnética", "Ultrassonografia transvaginal", "Hemograma e coagulograma", "Tipagem sanguínea e PAIc"], "g": "B", "ar": "Ginecologia e Obstetrícia", "es": "Obstetrícia", "as_": "Sangramentos na Gestação", "d": "fundamental", "i": "Cardiotocografia anteparto (traçado no texto do caso)", "x": "A alternativa B está correta. Dicas do enunciado: **sangramento de segundo/terceiro trimestre, indolor, com útero relaxado (tônus fisiológico, sem dinâmica), bom estado materno e fetal**, em mulher com **antecedentes obstétricos (iteratividade) e idade materna avançada**: a principal hipótese é **placenta prévia**. O exame de escolha é a **ultrassonografia (preferencialmente transvaginal)**, que localiza a placenta e afasta descolamento e vasa prévia, antes de se procurar acretismo. A: a ressonância é para suspeita de acretismo, depois. C: hemograma e coagulograma são complementares, não o exame que define a causa. D: tipagem e PAIc fazem parte do pré-natal e não esclarecem o sangramento.", "r": "Febrasgo, Placenta Prévia; ACOG Practice Bulletin 231."}, {"n": 51, "e": "Texto para as questões 50 e 51: Mulher, 37 anos de idade, 3G2Pc, está gestante de 32+3 semanas e procura o pronto socorro com queixa de sangramento vaginal há 30 minutos. Nega cefaleia, escotomas, epigastralgia e refere boa movimentação fetal. Paciente não traz caderneta de pré-natal e refere que já realizou 3 consultas na UBS. Ao exame: bom estado geral, descorada 1+, hidratada, anictérica, afebril; PA: 120x80 mmHg, FC: 95 bpm, T: 36,5°C BCF: 145 bpm rítmico; AU: 32 cm; Tônus uterino fisiológico; Dinâmica uterina ausente. Exame especular: sangramento coletado em fundo de saco em moderada quantidade. Cardiotocografia: (traçado com linha de base e variabilidade preservadas, acelerações presentes e sem desacelerações). Qual é a classificação da cardiotocografia?", "a": ["Categoria I", "Categoria II", "Feto ativo", "Feto hipoativo reativo"], "g": "C", "ar": "Ginecologia e Obstetrícia", "es": "Obstetrícia", "as_": "Vitalidade Fetal, Líquido Amniótico e Indução do Parto", "d": "intermediario", "i": "Cardiotocografia anteparto com linha de base de 110-160 bpm, variabilidade presente, acelerações e sem desacelerações", "x": "A alternativa C está correta. Dicas do enunciado: trata-se de uma **cardiotocografia anteparto** (gestante fora de trabalho de parto, sem dinâmica). Dicas da imagem: **linha de base entre 110 e 160 bpm, variabilidade presente, acelerações presentes e ausência de desacelerações**, pontuando 5 pontos, o que caracteriza **feto ativo**. A e B: as categorias I, II e III são usadas na cardiotocografia **intraparto**. D: \"hipoativo reativo\" é um perfil intermediário, com poucas acelerações e variabilidade reduzida, o que não é o traçado descrito.", "r": "Febrasgo, Cardiotocografia; Manual de Assistência ao Pré-natal."}, {"n": 52, "e": "Mulher de 23 anos de idade, primigesta, 24 semanas de gestação, procura o pronto atendimento com queixa de disúria e polaciúria há 3 dias. Nega outras queixas. O médico de plantão checa o cartão de pré-natal e identifica uma glicemia de jejum realizada com 10 semanas de 91 mg/dL e um teste de tolerância oral a glicose (TOTG) 75g realizado com 21 semanas de 94 mg/dL (jejum) / 145 mg/dL (pós 1 hora) / 110 mg/dL (pós 2 horas). É correto afirmar que:", "a": ["A paciente deverá repetir o exame de TOTG pois foi realizado em período incorreto no pré-natal.", "O TOTG 75g está normal e sua indicação adequada, pois recomenda-se a realização do exame para investigação de diabetes mellitus gestacional entre a 21ª e 24ª semanas de gestação.", "A paciente não tem diagnóstico de diabetes mellitus gestacional, pois o diagnóstico, feito por glicemia de jejum tem como valor positivo acima de 126 mg/dL, sendo que pode ser feito em qualquer idade gestacional.", "A paciente realizou corretamente a glicemia de jejum na primeira consulta de pré-natal, pois deve-se avaliar gestantes sem diagnóstico prévio de diabetes mellitus com objetivo de detectar overt diabetes versus diabetes mellitus gestacional."], "g": "D", "ar": "Ginecologia e Obstetrícia", "es": "Obstetrícia", "as_": "Diabetes Mellitus Gestacional", "d": "intermediario", "i": null, "x": "A alternativa D está correta. Dicas do enunciado: a **glicemia de jejum na primeira consulta** serve para detectar **diabetes prévio (overt)** ou DMG precoce, sendo normal **abaixo de 92 mg/dL**. A glicemia de jejum de 91 mg/dL foi normal, e o rastreio seguinte é o **TOTG 75 g entre 24 e 28 semanas**, com valores de referência de jejum < 92, 1 h < 180 e 2 h < 153 mg/dL. O TOTG feito com 21 semanas (jejum 94, ≥ 92) já mostrou **valor alterado em jejum**, o que fecha o diagnóstico de DMG, e não precisa repetir o exame. A: o resultado já é diagnóstico, e repetir não é necessário. B: o TOTG de 21 semanas não está no período preconizado, e o jejum de 94 está alterado, e não normal. C: o ponto de corte de 126 mg/dL é de diabetes prévio, e na gestação o DMG se diagnostica com jejum ≥ 92.", "r": "Febrasgo, Diabetes Mellitus Gestacional; Diretriz da SBD 2023."}, {"n": 53, "e": "Durante o pré-natal, a pesquisa de toxoplasmose pode identificar não apenas as gestantes infectadas, mas também as susceptíveis. Diante do resultado do exame realizado no primeiro trimestre pode-se afirmar que:", "a": ["IgG positivo e IgM negativo: infecção crônica; requer nova investigação no 3° trimestre.", "IgG e IgM negativos: gestante suscetível; a sorologia deve ser repetida no último trimestre.", "IgG negativa e IgM positiva: infecção aguda inicial; a sorologia ser repetida após 2 semanas.", "IgG e IgM positivas: infecção subaguda ou recente; a dosagem IgA deve ser solicitada."], "g": "C", "ar": "Ginecologia e Obstetrícia", "es": "Obstetrícia", "as_": "Assistência Pré-natal", "d": "intermediario", "i": null, "x": "A alternativa C está correta pelo gabarito oficial. Dicas do enunciado: **IgG negativa e IgM positiva** podem indicar **infecção aguda inicial** ou **IgM falso-positiva**; se a IgG se mantém negativa, repete-se a sorologia em **duas semanas** para confirmação. A: IgG positivo e IgM negativo é infecção crônica e **não requer repetição** durante o pré-natal. B: IgG e IgM negativas indicam gestante suscetível, e a conduta preconizada é **repetir a sorologia bimensalmente** (a cada 2 meses). D: IgG e IgM positivas pedem o **teste de avidez de IgG**: baixa avidez (< 30%) sugere infecção aguda; alta avidez (> 60%) com menos de 4 meses indica infecção antiga.", "r": "Febrasgo, Toxoplasmose na Gestação; Caderno de Atenção ao Pré-natal de Baixo Risco (Ministério da Saúde)."}, {"n": 54, "e": "Secundigesta com um parto normal domiciliar anterior, idade gestacional de 28 semanas, portadora de tipagem sanguínea Rh negativo Du negativo, com parceiro Rh positivo, realizou Pesquisa de anticorpos irregulares (PAIC) que se revelou positivo para anti-D no valor de 1:64. Por tal motivo foi solicitado avaliação dopplervelocimétrica do pico sistólico da Artéria Cerebral Média (ACM), e este mostrou valor de 62 cm/s. A tabela que traz a mediana de picos sistólicos de ACM para cada idade gestacional (semanas; mediana cm/s): 26, 33,6; 28, 36,9; 30, 40,5; 32, 44,4; 34, 48,7; 36, 53,5. Qual deve ser a conduta?", "a": ["Resolução da gestação.", "Conduta expectante com acompanhamento semanal do pico sistólico da artéria cerebral média.", "Cordocentese para verificar hematimetria fetal e necessidade de transfusão intrauterina.", "Repetir Coombs indireto e Doppler de artéria cerebral média em quatro semanas."], "g": "C", "ar": "Ginecologia e Obstetrícia", "es": "Obstetrícia", "as_": "Aloimunização Rh e Doença Hemolítica Perinatal", "d": "avancado", "i": "Tabela com a mediana do pico sistólico da ACM por idade gestacional", "x": "A alternativa C está correta. Dicas do enunciado: gestante Rh negativo, com **parto domiciliar prévio (provavelmente sem imunoglobulina anti-D)** e **PAIC com anti-D 1:64 (título crítico ≥ 1:8)**. Com idade gestacional acima de 24 semanas, faz-se a **dopplervelocimetria da ACM**: o pico de **62 cm/s** na idade de 28 semanas (mediana 36,9) equivale a **1,68 MoM**, acima de **1,5 MoM**, indicando **anemia fetal moderada a grave**. Em gestação com menos de 35 semanas, a conduta é a **cordocentese para medir o hematócrito fetal**: acima de 30%, seguimento com hematócritos seriados; abaixo de 30%, **transfusão intrauterina**. A: resolver a gestação com 28 semanas é precoce e de alto risco para o neonato. B e D: esperar e repetir exames deixaria a anemia grave sem diagnóstico confirmado.", "r": "Febrasgo, Doença Hemolítica Perinatal; ACOG Practice Bulletin 181; Mari et al., NEJM 2000."}, {"n": 55, "e": "Você está atendendo em uma UBS e chega para a primeira consulta de pré-natal uma paciente de 25 anos de idade, 2G1Pn, idade gestacional de 11 semanas e previamente hígida. Traz exames laboratoriais: Hb: 12,5 g/dL; Ht: 36%; Glicemia jejum: 85 mg/dL; Tipagem sanguínea: A negativo; coombs indireto: negativo; Urina 1: normal; Urocultura: negativa. Exame do parceiro: Tipagem sanguínea: A positivo. Qual deve ser a conduta?", "a": ["Solicitar novo coombs indireto com 20 semanas", "Solicitar novo coombs indireto com 27 semanas", "Solicitar novo coombs indireto mensalmente", "Solicitar novo coombs indireto a cada 2 meses"], "g": "C", "ar": "Ginecologia e Obstetrícia", "es": "Obstetrícia", "as_": "Aloimunização Rh e Doença Hemolítica Perinatal", "d": "intermediario", "i": null, "x": "A alternativa C está correta pelo gabarito oficial. Dicas do enunciado: gestante **Rh negativo, Coombs indireto negativo (não sensibilizada)** e parceiro Rh positivo. As Rh negativo com Coombs indireto negativo devem **repetir o exame mensalmente** durante o pré-natal e receber a **imunoglobulina anti-D com 28 semanas** se o Coombs se mantiver negativo, além do parto de Rh positivo. A: repetir apenas com 20 semanas deixa grande intervalo sem vigilância. B: repetir somente com 27 semanas também. D: a cada 2 meses é intervalo mais longo que o preconizado. Observação: o Ministério da Saúde propõe repetir o Coombs indireto com 28 semanas e administrar a imunoglobulina; o protocolo do gabarito é mensal.", "r": "Febrasgo, Aloimunização Rh; Manual de Gestação de Alto Risco (Ministério da Saúde)."}, {"n": 56, "e": "Mulher de 21 anos de idade, 3G0P2A, sem curetagem, gestante de 7 semanas e 1 dia, chega ao pronto atendimento com queixa de sangramento vaginal há 2 horas. Ao exame: Bom estado geral, corada, hidratada, anictérica e afebril. PA: 130x70 mmHg, FC 100 bpm T: 36,5°C. Abdome indolor à palpação. Exame especular: sangramento coletado em moderada quantidade. Solicitado ultrassonografia (embrião com batimentos cardíacos presentes). Qual deve ser a conduta?", "a": ["Retorno em 15 dias para novo exame", "Internar para realizar curetagem uterina", "Usar progesterona via vaginal e repouso", "Seguir com as consultas de pré-natal"], "g": "D", "ar": "Ginecologia e Obstetrícia", "es": "Obstetrícia", "as_": "Abortamento", "d": "fundamental", "i": "USG com saco gestacional e embrião com batimentos cardíacos presentes", "x": "A alternativa D está correta. Dicas do enunciado: gestante de 7 semanas com **sangramento vaginal moderado, indolor**, sem alteração hemodinâmica, e **USG com embrião e batimentos cardíacos presentes**: **ameaça de abortamento**. A orientação é **seguir o pré-natal**, sem repetir o exame de rotina, já que não há tratamento que evite o abortamento. A: não há necessidade de repetir o exame em 15 dias sem mudança clínica. B: a curetagem é para abortamento incompleto ou retido, que não é o caso, já que o embrião está vivo. C: a progesterona e o repouso **não reduzem o risco de abortamento** em ameaça.", "r": "Febrasgo, Abortamento; Caderno de Atenção ao Pré-natal de Baixo Risco."}, {"n": 57, "e": "Mulher de 24 anos de idade, 3 Gesta, 2 Para, tem tipagem sanguínea A, RhD negativo, e o marido apresenta tipagem sanguínea O, RhD positivo. Encontra-se na 28ª semana da gestação, tem título de 1:128 no exame da pesquisa de anticorpos irregulares contra o antígeno D. Ao exame ultrassonográfico, o volume de líquido amniótico é normal, o feto não apresenta edema ou derrames cavitários, e não há alterações morfológicas. É correto afirmar que:", "a": ["O feto pode estar anêmico e é necessária a avaliação Dopplervelo-cimétrica da artéria cerebral média fetal.", "O feto está anêmico e deve ser tratado pela transfusão intrauterina.", "O feto não está anêmico e os exames devem ser repetidos em 3 semanas.", "O feto não está anêmico e a gestante deve receber imunoglobulina anti-D."], "g": "A", "ar": "Ginecologia e Obstetrícia", "es": "Obstetrícia", "as_": "Aloimunização Rh e Doença Hemolítica Perinatal", "d": "intermediario", "i": null, "x": "A alternativa A está correta. Dicas do enunciado: gestante **Rh negativo aloimunizada, com PAIC anti-D 1:128 (≥ 1:8)** aos 28 semanas e ultrassom sem hidropsia. O método atual para avaliar a **anemia fetal** é a **dopplervelocimetria da artéria cerebral média**: velocidade sistólica acima de **1,5 MoM** indica anemia moderada a grave e a necessidade de cordocentese. B: não se pode afirmar anemia sem o Doppler e a cordocentese. C: sem o Doppler não se sabe se o feto está anêmico, e a repetição em 3 semanas deixa a gestante sem avaliação. D: uma vez aloimunizada, a gestante **não deve receber imunoglobulina anti-D**, que serve para prevenir a sensibilização.", "r": "Febrasgo, Doença Hemolítica Perinatal; ACOG Practice Bulletin 181."}, {"n": 58, "e": "Primigesta, 34 anos de idade, 38 semanas de gestação, está na sala de PPP (pré parto, parto e puerpério). A paciente se encontra em fase ativa de trabalho de parto, sem analgesia e 9 cm de dilatação. Você decide instalar uma cardiotocografia intraparto (traçado com linha de base entre 110 e 160 bpm, variabilidade presente e desacelerações precoces sincrônicas com as contrações). Qual deve ser a conduta?", "a": ["Indicar cesárea.", "Indicar analgesia.", "Expectante.", "Indicar medidas de reanimação intrauterina."], "g": "C", "ar": "Ginecologia e Obstetrícia", "es": "Obstetrícia", "as_": "Trabalho de Parto", "d": "fundamental", "i": "Cardiotocografia intraparto com desacelerações precoces (DIP I)", "x": "A alternativa C está correta. Dicas do enunciado: **fase ativa, 9 cm de dilatação**, cardiotocografia **categoria I**: **linha de base de 110 a 160 bpm, variabilidade presente e desacelerações precoces** (DIP I), que decorrem da compressão do polo cefálico e **não indicam hipóxia**. A conduta é **expectante**, mantendo a vigilância. A: não há indicação de cesárea com traçado tranquilizador. B: a analgesia depende do desejo e da dor da paciente, não do traçado. D: as medidas de reanimação intrauterina são para categoria II ou III, com alteração de vitalidade.", "r": "Febrasgo, Assistência ao Trabalho de Parto; ACOG Practice Bulletin 106."}, {"n": 59, "e": "Primigesta, 19 anos de idade, com 23 semanas, chega ao pronto-socorro com queixa de dor intensa e perda de líquido. Sem doenças prévias, realizando pré-natal de baixo risco. Ao exame clínico: Bom estado geral, corada, hidratada, anictérica, afebril. PA 110x60 mmHg, FC 100 bpm, Temp 37,7ºC. Dinâmica uterina 2 contrações de 40 segundos em 10 minutos. Especular: saída de líquido claro. Toque vaginal: colo fino, anterior, pérvio para 2 centímetros. Na semana anterior a paciente havia realizado o seguinte exame e não havia levado para seu pré-natalista (ultrassonografia transvaginal do colo uterino com medida de 1,95 cm). Qual conduta deveria ter sido realizada na consulta de pré natal?", "a": ["Progesterona", "Antibiótico", "Corticóide", "Cerclagem"], "g": "A", "ar": "Ginecologia e Obstetrícia", "es": "Obstetrícia", "as_": "Trabalho de Parto Pré-termo, Prematuridade e Rotura de Membranas", "d": "intermediario", "i": "USG transvaginal do colo uterino com comprimento de 1,95 cm", "x": "A alternativa A está correta. Dicas do enunciado: primigesta de baixo risco, sem prematuridade prévia, cuja USG do colo uterino aos **22-23 semanas mostrou colo curto (1,95 cm; < 2,5 cm)**. Em **colo curto sem antecedente de parto prematuro**, a conduta é **progesterona vaginal** de forma contínua do diagnóstico até 36 semanas. B: não há infecção aparente no pré-natal, e o antibiótico não previne a prematuridade. C: o corticoide é para maturação pulmonar quando há risco de parto nos próximos 7-15 dias e feto viável, o que não era o caso na consulta. D: a cerclagem se indica em insuficiência cervical com história de perdas ou colo muito curto (< 1,5 cm) com história de prematuridade; antes não havia indicação.", "r": "Febrasgo, Prevenção da Prematuridade; SMFM Consult Series 2012."}, {"n": 60, "e": "A toxoplasmose é uma doença de distribuição mundial, geralmente assintomática. No entanto, quando acomete a mulher durante a gravidez, pode acarretar infecção fetal com elevada morbiletalidade. Em vista disso, o rastreamento desta infecção faz parte dos exames de rotina no prénatal. Considerando o rastreio no primeiro trimestre da gravidez é correto afirmar que:", "a": ["Diante de sorologia negativa (IgG e IgM) não há necessidade de exames adicionais durante a gravidez em curso.", "Diante de sorologia positiva (IgG e IgM) está indicado o teste de IgM para toxoplasmose.", "Diante de teste de avidez de IgG para toxoplasmose abaixo de 30% está indicado o tratamento materno com espiramicina.", "Diante de infecção materna aguda, a infecção fetal deverá ser confirmada pelo teste de avidez de IgM para toxoplasmose no líquido amniótico."], "g": "C", "ar": "Ginecologia e Obstetrícia", "es": "Obstetrícia", "as_": "Assistência Pré-natal", "d": "intermediario", "i": null, "x": "A alternativa C está correta. Dicas do enunciado: a **avidez de IgG baixa (< 30%)** indica **infecção aguda (menos de 4 meses)** e, nesse caso, está indicado o **tratamento materno com espiramicina** para reduzir a transmissão ao feto; avidez alta (> 60%) sugere infecção antiga. A: gestantes IgG e IgM negativas são **suscetíveis**, e a sorologia deve ser repetida **a cada 2 meses**. B: com IgG e IgM positivas, o teste indicado é a **avidez de IgG**, e não o IgM (já realizado). D: a infecção fetal se confirma por **PCR no líquido amniótico** ou por anticorpos IgM no sangue fetal obtido por cordocentese, e não por avidez de IgM.", "r": "Febrasgo, Toxoplasmose na Gestação; Ministério da Saúde, Pré-natal de Baixo Risco."}, {"n": 61, "e": "Mulher de 26 anos de idade, nuligesta, sem comorbidades, realizou colpocitologia oncótica que revelou lesão intraepitelial de alto grau. Vem hoje para a realização de colposcopia, com a imagem abaixo (epitélio acetobranco denso, com área de grande extensão no colo). Qual deve ser a conduta?", "a": ["Conização", "Curetagem", "Biópsia", "Cauterização"], "g": "C", "ar": "Ginecologia e Obstetrícia", "es": "Oncologia Ginecológica", "as_": "Câncer de Colo do Útero", "d": "fundamental", "i": "Colposcopia com epitélio acetobranco denso de grande extensão no colo uterino", "x": "A alternativa C está correta. Dicas do enunciado: citologia com **lesão intraepitelial de alto grau (LIE-AG)** em mulher de 26 anos, e a colposcopia mostra **epitélio acetobranco denso**, alteração maior de alta suspeita para NIC. A conduta é **biópsia dirigida**, para obter o diagnóstico histológico antes de tratar. A: a conização é o tratamento excisional, depois da confirmação histológica, e ainda mais em nuligesta jovem, em que se evita a conização desnecessária. B: a curetagem do canal endocervical se faz quando a junção escamocolunar não é visualizada, o que não ocorre. D: a cauterização é destrutiva e não cabe sem diagnóstico histopatológico firmado.", "r": "Diretrizes Brasileiras para o Rastreamento do Câncer do Colo do Útero (INCA); ASCCP 2019."}, {"n": 62, "e": "Mulher de 53 anos de idade com antecedente pessoal de câncer de mama tratado há 4 anos e em uso de tamoxifeno procura atendimento médico devido a sangramento vaginal vermelho vivo, em pequena quantidade há cerca de 5 dias. Ao exame de ultrassonografia transvaginal, evidenciado útero de 58 cm, anexos não visualizados e eco endometrial de 8 mm. Qual deve ser a conduta neste momento?", "a": ["Prescrever progestagênio cíclico.", "Histeroscopia diagnóstica.", "Ressonância magnética de pelve.", "Suspender o tamoxifeno."], "g": "B", "ar": "Ginecologia e Obstetrícia", "es": "Oncologia Ginecológica", "as_": "Câncer de Endométrio", "d": "fundamental", "i": "USG transvaginal com eco endometrial de 8 mm", "x": "A alternativa B está correta. Dicas do enunciado: **sangramento pós-menopausa** em usuária de **tamoxifeno** (efeito estrogênico no útero, fator de risco para pólipo, hiperplasia e adenocarcinoma de endométrio) e **eco endometrial de 8 mm (> 4-5 mm)**. A investigação padrão é a **histeroscopia diagnóstica com biópsia dirigida**, que permite ver lesões focais como pólipos e obter diagnóstico histológico. A: o progestagênio cíclico trataria sangramento disfuncional, e aqui precisa de diagnóstico antes. C: a ressonância é para estadiamento depois do diagnóstico. D: suspender o tamoxifeno pode ser discutido com a oncologia, mas não é a conduta imediata, que é investigar.", "r": "Febrasgo, Sangramento Uterino Pós-menopausa; ACOG Committee Opinion 601."}, {"n": 63, "e": "Mulher de 41 anos de idade, 3 filhos, duas cesáreas prévias, apresenta sangramento uterino anormal refratário ao tratamento clínico. O último exame ultrassonográfico identificou útero com 540 cm³, várias imagens sugestivas de leiomiomas intramurais, o maior deles com 2 cm de diâmetro, endométrio ecogênico com 4 mm de espessura, embora distorcido pelas imagens nodulares, e anexos aparentemente normais. Foi realizada histeroscopia na qual visualizou-se a imagem abaixo (vários nódulos submucosos que abaulam a cavidade). Qual deve ser a conduta?", "a": ["Histerectomia laparoscópica.", "Miomectomia histeroscópica.", "Miomectomia laparoscópica.", "Ablação endometrial por via histeroscópica."], "g": "B", "ar": "Ginecologia e Obstetrícia", "es": "Ginecologia Geral", "as_": "Miomatose Uterina", "d": "avancado", "i": "Histeroscopia mostrando múltiplos nódulos miomatosos que abaulam a cavidade uterina", "x": "A alternativa B está correta pelo cabeçalho do gabarito. Dicas do enunciado: **sangramento uterino anormal refratário ao tratamento clínico** em mulher de 41 anos com **múltiplos miomas**, útero aumentado (540 cm³) e **nódulos que distorcem a cavidade na histeroscopia**. O gabarito indica a **miomectomia histeroscópica** para tratar os nódulos submucosos. A: a histerectomia é opção para mulher sem desejo reprodutivo e com vários miomas de difícil extração. C: a miomectomia laparoscópica serve para miomas subserosos ou intramurais, que não alcançam a cavidade. D: a ablação endometrial não é indicada com múltiplos miomas que distorcem a cavidade. Observação: o texto do comentário oficial contradiz o cabeçalho e aponta a histerectomia como melhor opção, o que torna a questão discutível.", "r": "Febrasgo, Miomatose Uterina; FIGO PALM-COEIN."}, {"n": 64, "e": "Mulher, 57 anos de idade, refere sangramento genital em pequena quantidade há 30 dias. Refere menopausa aos 51 anos, sem terapia hormonal e sem sangramento até a presente data. Ao exame ginecológico genitais externos atróficos, especular conteúdo vaginal com pequena quantidade de sangue acumulado em fundo de saco vaginal, colo epitelizado; toque vaginal útero pouco aumentado, regular, móvel e indolor. Realiza o exame ultrassonográfico abaixo (endométrio espessado, com lesão hipoecogênica central). Realiza a retirada de pólipo endometrial com diagnóstico de carcinoma. Qual é o fator de melhor prognóstico?", "a": ["Tipo seroso-papilífero.", "Tipo endometrióide.", "Presença de invasão linfovascular.", "Invasão limitada pela serosa uterina."], "g": "B", "ar": "Ginecologia e Obstetrícia", "es": "Oncologia Ginecológica", "as_": "Câncer de Endométrio", "d": "intermediario", "i": "USG transvaginal com endométrio espessado e lesão hipoecogênica central", "x": "A alternativa B está correta. Dicas do enunciado: **sangramento na pós-menopausa** com endométrio espessado e diagnóstico de carcinoma. O **tipo endometrióide (tipo I)** é o mais comum (cerca de 80%), de **baixo grau**, ligado à exposição estrogênica sem oposição e à hiperplasia endometrial, com menor agressividade e **invasão miometrial superficial**: é o de **melhor prognóstico**. A: o seroso-papilífero (tipo II) é agressivo e de pior prognóstico. C: a invasão linfovascular piora o prognóstico. D: a invasão da serosa é fator de pior prognóstico em comparação com tumores limitados ao endométrio, ainda que melhor que a invasão de órgãos adjacentes.", "r": "FIGO 2018 Staging of Endometrial Cancer; Febrasgo, Câncer de Endométrio."}, {"n": 65, "e": "Você está na enfermaria da gastroenterologia e avalia uma paciente de 24 anos de idade, G1P0A1, que apresenta hiperplasia hepática nodular focal e não apresenta alterações das enzimas e nem da função hepática. Considerando os critérios médicos de elegibilidade da Organização Mundial de Saúde (2015) para prescrição de métodos contraceptivos, é correto afirmar que:", "a": ["Os métodos contraceptivos combinados devem ser evitados.", "Todos os métodos hormonais devem ser evitados.", "Não há restrição para a hiperplasia hepática nodular focal.", "Os métodos progestagênicos devem ser evitados."], "g": "C", "ar": "Ginecologia e Obstetrícia", "es": "Planejamento Familiar", "as_": "Métodos Contraceptivos", "d": "intermediario", "i": null, "x": "A alternativa C está correta. Dicas do enunciado: **hiperplasia nodular focal (HNF)** do fígado. Ela **não parece crescer com o estímulo hormonal**, e pelos critérios da OMS tanto os **contraceptivos combinados** quanto os **progestagênicos isolados** são **categoria 2** (benefícios superam riscos), ou seja, **sem restrição**. A, B e D: a restrição vale para o **adenoma hepático**, tumor com receptores hormonais, no qual os combinados são categoria 4 e os progestagênicos, categoria 3. É essencial não confundir os dois tumores.", "r": "Critérios Médicos de Elegibilidade da OMS (5ª ed., 2015); Febrasgo, Anticoncepção."}, {"n": 66, "e": "Menina de 13 anos de idade vem ao pronto-socorro de Ginecologia por quadro de dor pélvica de início há dois dias. Mãe informa que é a terceira vez que a filha apresenta o mesmo episódio, porém desta vez está mais intenso, sem melhora com o uso de anti-inflamatórios. Nunca menstruou. Nega atividade sexual. Ao exame clínico, regular estado geral (fácies de dor), corada, PA 100x70 mmHg, FC 92 bpm, Temp 36,9ºC e IMC 24,3kg/m²; mamas em estádio IV de Tanner; genitália externa apresentada na imagem abaixo. De acordo com o quadro clínico e a imagem apresentados, qual deve ser a conduta?", "a": ["Punção", "Secção", "Bloqueio de eixo", "Neovagina"], "g": "B", "ar": "Ginecologia e Obstetrícia", "es": "Ginecologia Geral", "as_": "Desordens do Desenvolvimento Sexual e Malformações Müllerianas", "d": "intermediario", "i": "Fotografia da genitália externa com hímen abaulado e azulado (hímen imperfurado)", "x": "A alternativa B está correta. Dicas do enunciado: adolescente de 13 anos com **amenorreia primária, mamas em Tanner IV, dor pélvica cíclica e recorrente**. Dicas da imagem: **hímen abaulado, de aspecto azulado**, típico de **hímen imperfurado**, com acúmulo de sangue menstrual na vagina e no útero (hematocolpo). O tratamento é a **secção himenal (himenotomia)**, definitiva. A: a punção exterioriza o conteúdo, mas **não trata a condição**, com recorrência a cada ciclo. C: o bloqueio do eixo (ACO, análogo de GnRH) suspende a menstruação, mas não resolve a obstrução. D: a neovagina é para agenesia vaginal, e a paciente tem vagina.", "r": "Febrasgo, Ginecologia da Infância e Adolescência; ACOG Committee Opinion 728."}, {"n": 67, "e": "Mulher, 69 anos de idade, está internada para cirurgia ginecológica da condição ginecológica demonstrada na imagem abaixo (corte sagital da pelve, sem útero, com descida da parede vaginal anterior e da cúpula vaginal). Qual deve ser a conduta?", "a": ["Pexia da cúpula vaginal ao ligamento redondo", "Pexia do fórnice vaginal ao púbis", "Correção cirúrgica sítio-específica retovaginal", "Suspensão da cúpula vaginal ao promontório com tela"], "g": "D", "ar": "Ginecologia e Obstetrícia", "es": "Ginecologia Geral", "as_": "Incontinência Urinária e Prolapso Genital", "d": "intermediario", "i": "Esquema sagital de pelve sem útero com prolapso de cúpula vaginal e parede anterior", "x": "A alternativa D está correta. Dicas do enunciado: paciente de 69 anos **sem útero** e prolapso da **cúpula vaginal (apical)** com descida da parede anterior. O prolapso apical é corrigido pela **suspensão da cúpula ao promontório com tela (colpopexia sacral)**. Dicas da imagem: o ápice vaginal desce, e a parede posterior não está prolapsada. A: o ligamento redondo não é usado como reparo da cúpula. B: a pexia ao púbis não trata o prolapso apical. C: a correção sítio-específica retovaginal é para prolapso de parede posterior, e não há prolapso posterior no esquema.", "r": "Febrasgo, Prolapso Genital; Tratado de Ginecologia."}, {"n": 68, "e": "Mulher de 53 anos de idade, assintomática, realizou mamografia que resultou na imagem abaixo (microcalcificações pleomórficas agrupadas, sem nódulo associado). Qual deve ser a conduta?", "a": ["Realizar biópsia por agulha grossa.", "Realizar mamotomia.", "Excisão cirúrgica da lesão.", "Realizar punção por agulha fina."], "g": "B", "ar": "Ginecologia e Obstetrícia", "es": "Oncologia Ginecológica", "as_": "Câncer de Mama", "d": "intermediario", "i": "Mamografia com microcalcificações pleomórficas agrupadas", "x": "A alternativa B está correta. Dicas do enunciado: paciente assintomática com **calcificações pleomórficas**, altamente suspeitas de neoplasia, sem nódulo. Dicas da imagem: microcalcificações agrupadas. A melhor opção é a **biópsia assistida a vácuo (mamotomia)**, que permite excisar boa parte da lesão e deixar clipe metálico para guiar tratamentos posteriores. A: a agulha grossa é para lesões sólidas, em geral maiores que 1 cm. C: a excisão cirúrgica não é necessária antes de obter o diagnóstico por biópsia percutânea. D: a punção por agulha fina dá só diagnóstico citológico, pode subestimar a lesão e não é boa para calcificações.", "r": "Febrasgo/CBR, Manual de BI-RADS; INCA, Diretrizes para a detecção precoce do câncer de mama."}, {"n": 69, "e": "Mulher de 53 anos de idade procura atendimento ambulatorial devido queixa de fogachos, insônia e irritabilidade intensa. A última menstruação foi há 10 meses. Nega comorbidade. Refere que a tia materna teve câncer de mama. No exame clínico, não foram observadas alterações. Traz uma mamografia com laudo BIRADS 2. Colpocitologia oncótica, classe 2. É correto afirmar que:", "a": ["A terapia de reposição hormonal está contraindicada pela história familiar de câncer de mama.", "A terapia de reposição hormonal não está indicada pois a paciente ainda não completou 12 meses de amenorreia.", "A reposição hormonal poderá ser feita com estrogênio e progestagênio.", "Os sintomas se devem à redução da progesterona sérica pelo esgotamento folicular."], "g": "C", "ar": "Ginecologia e Obstetrícia", "es": "Ginecologia Geral", "as_": "Climatério", "d": "fundamental", "i": null, "x": "A alternativa C está correta. Dicas do enunciado: mulher de 53 anos, **menopausa recente (10 meses sem menstruar), sintomas vasomotores e do sono que comprometem a qualidade de vida**, mamografia BI-RADS 2 e história de câncer de mama só na tia materna. Pode-se fazer a **terapia hormonal com estrogênio para aliviar os sintomas e progestagênio para proteção endometrial** (útero íntegro). A: o antecedente familiar de segundo grau não contraindica; as contraindicações são câncer de mama atual ou prévio, tromboembolismo e outras. B: a paciente já tem sintomas vasomotores, e a terapia pode ser iniciada mesmo antes de completar 12 meses. D: os sintomas climatéricos decorrem da **redução do estrogênio** pelo esgotamento folicular.", "r": "Febrasgo, Consenso de Terapêutica Hormonal; NAMS 2022 Hormone Therapy Position Statement."}, {"n": 70, "e": "Mulher de 25 anos de idade, 2G2PN, último parto há 56 dias, amamentando, comparece ao ambulatório desejando método contraceptivo. É correto afirmar que:", "a": ["O DIU hormonal está contraindicado.", "Os contraceptivos hormonais combinados estão contraindicados.", "O ideal é o uso de preservativo e a indicação exclusiva.", "Os contraceptivos, com progestagênios isolados, podem ser utilizados."], "g": "D", "ar": "Ginecologia e Obstetrícia", "es": "Planejamento Familiar", "as_": "Métodos Contraceptivos", "d": "fundamental", "i": null, "x": "A alternativa D está correta. Dicas do enunciado: **56 dias de puerpério, amamentando**. Os **progestagênios isolados** podem ser usados em quem amamenta (categoria 1-2 da OMS a partir de 6 semanas). A: o **DIU hormonal não está contraindicado** nessa fase: a contraindicação vai de 48 horas até 4 semanas pós-parto, e a paciente já passou desse período. B: o uso de combinados é contraindicado em lactantes até **6 meses**, e a paciente tem 56 dias, portanto está contraindicado, mas o gabarito aponta a opção D como a correta e mais ampla. C: o preservativo isolado não é a indicação exclusiva, pois há progestagênios seguros no puerpério.", "r": "Critérios Médicos de Elegibilidade da OMS (5ª ed., 2015); Febrasgo, Anticoncepção."}, {"n": 71, "e": "Mulher de 19 anos de idade, sem comorbidades, procura ginecologista com queixa de dor durante a relação sexual. Ciclos menstruais regulares, duração de 3 dias, fluxo leve, nega dismenorreia. No exame ginecológico, foi observada a imagem abaixo (vagina dividida por uma faixa de tecido longitudinal). Qual é o diagnóstico?", "a": ["Hímen imperfurado", "Septo vaginal transverso", "Septo vaginal longitudinal", "Útero septado"], "g": "C", "ar": "Ginecologia e Obstetrícia", "es": "Ginecologia Geral", "as_": "Desordens do Desenvolvimento Sexual e Malformações Müllerianas", "d": "intermediario", "i": "Exame especular com vagina dividida por septo longitudinal, com duas hemivaginas", "x": "A alternativa C está correta. Dicas do enunciado: **dispareunia** em jovem com ciclos regulares e sem dismenorreia (a menstruação sai). Dicas da imagem: **faixa de tecido que divide a vagina no sentido longitudinal**, caracterizando o **septo vaginal longitudinal**, defeito de fusão dos ductos de Müller que pode se associar a útero didelfo ou bicorno. A: o hímen imperfurado causaria amenorreia primária e hematocolpo. B: o septo transverso também causaria obstrução e dor cíclica, com amenorreia. D: o útero septado é um defeito da cavidade uterina, que não se vê ao exame especular.", "r": "Febrasgo, Malformações Müllerianas; ASRM Müllerian Anomalies Classification 2021."}, {"n": 72, "e": "Mulher, 68 anos, queixa-se de perda de urina há cerca de 6 anos. Refere sensação de urgência para urinar, com necessidade ir ao banheiro à noite (3 vezes por noite), frequência urinária 8 vezes ao dia. Nega perda urinária aos esforços, nega queixas intestinais. Ao exame físico ginecológico: ausência de perda urinária durante a manobra de Valsalva. Qual é a hipótese diagnóstica?", "a": ["Incontinência urinária de esforço", "Incontinência urinária mista", "Bexiga hiperativa", "Cistite intersticial"], "g": "C", "ar": "Ginecologia e Obstetrícia", "es": "Ginecologia Geral", "as_": "Incontinência Urinária e Prolapso Genital", "d": "fundamental", "i": null, "x": "A alternativa C está correta. Dicas do enunciado: **urgência miccional, urge-incontinência, noctúria (3 vezes por noite) e polaciúria (8 vezes ao dia)**, sem perda aos esforços e **sem perda durante o Valsalva**: **bexiga hiperativa**. A: não há perda aos esforços, o que afasta a incontinência de esforço. B: a incontinência mista tem componente de esforço, que a paciente nega. D: a cistite intersticial se manifesta com dor suprapúbica e disúria, não com esse padrão de urgência.", "r": "Febrasgo, Incontinência Urinária; Diretriz AUA/SUFU de bexiga hiperativa."}, {"n": 73, "e": "Mulher, 40 anos, comparece ao ambulatório com queixa de tontura rotatória recorrente com duração de minutos a horas, associada à plenitude auricular e zumbido pior à direita. As crises não são desencadeadas por movimentos da cabeça. Nega náuseas, vômitos, escurecimento visual ou perda de consciência. A paciente conta ainda que, apesar do quadro se arrastar há 10 anos, no último ano notou que a sua audição vem flutuando, com períodos de melhora e piora, e que nota hipoacusia pior no ouvido direito. Nega tontura na consulta atual. Exame clínico: BEG, corado, hidratado, acianótico, eupneico. Head-impulse test: sem sacada corretiva. Pesquisa de nistagmo: sem nistagmo espontâneo ou evocado pelo olhar. Pesquisa de desvio skew: sem desvio skew. Teste de equilíbrio: Romberg sem quedas, Fukuda: marcha sem desvios. Realizadas manobras de Dix Hallpike e Head Roll, sem nistagmos observados. Qual a audiometria esperada para essa paciente?", "a": ["Audiometria (A): limiares normais nos dois ouvidos.", "Audiometria (B): perda auditiva neurossensorial bilateral descendente (padrão de presbiacusia).", "Audiometria (C): perda auditiva neurossensorial apenas no ouvido direito, com ouvido esquerdo normal.", "Audiometria (D): perda auditiva neurossensorial apenas no ouvido esquerdo."], "g": "C", "ar": "Cirurgia Geral", "es": "Otorrinolaringologia", "as_": "Vertigem Periférica", "d": "intermediario", "i": "quatro audiometrias tonais (A a D) com ouvidos direito e esquerdo", "x": "A alternativa C está correta. Dicas do enunciado: **vertigem rotatória em crises de minutos a horas, plenitude auricular, zumbido e hipoacusia flutuante, pior à direita**, sem desencadeamento por posição, com exame vestibular central normal: **doença de Ménière** no ouvido direito. Na audiometria espera-se **perda neurossensorial (vias aérea e óssea alteradas)**, unilateral, e no caso, apenas no **lado direito**, com o esquerdo normal (mnemônico \"Red-Right-Round\"). A: audiometria normal bilateral não explica a hipoacusia. B: perda neurossensorial bilateral descendente é padrão de presbiacusia. D: a perda apenas à esquerda corresponderia, por exemplo, a surdez súbita ou trauma acústico à esquerda, e a paciente tem sintomas à direita.", "r": "Diretrizes de Doença de Ménière (Barany Society 2015); Tratado de Otorrinolaringologia."}, {"n": 74, "e": "Uma mulher de 36 anos de idade é trazida pelo SAMU após ser encontrada pela família por ingestão de grande quantidade de medicamentos psiquiátricos há 6 horas. Os familiares dizem que ela fazia tratamento regular com psiquiatra na UBS, porém não sabem dizer qual era o diagnóstico. Relatam que em algumas semanas ficava sem se levantar da cama dormindo o dia inteiro, e que já sofreu um episódio em que teve delírios, alucinações e agitação psicomotora. No PS encontra-se confusa e desorientada, vomitando e com diarreia. Você repara também na ocorrência de tremores e fasciculações. Apresenta-se ainda desidratada e hipotensa porém afebril. Qual medicamento é mais provável que ela tenha ingerido e qual deve ser a conduta?", "a": ["Benzodiazepínico, ministrar de Flumazenil.", "Inibidor Seletivo de Recaptação de Serotonina, lavagem gástrica.", "Haloperidol, dosagem de CKMB.", "Lítio, eletrocardiograma."], "g": "D", "ar": "Clínica Médica", "es": "Medicina de Emergência", "as_": "Intoxicações Exógenas e Síndromes Toxicológicas", "d": "intermediario", "i": null, "x": "A alternativa D está correta. Dicas do enunciado: história de **episódios depressivos e de mania/psicose** (provável transtorno bipolar), com ingestão de grandes quantidades de medicamento, **confusão, vômitos, diarreia, tremores e fasciculações** e hipotensão, afebril: **intoxicação aguda por lítio**, que pode levar a alterações cardiovasculares; por isso se pede o **eletrocardiograma**, além de hidratação, dosagem sérica do lítio e avaliação para diálise. A: a intoxicação por benzodiazepínico cursa com rebaixamento do nível de consciência, sem diarreia e fasciculações; o flumazenil não é de rotina. B: os ISRS levariam a síndrome serotoninérgica, com hipertermia e hiperreflexia. C: o haloperidol causaria rigidez e hipertermia (síndrome neuroléptica maligna), e a CKMB não é o foco.", "r": "Centro de Controle de Intoxicações; Goldfrank's Toxicologic Emergencies."}, {"n": 75, "e": "Homem, 63 anos de idade, nunca realizou consultas médicas prévias. Apresenta baixa de visão progressiva em ambos os olhos, pior à direita, indolor, há 3 anos. Vai a consulta com especialista. Apresenta acuidade visual, com correção, de 20/400 em ambos os olhos e os seguintes achados fundoscópicos. Considere que o exame do segmento anterior e de reflexos pupilares está sem alterações. Com base no caso clínico, assinale a alternativa correta.", "a": ["Trata-se de retinopatia hipertensiva, tendo em vista que o achado de mácula em cereja presente na imagem é bem sugestivo de tal condição.", "O tempo de duração da doença de base e o descontrole glicêmico são dois dos principais fatores de risco. Uma das condutas preconizadas é a panfotocoagulação da retina.", "A neovascularização de retina presente na imagem é fator de risco para o surgimento de descolamento de retina do tipo regmatogênico.", "O seguimento deste paciente deve ser feito com consultas anuais."], "g": "B", "ar": "Clínica Médica", "es": "Oftalmologia", "as_": "Retina e Perda Visual", "d": "intermediario", "i": "Fundoscopia com hemorragias, microaneurismas e neovasos no disco e na retina", "x": "A alternativa B está correta. Dicas do enunciado: **homem de 63 anos, sem acompanhamento médico**, com **baixa visual progressiva, indolor, bilateral**. Dicas da imagem: **microaneurismas, hemorragias e neovasos no disco e na retina**: **retinopatia diabética proliferativa**. Os principais fatores de risco são o **tempo de doença e o descontrole glicêmico**, e uma das condutas é a **panfotocoagulação da retina**. A: a mácula em cereja é da oclusão da artéria central da retina, ausente aqui. C: a neovascularização forma fibrose, cuja contração causa descolamento **tracional**, e não regmatogênico (associado a roturas). D: o seguimento na forma proliferativa é mais frequente, pelo menos a cada 3 meses.", "r": "Diretrizes do CBO e da SBD para retinopatia diabética; AAO Preferred Practice Pattern."}, {"n": 76, "e": "Homem de 34 anos de idade, agricultor, foi admitido na emergência do hospital regional após sofrer uma picada por cobra, região dorsal da mão esquerda, há 3 horas, enquanto trabalhava em sua plantação de café. No exame clínico: REG, CHAAA, LOTE, edema no dorso da mão, antebraço e braço esquerdo associado a equimose e muita dor e parestesia local, 02 pontos de inoculação, bolhas serohemáticas na região da mão e cotovelo, MV presente sem ruídos adventícios, FR 26 irpm, SatO2 98% em aa, BRNF 2T SS, FC 120 bpm, PA 140x90 mmHg, TEC 3 segs, Glasgow 15, agitado, mobiliza as 4 extremidades. Qual é o tipo de acidente ofídico relatado, como é o manejo e quais são as principais complicações?", "a": ["Acidente botrópico; analgesia e soro antiofídico; abscesso, necrose e síndrome compartimental do membro.", "Acidente elapídico, analgesia e aplicação de torniquete para diminuir a dispersão do veneno; lesão renal aguda, CIVD e infecção local.", "Acidente crotálico; analgesia e soro antiofídico; abscesso, necrose e sangramento.", "Acidente laquético; analgesia e incisão do local; CIVD, lesão renal aguda e abscesso."], "g": "A", "ar": "Clínica Médica", "es": "Medicina de Emergência", "as_": "Emergências Ambientais (Afogamento, Animais Peçonhentos, Hipotermia)", "d": "intermediario", "i": "Fotografia do membro com edema, equimose e bolhas serohemáticas", "x": "A alternativa A está correta. Dicas do enunciado: picada de cobra em agricultor, com **edema extenso (até o braço), equimose, dor, 2 pontos de inoculação e bolhas serohemáticas**: **acidente botrópico (jararaca)**, o mais comum no Brasil. O veneno tem ação **proteolítica (inflamatória), coagulante e hemorrágica**. O manejo é **analgesia, hidratação, limpeza local e soro antibotrópico**, e as complicações locais são **abscesso, necrose e síndrome compartimental**, além de insuficiência renal. B: o acidente elapídico (coral) é neurotóxico, com dor discreta, sem lesão local. O **torniquete, garroteamento, incisão e sucção** não devem ser feitos. C: o acidente crotálico causa ptose palpebral, turvação visual e mialgia, com dor local discreta. D: o laquético (surucucu) tem manifestações vagais e cursa em Mata Atlântica e Amazônia, além de a incisão ser contraindicada.", "r": "Guia de Vigilância em Saúde, Acidentes por animais peçonhentos (Ministério da Saúde); Manual de Diagnóstico e Tratamento de Acidentes Ofídicos."}, {"n": 77, "e": "Homem de 55 anos, previamente hipertenso e tabagista ativo, é admitido em sala de emergência em mau estado geral com queixa de dor torácica súbita retroesternal com irradiação para dorso, início há 1 hora. Ao exame clínico, pressão arterial 220/130 mmHg, frequência cardíaca 101 bpm. Ausculta cardiopulmonar sem alterações, pulsos femorais presentes e simétricos. Força grau III em dimídio esquerdo, força grau V em dimídio direito, desvio do olhar para a direita. Abaixo o eletrocardiograma obtido em sala de emergência (supradesnivelamento do ST em parede inferior). Tomografia computadorizada de crânio sem contraste sem alterações. Qual deve ser a conduta?", "a": ["Trombólise com alteplase por hipótese de AVC isquêmico em janela para reperfusão", "Encaminhar à hemodinâmica para angioplastia primária", "Iniciar esmolol para controle de frequência cardíaca", "Iniciar nitroglicerina para redução 15-25% de pressão arterial média na primeira hora"], "g": "C", "ar": "Cirurgia Geral", "es": "Cirurgia Vascular", "as_": "Dissecção de Aorta", "d": "avancado", "i": "ECG com supradesnivelamento do segmento ST em parede inferior", "x": "A alternativa C está correta. Dicas do enunciado: **dor torácica súbita irradiada para o dorso**, **hipertensão importante (220/130)**, **déficit neurológico** (hemiparesia esquerda e desvio do olhar) e **ECG com supra de ST inferior**, com TC de crânio normal. O que une dor torácica de início abrupto, infarto inferior e déficit neurológico agudo é a **dissecção aguda de aorta ascendente**, que exige alto nível de suspeita. O tratamento inicial é a **redução do estresse hemodinâmico**: analgesia e **controle da frequência cardíaca (60-80 bpm) com betabloqueador (esmolol)**, depois PAS < 120 mmHg, e cirurgia urgente. A: a trombólise é contraindicada em dissecção. B: a angioplastia e a anticoagulação associada piorariam a dissecção. D: o vasodilatador isolado, sem controle prévio da frequência, aumenta a taquicardia reflexa e o estresse sobre a parede.", "r": "Diretrizes ACC/AHA 2022 para doenças da aorta; Diretriz Brasileira de Doenças da Aorta."}, {"n": 78, "e": "Homem é admitido no PS com quadro de doença pulmonar obstrutiva crônica (DPOC) exacerbada. Ao exame clínico, FC: 120 bpm, FR: 30 irpm, SpO2: 82%, com sinais de esforço respiratório. Em gasometria arterial em ar ambiente, você observa: pH 7,29 / PaCO2 70 mmHg / PaO2 55 mmHg / HCO3 37 mEq/L. Qual deve ser a configuração da VNI?", "a": ["Modo CPAP, com CPAP 10 mmHg e FiO2 80%", "Modo CPAP, com CPAP 15 mmHg e FiO2 40%", "Modo BiPAP, com IPAP 10 mmHg e EPAP 5 mmHg e FiO2 40%", "Modo BiPAP, com IPAP 12 mmHg e EPAP 6 mmHg e FiO2 95%"], "g": "C", "ar": "Clínica Médica", "es": "Pneumologia", "as_": "DPOC", "d": "intermediario", "i": null, "x": "A alternativa C está correta. Dicas do enunciado: DPOC exacerbada com **pH 7,29 e PaCO₂ de 70 mmHg**, esforço respiratório e hipoxemia: **acidose respiratória crônica agudizada**. O bicarbonato elevado (37, esperado 34-38) mostra a compensação crônica. A indicação é **VNI em modo BiPAP**, que é o de **melhor evidência no DPOC**, com IPAP maior que EPAP (aqui 10/5) e **FiO₂ titulada (40%)**, para evitar a **hiperoxigenação e a evolução para carbonarcose**. A e B: o CPAP não oferece o suporte inspiratório que reduz o trabalho respiratório e a PaCO₂, e as pressões e frações usadas estão inadequadas. D: o BiPAP com FiO₂ de 95% é excessivo e arrisca a retenção de CO₂.", "r": "GOLD 2024; Diretrizes Brasileiras de Ventilação Mecânica (AMIB/SBPT)."}, {"n": 79, "e": "Homem de 55 anos de idade tem diagnóstico de hipertensão arterial sistêmica há 15 anos. Atualmente está em uso de atorvastatina 40 mg uma vez a noite, enalapril 20 mg duas vezes ao dia e há 3 meses (1ª avaliação) foi adicionada a sua prescrição dapagliflozina 10 mg uma vez pela manhã devido ao diagnóstico de diabetes mellitus tipo 2. Em consulta de retorno, traz exames coletados na semana anterior (2ª avaliação). Está assintomático no período, sem intercorrências infecciosas ou uso de demais medicações desde o primeiro atendimento. Controles deste atendimento: peso 80 kg; altura 1,74 m; frequência cardíaca 67bpm; pressão arterial 128x76 mmHg. Exames (1ª avaliação / 2ª avaliação): Hemoglobina glicada 6,8% / 6,3%; Glicemia (jejum) 136 / 123 mg/dl; Creatinina sérica 1,2 / 1,44 mg/dl (TFG CKD-EPI 2021: 71 / 57 ml/min/1,73 m²); Sódio sérico 137 / 138 mEq/l; Potássio sérico 4,3 / 4,4 mEq/l; Relação albumina/creatinina urinária isolada 80 / 76 mg/g. Qual deve ser a conduta?", "a": ["Realizar biópsia renal", "Substituir dapagliflozina por metformina", "Reduzir dose de enalapril", "Associar finerenona."], "g": "D", "ar": "Clínica Médica", "es": "Nefrologia", "as_": "Doença Renal Crônica", "d": "avancado", "i": "Tabela com exames da 1ª e da 2ª avaliação", "x": "A alternativa D está correta. Dicas do enunciado: DM2 recente com **doença renal crônica G2A2** (TFG de 57 a 71 mL/min e albuminúria de 76-80 mg/g). Após o início do iSGLT2 espera-se uma **queda transitória da TFG de até 30%** (aqui, de 71 para 57, cerca de 20%), que é tolerada. O paciente já usa **IECA e iSGLT2**, e persiste com albuminúria acima de 30 mg/g com **potássio de 4,4 (abaixo de 4,8)**: indica-se **associar a finerenona** (antagonista não esteroidal do receptor mineralocorticoide). A: a investigação com biópsia é para proteinúria abrupta, nefrótica, declínio rápido ou sedimento alterado. B: o iSGLT2 é a primeira linha para esses pacientes, pela nefroproteção. C: a queda da TFG está dentro do esperado, e reduzir o IECA retiraria a proteção renal.", "r": "KDIGO 2024 Clinical Practice Guideline for CKD; ADA Standards of Care."}, {"n": 80, "e": "Homem de 58 anos de idade teve um infarto agudo do miocárdio há 3 meses, quando foi diagnosticado como hipertenso. Está em uso de losartana 50 mg/dia, sinvastatina 10mg/dia e AAS 100 mg/dia, com boa tolerância. É sedentário e refere ingestão diária de frituras. Informa pai falecido aos 54 anos por IAM e mãe diabética. Ao exame físico: acantose nigricans cervical, pressão arterial 124/80 mmHg, IMC 33, circunferência abdominal 108 cm, ausculta cardiopulmonar fisiológica, sem edemas. Os exames laboratoriais evidenciaram glicemia de jejum 98 mg/dl; colesterol total 224 mg/dl; HDL 36 mg/dl; LDL 148 mg/dl; triglicerídeos 180 mg/dl. Qual deve ser a conduta?", "a": ["Aumentar sinvastatina para 20 mg/dia e estabelecer dieta hipolipídica", "Associar ezetimiba 10 mg/dia e iniciar ciprofibrato 100 mg/dia", "Trocar sinvastatina por rosuvastatina 20 mg/dia", "Trocar sinvastatina por atorvastatina 20 mg/dia"], "g": "C", "ar": "Clínica Médica", "es": "Cardiologia", "as_": "Dislipidemia e Risco Cardiovascular", "d": "intermediario", "i": null, "x": "A alternativa C está correta. Dicas do enunciado: **infarto prévio**, que coloca o paciente em **risco cardiovascular muito alto**, com **LDL de 148 mg/dL** em uso de sinvastatina 10 mg, que é de baixa potência. A meta de LDL é **< 50 mg/dL**, e está indicada **estatina de alta potência**: **rosuvastatina 20 mg/dia** (ou atorvastatina 40-80 mg). A: dobrar a sinvastatina para 20 mg ainda é de potência moderada e insuficiente. B: o fibrato só se indica com triglicerídeos acima de 500 mg/dL, e não se relaciona a desfechos cardiovasculares; a ezetimiba entra depois da estatina de alta potência. D: a atorvastatina 20 mg é de potência moderada, e a dose de alta potência seria 40-80 mg.", "r": "Atualização da Diretriz Brasileira de Dislipidemias e Prevenção da Aterosclerose (SBC, 2017/2023)."}, {"n": 81, "e": "Mulher de 60 anos de idade está em investigação de dispneia crônica. O quadro se iniciou de forma progressiva há 5 anos e atualmente é a limite para acompanhar sua mãe até a feira próxima de casa. Já faz acompanhamento de hipertensão arterial sistêmica e de diabetes mellitus tipo 2 em sua UBS há 10 anos, em uso de enalapril 20 mg 2 vezes ao dia, anlodipino 10 mg 1 vez ao dia e metformina 500 mg 1 vez ao dia. Além disso, fumava 1 maço de cigarro todos os dias desde os 20 anos de idade, mas parou há 10 anos após entrar em grupo de ajuda na UBS. Recentemente vem notado surgimento de edema de membros inferiores. Apesar da gravidade dos sintomas, nunca precisou recorrer ao pronto socorro. Ao ser questionada sobre exposições ambientais, conta que tem um casal de calopsitas há 10 anos. Sinais vitais: Peso: 60 kg; Altura: 1,75 m; FC: 78 bpm; PA: 122 x 76 mmHg; FR: 15 ipm; SpO: 89%. Exame clínico: Bom estado geral, acianótica, eupneica, normocorada, tempo de enchimento capilar 2 segundos. Bulhas rítmicas normofônéticas em 2 tempos sem sopros. Murmúrios vesiculares presentes com crepitações e estertores difusos, predominando em bases. Semiologia abdominal sem alterações. Edema +/4+ simétrico de membros inferiores, sem sinais flogísticos. Exames: NT-proBNP: 503 pg/ml; gasometria pH 7,34, PO2 59 mmHg, SO2 92%; ECG com sobrecarga de átrio direito e de ventrículo direito; espirometria: CVF pré-BD 1,85 L (62%), VEF1 pré 0,71 L (30%), VEF1/CVF 0,38; pós-BD VEF1 0,67 L, VEF1/CVF 0,39, sem resposta ao broncodilatador. Qual deve ser a conduta?", "a": ["Solicitar ecocardiograma transtorácico para decidir terapia medicamentosa definitiva. Enquanto isso, adicionar dapagliflozina e prescrever furosemida via oral para melhora de sintomas.", "Prescrever beta agonista de longa duração com antimuscarínico de longa duração e oxigenoterapia domiciliar.", "Solicitar tomografia computadorizada de tórax e pletismografia. A depender do resultado, solicitar biópsia pulmonar para definir o tratamento.", "Solicitar angiotomografia de coronárias para avaliar doença arterial coronariana com possível indicação de revascularização miocárdica."], "g": "B", "ar": "Clínica Médica", "es": "Pneumologia", "as_": "DPOC", "d": "avancado", "i": "ECG com sobrecarga de câmaras direitas e espirometria com obstrução grave sem resposta ao broncodilatador", "x": "A alternativa B está correta. Dicas do enunciado: **ex-tabagista (20 anos-maço)** com **dispneia crônica progressiva**, espirometria com **VEF1/CVF pós-broncodilatador de 0,39 (< 0,7) e VEF1 de 30%**: **DPOC GOLD 4, grupo B**. Dicas da imagem: ECG com sobrecarga das câmaras direitas e edema, o que indica **cor pulmonale**, com **PaO₂ de 59 mmHg**. A conduta é **LABA + LAMA** e **oxigenoterapia domiciliar** (PaO₂ ≤ 55, ou ≤ 59 com cor pulmonale). A: o NT-proBNP de 503 e o quadro obstrutivo não apontam para IC primária, e a terapia seria da doença pulmonar. C: a tomografia e a biópsia são desnecessárias com espirometria típica. D: a investigação coronariana não é o foco da dispneia por obstrução fixa.", "r": "GOLD 2024; Diretrizes SBPT para DPOC."}, {"n": 82, "e": "Mulher de 78 anos de idade com peso ideal predito 70 kg está internada na unidade de terapia intensiva por SDRA há 5 dias. Está em RASS +3 recebendo fentanil + midazolam em infusão contínua. Parâmetros vitais: PA 130x80 mmHg, FC 120 bpm, TEC 3 seg, SatO2 85%. Segue em IOT sob VM, modo VCV, FiO2 50%, PEEP 10, VC 300 mL, FR 32 irpm, fluxo 60L/min. O plantonista percebe que a paciente está inquieta, com queda da saturação de O2 e apresenta as seguintes curvas no ventilador mecânico (curvas de pressão, fluxo e volume com duplo disparo). Qual deve ser a conduta?", "a": ["Aumentar a sedação contínua, diminuir o VC e aumentar a FR.", "Aumentar a FiO2 e aumentar a PEEP, dessa forma corrigimos o problema.", "Diminuir o fluxo de ar do ventilador ou mudar para o modo PCV.", "Bloquear e pronar o paciente devido a refrataridade as medidas de ventilação protetora."], "g": "C", "ar": "Clínica Médica", "es": "Pneumologia", "as_": "Ventilação Mecânica Invasiva", "d": "avancado", "i": "Curvas de pressão, fluxo e volume no ventilador com duplo disparo (empilhamento de volume)", "x": "A alternativa C está correta. Dicas do enunciado: paciente com SDRA, **inquieta, com queda de SatO₂ e assincronia**. Dicas da imagem: curvas com **duplo disparo**, ou seja, o tempo inspiratório do paciente é maior que o do ventilador, que cicla e é disparado de novo, **empilhando volume**; há risco de **volutrauma, pneumotórax e choque**. A solução é **diminuir o fluxo** (aumentando indiretamente o tempo inspiratório) **ou mudar para modo PCV**, em que o fluxo é livre. A: aumentar a sedação e reduzir o VC piora a demanda ventilatória e não corrige a assincronia. B: aumentar FiO₂ e PEEP não resolve a assincronia. D: bloquear e pronar é medida de SDRA refratária, e o problema aqui é de assincronia. Lembre a ventilação protetora: VC 4-6 mL/kg, PEEP pela SatO₂, pressão de platô ≤ 30.", "r": "Diretrizes Brasileiras de Ventilação Mecânica (AMIB/SBPT); Respir Care 2013;58:1847."}, {"n": 83, "e": "Homem de 38 anos de idade chega ao pronto atendimento com história de fraqueza em hemicorpo direito e dificuldade de fala, instaladas de forma súbita há 2 horas. Acompanhante relata que antes do início do déficit queixou-se de dor cervical à esquerda. Sem comorbidades prévias. Sinais vitais: PA 130x90 mmHg, FC 88 bpm, satO2 97%, T 36,5°C, Dx 88mg/dL. Ao exame neurológico: NIH 16, hemiparesia direita completa, afasia global, anisocoria com pupila esquerda menor que a direita e semiptose em olho esquerdo. TC crânio sem alterações, ASPECTS 10. AngioTC mostrando oclusão de M1 esquerda e suspeita de dissecção de carótida interna cervical esquerda. Qual deve ser a conduta?", "a": ["Trombólise com alteplase 0,9mg/kg.", "Trombólise com alteplase 0,9mg/kg + Trombectomia mecânica.", "Trombectomia mecânica.", "Sem indicação de terapia de reperfusão."], "g": "B", "ar": "Clínica Médica", "es": "Neurologia", "as_": "Acidente Vascular Cerebral", "d": "avancado", "i": null, "x": "A alternativa B está correta. Dicas do enunciado: adulto jovem com **hemiparesia direita, afasia, dor cervical prévia e síndrome de Horner à esquerda (semiptose + miose)**: **dissecção de carótida interna esquerda** com **oclusão de M1 em tandem**. Está **dentro da janela de trombólise (< 4,5 h)** e da **trombectomia (oclusão proximal, ASPECTS ≥ 6, NIHSS ≥ 6, < 6 horas)**, portanto há indicação das **duas terapias**: alteplase 0,9 mg/kg + trombectomia mecânica. A dissecção arterial **não contraindica** a trombólise nem a trombectomia. A: usar só a trombólise é insuficiente na oclusão de grande vaso proximal. C: a trombectomia isolada deixaria de usar a trombólise, que é indicada se não houver contraindicação. D: há indicação de reperfusão.", "r": "AHA/ASA 2019 Update to the 2018 Guidelines for the Early Management of Acute Ischemic Stroke (Powers et al.)."}, {"n": 84, "e": "Homem, 24 anos de idade, sem comorbidades conhecidas, é trazido pela equipe do SAMU após relato de ingesta de múltiplos comprimidos, incluindo clonazepam, há cerca de 30 minutos. Atualmente, encontra-se com Glasgow 7, pupilas isofotorreagentes, sonolento e com os seguintes sinais vitais: FC 80 bpm, PA 115x80mmHg, FR 15irpm, SpO2 (CN 2l/min) 96%. Qual deve ser a conduta?", "a": ["Manter paciente em sala de emergência monitorizado pelas próximas 6 horas, sem necessidade de exames ou procedimentos adicionais.", "Realização imediata de lavagem gástrica e carvão ativado, devendo se considerar ainda a administração de flumazenil.", "Realização imediata de lavagem gástrica e carvão ativado, devendo se considerar ainda a administração empírica de naloxone.", "Proceder com intubação para proteção de via aérea visto necessidade de oxigênio suplementar e rebaixamento expressivo e, em seguida, realização de lavagem gástrica e carvão ativado."], "g": "A", "ar": "Clínica Médica", "es": "Medicina de Emergência", "as_": "Intoxicações Exógenas e Síndromes Toxicológicas", "d": "intermediario", "i": null, "x": "A alternativa A está correta pelo gabarito oficial (que não traz comentário). Dicas do enunciado: ingestão de **múltiplos comprimidos incluindo clonazepam** há 30 minutos, com **Glasgow 7 mas sinais vitais estáveis (FR 15, SpO₂ de 96% com 2 L/min, PA normal)** e pupilas normais: síndrome sedativa por **benzodiazepínico**, que raramente causa depressão respiratória grave isolada. Pelo gabarito, o manejo é **monitorização em sala de emergência por 6 horas**, com suporte, sem procedimentos adicionais. B: a lavagem gástrica é rara e arriscada com rebaixamento, e o flumazenil pode precipitar convulsões, sobretudo com coingestão de outras drogas. C: o naloxone não tem papel sem miose ou depressão respiratória por opioide. D: a intubação não é necessária com ventilação adequada. Observação: o enunciado cita outros comprimidos não identificados, e o rebaixamento com Glasgow 7 pode justificar proteção de via aérea, o que torna a questão discutível.", "r": "Goldfrank's Toxicologic Emergencies; Centro de Controle de Intoxicações."}, {"n": 85, "e": "Homem, 57 anos de idade, em acompanhamento regular na Unidade Básica de Saúde, comparece a consulta médica anual de rotina. Realiza seguimento por doença de Chagas, diabetes mellitus e artrite gotosa. Em uso regular das medicações: metformina 500 mg 2 comprimidos ao dia, gliclazida 60 mg ao dia e alopurinol 100 mg. Paciente ativo, trabalha como atendente de farmácia, joga vôlei duas vezes na semana. Nega dispneia, nega episódios de pré-síncope ou síncope. Ao exame físico, pressão arterial 128/70 mmHg, frequência cardíaca de 48 bpm, sem sinais de congestão, bem perfundido. Traz eletrocardiograma de 12 derivações que realiza anualmente pela doença de Chagas (bradicardia sinusal com bloqueio de ramo direito e bloqueio divisional anterossuperior). Qual deve ser a conduta?", "a": ["Solicitar holter e teste ergométrico para avaliação de bloqueios avançados e competência cronotrópica.", "Encaminhar ao Cardiologista ambulatorialmente para implante de marcapasso.", "Internar paciente para realização de holter com prioridade.", "Solicitar transferência do paciente para Hospital devido a bloqueio avançado para implante de marcapasso na urgência."], "g": "A", "ar": "Clínica Médica", "es": "Cardiologia", "as_": "Arritmias Cardíacas", "d": "intermediario", "i": "ECG com bradicardia sinusal, bloqueio de ramo direito e bloqueio divisional anterossuperior", "x": "A alternativa A está correta. Dicas do enunciado: **doença de Chagas**, assintomático (sem dispneia, pré-síncope ou síncope), **FC de 48 bpm** e, no ECG, **bradicardia sinusal com bloqueio de ramo direito (BRD) e bloqueio divisional anterossuperior (BDAS)**, achados comuns da cardiopatia chagásica crônica. Não há ondas P bloqueadas, ou seja, não há bloqueio avançado. Como a bradicardia é **assintomática**, pede-se o **Holter de 24 horas** (avaliar o ritmo por mais tempo) e o **teste ergométrico** (competência cronotrópica), com seguimento ECG periódico. B: o marcapasso exige sintomas ou bloqueios avançados. C: não há indicação de internação. D: não há bloqueio avançado nem instabilidade para a urgência.", "r": "II Diretriz Latino-Americana para o Diagnóstico e Tratamento da Cardiopatia Chagásica (SBC); Diretriz Brasileira de Arritmias."}, {"n": 86, "e": "Mulher, 56 anos de idade, hipertensa há 8 anos, apresenta níveis de PA mensurados em sua residência acima de 140/90 mmHg. Está em uso de losartana 100 mg/dia, anlodipino 10 mg/dia e clortalidona 25 mg/dia. Não há evidências de má aderência. Exame clínico: PA = 162/98 mmHg; FC 82 bpm; IMC 24. Exames laboratoriais: creatinina = 0,82 mg/dl; potássio = 4,2 mEq/L; urina 1 normal; USG doppler de artérias renais normal. Outras causas de hipertensão secundárias foram excluídas. Qual deve ser a conduta?", "a": ["Aumentar anlodipino para 10 mg duas vezes ao dia", "Associar clonidina 0,1 mg duas vezes ao dia", "Aumentar a clortalidona para 50 mg ao dia", "Associar espironolactona 25 mg/dia"], "g": "D", "ar": "Clínica Médica", "es": "Cardiologia", "as_": "Hipertensão Arterial Sistêmica", "d": "fundamental", "i": null, "x": "A alternativa D está correta. Dicas do enunciado: hipertensa em uso de **três fármacos de primeira linha (BRA, bloqueador de canal de cálcio e diurético tiazídico)** em doses plenas, **sem má adesão**, com **PA persistentemente elevada** (162/98 e MRPA > 140/90) e causas secundárias excluídas: **hipertensão arterial resistente**. A quarta droga de escolha é a **espironolactona 25 mg/dia**. A: o anlodipino já está na dose máxima (10 mg/dia), e dividir a dose não é prática. B: a clonidina é de uso restrito, depois da espironolactona. C: a clortalidona já está em dose adequada, e subir para 50 mg aumenta efeitos adversos metabólicos com pouco ganho.", "r": "Diretrizes Brasileiras de Hipertensão Arterial 2020 (SBC); PATHWAY-2."}, {"n": 87, "e": "Mulher de 40 anos de idade apresenta hipertensão arterial de difícil controle, fraqueza muscular e poliúria. Glicemia e creatinina são normais. A relação aldosterona/atividade de renina é bastante elevada e na adrenal esquerda a tomografia mostra nódulo de 6 cm. A gasometria mais provável nesta paciente é:", "a": ["pH 7,55; Bicarbonato 33; pCO2 40", "pH 7,20; Bicarbonato 8; pCO2 20", "pH 7,60; Bicarbonato 23; pCO2 25", "pH 7,31; Bicarbonato 36; pCO2 70"], "g": "A", "ar": "Clínica Médica", "es": "Endocrinologia", "as_": "Distúrbios Adrenais", "d": "intermediario", "i": null, "x": "A alternativa A está correta. Dicas do enunciado: hipertensão de difícil controle, fraqueza, poliúria e **relação aldosterona/renina muito elevada** com nódulo adrenal: **hiperaldosteronismo primário**. A aldosterona aumenta a reabsorção de sódio e a **excreção de potássio e de H⁺**; a **hipocalemia** estimula a secreção de hidrogênio no néfron distal, causando **alcalose metabólica** (pH 7,55, bicarbonato 33, pCO₂ normal ou discretamente elevada). B: pH 7,20 com bicarbonato 8 é acidose metabólica. C: pH 7,60 com bicarbonato 23 e pCO₂ 25 é alcalose respiratória. D: pH 7,31 com bicarbonato 36 e pCO₂ 70 é acidose respiratória crônica.", "r": "Endocrine Society Guideline on Primary Aldosteronism; Brenner and Rector's The Kidney."}, {"n": 88, "e": "Mulher, 48 anos de idade é usuária de crack e cocaína há 20 anos, moradora de área livre. É atendida pela equipe do Consultório na Rua e diz que as vozes que ouve desde sempre estão mais intensas ultimamente: elas começaram a gritar com a paciente para voltar a usar substâncias, desde que cessou o uso há 20 dias. Conta que sente muita vontade de usar, mas não quer mais, pois desde que iniciou o uso, afastou-se de todos, vivendo totalmente sozinha há 10 anos. Foi passada medicação na sua última consulta, porém a paciente não conseguiu se organizar para tomá-la: acredita que morar próxima a outras pessoas seria suficiente para se organizar. Nega ideação suicida ou desejo de agredir outras pessoas. Ao exame psíquico, olha constantemente ao seu redor e sussurra palavras quase inaudíveis. Mantém-se inquieta durante todo o atendimento. Dentre as alternativas abaixo, qual seria o serviço mais adequado a acompanhar a paciente, considerando os equipamentos e diretrizes da Rede de Atenção Psicossocial (RAPS) e seus objetivos?", "a": ["CAPS AD, para acolhimento e condutas voltadas à ressocialização.", "Hospital dia, para manejo do risco de exposição social grave e iminente.", "Pronto socorro psiquiátrico, para manejo clínico da síndrome de abstinência de substâncias.", "Internação hospitalar, dada a falta de suporte social da paciente."], "g": "A", "ar": "Clínica Médica", "es": "Psiquiatria", "as_": "Transtornos por Uso de Substâncias", "d": "intermediario", "i": null, "x": "A alternativa A está correta. Dicas do enunciado: uso crônico de crack e cocaína, **em fissura** (sem abstinência grave) há 20 dias, **sem ideação suicida ou heteroagressividade**, isolada e sem suporte social. O **CAPS AD** (álcool e drogas) é serviço **aberto e comunitário** que acolhe e promove **atividades de ressocialização e fortalece a autonomia**, adequado a quadro crônico sem urgência. B: o hospital-dia não é o serviço indicado, pois não há risco iminente de exposição grave. C: o pronto-socorro psiquiátrico é para urgência, e a paciente não está em síndrome de abstinência grave. D: a internação tolheria a autonomia e reforçaria estigmas, sem critérios de internação.", "r": "Portaria de Consolidação nº 3/2017 (RAPS); Ministério da Saúde, Política Nacional sobre Drogas."}, {"n": 89, "e": "Uma adolescente de 16 anos de idade, acompanhada da mãe, tem histórico de autolesões e quatro tentativas de overdose nos últimos três anos, sendo a mais recente com 15 cápsulas de fluoxetina. A mãe está preocupada com as ameaças de suicídio quando a filha fica frustrada e aumenta sua instabilidade emocional. Durante a consulta, a paciente se vincula facilmente, relata sentimentos de vazio, ansiedade intensa, e dificuldade em controlar a raiva. Ela descreve mudanças emocionais repentinas e deseja algo para aliviar as crises. No exame mental, há labilidade emocional e dissociação ao falar das tentativas de suicídio. Sobre o caso, é correto afirmar que:", "a": ["A paciente apresenta um quadro de desregulação emocional grave, com crises provavelmente desencadeadas por estressores interpessoais que devem ser ativamente explorados durante o atendimento.", "O diagnóstico principal é um transtorno de humor, possivelmente bipolar tipo II com ciclagem rápida, e deve ser abordado primariamente com o uso de estabilizadores de humor.", "Segundo o DSM-5, a paciente não pode ser diagnosticada com transtorno de personalidade borderline devido à idade e ao fato de a personalidade ainda não estar totalmente formada.", "As autolesões e as ingestas medicamentosas não tinham intenção suicida e caracterizam um quadro manipulativo da paciente."], "g": "A", "ar": "Clínica Médica", "es": "Psiquiatria", "as_": "Transtornos de Personalidade (Borderline)", "d": "intermediario", "i": null, "x": "A alternativa A está correta. Dicas do enunciado: adolescente com **autolesões, tentativas de overdose, vínculo fácil, sentimentos de vazio, raiva difícil de controlar, labilidade emocional, dissociação** e crises **desencadeadas por frustrações interpessoais**: **desregulação emocional grave**, padrão compatível com traços de transtorno de personalidade borderline. Os estressores interpessoais devem ser explorados no atendimento. B: não há evidência suficiente para um transtorno de humor bipolar, e os estabilizadores não são a abordagem primária. C: o diagnóstico formal de borderline é cauteloso antes dos 18 anos, mas o quadro pode indicar essa possibilidade, e o DSM-5 admite o diagnóstico em adolescentes com sintomas persistentes. D: autolesões e tentativas de overdose são graves, e rotular o quadro de manipulativo é incorreto e arriscado.", "r": "DSM-5-TR; Diretrizes de borderline em adolescentes (NICE CG78)."}, {"n": 90, "e": "Mulher de 21 anos procura o pronto-socorro por história de perda de visão no olho esquerdo há 3 dias. Paciente relata aparecimento de “mancha” no campo de visão acompanhada de dor para movimentar o olho, de instalação progressiva ao longo desses dias. Refere que há 1 ano apresentou episódio de dor em face a direita, sendo diagnosticada com neuralgia do trigêmio e receitada carbamazepina 200 mg 8/8h. Ao exame neurológico: olho esquerdo com acuidade visual 20/50, escotoma cecocentral, dessaturação do vermelho e fundo de olho normal; sem outras alterações. TC crânio e órbitas sem alterações. LCR: 15 células (90% Lt, 8% Mono, 2% Nt), proteína 35g, glicose 60mg/ dL, presença de bandas oligoclonais. Qual é o diagnóstico e qual deve ser a conduta?", "a": ["Esclerose múltipla / Pulsoterapia com metilprednisolona", "Esclerose múltipla / Plasmaférese", "Neuromielite óptica / Pulsoterapia com metilprednisolona", "Neuromielite óptica / Plasmaférese"], "g": "A", "ar": "Clínica Médica", "es": "Neurologia", "as_": "Doenças Desmielinizantes (Esclerose Múltipla, Neurite Óptica)", "d": "intermediario", "i": null, "x": "A alternativa A está correta. Dicas do enunciado: mulher jovem com **perda visual monocular, dor à movimentação ocular, escotoma cecocentral, dessaturação de vermelho e fundo de olho normal** (neurite óptica retrobulbar típica), **neuralgia do trigêmio aos 20 anos** (sintoma desmielinizante) e **líquor com pleocitose leve e bandas oligoclonais**: **escl
