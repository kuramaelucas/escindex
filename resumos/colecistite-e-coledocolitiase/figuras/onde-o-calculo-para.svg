<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="360" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2d3d">Onde o cálculo para e o que ele causa</text>
  <g font-size="13" fill="#1f2d3d" text-anchor="middle">
    <rect x="20" y="44" width="335" height="130" rx="8" fill="#e1f0f6" stroke="#1b5e7a" stroke-width="2"/>
    <text x="187" y="68" font-weight="bold">Ducto cístico ou infundíbulo</text>
    <text x="187" y="94">Colecistite aguda litiásica</text>
    <text x="187" y="116">Vesícula cheia de líquido claro,</text>
    <text x="187" y="134">sem bile: hidropsia (mucocele)</text>
    <text x="187" y="156">Comprime o hepático comum: Mirizzi</text>
    <rect x="365" y="44" width="335" height="130" rx="8" fill="#fdf6d9" stroke="#8a7412" stroke-width="2"/>
    <text x="532" y="68" font-weight="bold">Colédoco</text>
    <text x="532" y="94">Coledocolitíase: ALT, GGT e</text>
    <text x="532" y="112">fosfatase alcalina altas</text>
    <text x="532" y="134">Colangite: febre, icterícia, dor</text>
    <text x="532" y="152">e, se grave, hipotensão e confusão</text>
    <rect x="20" y="194" width="680" height="110" rx="8" fill="#fbe9dd" stroke="#8a3b12" stroke-width="2"/>
    <text x="360" y="218" font-weight="bold">Fístula entre a vesícula e o intestino</text>
    <text x="360" y="242">O cálculo grande passa pela fístula e para no íleo terminal:</text>
    <text x="360" y="262">íleo biliar, obstrução mecânica do delgado</text>
    <text x="360" y="282">(ar nas vias biliares na radiografia)</text>
  </g>
  <text x="360" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3b12">O ponto onde o cálculo para define o quadro</text>
</svg>
