<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="360" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2d3d">Escala de coma de Glasgow: 3 a 15 pontos</text>
  <g font-size="13" fill="#1f2d3d" text-anchor="middle">
    <rect x="20" y="44" width="215" height="230" rx="8" fill="#e1f0f6" stroke="#1b5e7a" stroke-width="2"/>
    <text x="127" y="68" font-weight="bold">Abertura ocular (1 a 4)</text>
    <text x="127" y="96">4: espontânea</text>
    <text x="127" y="118">3: ao chamado</text>
    <text x="127" y="140">2: à pressão (dor)</text>
    <text x="127" y="162">1: nenhuma</text>
    <rect x="252" y="44" width="215" height="230" rx="8" fill="#fdf6d9" stroke="#8a7412" stroke-width="2"/>
    <text x="360" y="68" font-weight="bold">Resposta verbal (1 a 5)</text>
    <text x="360" y="96">5: orientada</text>
    <text x="360" y="118">4: confusa</text>
    <text x="360" y="140">3: palavras soltas</text>
    <text x="360" y="162">2: sons incompreensíveis</text>
    <text x="360" y="184">1: nenhuma</text>
    <rect x="484" y="44" width="216" height="230" rx="8" fill="#eef5e6" stroke="#4d7a1b" stroke-width="2"/>
    <text x="592" y="68" font-weight="bold">Resposta motora (1 a 6)</text>
    <text x="592" y="96">6: obedece comandos</text>
    <text x="592" y="118">5: localiza a dor</text>
    <text x="592" y="140">4: flexão normal (retirada)</text>
    <text x="592" y="162">3: flexão anormal (decorticação)</text>
    <text x="592" y="184">2: extensão (descerebração)</text>
    <text x="592" y="206">1: nenhuma</text>
    <text x="592" y="240" font-weight="bold">Mais preditiva do desfecho</text>
  </g>
  <rect x="20" y="288" width="680" height="46" rx="8" fill="#fbe9dd" stroke="#8a3b12" stroke-width="2"/>
  <text x="360" y="308" text-anchor="middle" font-size="13" fill="#1f2d3d">Grave: 8 ou menos (intubar) | Moderado: 9 a 13 | Leve: 14 e 15</text>
  <text x="360" y="326" text-anchor="middle" font-size="12" fill="#1f2d3d">Queda de 2 pontos ou mais ou pupila dilatada: pensar em herniação</text>
</svg>
