<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="sans-serif"><rect width="720" height="360" fill="#fff"/>
<text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b5e7a">Pressão na via aérea (volume controlado com pausa)</text>
<line x1="70" y1="290" x2="680" y2="290" stroke="#555" stroke-width="2"/><line x1="70" y1="290" x2="70" y2="60" stroke="#555" stroke-width="2"/>
<text x="40" y="180" font-size="12" fill="#555" transform="rotate(-90 40 180)" text-anchor="middle">pressão (cmH2O)</text>
<path d="M70,240 L120,240 L130,180 L250,90 L260,140 L330,140 L340,240 L680,240" fill="none" stroke="#1b5e7a" stroke-width="3"/>
<g stroke="#ccc" stroke-dasharray="4 4"><line x1="70" y1="90" x2="250" y2="90"/><line x1="70" y1="140" x2="330" y2="140"/></g>
<g font-size="13" font-weight="bold">
<text x="270" y="85" fill="#b03a2e">pico</text><text x="345" y="135" fill="#7a4d1b">platô</text><text x="360" y="232" fill="#4d7a1b">PEEP</text></g>
<g font-size="12" fill="#333">
<text x="430" y="85">pico − platô = resistência (tubo, broncoespasmo)</text>
<text x="430" y="135">platô − PEEP = driving pressure (alvo &lt; 15)</text>
<text x="430" y="155">platô ≤ 30 protege o pulmão</text>
<text x="430" y="232">PEEP mantém alvéolos abertos</text></g>
<g font-size="12" fill="#555" text-anchor="middle"><text x="190" y="308">inspiração</text><text x="295" y="308">pausa</text><text x="500" y="308">expiração</text></g>
<text x="360" y="340" text-anchor="middle" font-size="13" fill="#b03a2e">Volume corrente de 6 mL/kg do peso predito pela altura, não pelo peso real.</text>
</svg>
