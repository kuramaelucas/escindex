<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#1f2a26"><rect width="700" height="310" fill="#ffffff"/><text x="20" y="28" font-size="17" font-weight="700">Varicela: lesões em estágios diferentes ao mesmo tempo</text><line x1="35" y1="140" x2="155" y2="140" stroke="#d8b49a" stroke-width="3"/><ellipse cx="95" cy="139" rx="30" ry="5" fill="#e58a8a"/><text x="95" y="175" text-anchor="middle" font-weight="700">Mácula</text><text x="95" y="193" text-anchor="middle" font-size="12" fill="#55615c">plana, avermelhada</text><text x="180" y="145" text-anchor="middle" font-size="22" fill="#9aa5a0">→</text><line x1="205" y1="140" x2="325" y2="140" stroke="#d8b49a" stroke-width="3"/><path d="M237 140 Q265 106 293 140Z" fill="#e06f6f"/><text x="265" y="175" text-anchor="middle" font-weight="700">Pápula</text><text x="265" y="193" text-anchor="middle" font-size="12" fill="#55615c">elevada</text><text x="350" y="145" text-anchor="middle" font-size="22" fill="#9aa5a0">→</text><line x1="375" y1="140" x2="495" y2="140" stroke="#d8b49a" stroke-width="3"/><ellipse cx="435" cy="140" rx="34" ry="7" fill="#ef9a9a"/><path d="M413 138 Q435 90 457 138Z" fill="#eaf4fb" stroke="#8fb3c9" stroke-width="2"/><text x="435" y="175" text-anchor="middle" font-weight="700">Vesícula</text><text x="435" y="193" text-anchor="middle" font-size="12" fill="#55615c">“gota de orvalho”</text><text x="520" y="145" text-anchor="middle" font-size="22" fill="#9aa5a0">→</text><line x1="545" y1="140" x2="665" y2="140" stroke="#d8b49a" stroke-width="3"/><path d="M581 140 Q585 122 605 124 Q627 120 629 140Z" fill="#8a5a3c"/><text x="605" y="175" text-anchor="middle" font-weight="700">Crosta</text><text x="605" y="193" text-anchor="middle" font-size="12" fill="#55615c">seca, cai sem cicatriz*</text><rect x="20" y="225" width="660" height="70" rx="10" fill="#f4f1ec"/><text x="40" y="252" font-weight="700">No mesmo paciente, no mesmo dia: as quatro juntas (polimorfismo regional)</text><text x="40" y="276" font-size="13" fill="#3d4743">Distribuição centrípeta (mais no tronco), muito prurido. *Cicatriz se houver infecção secundária.</text></svg>
