<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#1f2a26"><rect width="700" height="400" fill="#ffffff"/><text x="20" y="28" font-size="17" font-weight="700">Kawasaki clássico: febre ≥ 5 dias + 4 dos 5 critérios</text><rect x="235" y="150" width="230" height="70" rx="35" fill="#c2561b"/><text x="350" y="180" text-anchor="middle" fill="#fff" font-weight="700">Febre ≥ 5 dias</text><text x="350" y="200" text-anchor="middle" fill="#fff" font-size="12">obrigatória</text><rect x="20" y="50" width="210" height="58" rx="10" fill="#fbe9e3" stroke="#e3b5a3"/><text x="125" y="74" text-anchor="middle" font-weight="700" font-size="13.5">Conjuntivite bilateral</text><text x="125" y="93" text-anchor="middle" font-size="11.5" fill="#55615c">sem secreção, poupa o limbo</text><line x1="125" y1="108" x2="350" y2="150" stroke="#e3b5a3" stroke-width="2"/><rect x="470" y="50" width="210" height="58" rx="10" fill="#fbe9e3" stroke="#e3b5a3"/><text x="575" y="74" text-anchor="middle" font-weight="700" font-size="13.5">Lábios e boca</text><text x="575" y="93" text-anchor="middle" font-size="11.5" fill="#55615c">fissuras, língua em framboesa</text><line x1="575" y1="108" x2="350" y2="150" stroke="#e3b5a3" stroke-width="2"/><rect x="20" y="280" width="210" height="58" rx="10" fill="#fbe9e3" stroke="#e3b5a3"/><text x="125" y="304" text-anchor="middle" font-weight="700" font-size="13.5">Exantema polimorfo</text><text x="125" y="323" text-anchor="middle" font-size="11.5" fill="#55615c">nunca vesicular ou bolhoso</text><line x1="125" y1="280" x2="350" y2="220" stroke="#e3b5a3" stroke-width="2"/><rect x="470" y="280" width="210" height="58" rx="10" fill="#fbe9e3" stroke="#e3b5a3"/><text x="575" y="304" text-anchor="middle" font-weight="700" font-size="13.5">Extremidades</text><text x="575" y="323" text-anchor="middle" font-size="11.5" fill="#55615c">edema/eritema → descamação</text><line x1="575" y1="280" x2="350" y2="220" stroke="#e3b5a3" stroke-width="2"/><rect x="245" y="300" width="210" height="58" rx="10" fill="#fbe9e3" stroke="#e3b5a3"/><text x="350" y="324" text-anchor="middle" font-weight="700" font-size="13.5">Linfonodo cervical</text><text x="350" y="343" text-anchor="middle" font-size="11.5" fill="#55615c">≥ 1,5 cm, em geral unilateral</text><line x1="350" y1="300" x2="350" y2="220" stroke="#e3b5a3" stroke-width="2"/><text x="350" y="385" text-anchor="middle" font-size="12" fill="#55615c">Miocardite e aneurisma coronariano são complicações, não critérios.</text></svg>
