<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="sans-serif"><rect width="760" height="340" fill="#fff"/>
<defs><marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs>
<text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Doença celíaca: investigar comendo glúten</text>
<g font-size="13" text-anchor="middle" fill="#333">
<rect x="230" y="44" width="300" height="50" rx="8" fill="#e1f0f6" stroke="#1b5e7a"/><text x="380" y="65" font-weight="bold" fill="#1b5e7a">Antitransglutaminase IgA</text><text x="380" y="83">+ IgA total (deficiência dá falso negativo)</text>
<g stroke="#555" stroke-width="2"><line x1="310" y1="94" x2="180" y2="128" marker-end="url(#s)"/><line x1="450" y1="94" x2="580" y2="128" marker-end="url(#s)"/></g>
<rect x="40" y="132" width="280" height="60" rx="8" fill="#eef5e6" stroke="#4d7a1b"/><text x="180" y="156" font-weight="bold" fill="#4d7a1b">Negativo</text><text x="180" y="176">celíaca improvável</text>
<rect x="440" y="132" width="280" height="60" rx="8" fill="#fbecec" stroke="#b03a2e"/><text x="580" y="156" font-weight="bold" fill="#b03a2e">Positivo</text><text x="580" y="176">endoscopia com biópsias do duodeno</text>
<line x1="580" y1="192" x2="580" y2="222" stroke="#555" stroke-width="2" marker-end="url(#s)"/>
<rect x="400" y="226" width="340" height="70" rx="8" fill="#f6efe1" stroke="#8a6a1b"/><text x="570" y="248" font-weight="bold" fill="#8a6a1b">Marsh: linfócitos intraepiteliais,</text><text x="570" y="266">hiperplasia de criptas, atrofia de vilos</text><text x="570" y="284">confirmado: dieta sem glúten por toda a vida</text>
<rect x="40" y="226" width="330" height="70" rx="8" fill="#f4f4f4" stroke="#777"/><text x="205" y="248" font-weight="bold">Dúvida (Marsh 1, sorologia limítrofe)</text><text x="205" y="268">HLA-DQ2/DQ8 negativo exclui;</text><text x="205" y="286">positivo não confirma</text>
