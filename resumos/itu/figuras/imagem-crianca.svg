<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="390" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2d3d">Imagem depois da ITU febril na criança</text>
  <g font-size="13" fill="#1f2d3d" text-anchor="middle">
    <rect x="235" y="44" width="250" height="56" rx="8" fill="#fbecec" stroke="#b03a2e" stroke-width="2"/>
    <text x="360" y="68" font-weight="bold">Primeira ITU febril</text>
    <text x="360" y="88">tratar e pedir imagem</text>
    <rect x="200" y="130" width="320" height="64" rx="8" fill="#e1f0f6" stroke="#1b5e7a" stroke-width="2"/>
    <text x="360" y="154" font-weight="bold">Ultrassonografia de rins e vias urinárias</text>
    <text x="360" y="174">na internação ou em até 6 semanas</text>
    <rect x="20" y="236" width="300" height="76" rx="8" fill="#eef5e6" stroke="#4d7a1b" stroke-width="2"/>
    <text x="170" y="260" font-weight="bold">Normal, primeiro episódio</text>
    <text x="170" y="280">parar a investigação</text>
    <text x="170" y="300">sem profilaxia de rotina</text>
    <rect x="400" y="236" width="300" height="76" rx="8" fill="#f7efe6" stroke="#7a4d1b" stroke-width="2"/>
    <text x="550" y="260" font-weight="bold">Alterada, atípica ou recorrente</text>
    <text x="550" y="280">uretrocistografia miccional</text>
    <text x="550" y="300">(procura refluxo)</text>
  </g>
  <g stroke="#1f2d3d" stroke-width="2" fill="none">
    <line x1="360" y1="100" x2="360" y2="124"/><polyline points="354,116 360,126 366,116"/>
    <line x1="300" y1="194" x2="200" y2="230"/><polyline points="204,220 198,232 211,231"/>
    <line x1="420" y1="194" x2="520" y2="230"/><polyline points="509,231 522,232 516,220"/>
  </g>
  <text x="360" y="346" text-anchor="middle" font-size="12" fill="#1f2d3d">Cintilografia com DMSA: na fase aguda confirma pielonefrite quando a cultura falha;</text>
  <text x="360" y="364" text-anchor="middle" font-size="12" fill="#1f2d3d">meses depois, mostra cicatriz renal.</text>
</svg>
