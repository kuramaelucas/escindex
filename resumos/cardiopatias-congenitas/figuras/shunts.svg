<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="sans-serif"><rect width="720" height="340" fill="#fff"/>
<defs><marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs>
<text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b5e7a">Para onde vai o sangue</text>
<g text-anchor="middle" font-size="13">
<rect x="20" y="55" width="215" height="190" rx="8" fill="#eef5e6" stroke="#4d7a1b"/><text x="127" y="78" font-weight="bold" fill="#4d7a1b">Shunt E → D (CIV, CIA)</text>
<rect x="40" y="100" width="70" height="60" rx="6" fill="#fbecec" stroke="#b03a2e"/><text x="75" y="135" fill="#b03a2e">esquerdo</text>
<rect x="145" y="100" width="70" height="60" rx="6" fill="#e1f0f6" stroke="#1b5e7a"/><text x="180" y="135" fill="#1b5e7a">direito</text>
<path d="M112,130 L141,130" stroke="#b03a2e" stroke-width="3" marker-end="url(#s)"/>
<text x="127" y="190" fill="#333">pulmão recebe mais</text><text x="127" y="210" fill="#333">sem cianose, B2 alta,</text><text x="127" y="230" fill="#333">cansaço na mamada</text>
<rect x="252" y="55" width="215" height="190" rx="8" fill="#fbecec" stroke="#b03a2e"/><text x="360" y="78" font-weight="bold" fill="#b03a2e">Fallot (D → E)</text>
<rect x="272" y="100" width="70" height="60" rx="6" fill="#fbecec" stroke="#b03a2e"/><text x="307" y="135" fill="#b03a2e">esquerdo</text>
<rect x="377" y="100" width="70" height="60" rx="6" fill="#e1f0f6" stroke="#1b5e7a"/><text x="412" y="135" fill="#1b5e7a">direito</text>
<path d="M375,130 L346,130" stroke="#1b5e7a" stroke-width="3" marker-end="url(#s)"/>
<text x="360" y="190" fill="#333">estenose pulmonar desvia</text><text x="360" y="210" fill="#333">sangue venoso à aorta:</text><text x="360" y="230" fill="#333">cianose, coração em bota</text>
<rect x="484" y="55" width="215" height="190" rx="8" fill="#f7efe6" stroke="#7a4d1b"/><text x="591" y="78" font-weight="bold" fill="#7a4d1b">Eisenmenger</text>
<text x="591" y="115" fill="#333">anos de hiperfluxo</text><text x="591" y="135" fill="#333">endurecem as arteríolas</text><text x="591" y="155" fill="#333">pulmonares; a pressão</text><text x="591" y="175" fill="#333">do pulmão supera a sistêmica</text><text x="591" y="205" fill="#7a4d1b" font-weight="bold">o shunt inverte:</text><text x="591" y="225" fill="#7a4d1b">cianose tardia</text>
<text x="360" y="285" fill="#333">Teste do coraçãozinho: &lt; 95% ou diferença &gt; 3% entre braço direito e perna → repetir em 1 h → eco.</text>
<text x="360" y="310" fill="#b03a2e">Cianose que não melhora com oxigênio (hiperóxia negativa) é cardíaca.</text>
</g></svg>
