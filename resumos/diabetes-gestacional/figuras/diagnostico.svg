<text x="380" y="65" font-weight="bold">Glicemia de jejum na 1ª consulta</text>
<text x="130" y="135" font-weight="bold">&lt; 92</text><text x="130" y="155">TOTG 75 g com 24–28 sem</text>
<text x="380" y="135" font-weight="bold">92 a 125</text><text x="380" y="155">diabetes gestacional</text>
<text x="630" y="135" font-weight="bold">≥ 126</text><text x="630" y="155">diabetes prévio (overt)</text>
