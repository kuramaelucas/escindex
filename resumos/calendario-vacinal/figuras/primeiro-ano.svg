<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 330" font-family="system-ui,sans-serif" font-size="13">
  <rect width="770" height="330" fill="#fff"/>
  <text x="20" y="26" font-size="15" font-weight="700" fill="#222">Primeiro ano: o que se aplica em cada mês</text>
  <line x1="40" y1="60" x2="730" y2="60" stroke="#888" stroke-width="2"/>
  <g fill="#222" font-weight="700" text-anchor="middle">
    <text x="60" y="52">Nascer</text><text x="160" y="52">2 m</text><text x="250" y="52">3 m</text><text x="340" y="52">4 m</text>
    <text x="430" y="52">5 m</text><text x="520" y="52">6 m</text><text x="610" y="52">9 m</text><text x="700" y="52">12 m</text>
  </g>
  <g fill="#555"><circle cx="60" cy="60" r="5"/><circle cx="160" cy="60" r="5"/><circle cx="250" cy="60" r="5"/><circle cx="340" cy="60" r="5"/><circle cx="430" cy="60" r="5"/><circle cx="520" cy="60" r="5"/><circle cx="610" cy="60" r="5"/><circle cx="700" cy="60" r="5"/></g>
  <!-- BCG e hep B -->
  <rect x="25" y="80" width="70" height="44" rx="6" fill="#e8eef9" stroke="#4a6fb3"/>
  <text x="60" y="98" text-anchor="middle">BCG</text><text x="60" y="116" text-anchor="middle">Hep B</text>
  <!-- PaVi: 2,4,6 -->
  <g text-anchor="middle"><rect x="125" y="80" width="70" height="30" rx="6" fill="#e6f4ec" stroke="#2f8a57"/><text x="160" y="100">Penta+VIP</text>
  <rect x="305" y="80" width="70" height="30" rx="6" fill="#e6f4ec" stroke="#2f8a57"/><text x="340" y="100">Penta+VIP</text>
  <rect x="485" y="80" width="70" height="30" rx="6" fill="#e6f4ec" stroke="#2f8a57"/><text x="520" y="100">Penta+VIP</text></g>
  <!-- Roda e pneu: 2,4 -->
  <g text-anchor="middle"><rect x="125" y="118" width="70" height="44" rx="6" fill="#fdf1e2" stroke="#c07a1c"/><text x="160" y="136">Rotavírus</text><text x="160" y="154">Pneumo 10</text>
  <rect x="305" y="118" width="70" height="44" rx="6" fill="#fdf1e2" stroke="#c07a1c"/><text x="340" y="136">Rotavírus</text><text x="340" y="154">Pneumo 10</text></g>
  <!-- Meningo ímpar -->
  <g text-anchor="middle"><rect x="212" y="80" width="76" height="30" rx="6" fill="#f6e8f3" stroke="#9a3f86"/><text x="250" y="100">Meningo C</text>
  <rect x="392" y="80" width="76" height="30" rx="6" fill="#f6e8f3" stroke="#9a3f86"/><text x="430" y="100">Meningo C</text></g>
  <!-- 9 m -->
  <rect x="572" y="80" width="76" height="44" rx="6" fill="#fff6cc" stroke="#b39200"/><text x="610" y="98" text-anchor="middle">Febre</text><text x="610" y="116" text-anchor="middle">amarela</text>
  <!-- 12 m -->
  <rect x="652" y="80" width="100" height="62" rx="6" fill="#eeeeee" stroke="#666"/>
  <g text-anchor="middle"><text x="702" y="98">SCR</text><text x="702" y="116">Pneumo (ref.)</text><text x="702" y="134">Meningo (ref.)</text></g>
  <!-- legenda dos mnemônicos -->
  <g font-size="13" fill="#222">
    <rect x="25" y="190" width="14" height="14" fill="#e6f4ec" stroke="#2f8a57"/><text x="46" y="202">"PaVi" nos meses pares: pentavalente + VIP aos 2, 4 e 6 meses</text>
    <rect x="25" y="214" width="14" height="14" fill="#fdf1e2" stroke="#c07a1c"/><text x="46" y="226">"Roda e pneu só no 2 e no 4": rotavírus + pneumocócica 10</text>
    <rect x="25" y="238" width="14" height="14" fill="#f6e8f3" stroke="#9a3f86"/><text x="46" y="250">"Meningo é ímpar": meningocócica C aos 3 e 5 meses</text>
    <rect x="25" y="262" width="14" height="14" fill="#fff6cc" stroke="#b39200"/><text x="46" y="274">"9 meses, amarelo maduro": febre amarela</text>
    <rect x="25" y="286" width="14" height="14" fill="#eeeeee" stroke="#666"/><text x="46" y="298">"Bolo de 1 ano com 3 velas": tríplice viral + reforços de pneumo e meningo (ACWY desde 2025)</text>
  </g>
</svg>
