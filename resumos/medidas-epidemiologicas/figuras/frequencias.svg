<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2d3d">Medidas de frequência: o que vai em cima e o que vai embaixo</text>
  <g font-size="13" fill="#1f2d3d">
    <rect x="20" y="44" width="680" height="60" rx="8" fill="#fbe9dd" stroke="#8a3b12"/>
    <text x="34" y="66" font-weight="bold">Incidência (risco)</text>
    <text x="34" y="90">casos novos no período  ÷  população em risco no início (livre da doença)</text>
    <rect x="20" y="112" width="680" height="60" rx="8" fill="#e1f0f6" stroke="#1b5e7a"/>
    <text x="34" y="134" font-weight="bold">Prevalência</text>
    <text x="34" y="158">casos existentes (novos e antigos)  ÷  população total</text>
    <rect x="20" y="180" width="680" height="60" rx="8" fill="#eef5e6" stroke="#4d7a1b"/>
    <text x="34" y="202" font-weight="bold">Taxa de ataque (surto)</text>
    <text x="34" y="226">casos  ÷  expostos</text>
    <rect x="20" y="248" width="680" height="60" rx="8" fill="#f3e8f6" stroke="#6b3a7a"/>
    <text x="34" y="270" font-weight="bold">Letalidade (gravidade)</text>
    <text x="34" y="294">óbitos pela doença  ÷  casos da doença</text>
    <rect x="20" y="316" width="680" height="60" rx="8" fill="#fdf6d9" stroke="#8a7412"/>
    <text x="34" y="338" font-weight="bold">Mortalidade (risco de morrer)</text>
    <text x="34" y="362">óbitos  ÷  população     |     mortalidade infantil: óbitos &lt; 1 ano  ÷  nascidos vivos</text>
  </g>
</svg>
