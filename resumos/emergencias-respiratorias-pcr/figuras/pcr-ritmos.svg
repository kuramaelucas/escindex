<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="system-ui,sans-serif" font-size="13">
<rect width="760" height="360" fill="#fff"/>
<text x="20" y="26" font-size="15" font-weight="700" fill="#222">Parada na criança: o ritmo decide o caminho</text>
<rect x="230" y="40" width="300" height="50" rx="8" fill="#eef1f6" stroke="#4a6fb3"/>
<text x="380" y="62" text-anchor="middle" font-weight="700">RCP (C-A-B), 100–120/min, 1/3 do tórax</text>
<text x="380" y="80" text-anchor="middle" font-size="12">monitor e acesso IV/IO</text>
<path d="M300 90 L170 128" stroke="#555" fill="none"/><path d="M460 90 L590 128" stroke="#555" fill="none"/>
<rect x="20" y="128" width="320" height="48" rx="8" fill="#fbe5e1" stroke="#b03a2e"/>
<text x="180" y="148" text-anchor="middle" font-weight="700">Chocável</text><text x="180" y="166" text-anchor="middle">fibrilação ventricular · TV sem pulso</text>
<rect x="420" y="128" width="320" height="48" rx="8" fill="#e8eef9" stroke="#4a6fb3"/>
<text x="580" y="148" text-anchor="middle" font-weight="700">Não chocável</text><text x="580" y="166" text-anchor="middle">assistolia · AESP</text>
<g font-size="13">
<rect x="20" y="190" width="320" height="34" rx="6" fill="#fff" stroke="#b03a2e"/><text x="180" y="212" text-anchor="middle">choque 2 J/kg → 2 min de RCP</text>
<rect x="20" y="232" width="320" height="34" rx="6" fill="#fff" stroke="#b03a2e"/><text x="180" y="254" text-anchor="middle">choque 4 J/kg → RCP + adrenalina</text>
<rect x="20" y="274" width="320" height="34" rx="6" fill="#fff" stroke="#b03a2e"/><text x="180" y="296" text-anchor="middle">3º choque → amiodarona ou lidocaína</text>
<rect x="420" y="190" width="320" height="34" rx="6" fill="#fff" stroke="#4a6fb3"/><text x="580" y="212" text-anchor="middle">adrenalina o quanto antes</text>
<rect x="420" y="232" width="320" height="34" rx="6" fill="#fff" stroke="#4a6fb3"/><text x="580" y="254" text-anchor="middle">0,01 mg/kg IV/IO a cada 3–5 min</text>
<rect x="420" y="274" width="320" height="34" rx="6" fill="#fff" stroke="#4a6fb3"/><text x="580" y="296" text-anchor="middle">tratar causas reversíveis (5 H e 5 T)</text>
</g>
<text x="20" y="332" fill="#555">Com via aérea avançada: compressões contínuas e 1 ventilação a cada 2–3 s.</text><text x="20" y="350" fill="#555">Pela cânula traqueal, adrenalina em dose 10 vezes maior.</text>
</svg>
