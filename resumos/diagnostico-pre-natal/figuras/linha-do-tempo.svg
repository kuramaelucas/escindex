<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="sans-serif"><rect width="760" height="330" fill="#fff"/>
<text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Diagnóstico pré-natal: cada exame tem a sua janela</text>
<line x1="40" y1="280" x2="720" y2="280" stroke="#555" stroke-width="2"/>
<g font-size="12" fill="#555" text-anchor="middle"><text x="60" y="300">10 sem</text><text x="170" y="300">11–14 sem</text><text x="330" y="300">15–20 sem</text><text x="490" y="300">20–24 sem</text><text x="650" y="300">24–28 sem</text></g>
<g font-size="13" fill="#333" text-anchor="middle">
<rect x="20" y="50" width="150" height="90" rx="8" fill="#f4f4f4" stroke="#777"/><text x="95" y="74" font-weight="bold">DNA fetal livre</text><text x="95" y="94">(NIPT) desde</text><text x="95" y="112">10 semanas:</text><text x="95" y="130">rastreio</text>
<rect x="100" y="160" width="160" height="110" rx="8" fill="#e1f0f6" stroke="#1b5e7a"/><text x="180" y="182" font-weight="bold" fill="#1b5e7a">Morfológico 1º tri</text><text x="180" y="204">translucência nucal,</text><text x="180" y="222">osso nasal, ducto</text><text x="180" y="240">venoso, tricúspide</text><text x="180" y="258">CCN 45–84 mm</text>
<rect x="185" y="50" width="150" height="90" rx="8" fill="#fbecec" stroke="#b03a2e"/><text x="260" y="74" font-weight="bold" fill="#b03a2e">Vilo corial</text><text x="260" y="94">11–14 semanas</text><text x="260" y="112">diagnóstico</text><text x="260" y="130">precoce</text>
<rect x="290" y="160" width="160" height="110" rx="8" fill="#fbecec" stroke="#b03a2e"/><text x="370" y="182" font-weight="bold" fill="#b03a2e">Amniocentese</text><text x="370" y="204">a partir de</text><text x="370" y="222">15 semanas</text><text x="370" y="240">(PCR de infecção:</text><text x="370" y="258">após 18 semanas)</text>
<rect x="420" y="50" width="160" height="90" rx="8" fill="#eef5e6" stroke="#4d7a1b"/><text x="500" y="74" font-weight="bold" fill="#4d7a1b">Morfológico 2º tri</text><text x="500" y="94">anatomia completa,</text><text x="500" y="112">marcadores menores</text>
<rect x="580" y="160" width="160" height="110" rx="8" fill="#f6efe1" stroke="#8a6a1b"/><text x="660" y="182" font-weight="bold" fill="#8a6a1b">Ecocardiograma</text><text x="660" y="204">fetal</text><text x="660" y="226">nas gestações</text><text x="660" y="244">de risco</text>
</g>
<text x="380" y="322" text-anchor="middle" font-size="12" fill="#555">Rastreio alterado → exame diagnóstico (vilo ou amniocentese). Rh negativo → anti-D após procedimento.</text>
</svg>
