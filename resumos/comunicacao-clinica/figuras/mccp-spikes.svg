<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2d3d">Duas ferramentas de comunicação</text>
  <text x="20" y="58" font-size="14" font-weight="bold" fill="#8a3b12">MCCP atual: quatro componentes</text>
  <g font-size="13" fill="#1f2d3d" text-anchor="middle">
    <rect x="20" y="68" width="160" height="96" rx="8" fill="#fbe9dd" stroke="#8a3b12" stroke-width="2"/>
    <text x="100" y="90" font-weight="bold">1. Explorar</text><text x="100" y="110">a saúde, a doença e a</text><text x="100" y="128">experiência da doença</text><text x="100" y="148">(SIFE)</text>
    <rect x="195" y="68" width="160" height="96" rx="8" fill="#fbe9dd" stroke="#8a3b12" stroke-width="2"/>
    <text x="275" y="90" font-weight="bold">2. Entender</text><text x="275" y="110">a pessoa como um todo</text><text x="275" y="128">(contexto, família,</text><text x="275" y="148">rede)</text>
    <rect x="370" y="68" width="160" height="96" rx="8" fill="#fbe9dd" stroke="#8a3b12" stroke-width="2"/>
    <text x="450" y="90" font-weight="bold">3. Plano conjunto</text><text x="450" y="110">terreno comum:</text><text x="450" y="128">problemas, metas e</text><text x="450" y="148">papéis negociados</text>
    <rect x="545" y="68" width="155" height="96" rx="8" fill="#fbe9dd" stroke="#8a3b12" stroke-width="2"/>
    <text x="622" y="90" font-weight="bold">4. Fortalecer</text><text x="622" y="110">a relação entre a</text><text x="622" y="128">pessoa e o médico</text>
  </g>
  <text x="20" y="198" font-size="14" font-weight="bold" fill="#1b5e7a">SPIKES: seis passos para a má notícia</text>
  <g font-size="13" fill="#1f2d3d" text-anchor="middle">
    <rect x="20" y="208" width="105" height="120" rx="8" fill="#e1f0f6" stroke="#1b5e7a" stroke-width="2"/>
    <text x="72" y="232" font-weight="bold">S</text><text x="72" y="252">preparar o</text><text x="72" y="270">ambiente</text>
    <rect x="135" y="208" width="105" height="120" rx="8" fill="#e1f0f6" stroke="#1b5e7a" stroke-width="2"/>
    <text x="187" y="232" font-weight="bold">P</text><text x="187" y="252">percepção:</text><text x="187" y="270">o que já sabe</text>
    <rect x="250" y="208" width="105" height="120" rx="8" fill="#e1f0f6" stroke="#1b5e7a" stroke-width="2"/>
    <text x="302" y="232" font-weight="bold">I</text><text x="302" y="252">convite: quanto</text><text x="302" y="270">quer saber</text>
    <rect x="365" y="208" width="105" height="120" rx="8" fill="#e1f0f6" stroke="#1b5e7a" stroke-width="2"/>
    <text x="417" y="232" font-weight="bold">K</text><text x="417" y="252">informação</text><text x="417" y="270">clara, em partes</text>
    <rect x="480" y="208" width="105" height="120" rx="8" fill="#e1f0f6" stroke="#1b5e7a" stroke-width="2"/>
    <text x="532" y="232" font-weight="bold">E</text><text x="532" y="252">emoções:</text><text x="532" y="270">acolher e validar</text>
    <rect x="595" y="208" width="105" height="120" rx="8" fill="#e1f0f6" stroke="#1b5e7a" stroke-width="2"/>
    <text x="647" y="232" font-weight="bold">S</text><text x="647" y="252">estratégia e</text><text x="647" y="270">sumário</text>
  </g>
  <text x="360" y="366" text-anchor="middle" font-size="13" fill="#1f2d3d">Com a família que pede para omitir: perguntar ao paciente quanto e como quer saber.</text>
</svg>
