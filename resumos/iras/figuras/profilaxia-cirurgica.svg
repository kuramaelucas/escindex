<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="390" fill="#ffffff"/>
  <text x="360" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2d3d">Antibiótico profilático em cirurgia</text>
  <g font-size="13" fill="#1f2d3d" text-anchor="middle">
    <rect x="20" y="44" width="215" height="270" rx="8" fill="#e1f0f6" stroke="#1b5e7a" stroke-width="2"/>
    <text x="127" y="68" font-weight="bold">Como dar</text>
    <text x="127" y="94">Até 1 hora antes da</text>
    <text x="127" y="112">incisão (na indução)</text>
    <text x="127" y="140">Espectro estreito;</text>
    <text x="127" y="158">cefazolina é a base</text>
    <text x="127" y="186">Repetir a dose na</text>
    <text x="127" y="204">cirurgia longa (cerca de</text>
    <text x="127" y="222">4 horas) ou com sangramento</text>
    <text x="127" y="240">volumoso</text>
    <text x="127" y="268">Sem dias de antibiótico</text>
    <text x="127" y="286">em casa depois</text>
    <rect x="252" y="44" width="215" height="270" rx="8" fill="#eef5e6" stroke="#4d7a1b" stroke-width="2"/>
    <text x="360" y="68" font-weight="bold">Quando indicar</text>
    <text x="360" y="94">Cirurgia com prótese ou</text>
    <text x="360" y="112">tela: hérnia incisional,</text>
    <text x="360" y="130">cirurgia vascular</text>
    <text x="360" y="158">Cirurgia cardíaca,</text>
    <text x="360" y="176">esplenectomia, craniotomia</text>
    <text x="360" y="204">Colorretal e apendicectomia:</text>
    <text x="360" y="222">cobrir também anaeróbios</text>
    <text x="360" y="250">Alergia grave a betalactâmico:</text>
    <text x="360" y="268">clindamicina com gentamicina</text>
    <rect x="484" y="44" width="216" height="270" rx="8" fill="#fbe9dd" stroke="#8a3b12" stroke-width="2"/>
    <text x="592" y="68" font-weight="bold">Quando dispensar</text>
    <text x="592" y="94">Cirurgia limpa sem prótese:</text>
    <text x="592" y="112">tireoidectomia por bócio,</text>
    <text x="592" y="130">fundoplicatura</text>
    <text x="592" y="158">Traqueostomia</text>
    <text x="592" y="186">Colecistectomia videolaparos-</text>
    <text x="592" y="204">cópica eletiva de baixo risco</text>
    <text x="592" y="232">Hérnia inguinal com tela em</text>
    <text x="592" y="250">baixo risco (provas divergem)</text>
  </g>
  <text x="360" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3b12">A profilaxia mal dada (horário, dose ou duração) é ineficaz e pode prejudicar</text>
  <text x="360" y="366" text-anchor="middle" font-size="13" fill="#1f2d3d">Ela não substitui normotermia, tricotomia sem lâmina e antissepsia com clorexidina</text>
</svg>
