<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="sans-serif"><rect width="760" height="380" fill="#fff"/>
<defs><marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs>
<text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b5e7a">Suspeita de TVP: probabilidade antes do exame</text>
<g font-size="13" text-anchor="middle" fill="#333">
<rect x="250" y="44" width="260" height="46" rx="8" fill="#e1f0f6" stroke="#1b5e7a"/><text x="380" y="64" font-weight="bold" fill="#1b5e7a">Escore de Wells</text><text x="380" y="82">probabilidade clínica</text>
<g stroke="#555" stroke-width="2"><line x1="320" y1="90" x2="190" y2="128" marker-end="url(#s)"/><line x1="440" y1="90" x2="570" y2="128" marker-end="url(#s)"/></g>
<rect x="60" y="132" width="260" height="50" rx="8" fill="#eef5e6" stroke="#4d7a1b"/><text x="190" y="153" font-weight="bold" fill="#4d7a1b">Probabilidade baixa</text><text x="190" y="171">dosar D-dímero</text>
<rect x="440" y="132" width="260" height="50" rx="8" fill="#fbecec" stroke="#b03a2e"/><text x="570" y="153" font-weight="bold" fill="#b03a2e">Probabilidade alta</text><text x="570" y="171">Doppler direto</text>
<g stroke="#555" stroke-width="2"><line x1="140" y1="182" x2="110" y2="220" marker-end="url(#s)"/><line x1="240" y1="182" x2="290" y2="220" marker-end="url(#s)"/><line x1="570" y1="182" x2="570" y2="220" marker-end="url(#s)"/></g>
<rect x="20" y="224" width="180" height="56" rx="8" fill="#eef5e6" stroke="#4d7a1b"/><text x="110" y="246">D-dímero normal</text><text x="110" y="265" font-weight="bold" fill="#4d7a1b">TVP afastada</text>
<rect x="210" y="224" width="180" height="56" rx="8" fill="#f6efe1" stroke="#8a6a1b"/><text x="300" y="246">D-dímero alto</text><text x="300" y="265" font-weight="bold" fill="#8a6a1b">Doppler</text>
<rect x="440" y="224" width="260" height="56" rx="8" fill="#fbecec" stroke="#b03a2e"/><text x="570" y="246">veia que não se comprime</text><text x="570" y="265" font-weight="bold" fill="#b03a2e">TVP confirmada</text>
<text x="380" y="320">Exame demorado e suspeita alta, sem risco de sangrar: anticoagular enquanto espera.</text>
<text x="380" y="345">Doppler normal com D-dímero normal também afasta TVP.</text>
</g>
</svg>
