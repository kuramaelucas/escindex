<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" font-family="system-ui,sans-serif" font-size="13">
<rect width="760" height="240" fill="#fff"/>
<text x="20" y="26" font-size="15" font-weight="700" fill="#222">Adolescente e adulto: caminho preferido (track 1)</text>
<rect x="20" y="132" width="230" height="82" rx="8" fill="#e6f4ec" stroke="#2f8a57"/>
<text x="135" y="156" text-anchor="middle" font-weight="700">Asma leve</text>
<text x="135" y="178" text-anchor="middle">budesonida-formoterol</text>
<text x="135" y="196" text-anchor="middle">só quando necessário</text>
<rect x="265" y="100" width="230" height="114" rx="8" fill="#fdf3e0" stroke="#b07a1e"/>
<text x="380" y="124" text-anchor="middle" font-weight="700">Sem controle</text>
<text x="380" y="146" text-anchor="middle">budesonida-formoterol em</text>
<text x="380" y="164" text-anchor="middle">dose baixa de manutenção</text>
<text x="380" y="182" text-anchor="middle">e resgate (MART)</text>
<rect x="510" y="50" width="230" height="164" rx="8" fill="#fbe5e1" stroke="#b03a2e"/>
<text x="625" y="74" text-anchor="middle" font-weight="700">Antes de subir o degrau</text>
<text x="524" y="98">• técnica inalatória</text>
<text x="524" y="118">• adesão</text>
<text x="524" y="138">• gatilhos e comorbidades</text>
<text x="524" y="158">• drogas (betabloqueador, AINE)</text>
<text x="524" y="178">• confirmar o diagnóstico</text>
<text x="20" y="80" fill="#555" font-size="12">Salbutamol isolado não se usa:</text>
<text x="20" y="98" fill="#555" font-size="12">alivia sem tratar a inflamação.</text>
</svg>
