<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif"><rect width="760" height="400" fill="#fff"/>
<defs><marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs>
<text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b5e7a">Câncer de não pequenas células: o mediastino decide</text>
<g font-size="13" text-anchor="middle" fill="#333">
<rect x="230" y="42" width="300" height="46" rx="8" fill="#e1f0f6" stroke="#1b5e7a"/><text x="380" y="62" font-weight="bold" fill="#1b5e7a">PET-CT + ressonância de crânio</text><text x="380" y="80">sem metástase à distância</text>
<g stroke="#555" stroke-width="2"><line x1="320" y1="88" x2="170" y2="124" marker-end="url(#s)"/><line x1="440" y1="88" x2="590" y2="124" marker-end="url(#s)"/></g>
<rect x="30" y="128" width="280" height="64" rx="8" fill="#eef5e6" stroke="#4d7a1b"/><text x="170" y="150" font-weight="bold" fill="#4d7a1b">Mediastino normal,</text><text x="170" y="168">tumor periférico ≤ 3 cm</text><text x="170" y="184" font-size="12">(PET sem captação nos linfonodos)</text>
<rect x="450" y="128" width="280" height="64" rx="8" fill="#f6efe1" stroke="#8a6a1b"/><text x="590" y="150" font-weight="bold" fill="#8a6a1b">Linfonodo aumentado ou</text><text x="590" y="168">captante, tumor central ou</text><text x="590" y="184">maior que 3 cm</text>
<g stroke="#555" stroke-width="2"><line x1="170" y1="192" x2="170" y2="298" marker-end="url(#s)"/><line x1="590" y1="192" x2="590" y2="216" marker-end="url(#s)"/></g>
<rect x="450" y="220" width="280" height="46" rx="8" fill="#f6efe1" stroke="#8a6a1b"/><text x="590" y="240" font-weight="bold" fill="#8a6a1b">EBUS (punção do linfonodo)</text><text x="590" y="258">negativo com suspeita: mediastinoscopia</text>
<g stroke="#555" stroke-width="2"><line x1="530" y1="266" x2="300" y2="298" marker-end="url(#s)"/><line x1="650" y1="266" x2="650" y2="298" marker-end="url(#s)"/></g>
<text x="420" y="292" font-size="12" fill="#555">sem N2</text>
<rect x="30" y="302" width="300" height="56" rx="8" fill="#eef5e6" stroke="#4d7a1b"/><text x="180" y="324" font-weight="bold" fill="#4d7a1b">Lobectomia + linfadenectomia</text><text x="180" y="343">inoperável: radioterapia estereotáxica</text>
<rect x="500" y="302" width="240" height="56" rx="8" fill="#fbecec" stroke="#b03a2e"/><text x="620" y="324" font-weight="bold" fill="#b03a2e">N2 em várias cadeias</text><text x="620" y="343">tratamento não cirúrgico</text>
</g>
</svg>
