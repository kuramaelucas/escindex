<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Arial, sans-serif" font-size="13">
<rect width="760" height="330" fill="#fff"/>
<text x="380" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Partograma: o desenho de cada distocia</text>
<g font-size="12" fill="#222">
<g transform="translate(20,40)"><rect width="230" height="270" rx="8" fill="#f7f9fc" stroke="#9aaccc"/>
<text x="115" y="20" text-anchor="middle" font-weight="bold">Fase ativa prolongada</text>
<line x1="30" y1="200" x2="200" y2="200" stroke="#666"/><line x1="30" y1="200" x2="30" y2="40" stroke="#666"/>
<line x1="40" y1="190" x2="140" y2="60" stroke="#c9a400" stroke-dasharray="5 3"/><line x1="90" y1="190" x2="190" y2="60" stroke="#b5533c" stroke-dasharray="5 3"/>
<polyline points="40,190 80,175 120,160 160,140" fill="none" stroke="#4a6fa5" stroke-width="2.5"/>
<text x="115" y="225" text-anchor="middle">dilatação lenta, cruza o alerta</text><text x="115" y="243" text-anchor="middle">causa: contração ineficaz</text><text x="115" y="261" text-anchor="middle" font-weight="bold">amniotomia, ocitocina, analgesia</text></g>
<g transform="translate(265,40)"><rect width="230" height="270" rx="8" fill="#f7f9fc" stroke="#9aaccc"/>
<text x="115" y="20" text-anchor="middle" font-weight="bold">Parada secundária da dilatação</text>
<line x1="30" y1="200" x2="200" y2="200" stroke="#666"/><line x1="30" y1="200" x2="30" y2="40" stroke="#666"/>
<polyline points="40,170 80,130 120,130 160,130" fill="none" stroke="#4a6fa5" stroke-width="2.5"/>
<text x="120" y="120" text-anchor="middle">mesma dilatação em 2 h</text>
<text x="115" y="225" text-anchor="middle">bolsa íntegra: amniotomia</text><text x="115" y="243" text-anchor="middle">bolsa rota, boas contrações,</text><text x="115" y="261" text-anchor="middle" font-weight="bold">bossa: cesárea</text></g>
<g transform="translate(510,40)"><rect width="230" height="270" rx="8" fill="#f7f9fc" stroke="#9aaccc"/>
<text x="115" y="20" text-anchor="middle" font-weight="bold">Parada secundária da descida</text>
<line x1="30" y1="200" x2="200" y2="200" stroke="#666"/><line x1="30" y1="200" x2="30" y2="40" stroke="#666"/>
<polyline points="40,150 80,100 120,60" fill="none" stroke="#4a6fa5" stroke-width="2.5"/><text x="150" y="64">10 cm</text>
<polyline points="40,120 80,105 120,95 160,95" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="2 3"/><text x="115" y="185" text-anchor="middle">plano parado em 1 h</text>
<text x="115" y="225" text-anchor="middle">dilatação total, cabeça parada</text><text x="115" y="243" text-anchor="middle">alta com desproporção: cesárea</text><text x="115" y="261" text-anchor="middle" font-weight="bold">OT baixa: rotação</text></g>
</g>
<text x="380" y="324" text-anchor="middle" font-size="11" fill="#555">tracejado amarelo = linha de alerta; vermelho = linha de ação (4 h depois); azul = dilatação; verde = altura da apresentação</text>
</svg>
