<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2d3d">Curva ROC</text>
  <rect x="80" y="50" width="300" height="300" fill="none" stroke="#1f2d3d" stroke-width="2"/>
  <line x1="80" y1="350" x2="380" y2="50" stroke="#8a3b12" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M80 350 C100 200 130 110 200 85 C270 62 340 55 380 50" fill="none" stroke="#1b5e7a" stroke-width="3"/>
  <circle cx="145" cy="108" r="6" fill="#1b5e7a"/>
  <circle cx="380" cy="50" r="6" fill="#4d7a1b"/><circle cx="80" cy="350" r="6" fill="#6b3a7a"/>
  <g font-size="13" fill="#1f2d3d">
    <text x="230" y="378" text-anchor="middle">1 − especificidade (falso-positivos)</text>
    <text transform="translate(40 200) rotate(-90)" text-anchor="middle">sensibilidade</text>
    <text x="160" y="150">melhor corte: perto do canto superior esquerdo</text>
    <text x="250" y="256" fill="#8a3b12" font-weight="bold">diagonal = acaso</text>
    <text x="388" y="46">sempre positivo: sens. 100%, esp. 0</text>
    <text x="388" y="354" fill="#6b3a7a">nunca positivo: sens. 0, esp. 100%</text>
  </g>
  <g font-size="13" fill="#1f2d3d">
    <text x="420" y="150" font-weight="bold">Baixar o ponto de corte:</text>
    <text x="420" y="172">sensibilidade sobe, especificidade cai</text>
    <text x="420" y="204" font-weight="bold">Maior área sob a curva:</text>
    <text x="420" y="226">método diagnóstico melhor</text>
  </g>
</svg>
