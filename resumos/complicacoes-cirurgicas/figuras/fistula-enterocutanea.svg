<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="360" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2d3d">Fístula enterocutânea: fecha sozinha ou não?</text>
  <g font-size="13" fill="#1f2d3d" text-anchor="middle">
    <rect x="20" y="44" width="335" height="250" rx="8" fill="#eef5e6" stroke="#4d7a1b" stroke-width="2"/>
    <text x="187" y="68" font-weight="bold">Favorece o fechamento</text>
    <text x="187" y="94">Trajeto longo (mais de 2 cm)</text>
    <text x="187" y="116">Orifício pequeno (menos de 1 cm)</text>
    <text x="187" y="138">Baixo débito (menos de 200 mL/dia)</text>
    <text x="187" y="160">Origem no jejuno</text>
    <text x="187" y="182">Fístula lateral e trajeto único</text>
    <text x="187" y="204">Sem obstrução distal nem doença</text>
    <text x="187" y="222">de base</text>
    <rect x="365" y="44" width="335" height="250" rx="8" fill="#fbe9dd" stroke="#8a3b12" stroke-width="2"/>
    <text x="532" y="68" font-weight="bold">Impede o fechamento</text>
    <text x="532" y="94">Trajeto curto ou epitelizado</text>
    <text x="532" y="116">Débito alto (mais de 500 mL/dia)</text>
    <text x="532" y="138">Corpo estranho, enterite por radiação,</text>
    <text x="532" y="156">infecção ou doença inflamatória,</text>
    <text x="532" y="174">neoplasia</text>
    <text x="532" y="196">Obstrução distal (a jusante)</text>
    <text x="532" y="218">Origem no duodeno, estômago ou</text>
    <text x="532" y="236">coto; vários trajetos</text>
  </g>
  <text x="360" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3b12">Tratamento inicial é conservador; a cirurgia fica para meses depois, se não fechar</text>
</svg>
