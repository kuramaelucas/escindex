<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="system-ui,sans-serif" font-size="13">
<rect width="760" height="360" fill="#fff"/>
<text x="20" y="26" font-size="15" font-weight="700" fill="#222">Recém-nascido de mãe com sífilis: a primeira pergunta</text>
<rect x="190" y="40" width="380" height="56" rx="8" fill="#eef1f6" stroke="#4a6fb3"/>
<text x="380" y="62" text-anchor="middle" font-weight="700">A mãe foi adequadamente tratada?</text>
<text x="380" y="82" text-anchor="middle" font-size="12">benzatina completa, início ≥ 30 dias antes do parto, título caindo</text>
<path d="M300 96 L170 140" stroke="#555" fill="none"/><path d="M460 96 L590 140" stroke="#555" fill="none"/>
<text x="200" y="118" fill="#2f8a57" font-weight="700">sim</text><text x="530" y="118" fill="#b03a2e" font-weight="700">não</text>
<rect x="20" y="140" width="320" height="76" rx="8" fill="#e6f4ec" stroke="#2f8a57"/>
<text x="180" y="162" text-anchor="middle">VDRL do RN comparado ao materno</text>
<text x="180" y="184" text-anchor="middle">e exame físico</text>
<text x="180" y="205" text-anchor="middle" font-size="12">título ≥ 4× o materno ou sinais → como "não"</text>
<rect x="20" y="236" width="320" height="58" rx="8" fill="#fff" stroke="#2f8a57"/>
<text x="180" y="258" text-anchor="middle" font-weight="700">Criança exposta: sem tratamento</text>
<text x="180" y="278" text-anchor="middle">VDRL com 1, 3, 6, 12 e 18 meses</text>
<path d="M180 216 v20" stroke="#555"/>
<rect x="420" y="140" width="320" height="76" rx="8" fill="#fbe5e1" stroke="#b03a2e"/>
<text x="580" y="162" text-anchor="middle" font-weight="700">Investigar: sífilis congênita</text>
<text x="580" y="184" text-anchor="middle">hemograma, radiografia de ossos longos,</text>
<text x="580" y="204" text-anchor="middle">líquor (células, proteína, VDRL)</text>
<path d="M580 216 v20" stroke="#555"/>
<rect x="420" y="236" width="155" height="78" rx="8" fill="#fff" stroke="#b03a2e"/>
<text x="497" y="256" text-anchor="middle" font-weight="700">Líquor alterado</text><text x="497" y="274" text-anchor="middle">ou não colhido</text><text x="497" y="296" text-anchor="middle" font-size="12">cristalina IV, 10 dias</text>
<rect x="585" y="236" width="155" height="78" rx="8" fill="#fff" stroke="#b03a2e"/>
<text x="662" y="256" text-anchor="middle" font-weight="700">Líquor normal</text><text x="662" y="274" text-anchor="middle">&#160;</text><text x="662" y="296" text-anchor="middle" font-size="11">cristalina ou procaína, 10 d</text>
<text x="20" y="342" fill="#555">Título que não cai no seguimento = falha: novo líquor e 10 dias de penicilina parenteral.</text>
</svg>
