<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="sans-serif"><rect width="760" height="380" fill="#fff"/>
<defs><marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs>
<text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">TEP confirmado: o ventrículo direito decide a conduta</text>
<g font-size="13" text-anchor="middle" fill="#333">
<rect x="270" y="44" width="220" height="40" rx="8" fill="#e1f0f6" stroke="#1b5e7a"/><text x="380" y="69" font-weight="bold" fill="#1b5e7a">Pressão arterial?</text>
<g stroke="#555" stroke-width="2"><line x1="300" y1="84" x2="140" y2="118" marker-end="url(#s)"/><line x1="460" y1="84" x2="560" y2="118" marker-end="url(#s)"/></g>
<text x="150" y="98" font-size="12" fill="#555" text-anchor="end">choque, PAS &lt; 90</text><text x="530" y="98" font-size="12" fill="#555" text-anchor="start">estável</text>
<rect x="20" y="122" width="240" height="96" rx="8" fill="#fbecec" stroke="#b03a2e"/><text x="140" y="145" font-weight="bold" fill="#b03a2e">Alto risco (maciço)</text><text x="140" y="170">trombólise com alteplase</text><text x="140" y="190">ou embolectomia se</text><text x="140" y="208">contraindicada</text>
<rect x="420" y="122" width="290" height="40" rx="8" fill="#f4f4f4" stroke="#777"/><text x="565" y="147">escore (sPESI), VD no eco/TC, troponina</text>
<g stroke="#555" stroke-width="2"><line x1="500" y1="162" x2="410" y2="196" marker-end="url(#s)"/><line x1="565" y1="162" x2="565" y2="196" marker-end="url(#s)"/><line x1="640" y1="162" x2="680" y2="196" marker-end="url(#s)"/></g>
<rect x="290" y="200" width="200" height="110" rx="8" fill="#f6efe1" stroke="#8a6a1b"/><text x="390" y="222" font-weight="bold" fill="#8a6a1b">Intermediário-alto</text><text x="390" y="244">VD dilatado</text><text x="390" y="262">e troponina alta</text><text x="390" y="286">anticoagular, internar</text><text x="390" y="302">monitorado</text>
<rect x="500" y="200" width="130" height="110" rx="8" fill="#f6efe1" stroke="#8a6a1b"/><text x="565" y="222" font-weight="bold" fill="#8a6a1b">Interm.-baixo</text><text x="565" y="244">um ou nenhum</text><text x="565" y="262">dos dois</text><text x="565" y="290">anticoagular</text>
<rect x="640" y="200" width="110" height="110" rx="8" fill="#eef5e6" stroke="#4d7a1b"/><text x="695" y="222" font-weight="bold" fill="#4d7a1b">Baixo</text><text x="695" y="244">sPESI 0</text><text x="695" y="266">oral e</text><text x="695" y="284">alta</text><text x="695" y="302">precoce</text>
<text x="380" y="350">Se o paciente estável piorar e entrar em choque, a trombólise passa a valer.</text>
</g>
</svg>
