<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="system-ui,sans-serif" font-size="13">
<rect width="760" height="340" fill="#fff"/>
<text x="20" y="26" font-size="15" font-weight="700" fill="#222">Taquicardia no paciente estável: duas perguntas</text>
<rect x="290" y="44" width="180" height="40" rx="8" fill="#eef1f6" stroke="#4a5a78"/>
<text x="380" y="69" text-anchor="middle" font-weight="700">Como é o QRS?</text>
<line x1="330" y1="84" x2="200" y2="118" stroke="#555"/>
<line x1="430" y1="84" x2="600" y2="118" stroke="#555"/>
<rect x="110" y="118" width="180" height="40" rx="8" fill="#eef1f6" stroke="#4a5a78"/>
<text x="200" y="135" text-anchor="middle" font-weight="700">Estreito</text>
<text x="200" y="151" text-anchor="middle">e o RR?</text>
<rect x="510" y="118" width="180" height="40" rx="8" fill="#fbe5e1" stroke="#b03a2e"/>
<text x="600" y="135" text-anchor="middle" font-weight="700">Largo e regular</text>
<text x="600" y="151" text-anchor="middle">em cardiopata</text>
<line x1="600" y1="158" x2="600" y2="196" stroke="#555"/>
<rect x="510" y="196" width="180" height="58" rx="8" fill="#fbe5e1" stroke="#b03a2e"/>
<text x="600" y="219" text-anchor="middle" font-weight="700">TV monomórfica</text>
<text x="600" y="239" text-anchor="middle">amiodarona</text>
<line x1="160" y1="158" x2="90" y2="196" stroke="#555"/>
<line x1="240" y1="158" x2="330" y2="196" stroke="#555"/>
<rect x="20" y="196" width="160" height="40" rx="8" fill="#fdf3e0" stroke="#b07a1e"/>
<text x="100" y="221" text-anchor="middle" font-weight="700">Irregular</text>
<rect x="200" y="196" width="270" height="40" rx="8" fill="#e6f4ec" stroke="#2f8a57"/>
<text x="335" y="221" text-anchor="middle" font-weight="700">Regular: onde está a onda atrial?</text>
<text x="20" y="262" font-weight="700">Fibrilação atrial</text>
<text x="20" y="280">sem P, ondas f</text>
<text x="20" y="298">controle da FC,</text>
<text x="20" y="316">anticoagulação</text>
<text x="200" y="262" font-weight="700">P normal: sinusal</text>
<text x="200" y="280">tratar a causa</text>
<text x="340" y="262" font-weight="700">Pseudo-S: TPSV</text>
<text x="340" y="280">vagal, adenosina</text>
<text x="200" y="304" font-weight="700">Serrilhado: flutter</text>
<text x="200" y="324">controle da FC ou cardioversão</text>
</svg>
