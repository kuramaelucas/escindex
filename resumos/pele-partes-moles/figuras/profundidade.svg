<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="360" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2d3d">Infecções de pele: da superfície à fáscia</text>
  <g font-size="13" fill="#1f2d3d" text-anchor="middle">
    <rect x="20" y="44" width="215" height="270" rx="8" fill="#eef5e6" stroke="#4d7a1b" stroke-width="2"/>
    <text x="127" y="68" font-weight="bold">Epiderme: impetigo</text>
    <text x="127" y="94">Crosta cor de mel (não</text>
    <text x="127" y="112">bolhoso) ou bolha flácida</text>
    <text x="127" y="130">(bolhoso, por toxina)</text>
    <text x="127" y="158">Tópico: mupirocina</text>
    <text x="127" y="176">Extenso ou recorrente:</text>
    <text x="127" y="194">cefalexina por via oral</text>
    <text x="127" y="222">Ectima: úlcera rasa que</text>
    <text x="127" y="240">chega à derme</text>
    <rect x="252" y="44" width="215" height="270" rx="8" fill="#fdf3d8" stroke="#8a6b12" stroke-width="2"/>
    <text x="360" y="68" font-weight="bold">Derme e subcutâneo</text>
    <text x="360" y="94">Erisipela: borda nítida</text>
    <text x="360" y="112">e elevada, febre; estreptococo</text>
    <text x="360" y="130">do grupo A; penicilina</text>
    <text x="360" y="158">Celulite: limite impreciso;</text>
    <text x="360" y="176">estafilococo; oxacilina</text>
    <text x="360" y="194">ou cefalexina</text>
    <text x="360" y="222">MRSA da comunidade:</text>
    <text x="360" y="240">sulfametoxazol-trimetoprim</text>
    <rect x="484" y="44" width="216" height="270" rx="8" fill="#fbe9dd" stroke="#8a3b12" stroke-width="2"/>
    <text x="592" y="68" font-weight="bold">Fáscia: necrosante</text>
    <text x="592" y="94">Dor desproporcional ao</text>
    <text x="592" y="112">exame, toxemia, bolhas</text>
    <text x="592" y="130">hemorrágicas, crepitação</text>
    <text x="592" y="158">Desbridamento cirúrgico</text>
    <text x="592" y="176">de urgência e antibiótico</text>
    <text x="592" y="194">de amplo espectro</text>
    <text x="592" y="222">Clindamicina bloqueia a</text>
    <text x="592" y="240">toxina do estreptococo</text>
  </g>
  <text x="360" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3b12">Dor maior que o achado da pele e toxemia: pensar em fasceíte antes de rotular celulite</text>
</svg>
