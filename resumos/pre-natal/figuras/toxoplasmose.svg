<g text-anchor="middle" fill="#222">
<text x="102" y="70" font-weight="bold">IgG + · IgM −</text><text x="102" y="98">imune</text><text x="102" y="120">sem conduta</text>
<text x="287" y="70" font-weight="bold">IgG − · IgM −</text><text x="287" y="98">suscetível</text><text x="287" y="120">prevenção e</text><text x="287" y="138">repetir sorologia</text>
<text x="472" y="70" font-weight="bold">IgG + · IgM +</text><text x="472" y="98">pedir avidez</text><text x="472" y="120">e iniciar</text><text x="472" y="138">espiramicina</text>
<text x="657" y="70" font-weight="bold">IgG − · IgM +</text><text x="657" y="98">pode ser inicial:</text><text x="657" y="120">repetir em</text><text x="657" y="138">2 semanas</text>
<text x="472" y="210" font-weight="bold">Avidez alta</text><text x="472" y="232">antes de 16 semanas:</text><text x="472" y="254">infecção prévia,</text><text x="472" y="272">não tratar</text>
<text x="657" y="210" font-weight="bold">Avidez baixa</text><text x="657" y="232">(ou após 16 semanas):</text><text x="657" y="254">espiramicina;</text><text x="657" y="272">feto: amniocentese</text>
</g></svg>
