<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="sans-serif"><rect width="760" height="340" fill="#fff"/>
<defs><marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs>
<text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Constipação funcional na criança: o ciclo da retenção</text>
<g font-size="13" fill="#333" text-anchor="middle">
<rect x="270" y="46" width="220" height="50" rx="8" fill="#e1f0f6" stroke="#1b5e7a"/><text x="380" y="67" font-weight="bold" fill="#1b5e7a">Evacuação dolorosa</text><text x="380" y="85">(desfralde, escola, febre)</text>
<rect x="520" y="130" width="220" height="50" rx="8" fill="#f6efe1" stroke="#8a6a1b"/><text x="630" y="151" font-weight="bold" fill="#8a6a1b">Medo: segura as fezes</text><text x="630" y="169">postura de retenção</text>
<rect x="270" y="214" width="220" height="50" rx="8" fill="#fbecec" stroke="#b03a2e"/><text x="380" y="235" font-weight="bold" fill="#b03a2e">Fezes secas e grossas</text><text x="380" y="253">reto distende (fecaloma)</text>
<rect x="20" y="130" width="220" height="50" rx="8" fill="#f4f4f4" stroke="#777"/><text x="130" y="151" font-weight="bold">Escape em volta</text><text x="130" y="169">(parece diarreia)</text>
<g stroke="#555" stroke-width="2" fill="none"><path d="M490,72 C560,80 620,100 630,128" marker-end="url(#s)"/><path d="M630,180 C620,215 560,238 492,240" marker-end="url(#s)"/><path d="M270,240 C200,236 140,210 132,182" marker-end="url(#s)"/><path d="M380,214 L380,98" stroke-dasharray="5 4" marker-end="url(#s)"/></g>
<text x="380" y="292">Quebrar o ciclo: desimpactar (PEG em dose alta) e manter por meses,</text>
<text x="380" y="312">com rotina no vaso depois das refeições. Exame clínico basta para o diagnóstico.</text>
</g>
</svg>
