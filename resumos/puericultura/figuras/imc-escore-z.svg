<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#1f2a26"><rect width="680" height="370" fill="#ffffff"/><text x="20" y="28" font-size="17" font-weight="700">IMC para a idade (0 a 5 anos): leitura pelo escore z</text><rect x="150" y="50" width="260" height="48" fill="#d9534f" opacity=".85"/><text x="280" y="80" text-anchor="middle" font-weight="700">Obesidade</text><text x="135" y="80" text-anchor="end" fill="#3d4743">&gt; +3</text><rect x="150" y="102" width="260" height="48" fill="#ee8a4a" opacity=".85"/><text x="280" y="132" text-anchor="middle" font-weight="700">Sobrepeso</text><text x="135" y="132" text-anchor="end" fill="#3d4743">+2 a +3</text><rect x="150" y="154" width="260" height="48" fill="#f2c14e" opacity=".85"/><text x="280" y="184" text-anchor="middle" font-weight="700">Risco de sobrepeso</text><text x="135" y="184" text-anchor="end" fill="#3d4743">+1 a +2</text><rect x="150" y="206" width="260" height="48" fill="#6dbb84" opacity=".85"/><text x="280" y="236" text-anchor="middle" font-weight="700">Eutrofia</text><text x="135" y="236" text-anchor="end" fill="#3d4743">−2 a +1</text><rect x="150" y="258" width="260" height="48" fill="#f2c14e" opacity=".85"/><text x="280" y="288" text-anchor="middle" font-weight="700">Magreza</text><text x="135" y="288" text-anchor="end" fill="#3d4743">−3 a −2</text><rect x="150" y="310" width="260" height="48" fill="#d9534f" opacity=".85"/><text x="280" y="340" text-anchor="middle" font-weight="700">Magreza acentuada</text><text x="135" y="340" text-anchor="end" fill="#3d4743">&lt; −3</text><line x1="150" y1="100" x2="430" y2="100" stroke="#1f2a26" stroke-width="1.5"/><text x="436" y="104" font-size="12">+3</text><line x1="150" y1="152" x2="430" y2="152" stroke="#1f2a26" stroke-width="1.5"/><text x="436" y="156" font-size="12">+2</text><line x1="150" y1="204" x2="430" y2="204" stroke="#1f2a26" stroke-width="1.5"/><text x="436" y="208" font-size="12">+1</text><line x1="150" y1="256" x2="430" y2="256" stroke="#1f2a26" stroke-width="1.5"/><text x="436" y="260" font-size="12">−2</text><line x1="150" y1="308" x2="430" y2="308" stroke="#1f2a26" stroke-width="1.5"/><text x="436" y="312" font-size="12">−3</text><text x="470" y="80" font-size="12.5" fill="#3d4743"><tspan x="470">Linha de +1 é o primeiro</tspan><tspan x="470" dy="17">alerta (risco de sobrepeso).</tspan><tspan x="470" dy="28">Acima de 5 anos os cortes</tspan><tspan x="470" dy="17">sobem uma faixa: +1</tspan><tspan x="470" dy="17">sobrepeso, +2 obesidade.</tspan><tspan x="470" dy="28">Peso/idade isolado não</tspan><tspan x="470" dy="17">diagnostica excesso de peso.</tspan></text></svg>
