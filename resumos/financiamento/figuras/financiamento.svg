<rect x="20" y="260" width="680" height="55" rx="8" fill="#fbecec" stroke="#b03a2e"/><text x="360" y="283" fill="#b03a2e" font-weight="bold">Saúde suplementar (ANS): planos pagos por pessoas e empresas</text><text x="360" y="303" fill="#333">quando o beneficiário usa o SUS, o plano ressarce · o gasto privado já supera o público no Brasil</text>
