<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="sans-serif"><rect width="760" height="360" fill="#fff"/>
<text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Quanto maior o risco, mais baixo o LDL-alvo</text>
<g font-size="13" fill="#333">
<rect x="40" y="250" width="160" height="70" rx="8" fill="#eef5e6" stroke="#4d7a1b"/><text x="120" y="275" text-anchor="middle" font-weight="bold" fill="#4d7a1b">Intermediário</text><text x="120" y="300" text-anchor="middle">LDL &lt; 100</text>
<rect x="215" y="190" width="160" height="130" rx="8" fill="#f6efe1" stroke="#8a6a1b"/><text x="295" y="215" text-anchor="middle" font-weight="bold" fill="#8a6a1b">Alto</text><text x="295" y="240" text-anchor="middle">LDL &lt; 70</text><text x="295" y="268" text-anchor="middle" font-size="12">diabetes com idade</text><text x="295" y="284" text-anchor="middle" font-size="12">ou estratificador,</text><text x="295" y="300" text-anchor="middle" font-size="12">doença renal crônica</text>
<rect x="390" y="130" width="160" height="190" rx="8" fill="#fbecec" stroke="#b03a2e"/><text x="470" y="155" text-anchor="middle" font-weight="bold" fill="#b03a2e">Muito alto</text><text x="470" y="180" text-anchor="middle">LDL &lt; 50</text><text x="470" y="208" text-anchor="middle" font-size="12">infarto, AVC isquêmico,</text><text x="470" y="224" text-anchor="middle" font-size="12">doença arterial</text><text x="470" y="240" text-anchor="middle" font-size="12">periférica, placa</text><text x="470" y="256" text-anchor="middle" font-size="12">significativa</text>
<rect x="565" y="70" width="160" height="250" rx="8" fill="#f4f4f4" stroke="#777"/><text x="645" y="95" text-anchor="middle" font-weight="bold">Tratamento</text><text x="645" y="125" text-anchor="middle" font-size="12">mudança de vida</text><text x="645" y="141" text-anchor="middle" font-size="12">para todos</text><text x="645" y="175" text-anchor="middle" font-size="12">estatina de alta</text><text x="645" y="191" text-anchor="middle" font-size="12">potência no muito alto:</text><text x="645" y="207" text-anchor="middle" font-size="12">atorvastatina 40–80,</text><text x="645" y="223" text-anchor="middle" font-size="12">rosuvastatina 20–40</text><text x="645" y="257" text-anchor="middle" font-size="12">fora da meta:</text><text x="645" y="273" text-anchor="middle" font-size="12">ezetimiba</text>
</g>
<text x="380" y="345" text-anchor="middle" font-size="12" fill="#555">Valores de LDL em mg/dL, pelas diretrizes brasileiras de dislipidemia.</text>
</svg>
