<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="sans-serif"><rect width="760" height="320" fill="#fff"/>
<text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Abstinência alcoólica: o que surge depois da última dose</text>
<line x1="40" y1="270" x2="720" y2="270" stroke="#555" stroke-width="2"/>
<g font-size="12" fill="#555" text-anchor="middle"><text x="40" y="290">0 h</text><text x="160" y="290">6 h</text><text x="280" y="290">24 h</text><text x="400" y="290">48 h</text><text x="520" y="290">72 h</text><text x="640" y="290">96 h</text></g>
<g font-size="13" fill="#333">
<rect x="160" y="60" width="200" height="44" rx="8" fill="#eef5e6" stroke="#4d7a1b"/><text x="260" y="80" text-anchor="middle" font-weight="bold" fill="#4d7a1b">Tremor, ansiedade,</text><text x="260" y="96" text-anchor="middle">sudorese, taquicardia</text>
<rect x="210" y="116" width="180" height="44" rx="8" fill="#f6efe1" stroke="#8a6a1b"/><text x="300" y="136" text-anchor="middle" font-weight="bold" fill="#8a6a1b">Convulsão</text><text x="300" y="152" text-anchor="middle">(12 a 48 h)</text>
<rect x="210" y="172" width="180" height="44" rx="8" fill="#f6efe1" stroke="#8a6a1b"/><text x="300" y="192" text-anchor="middle" font-weight="bold" fill="#8a6a1b">Alucinose</text><text x="300" y="208" text-anchor="middle">consciência preservada</text>
<rect x="410" y="116" width="300" height="100" rx="8" fill="#fbecec" stroke="#b03a2e"/><text x="560" y="140" text-anchor="middle" font-weight="bold" fill="#b03a2e">Delirium tremens (48 a 96 h)</text><text x="560" y="164" text-anchor="middle">confusão, alucinações visuais,</text><text x="560" y="182" text-anchor="middle">febre, hipertensão, taquicardia</text><text x="560" y="204" text-anchor="middle">benzodiazepínico + tiamina</text>
</g>
<text x="380" y="245" text-anchor="middle" font-size="12" fill="#555">Tiamina antes da glicose em todo etilista; antipsicótico isolado baixa o limiar convulsivo.</text>
</svg>
