<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="sans-serif"><rect width="760" height="340" fill="#fff"/>
<defs><marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs>
<text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">O ataque de pânico se alimenta da própria interpretação</text>
<g font-size="13" fill="#333" text-anchor="middle">
<rect x="270" y="48" width="220" height="56" rx="8" fill="#e1f0f6" stroke="#1b5e7a"/><text x="380" y="70" font-weight="bold" fill="#1b5e7a">Sensação corporal</text><text x="380" y="90">coração dispara, falta de ar</text>
<rect x="520" y="140" width="220" height="56" rx="8" fill="#fbecec" stroke="#b03a2e"/><text x="630" y="162" font-weight="bold" fill="#b03a2e">Interpretação</text><text x="630" y="182">"vou morrer, enfartar"</text>
<rect x="270" y="232" width="220" height="56" rx="8" fill="#f6efe1" stroke="#8a6a1b"/><text x="380" y="254" font-weight="bold" fill="#8a6a1b">Medo e adrenalina</text><text x="380" y="274">mais taquicardia e ar</text>
<rect x="20" y="140" width="220" height="56" rx="8" fill="#f4f4f4" stroke="#777"/><text x="130" y="162" font-weight="bold">Pico em ~10 minutos</text><text x="130" y="182">e depois passa</text>
<g stroke="#555" stroke-width="2" fill="none"><path d="M490,80 C560,85 620,110 630,138" marker-end="url(#s)"/><path d="M630,196 C620,240 560,260 492,262" marker-end="url(#s)"/><path d="M270,262 C200,258 140,230 132,198" marker-end="url(#s)"/><path d="M130,140 C140,100 200,80 268,78" marker-end="url(#s)"/></g>
<text x="380" y="320">Transtorno de pânico = ataques inesperados + medo de ter outro. Tratar: ISRS e terapia cognitivo-comportamental.</text>
</g>
</svg>
