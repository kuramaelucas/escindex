<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caderno de Exantemáticas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Resumos adaptativos (resumos/LEIA-ME.md) em forma de caderno: sumário, capítulos
     (doenças) e seções (trechos). Onde o aluno erra, a seção se abre tópico a tópico,
     cada um com a própria medida de erro; onde ele domina, vira um parágrafo curto.
     O erro vem do backup da plataforma (Perfil › Seus dados); nada sai do navegador. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<script src="exantematicas/resumo.js"></script>
<style>
/* Caderno pautado: página com margem vermelha à esquerda; texto em serifa de livro,
   rótulos em sans condensada. Cor semântica (erro/atenção/domínio) separada do azul de tinta. */
:root{
  --papel:#fbfbf8; --folha:#ffffff; --pauta:#e6ebf2; --margem:#e8a3a3;
  --tinta:#1f2430; --suave:#667085; --azul:#1e4f9c;
  --erro:#b42318; --erro-f:#fdf0ef; --aten:#a15c07; --aten-f:#fdf5e7; --ok:#2b7a3d; --ok-f:#eef7f0;
  --serifa:"Source Serif 4",Georgia,"Times New Roman",serif;
  --rotulo:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#15171c; --folha:#1c1f26; --pauta:#262b35; --margem:#6b3434;
  --tinta:#e8e9ee; --suave:#9aa3b2; --azul:#8fb4f0;
  --erro:#ff8a80; --erro-f:#33201f; --aten:#f2b45a; --aten-f:#33291a; --ok:#86cf95; --ok-f:#1b2a20; color-scheme:dark}}
:root[data-theme="dark"]{
  --papel:#15171c; --folha:#1c1f26; --pauta:#262b35; --margem:#6b3434;
  --tinta:#e8e9ee; --suave:#9aa3b2; --azul:#8fb4f0;
  --erro:#ff8a80; --erro-f:#33201f; --aten:#f2b45a; --aten-f:#33291a; --ok:#86cf95; --ok-f:#1b2a20; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--papel);color:var(--tinta);font:17px/1.65 var(--serifa)}
.folha{max-width:860px;margin:24px auto 64px;background:var(--folha);border:1px solid var(--pauta);border-radius:4px;
  padding-block:40px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:linear-gradient(to right,transparent 0 calc(var(--m) - 1px),var(--margem) calc(var(--m) - 1px) var(--m),transparent var(--m));--m:0px}
@media (min-width:700px){.folha{--m:56px;padding-left:84px;padding-right:48px}}
@media (max-width:899px){.folha{margin:0;border:0;border-radius:0}}
.rotulo{font-family:var(--rotulo);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.74rem;color:var(--suave)}
h1{font-size:2.1rem;line-height:1.15;margin:.2em 0 .3em;text-wrap:balance}
h2{font-size:1.55rem;line-height:1.2;margin:0;text-wrap:balance}
h3{font-size:1.12rem;margin:0;text-wrap:balance}
p{margin:.4em 0}
a{color:var(--azul)}
a:focus-visible,button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.aluno{display:grid;gap:10px;border-top:1px solid var(--pauta);border-bottom:1px solid var(--pauta);padding:14px 0;margin:18px 0 8px;font-size:.95rem}
.aluno .acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font:500 .85rem var(--rotulo);border-radius:6px;padding:7px 12px;cursor:pointer;border:1px solid var(--pauta);background:var(--folha);color:var(--azul)}
input[type=file]{font:.85rem var(--rotulo);max-width:100%;color:var(--suave)}
.legenda{display:flex;flex-wrap:wrap;gap:6px 16px;font:.8rem var(--rotulo);color:var(--suave)}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
/* Sumário */
.sumario{margin:28px 0 8px}
.sumario ol{list-style:none;padding:0;margin:10px 0 0}
.cap-item{border-bottom:1px dotted var(--pauta);padding:8px 0}
.cap-linha{display:flex;gap:10px;align-items:baseline}
.cap-linha a{font-weight:600;text-decoration:none;color:var(--tinta);flex:1;min-width:0}
.cap-linha a:hover{color:var(--azul)}
.num{font-family:var(--rotulo);font-variant-numeric:tabular-nums;color:var(--suave);min-width:2.2em}
.sub{list-style:none;padding:0 0 0 2.2em;margin:2px 0 0;display:grid;gap:1px;font-size:.92rem}
.sub li{display:flex;gap:8px;align-items:baseline}
.sub a{color:var(--suave);text-decoration:none;flex:1;min-width:0}
.sub a:hover{color:var(--azul)}
.sub li.prioridade a{color:var(--erro);font-weight:600}
.sub li.atencao a{color:var(--aten)}
.chip{font:600 .7rem var(--rotulo);letter-spacing:.04em;padding:1px 8px;border-radius:99px;white-space:nowrap;border:1px solid currentColor;font-variant-numeric:tabular-nums}
.chip.prioridade{color:var(--erro);background:var(--erro-f)}.chip.atencao{color:var(--aten);background:var(--aten-f)}
.chip.dominado{color:var(--ok);background:var(--ok-f)}.chip.nada{color:var(--suave)}
/* Capítulos e seções */
.capitulo{margin-top:56px;scroll-margin-top:16px}
.cap-cab{border-bottom:2px solid var(--tinta);padding-bottom:8px;margin-bottom:6px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:end}
.cap-resumo{font-size:.92rem;color:var(--suave);font-style:italic;margin:6px 0 0}
.secao{margin-top:26px;scroll-margin-top:16px}
.sec-cab{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sec-cab h3{flex:1;min-width:0}
.porque{font:.8rem var(--rotulo);color:var(--suave);margin:4px 0 0}
.conferir{font:italic .8rem var(--serifa);color:var(--suave)}
/* Seção que o aluno erra: um bloco por tópico */
.topicos{display:grid;gap:8px;margin-top:10px}
.topico{border-left:3px solid var(--pauta);padding:6px 12px 6px 14px;border-radius:0 6px 6px 0}
.topico.prioridade{border-left-color:var(--erro);background:var(--erro-f)}
.topico.atencao{border-left-color:var(--aten);background:var(--aten-f)}
.topico.dominado{border-left-color:var(--ok)}
.topico .marca{display:block;font:600 .72rem var(--rotulo);letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.topico.prioridade .marca{color:var(--erro)}.topico.atencao .marca{color:var(--aten)}.topico.dominado .marca{color:var(--ok)}
/* Seção dominada ou sem medida: texto corrido, como num livro */
.corrido ul{margin:8px 0 0;padding-left:1.1em}
.corrido li{margin:3px 0}
details.dominada>summary{cursor:pointer;list-style:none}
details.dominada>summary::-webkit-details-marker{display:none}
details.dominada>summary h3::after{content:" ▸";color:var(--suave);font-size:.8em}
details.dominada[open]>summary h3::after{content:" ▾"}
details.dominada .corrido{color:var(--suave)}
.fim{margin-top:56px;border-top:1px solid var(--pauta);padding-top:12px;font-size:.85rem;color:var(--suave)}
</style>
</head>
<body>
<main class="folha">
  <div class="rotulo">Caderno de estudo · Pediatria · Infectologia</div>
  <h1 id="titulo">Caderno</h1>
  <p id="sub" class="cap-resumo" style="font-style:normal"></p>

  <section class="aluno" aria-label="De quem é o caderno">
    <div id="estado">Sem backup: o caderno aparece inteiro, sem destaque.</div>
    <div class="acoes">
      <label class="rotulo" for="arquivo">Seu backup</label>
      <input type="file" id="arquivo" accept=".json,application/json">
      <select id="usuario" hidden aria-label="Aluno do backup"></select>
      <button id="demo" type="button">Aluno de exemplo</button>
      <button id="limpar" type="button">Sem destaque</button>
    </div>
    <div class="legenda">
      <span><i style="background:var(--erro)"></i>Prioridade: errou 50% ou mais</span>
      <span><i style="background:var(--aten)"></i>Atenção: 20–49%</span>
      <span><i style="background:var(--ok)"></i>Dominado: menos de 20%</span>
      <span><i style="background:var(--pauta)"></i>Não medido</span>
    </div>
  </section>

  <nav class="sumario" aria-label="Sumário">
    <div class="rotulo">Sumário</div>
    <p class="porque" id="ordem"></p>
    <ol id="sumario"></ol>
  </nav>

  <div id="conteudo"></div>
  <p class="fim" id="fim"></p>
</main>
<script>
const R = window.EscResumos.lista[0];
let ultimas = null; // questaoId -> peso de erro da última resposta (0, 0.5 ou 1)

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const negrito = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
// Tópico = linha "- texto {q-a,q-b}": as chaves ligam o tópico às questões que ele responde.
const topicos = f => f.texto.split("\n").filter(l => l.trim()).map(l => {
  const m = l.match(/\s*\{([^}]+)\}\s*$/);
  return { texto: l.replace(/^\s*-\s*/, "").replace(/\s*\{[^}]+\}\s*$/, ""), questoes: m ? m[1].split(",").map(x => x.trim()) : null };
});

/* Erro de um conjunto: última resposta de cada questão respondida; acerto no chute
   conta meio erro (acertar sem saber não é domínio). */
function medir(ids){
  if(!ultimas) return null;
  const feitas = ids.filter(id => id in ultimas);
  if(!feitas.length) return { feitas: 0, total: ids.length, taxa: null, erro: 0 };
  const erro = feitas.reduce((s, id) => s + ultimas[id], 0);
  return { feitas: feitas.length, total: ids.length, taxa: erro / feitas.length, erro };
}
const nivel = m => !m || m.taxa === null ? "nada" : m.taxa >= .5 ? "prioridade" : m.taxa >= .2 ? "atencao" : "dominado";
const ROTULO = { prioridade: "Prioridade", atencao: "Atenção", dominado: "Dominado", nada: "Não medido" };
const pct = x => Math.round(x * 100) + "%";
const num = x => String(Math.round(x * 10) / 10).replace(".", ",");
const chip = m => ultimas ? `<span class="chip ${nivel(m)}">${ROTULO[nivel(m)]}${m.taxa !== null ? " · " + pct(m.taxa) : ""}</span>` : "";
function porque(m){
  if(!m.feitas) return `Você ainda não fez nenhuma das ${m.total} questões ligadas a esta seção.`;
  return `Você errou ${num(m.erro)} de ${m.feitas} questão(ões) que esta seção responde` + (m.feitas < m.total ? `; faltam ${m.total - m.feitas} por fazer.` : ".");
}
const ordenar = lista => ultimas ? lista.sort((a, b) => ((b.m.taxa ?? -1) - (a.m.taxa ?? -1)) || a.i - b.i) : lista;

function montar(){
  return ordenar(R.doencas.map((d, i) => ({ d, i, m: medir([...new Set(d.fragmentos.flatMap(f => f.questoes))]),
    secoes: ordenar(d.fragmentos.map((f, j) => ({ f, i: j, m: medir(f.questoes) }))) })));
}

function htmlSecao(cap, k, { f, m }){
  const n = nivel(m), id = `s-${f.id}`, numero = `${cap}.${k}`;
  const nota = f.conferir ? `<div class="conferir">Texto ainda a conferir na fonte primária.</div>` : "";
  // Onde o aluno erra (prioridade/atenção), a seção se abre tópico a tópico, cada um
  // com a sua medida: é ali que ele precisa saber QUAL detalhe está errando.
  if(n === "prioridade" || n === "atencao"){
    const blocos = topicos(f).map(t => {
      const mt = t.questoes ? medir(t.questoes) : null, nt = mt ? nivel(mt) : "nada";
      const marca = mt && mt.taxa !== null
        ? `<span class="marca">${nt === "dominado" ? "Você acerta" : "Você erra aqui"} · ${num(mt.erro)} de ${mt.feitas}</span>`
        : (mt && !mt.feitas ? `<span class="marca" style="color:var(--suave)">Ainda não testado</span>` : "");
      return `<div class="topico ${nt}">${marca}${negrito(t.texto)}</div>`;
    }).join("");
    return `<section class="secao" id="${id}">
      <div class="sec-cab"><span class="num">${numero}</span><h3>${esc(f.titulo)}</h3>${chip(m)}</div>
      <p class="porque">${esc(porque(m))} Abaixo, cada tópico com o seu próprio erro.</p>
      <div class="topicos">${blocos}</div>${nota}</section>`;
  }
  const corpo = `<div class="corrido"><ul>${topicos(f).map(t => `<li>${negrito(t.texto)}</li>`).join("")}</ul>${ultimas ? `<p class="porque">${esc(porque(m))}</p>` : ""}${nota}</div>`;
  if(n === "dominado") return `<details class="secao dominada" id="${id}"><summary class="sec-cab"><span class="num">${numero}</span><h3>${esc(f.titulo)}</h3>${chip(m)}</summary>${corpo}</details>`;
  return `<section class="secao" id="${id}"><div class="sec-cab"><span class="num">${numero}</span><h3>${esc(f.titulo)}</h3>${chip(m)}</div>${corpo}</section>`;
}

function desenhar(){
  const caps = montar();
  document.getElementById("titulo").textContent = R.titulo;
  document.getElementById("sub").textContent = `${caps.length} capítulos e ${R.doencas.reduce((s, d) => s + d.fragmentos.length, 0)} seções. Cada seção é ligada às questões reais de prova que ela responde.`;
  document.getElementById("ordem").textContent = ultimas
    ? "Os capítulos e as seções estão na ordem do que você mais erra. As seções em vermelho se abrem tópico a tópico; as dominadas ficam recolhidas."
    : "Carregue um backup para o caderno se reordenar pelo seu erro.";
  document.getElementById("sumario").innerHTML = caps.map(({ d, m, secoes }, c) => `
    <li class="cap-item">
      <div class="cap-linha"><span class="num">${c + 1}</span><a href="#c-${d.id}">${esc(d.titulo)}</a>${chip(m)}</div>
      <ol class="sub">${secoes.map(({ f, m }, k) => `<li class="${ultimas ? nivel(m) : ""}"><span class="num">${c + 1}.${k + 1}</span><a href="#s-${f.id}">${esc(f.titulo)}</a></li>`).join("")}</ol>
    </li>`).join("");
  document.getElementById("conteudo").innerHTML = caps.map(({ d, m, secoes }, c) => `
    <article class="capitulo" id="c-${d.id}">
      <div class="cap-cab"><div><div class="rotulo">Capítulo ${c + 1}</div><h2>${esc(d.titulo)}</h2></div>${chip(m)}</div>
      ${ultimas && m.taxa !== null ? `<p class="cap-resumo">${esc(porque(m).replace("esta seção", "este capítulo"))}</p>` : ""}
      ${secoes.map((s, k) => htmlSecao(c + 1, k + 1, s)).join("")}
    </article>`).join("");
  document.getElementById("fim").textContent = `Fontes a conferir: ${R.fontes.map(x => x.texto).join("; ")}. Fora deste caderno: ${R.foraDoEscopo.map(x => x.motivo).join("; ")}.`;
}

/* O backup é o db inteiro; respostas vêm em lista de objetos ou, em versões antigas, em colunas. */
function respostasDoBackup(b){
  const r = b.respostas || b.db?.respostas || [];
  if(Array.isArray(r)) return r;
  if(r && Array.isArray(r.questaoId)) return r.questaoId.map((_, i) => Object.fromEntries(Object.keys(r).map(k => [k, Array.isArray(r[k]) ? r[k][i] : r[k]])));
  return [];
}
function aplicarRespostas(lista, usuarioId, rotulo){
  ultimas = {};
  lista.filter(r => !usuarioId || r.usuarioId === usuarioId)
    .sort((a, b) => String(a.respondidaEm || a.data || "").localeCompare(String(b.respondidaEm || b.data || "")))
    .forEach(r => { ultimas[r.questaoId] = r.correta ? (r.confianca === "chute" ? .5 : 0) : 1; });
  const ids = new Set(R.doencas.flatMap(d => d.fragmentos.flatMap(f => f.questoes)));
  const feitas = Object.keys(ultimas).filter(id => ids.has(id)).length;
  document.getElementById("estado").innerHTML = `${rotulo ? `<strong>${esc(rotulo)}</strong>: ` : ""}${feitas} de ${ids.size} questões deste caderno respondidas. Vale a última resposta de cada uma.`;
  desenhar();
}

document.getElementById("arquivo").addEventListener("change", e => {
  const arq = e.target.files[0]; if(!arq) return;
  arq.text().then(t => {
    let b; try { b = JSON.parse(t); } catch { document.getElementById("estado").textContent = "Esse arquivo não é um backup em JSON da plataforma."; return; }
    const lista = respostasDoBackup(b), usuarios = [...new Set(lista.map(r => r.usuarioId))];
    const nome = id => (b.usuarios || []).find(u => u.id === id)?.nome || id;
    const sel = document.getElementById("usuario");
    if(usuarios.length > 1){
      sel.innerHTML = usuarios.map(id => `<option value="${esc(id)}">${esc(nome(id))}</option>`).join("");
      sel.hidden = false; sel.onchange = () => aplicarRespostas(lista, sel.value, nome(sel.value));
      aplicarRespostas(lista, usuarios[0], nome(usuarios[0]));
    } else { sel.hidden = true; aplicarRespostas(lista, null, usuarios[0] ? nome(usuarios[0]) : ""); }
  });
});

/* Aluno de exemplo, montado tópico a tópico para mostrar a fragmentação:
   - Sarampo: acerta o pródromo e o exantema, erra Koplik, vitamina A, bloqueio e cobertura.
   - Escarlatina: acerta o quadro em lixa, erra o agente e o tratamento.
   - Exantema súbito e eritema infeccioso: vai bem (um chute no eritema).
   - Kawasaki: erra "miocardite não é critério". O resto, metade certo. */
const ERRADAS = new Set(["q-iamspe2025-065","q-fmabc2026-089","q-famerp2023-027","q-sirio2022-053","q-usprp2026-032","q-uspsp4-101",
  "q-famerp2026-009","q-iamspe2021-072","q-amrigs2025-014","q-einstein2021-021","q-einstein2025-043",
  "q-unesp2025-009","q-uspsp2-050","q-sirio2024-050","q-scmsp2022-039","q-einstein2026-035","q-tp20222-047"]);
const CHUTES = new Set(["q-tp20202-046","q-usprp2026-045"]);
document.getElementById("demo").addEventListener("click", () => {
  const ids = [...new Set(R.doencas.flatMap(d => d.fragmentos.flatMap(f => f.questoes)))];
  const lista = ids.filter(id => id !== "q-sessp2026-050").map(id => ({ questaoId: id, correta: !ERRADAS.has(id), confianca: CHUTES.has(id) ? "chute" : "certeza", data: "2026-11-01" }));
  aplicarRespostas(lista, null, "Aluno de exemplo");
});
document.getElementById("limpar").addEventListener("click", () => {
  ultimas = null; document.getElementById("estado").textContent = "Sem destaque: o caderno na ordem do autor."; desenhar();
});
desenhar();
</script>
</body>
</html>
