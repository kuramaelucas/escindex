<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="system-ui,sans-serif" font-size="13">
<rect width="760" height="330" fill="#fff"/>
<text x="20" y="26" font-size="15" font-weight="700" fill="#222">Da avaliação ao plano (Ministério da Saúde)</text>
<g>
<rect x="20" y="45" width="230" height="200" rx="8" fill="#e6f4ec" stroke="#2f8a57"/>
<text x="135" y="68" text-anchor="middle" font-weight="700">Sem desidratação</text>
<text x="34" y="94">• bem alerta</text><text x="34" y="114">• olhos normais, com lágrimas</text><text x="34" y="134">• bebe normalmente</text><text x="34" y="154">• prega desaparece rápido</text>
<rect x="34" y="185" width="202" height="46" rx="6" fill="#fff" stroke="#2f8a57"/><text x="135" y="204" text-anchor="middle" font-weight="700">PLANO A — em casa</text><text x="135" y="222" text-anchor="middle" font-size="11.5">soro após cada evacuação + zinco</text>
</g>
<g>
<rect x="265" y="45" width="230" height="200" rx="8" fill="#fdf1e2" stroke="#c07a1c"/>
<text x="380" y="68" text-anchor="middle" font-weight="700">Desidratação (2 ou mais sinais)</text>
<text x="279" y="94">• irritado, inquieto</text><text x="279" y="114">• olhos fundos, sem lágrimas</text><text x="279" y="134">• sedento, bebe rápido</text><text x="279" y="154">• prega desaparece lentamente</text>
<rect x="279" y="185" width="202" height="46" rx="6" fill="#fff" stroke="#c07a1c"/><text x="380" y="204" text-anchor="middle" font-weight="700">PLANO B — na unidade</text><text x="380" y="222" text-anchor="middle">SRO 50–100 mL/kg em 4–6 h</text>
</g>
<g>
<rect x="510" y="45" width="230" height="200" rx="8" fill="#fbe5e1" stroke="#b03a2e"/>
<text x="625" y="68" text-anchor="middle" font-weight="700">Desidratação grave</text>
<text x="524" y="94">• letárgico ou inconsciente</text><text x="524" y="114">• não consegue beber</text><text x="524" y="134">• prega muito lenta (&gt; 2 s)</text><text x="524" y="154">• pulso fraco, enchimento &gt; 5 s</text>
<rect x="524" y="185" width="202" height="46" rx="6" fill="#fff" stroke="#b03a2e"/><text x="625" y="204" text-anchor="middle" font-weight="700">PLANO C — hospital</text><text x="625" y="222" text-anchor="middle">hidratação venosa imediata</text>
</g>
<path d="M380 245 v20 h-245 v-12" fill="none" stroke="#888" stroke-dasharray="4 3"/><text x="140" y="282" fill="#555">reavaliar: sem sinais → A</text>
<path d="M380 245 v20 h245 v-12" fill="none" stroke="#888" stroke-dasharray="4 3"/><text x="470" y="282" fill="#555">piora ou não bebe → C</text>
<text x="20" y="315" fill="#555">Zinco para todo menor de 5 anos: 10 mg/dia (&lt; 6 meses) ou 20 mg/dia (≥ 6 meses), por 10 a 14 dias.</text>
</svg>
