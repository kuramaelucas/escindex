<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Arial, Helvetica, sans-serif">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2d3d">Atributos da atenção primária (Starfield)</text>
  <text x="20" y="62" font-size="14" font-weight="bold" fill="#8a3b12">ESSENCIAIS: sem eles não é atenção primária</text>
  <g font-size="13" fill="#1f2d3d">
    <rect x="20" y="74" width="165" height="108" rx="8" fill="#fbe9dd" stroke="#8a3b12"/>
    <text x="102" y="98" text-anchor="middle" font-weight="bold">Primeiro contato</text>
    <text x="102" y="120" text-anchor="middle">Porta de entrada a</text>
    <text x="102" y="138" text-anchor="middle">cada novo problema;</text>
    <text x="102" y="156" text-anchor="middle">acesso e acolhimento</text>
    <rect x="195" y="74" width="165" height="108" rx="8" fill="#fbe9dd" stroke="#8a3b12"/>
    <text x="277" y="98" text-anchor="middle" font-weight="bold">Longitudinalidade</text>
    <text x="277" y="120" text-anchor="middle">Mesma equipe ao</text>
    <text x="277" y="138" text-anchor="middle">longo do tempo,</text>
    <text x="277" y="156" text-anchor="middle">com vínculo</text>
    <rect x="370" y="74" width="165" height="108" rx="8" fill="#fbe9dd" stroke="#8a3b12"/>
    <text x="452" y="98" text-anchor="middle" font-weight="bold">Integralidade</text>
    <text x="452" y="120" text-anchor="middle">Conjunto de problemas</text>
    <text x="452" y="138" text-anchor="middle">da pessoa resolvidos</text>
    <text x="452" y="156" text-anchor="middle">ou reconhecidos</text>
    <rect x="545" y="74" width="155" height="108" rx="8" fill="#fbe9dd" stroke="#8a3b12"/>
    <text x="622" y="98" text-anchor="middle" font-weight="bold">Coordenação</text>
    <text x="622" y="120" text-anchor="middle">Integra os pontos</text>
    <text x="622" y="138" text-anchor="middle">da rede: alta,</text>
    <text x="622" y="156" text-anchor="middle">especialista, exames</text>
  </g>
  <path d="M360 190 L360 222" stroke="#1f2d3d" stroke-width="2"/>
  <path d="M352 214 L360 226 L368 214 Z" fill="#1f2d3d"/>
  <text x="20" y="252" font-size="14" font-weight="bold" fill="#1b5e7a">DERIVADOS: qualificam como a equipe atua</text>
  <g font-size="13" fill="#1f2d3d">
    <rect x="20" y="264" width="220" height="108" rx="8" fill="#e1f0f6" stroke="#1b5e7a"/>
    <text x="130" y="288" text-anchor="middle" font-weight="bold">Orientação familiar</text>
    <text x="130" y="310" text-anchor="middle">A família é o contexto</text>
    <text x="130" y="328" text-anchor="middle">do adoecer e do</text>
    <text x="130" y="346" text-anchor="middle">tratar</text>
    <rect x="250" y="264" width="220" height="108" rx="8" fill="#e1f0f6" stroke="#1b5e7a"/>
    <text x="360" y="288" text-anchor="middle" font-weight="bold">Orientação comunitária</text>
    <text x="360" y="310" text-anchor="middle">Problemas coletivos do</text>
    <text x="360" y="328" text-anchor="middle">território, trabalhados</text>
    <text x="360" y="346" text-anchor="middle">com a comunidade</text>
    <rect x="480" y="264" width="220" height="108" rx="8" fill="#e1f0f6" stroke="#1b5e7a"/>
    <text x="590" y="288" text-anchor="middle" font-weight="bold">Competência cultural</text>
    <text x="590" y="310" text-anchor="middle">Respeito às necessidades</text>
    <text x="590" y="328" text-anchor="middle">de grupos étnicos,</text>
    <text x="590" y="346" text-anchor="middle">de gênero e sociais</text>
  </g>
</svg>
