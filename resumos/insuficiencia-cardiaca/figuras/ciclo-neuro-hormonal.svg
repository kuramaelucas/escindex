<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#1f2a26"><rect width="720" height="480" fill="#ffffff"/><text x="20" y="28" font-size="17" font-weight="700">O ciclo neuro-hormonal da IC e onde cada remédio age</text><rect x="250" y="50" width="200" height="44" rx="22" fill="#eef1ef" stroke="#9aa5a0"/><text x="350.0" y="77" text-anchor="middle" font-size="13.5" font-weight="600">Lesão do miocárdio</text><rect x="470" y="140" width="200" height="44" rx="22" fill="#eef1ef" stroke="#9aa5a0"/><text x="570.0" y="167" text-anchor="middle" font-size="13.5" font-weight="600">↓ Débito cardíaco</text><rect x="420" y="260" width="228.0" height="44" rx="22" fill="#eef1ef" stroke="#9aa5a0"/><text x="534.0" y="287" text-anchor="middle" font-size="13.5" font-weight="600">Ativação: simpático, SRAA, ADH</text><rect x="120" y="330" width="311.59999999999997" height="44" rx="22" fill="#eef1ef" stroke="#9aa5a0"/><text x="275.79999999999995" y="357" text-anchor="middle" font-size="13.5" font-weight="600">Vasoconstrição + retenção de sódio e água</text><rect x="30" y="140" width="349.59999999999997" height="44" rx="22" fill="#eef1ef" stroke="#9aa5a0"/><text x="204.79999999999998" y="167" text-anchor="middle" font-size="13.5" font-weight="600">Remodelamento: fibrose, hipertrofia, dilatação</text><defs><marker id="s" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6b7672"/></marker></defs><line x1="450" y1="94" x2="540" y2="140" stroke="#6b7672" stroke-width="2" marker-end="url(#s)"/><line x1="570" y1="184" x2="560" y2="260" stroke="#6b7672" stroke-width="2" marker-end="url(#s)"/><line x1="450" y1="304" x2="400" y2="330" stroke="#6b7672" stroke-width="2" marker-end="url(#s)"/><line x1="150" y1="330" x2="130" y2="184" stroke="#6b7672" stroke-width="2" marker-end="url(#s)"/><line x1="160" y1="140" x2="250" y2="94" stroke="#6b7672" stroke-width="2" marker-end="url(#s)"/><text x="320" y="215" font-size="12.5" fill="#1d6b4a" font-weight="600">⛔ Betabloqueador → simpático</text><text x="320" y="235" font-size="12.5" fill="#1d6b4a" font-weight="600">⛔ IECA / BRA / INRA → SRAA</text><text x="300" y="415" font-size="12.5" fill="#1d6b4a" font-weight="600">⛔ Antag. mineralocorticoide → aldosterona</text><text x="300" y="435" font-size="12.5" fill="#1d6b4a" font-weight="600">⛔ Diurético → congestão (sintoma)</text><text x="20" y="465" font-size="11.5" fill="#55615c">Útil no início para manter a pressão; no longo prazo, tóxico. Bloquear o ciclo é o que reduz mortalidade (o diurético só alivia).</text></svg>
