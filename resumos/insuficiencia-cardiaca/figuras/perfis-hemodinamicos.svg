<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 455" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" fill="#1f2a26"><rect width="640" height="455" fill="#ffffff"/><text x="20" y="28" font-size="17" font-weight="700">IC aguda: perfis hemodinâmicos (congestão × perfusão)</text><rect x="120" y="60" width="240" height="160" rx="12" fill="#e6f2ea"/><text x="240" y="120" text-anchor="middle" font-size="40" font-weight="800" fill="#3d4743">A</text><text x="240" y="155" text-anchor="middle" font-weight="700">Quente e seco</text><text x="240" y="178" text-anchor="middle" font-size="12.5" fill="#3d4743">ajustar tratamento oral</text><rect x="370" y="60" width="240" height="160" rx="12" fill="#fdf0d9"/><text x="490" y="120" text-anchor="middle" font-size="40" font-weight="800" fill="#3d4743">B</text><text x="490" y="155" text-anchor="middle" font-weight="700">Quente e úmido</text><text x="490" y="178" text-anchor="middle" font-size="12.5" fill="#3d4743">diurético EV ± vasodilatador</text><rect x="120" y="230" width="240" height="160" rx="12" fill="#e4eef7"/><text x="240" y="290" text-anchor="middle" font-size="40" font-weight="800" fill="#3d4743">L</text><text x="240" y="325" text-anchor="middle" font-weight="700">Frio e seco</text><text x="240" y="348" text-anchor="middle" font-size="12.5" fill="#3d4743">prova cautelosa de volume</text><rect x="370" y="230" width="240" height="160" rx="12" fill="#f9dfdc"/><text x="490" y="290" text-anchor="middle" font-size="40" font-weight="800" fill="#3d4743">C</text><text x="490" y="325" text-anchor="middle" font-weight="700">Frio e úmido</text><text x="490" y="348" text-anchor="middle" font-size="12.5" fill="#3d4743">dobutamina + diurético (UTI)</text><text x="240" y="412" text-anchor="middle" font-size="13" fill="#55615c">SECO (sem congestão)</text><text x="490" y="412" text-anchor="middle" font-size="13" fill="#55615c">ÚMIDO (congestão)</text><text x="100" y="140" text-anchor="end" font-size="13" fill="#55615c">QUENTE</text><text x="100" y="156" text-anchor="end" font-size="11" fill="#55615c">perfusão boa</text><text x="100" y="310" text-anchor="end" font-size="13" fill="#55615c">FRIO</text><text x="100" y="326" text-anchor="end" font-size="11" fill="#55615c">hipoperfusão</text><text x="20" y="440" font-size="11.5" fill="#55615c">Úmido: ortopneia, estase jugular, estertores, edema. Frio: extremidades frias, pressão de pulso estreita, sonolência, oligúria.</text></svg>
