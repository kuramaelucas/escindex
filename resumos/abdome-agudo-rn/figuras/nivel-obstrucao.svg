<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="system-ui,sans-serif" font-size="13">
<rect width="760" height="330" fill="#fff"/>
<text x="20" y="26" font-size="15" font-weight="700" fill="#222">Recém-nascido que vomita: o nível da obstrução pelo que sai e pela radiografia</text>
<g text-anchor="middle">
<rect x="20" y="45" width="170" height="250" rx="8" fill="#e8eef9" stroke="#4a6fb3"/>
<text x="105" y="68" font-weight="700">Esôfago</text>
<text x="105" y="94" font-size="12">salivação abundante</text><text x="105" y="112" font-size="12">sonda não passa</text><text x="105" y="130" font-size="12">polidrâmnio</text>
<text x="105" y="168" font-weight="700" font-size="12">Radiografia</text><text x="105" y="186" font-size="12">sonda enrolada</text><text x="105" y="204" font-size="12">no coto esofágico</text>
<text x="105" y="244" font-size="12" fill="#b03a2e">atresia de esôfago</text><text x="105" y="262" font-size="12" fill="#555">(tipo C: fístula distal)</text>
<rect x="205" y="45" width="170" height="250" rx="8" fill="#e6f4ec" stroke="#2f8a57"/>
<text x="290" y="68" font-weight="700">Piloro</text>
<text x="290" y="94" font-size="12">vômito NÃO bilioso</text><text x="290" y="112" font-size="12">em jato, 2–6 semanas</text><text x="290" y="130" font-size="12">"oliva" no epigástrio</text>
<text x="290" y="168" font-weight="700" font-size="12">Exame</text><text x="290" y="186" font-size="12">ultrassom: músculo</text><text x="290" y="204" font-size="12">pilórico espesso</text>
<text x="290" y="244" font-size="12" fill="#b03a2e">estenose hipertrófica</text><text x="290" y="262" font-size="12" fill="#555">alcalose hipoclorêmica</text>
<rect x="390" y="45" width="170" height="250" rx="8" fill="#fdf1e2" stroke="#c07a1c"/>
<text x="475" y="68" font-weight="700">Duodeno e jejuno</text>
<text x="475" y="94" font-size="12">vômito BILIOSO</text><text x="475" y="112" font-size="12">primeiros dias</text><text x="475" y="130" font-size="12">pouca distensão</text>
<text x="475" y="168" font-weight="700" font-size="12">Radiografia</text><text x="475" y="186" font-size="12">dupla bolha (duodeno)</text><text x="475" y="204" font-size="12">poucas alças (jejuno)</text>
<text x="475" y="244" font-size="12" fill="#b03a2e">atresias; volvo por</text><text x="475" y="262" font-size="12" fill="#b03a2e">má rotação = urgência</text>
<rect x="575" y="45" width="165" height="250" rx="8" fill="#fbe5e1" stroke="#b03a2e"/>
<text x="657" y="68" font-weight="700">Cólon e reto</text>
<text x="657" y="94" font-size="12">distensão grande</text><text x="657" y="112" font-size="12">mecônio atrasado</text><text x="657" y="130" font-size="12">(&gt; 48 h)</text>
<text x="657" y="168" font-weight="700" font-size="12">Exame</text><text x="657" y="186" font-size="12">muitas alças dilatadas;</text><text x="657" y="204" font-size="12">biópsia retal</text>
<text x="657" y="244" font-size="12" fill="#b03a2e">Hirschsprung;</text><text x="657" y="262" font-size="12" fill="#b03a2e">malformação anorretal</text>
</g>
<text x="20" y="318" fill="#555" font-size="12">Vômito bilioso no recém-nascido: obstrução abaixo da papila até prova em contrário; o volvo não pode esperar.</text>
</svg>
