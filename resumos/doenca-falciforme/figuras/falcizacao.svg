<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="sans-serif"><rect width="760" height="360" fill="#fff"/>
<defs><marker id="s" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs>
<text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">Da hemoglobina S às duas faces da doença</text>
<g font-size="13" text-anchor="middle" fill="#333">
<rect x="250" y="44" width="260" height="46" rx="8" fill="#e1f0f6" stroke="#1b5e7a"/><text x="380" y="64" font-weight="bold" fill="#1b5e7a">Hemoglobina S sem oxigênio</text><text x="380" y="82">polimeriza dentro da hemácia</text>
<line x1="380" y1="90" x2="380" y2="116" stroke="#555" stroke-width="2" marker-end="url(#s)"/>
<rect x="250" y="120" width="260" height="46" rx="8" fill="#f6efe1" stroke="#8a6a1b"/><text x="380" y="140" font-weight="bold" fill="#8a6a1b">Hemácia em foice, rígida</text><text x="380" y="158">frio, desidratação, infecção, hipóxia pioram</text>
<g stroke="#555" stroke-width="2"><line x1="320" y1="166" x2="190" y2="200" marker-end="url(#s)"/><line x1="440" y1="166" x2="570" y2="200" marker-end="url(#s)"/></g>
<rect x="40" y="204" width="300" height="130" rx="8" fill="#fbecec" stroke="#b03a2e"/><text x="190" y="226" font-weight="bold" fill="#b03a2e">Vaso-oclusão</text>
<text x="190" y="250">crise de dor, dactilite</text><text x="190" y="270">síndrome torácica aguda</text><text x="190" y="290">AVC, necrose da cabeça do fêmur</text><text x="190" y="310">baço infartado: infecção por encapsulados</text>
<rect x="420" y="204" width="300" height="130" rx="8" fill="#eef5e6" stroke="#4d7a1b"/><text x="570" y="226" font-weight="bold" fill="#4d7a1b">Hemólise</text>
<text x="570" y="250">anemia crônica, reticulócitos altos</text><text x="570" y="270">icterícia (bilirrubina indireta)</text><text x="570" y="290">cálculo biliar de pigmento</text><text x="570" y="310">crise aplástica se a medula para</text>
</g>
</svg>
