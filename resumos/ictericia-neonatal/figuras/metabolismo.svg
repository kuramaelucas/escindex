<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="system-ui,sans-serif" font-size="13">
<rect width="760" height="300" fill="#fff"/>
<text x="20" y="26" font-size="15" font-weight="700" fill="#222">Onde a bilirrubina se acumula no recém-nascido</text>
<g text-anchor="middle">
<rect x="20" y="50" width="160" height="70" rx="8" fill="#fbe5e1" stroke="#b03a2e"/><text x="100" y="74" font-weight="700">Hemácias</text><text x="100" y="94" font-size="12">mais hemácias,</text><text x="100" y="110" font-size="12">vida mais curta</text>
<rect x="220" y="50" width="160" height="70" rx="8" fill="#fff6cc" stroke="#b39200"/><text x="300" y="74" font-weight="700">Bilirrubina indireta</text><text x="300" y="94" font-size="12">no sangue, presa</text><text x="300" y="110" font-size="12">à albumina</text>
<rect x="420" y="50" width="160" height="70" rx="8" fill="#e6f4ec" stroke="#2f8a57"/><text x="500" y="74" font-weight="700">Fígado</text><text x="500" y="94" font-size="12">glicuroniltransferase</text><text x="500" y="110" font-size="12">ainda imatura</text>
<rect x="600" y="50" width="140" height="70" rx="8" fill="#e8eef9" stroke="#4a6fb3"/><text x="670" y="74" font-weight="700">Intestino</text><text x="670" y="94" font-size="12">bilirrubina direta</text><text x="670" y="110" font-size="12">→ fezes</text>
</g>
<g stroke="#555" fill="none"><path d="M180 85 h40"/><path d="M380 85 h40"/><path d="M580 85 h20"/></g>
<path d="M670 120 C670 175 330 175 300 122" stroke="#9a3f86" fill="none" stroke-dasharray="5 3"/>
<text x="485" y="172" text-anchor="middle" fill="#9a3f86" font-size="12">circulação êntero-hepática: β-glicuronidase desconjuga e a indireta volta ao sangue</text>
<text x="485" y="188" text-anchor="middle" fill="#9a3f86" font-size="12">(maior quando o bebê mama pouco e evacua pouco)</text>
<g font-size="12.5" fill="#222">
<text x="20" y="222" font-weight="700">Excesso na entrada:</text><text x="160" y="222">hemólise (ABO, Rh, G6PD, esferocitose), céfalo-hematoma</text>
<text x="20" y="244" font-weight="700">Fígado lento:</text><text x="160" y="244">icterícia fisiológica (após 24 h, pico no 3º–5º dia)</text>
<text x="20" y="266" font-weight="700">Volta do intestino:</text><text x="160" y="266">pouca ingesta (aleitamento ineficaz) e icterícia do leite materno</text>
<text x="20" y="288" font-weight="700">Saída bloqueada:</text><text x="160" y="288">colestase (bilirrubina direta alta, acolia, colúria) — atresia biliar</text>
</g>
</svg>
