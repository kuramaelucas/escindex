# Roda os testes automáticos a cada envio e a cada pull request:
#   - o conferidor da pasta dados/ (ids, gabaritos, taxonomia, provas completas);
#   - o teste de fumaça, que abre a plataforma num Chromium de verdade, entra
#     com cada papel e passa por todas as telas, falhando em qualquer erro.
# Nada aqui publica o site nem fala com a nuvem.
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Conferir a pasta dados/
        run: npm run conferir
      - name: Teste de fumaça
        run: npm test

  # O nuvem/esquema.sql num PostgreSQL de verdade: roda num banco NOVO, roda
  # de novo por cima (tem de poder ser repetido) e as regras de segurança
  # (quem lê e grava o quê) se comportam como o arquivo promete.
  esquema-da-nuvem:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: teste
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Supabase de mentira (papéis e auth)
        run: psql -v ON_ERROR_STOP=1 -q -f testes/sql/supabase-de-mentira.sql
      - name: esquema.sql num banco novo
        run: psql -v ON_ERROR_STOP=1 -q -f nuvem/esquema.sql
      - name: esquema.sql de novo, por cima
        run: psql -v ON_ERROR_STOP=1 -q -f nuvem/esquema.sql
      - name: Regras de segurança
        run: psql -q -f testes/sql/regras.sql
